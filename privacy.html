  "s4.li1": "<strong>Quyền đọc thư viện ảnh</strong> — chỉ khi bạn mở lại một bản xuất cũ từ Việc gần đây, hoặc chia sẻ ảnh sau khi lưu, vì cả hai đều lấy lại ảnh đã lưu từ thư viện của bạn. Chọn ảnh để đóng dấu thì không cần: trình chọn ảnh của iOS chỉ trao cho Ứng dụng những ảnh bạn chọn.",
  "s4.li2": "<strong>Quyền thêm vào thư viện ảnh</strong> — để lưu ảnh đã đóng dấu vào Cuộn camera. Quyền này cho phép Ứng dụng thêm ảnh, không phải xem phần còn lại của thư viện.",
  "s4.li3": "<strong>Quyền truy cập Camera</strong> — chỉ khi bạn chọn chụp một bức ảnh mới bên trong Ứng dụng, để bạn có thể đóng hình mờ cho một bức ảnh mà không cần lưu bản chưa đánh dấu trước. Ứng dụng không bao giờ tự mở camera, và ảnh bạn chụp được xử lý y hệt như bất kỳ ảnh nào khác: xử lý trên thiết bị, không bao giờ tải lên.",
  "s4.p2": "Bạn cũng có thể nhập ảnh qua ứng dụng Tệp. Việc này sử dụng trình chọn tài liệu tiêu chuẩn của iOS, chỉ trao cho Ứng dụng đúng một tệp bạn chọn và không yêu cầu quyền lâu dài.",
  "s4.p3": "Quyền ảnh và camera chỉ được yêu cầu đúng lúc bạn dùng tính năng cần đến chúng — không bao giờ tự động khi khởi động. Bạn có thể thu hồi bất kỳ quyền nào bất cứ lúc nào trong Cài đặt iOS.",
  "s5.h": "Thông tin Bạn Thêm vào Ảnh của Mình",
  "s5.p1": "WatermarkIT có thể ghi một dòng ghi công — tên và bản quyền của bạn — vào siêu dữ liệu của những bức ảnh bạn xuất, sử dụng các trường IPTC và TIFF tiêu chuẩn (Byline, Thông báo Bản quyền, Nghệ sĩ). Đây là điều giúp thông tin ghi công của bạn tồn tại qua việc cắt ảnh.",
  "s5.p2": "Có hai điều cần làm rõ:",
  "s5.li1": "Văn bản được ghi là <strong>văn bản bạn nhập vào</strong>. WatermarkIT không bao giờ chèn tên của chúng tôi, mã định danh thiết bị, vị trí của bạn, hay bất kỳ dữ liệu theo dõi ẩn nào của riêng nó.",
  "s5.li2": "Siêu dữ liệu này được ghi vào tệp đã xuất, do đó nó <strong>đi cùng tệp đó tới bất cứ nơi nào bạn gửi</strong>. Đó chính xác là mục đích của tính năng này — nhưng điều đó cũng có nghĩa là bất kỳ ai bạn chia sẻ ảnh cùng đều có thể đọc được tên bạn đã đặt ở đó.",
  "s5.p3": "Dòng ghi công được bật theo mặc định, và việc tắt là do bạn quyết định: tắt cho một lần xuất trên bảng Xuất, hoặc cho mọi lần xuất trong Cài đặt. Ảnh hiện có của bạn không bao giờ bị sửa đổi — mỗi lần xuất đều được ghi thành một tệp mới.",
  "s6.h": "Lưu trữ Dữ liệu Cục bộ",
  "s6.p1": "Ứng dụng lưu trữ dữ liệu sau <strong>chỉ trên thiết bị của bạn</strong>:",
  "s6.li1": "Các mẫu và cài đặt sẵn hình mờ bạn tạo (tên, kiểu chữ, kích thước, màu sắc, độ mờ, xoay, lát kín và vị trí)",
  "s6.li2": "Hình ảnh xem trước thu nhỏ cho các mẫu bạn đã lưu",
  "s6.li3": "Công việc Gần đây của bạn — lịch sử cục bộ các ảnh bạn đã xuất, để bạn có thể mở lại hoặc xuất lại chúng",
  "s6.li4": "Tùy chọn ứng dụng của bạn, chẳng hạn như chất lượng và định dạng xuất mặc định, ngôn ngữ bạn đã chọn, và có bao gồm dòng ghi công của bạn hay không",
  "s6.p2": "Dữ liệu này không bao giờ rời khỏi thiết bị của bạn. Nó được lưu trữ trong vùng chứa cục bộ của Ứng dụng và tự động bị xóa nếu bạn gỡ cài đặt Ứng dụng.",
  "s7.h": "Dịch vụ Bên thứ ba",
  "s7.p1": "Ứng dụng không chia sẻ dữ liệu của bạn với các mạng quảng cáo bên thứ ba. Chúng tôi có thể sử dụng các SDK hoặc nhà cung cấp dịch vụ bên thứ ba đã được xác minh cho việc phân tích ứng dụng, báo cáo sự cố, hoặc quản lý gói đăng ký. Bất kỳ dịch vụ nào như vậy đều chỉ được tích hợp để hỗ trợ chức năng của ứng dụng và cải thiện trải nghiệm người dùng.",
  "s8.h": "Quyền riêng tư của Trẻ em",
  "s8.p1": "WatermarkIT được thiết kế cho đối tượng người dùng chung. Chúng tôi không cố ý thu thập thông tin cá nhân từ trẻ em dưới 13 tuổi. Nếu bạn tin rằng chúng tôi đã vô tình thu thập thông tin như vậy, vui lòng liên hệ với chúng tôi để chúng tôi có thể xử lý kịp thời.",
  "s9.h": "Bảo mật Dữ liệu",
  "s9.p1": "Vì WatermarkIT không truyền tải bất kỳ dữ liệu nào, nên không có dữ liệu nào đang truyền đi cần được bảo mật. Mọi dữ liệu được lưu trữ cục bộ (các mẫu của bạn) đều tuân theo mã hóa thiết bị tích hợp sẵn của iOS, được kích hoạt bất cứ khi nào bạn sử dụng mã khóa thiết bị.",
  "s10.h": "Thay đổi đối với Chính sách này",
  "s10.p1": "Chúng tôi có thể cập nhật Chính sách Quyền riêng tư của mình theo thời gian. Mọi thay đổi sẽ được đăng trên trang này với ngày “Cập nhật lần cuối” được cập nhật. Chúng tôi khuyến khích bạn xem lại chính sách này định kỳ để nắm bắt mọi thay đổi.",
  "s11.h": "Quyền của Bạn",
  "s11.p1": "Tùy thuộc vào vị trí của bạn, bạn có thể có các quyền liên quan đến dữ liệu của mình theo quy định pháp luật địa phương (như GDPR hoặc CCPA). Vì phần lớn dữ liệu của bạn (như các mẫu và ảnh) được lưu trữ cục bộ, bạn có thể quản lý trực tiếp bằng cách chỉnh sửa hoặc xóa các mục bên trong Ứng dụng, hoặc bằng cách gỡ cài đặt Ứng dụng.",
  "contact.h": "Có câu hỏi về quyền riêng tư của bạn?",
  "contact.p": "Nếu bạn có bất kỳ câu hỏi hoặc lo ngại nào về Chính sách Quyền riêng tư này, hãy liên hệ với chúng tôi — chúng tôi rất sẵn lòng giúp đỡ.",
  "footer.support": "Hỗ trợ",
  "footer.made": "Được làm với ❤️ cho iOS",
  "s3.li7": "Nếu bạn chạy WatermarkIT từ Siri hoặc Phím tắt, mọi thứ cũng diễn ra trên thiết bị: ảnh mà phím tắt truyền vào được đánh dấu cục bộ, hiển thị cho bạn và trả về phím tắt. Ảnh chỉ được thêm vào album WatermarkIT trong Ảnh nếu bạn chọn lưu; Ứng dụng không giữ bản sao nào khác",
  "s4.li4": "<strong>Thông báo</strong> — nhắc nhở tùy chọn, được lên lịch trên thiết bị mà không cần máy chủ nào. iOS chỉ hỏi một lần, trên màn hình chính; bạn có thể tắt trong mục Nhắc nhở ở Cài đặt của Ứng dụng, hoặc trong Cài đặt iOS.",
  "s3.li8": "Ô che đen, xóa nền logo và tệp PDF cũng được tạo theo cách đó, hoàn toàn trên thiết bị của bạn",
  "s3.li9": "Ảnh bạn gửi tới WatermarkIT từ nút Chia sẻ trong Ảnh được xử lý trên thiết bị theo đúng cách như vậy",
  "s3.li10": "“Kiểm tra ảnh” đọc thông tin ghi công, yêu cầu về huấn luyện AI, vị trí, ngày chụp và máy ảnh của ảnh bạn chọn, ngay trên thiết bị, và không giữ bản sao nào",
  "s5.p4": "WatermarkIT còn có thể thêm tín hiệu IPTC chuẩn “không huấn luyện AI” vào ảnh bạn lưu, kèm thông tin ghi công được lặp lại trong dữ liệu XMP của tệp. Đó là lời yêu cầu mà công cụ đọc được, không phải khóa. Tùy chọn bật sẵn, không bao giờ được ghi vào PDF, và bạn có thể tắt ở màn hình Xuất hoặc trong Cài đặt.",
  "s5.p5": "Bản lưu giữ ngày chụp và máy ảnh của ảnh gốc, nên nằm cạnh ảnh gốc trong Ảnh. Vị trí bị xóa trừ khi bạn chọn giữ lại.",
  "s6.li5": "Bản chỉnh sửa chưa xong, để “Tiếp tục chỉnh sửa” có thể mở lại, và các phông chữ bạn nhập"
 },
 "tr": {
  "nav.support": "Destek",
  "lang.label": "Dil",
  "hero.title": "Gizlilik Politikası",
  "hero.meta": "Yürürlük Tarihi: 1 Haziran 2026 &nbsp;·&nbsp; Son Güncelleme: 12 Ekim 2026",
  "trans.note": "Bu çeviri yalnızca kolaylık amacıyla sunulur; asıl metin İngilizce sürümdür.",
  "sum.1": "Cihaz üzerinde işleme",
  "sum.2": "Gizliliğe odaklı",
  "sum.3": "Buluta yükleme yok",
  "sum.4": "Güvenli yerel depolama",
  "s1.h": "Genel Bakış",
  "s1.p1": "WatermarkIT herhangi bir kişisel veri veya görsel toplamaz, saklamaz, iletmez ya da paylaşmaz. Tüm işleme tamamen cihazınızda gerçekleşir.",
  "s1.p2": "Bu Gizlilik Politikası, WatermarkIT iOS uygulamasının (“Uygulama”, “biz”) bilgilerinizi nasıl işlediğini açıklar. Gizliliğinizi korumaya ve uygulamalarımız konusunda şeffaf olmaya kararlıyız.",
  "s2.h": "Veri Toplama ve Kullanımı",
  "s2.p1": "<strong>Kesin Taahhüdümüz:</strong> Hiçbir koşulda fotoğraflarınıza erişmeyiz, onları yüklemeyiz, iletmeyiz veya saklamayız. Tüm görsel işleme tamamen cihazınızda, yerel olarak gerçekleştirilir.",
  "s2.p2": "Uygulama, adınız veya e-posta adresiniz gibi kişisel kimlik bilgilerini toplamaz. 1.4.1 sürümünden itibaren uygulama, hangi özelliklerin gerçekten kullanıldığını anlamak ve çökmeleri yakalamak için Firebase Analytics ve Crashlytics (Google) kullanır. Bunlara kullanılan özellikler, çökme raporları, uygulamanın sizdeki kurulumu için rastgele bir kimlik ve Google’ın IP adresinizden çıkardığı yaklaşık konum (örneğin ülkeniz) gönderilir. Asla bir fotoğraf, dosya adı, yazdığınız bir şey veya reklam kimliğiniz gönderilmez. Bunların hiçbiri kimliğinizle ilişkilendirilmez veya izleme için kullanılmaz. Bunu istediğiniz zaman Ayarlar → Gizlilik bölümünden kapatabilirsiniz. Her iki durumda da fotoğraflarınız %100 gizli kalır ve tarafımızca hiçbir zaman erişilmez, yüklenmez veya saklanmaz.",
  "s3.h": "Uygulama Nasıl Çalışır",
  "s3.p1": "WatermarkIT, cihaz üzerinde çalışan, tamamen çevrimdışı bir uygulamadır. Uygulamayı kullandığınızda tam olarak şunlar gerçekleşir:",
  "s3.li1": "Bir fotoğraf seçersiniz — fotoğraf kitaplığınızdan, kameranızdan ya da Dosyalar uygulamasından",
  "s3.li2": "Uygulama bu fotoğrafı cihazınızda yerel olarak okur",
  "s3.li3": "Tüm filigran işlemleri — metin, logolar, el yazısı imzalar, QR kodları ve döşeme — tamamen cihazınızda gerçekleştirilir",
  "s3.li4": "QR kodları, Apple’ın yerleşik Core Image çerçevesiyle cihaz üzerinde oluşturulur; girdiğiniz bağlantı asla iletilmez",
  "s3.li5": "Sonuç, yerel Kamera Rulonuza kaydedilir veya iOS Paylaşım Sayfası aracılığıyla paylaşılır",
  "s3.li6": "Hiçbir aşamada fotoğrafınız veya ondan türetilen herhangi bir veri, herhangi bir dış sunucuya gönderilmez",
  "s4.h": "Cihaz İzinleri",
  "s4.p1": "Uygulama aşağıdaki iOS izinlerini talep eder:",
  "s4.li1": "<strong>Fotoğraf Arşivi Okuma İzni</strong> — yalnızca Son çalışmalar’dan eski bir dışa aktarımı yeniden açarsanız ya da kaydettikten sonra fotoğraf paylaşırsanız, çünkü ikisi de kaydedilmiş fotoğrafınızı arşivinizden geri alır. Filigran eklenecek fotoğrafı seçmek için gerekmez: iOS fotoğraf seçicisi Uygulama’ya yalnızca seçtiğiniz fotoğrafları verir.",
  "s4.li2": "<strong>Fotoğraf Arşivine Ekleme İzni</strong> — filigranlı görüntülerinizi Film Rulonuza kaydetmek için. Bu izin Uygulama’nın fotoğraf eklemesine olanak tanır, arşivinizin geri kalanını görmesine değil.",
  "s4.li3": "<strong>Kamera Erişimi</strong> — yalnızca Uygulama içinde yeni bir fotoğraf çekmeyi seçtiğinizde, önce işaretsiz bir kopya kaydetmeden bir çekime filigran ekleyebilmeniz için. Uygulama kamerayı kendiliğinden asla açmaz ve çektiğiniz fotoğraflar tıpkı diğerleri gibi işlenir: cihazda işlenir, asla yüklenmez.",
  "s4.p2": "Dosyalar uygulaması üzerinden de bir görsel içe aktarabilirsiniz. Bu, Uygulamaya yalnızca seçtiğiniz tek dosyayı veren ve sürekli izin gerektirmeyen standart iOS belge seçiciyi kullanır.",
  "s4.p3": "Fotoğraf ve kamera izinleri yalnızca bunlara ihtiyaç duyan özelliği kullandığınız anda istenir — asla açılışta otomatik olarak istenmez. Bu izinlerin herhangi birini istediğiniz zaman iOS Ayarları’ndan geri alabilirsiniz.",
  "s5.h": "Fotoğraflarınıza Eklediğiniz Bilgiler",
  "s5.p1": "WatermarkIT, dışa aktardığınız fotoğrafların meta verilerine standart IPTC ve TIFF alanlarını (Byline, Telif Hakkı Bildirimi, Sanatçı) kullanarak bir telif satırı — adınızı ve telif hakkınızı — yazabilir. Telif bilginizin kırpmaya dayanmasını sağlayan da budur.",
  "s5.p2": "Netleştirilmesi gereken iki nokta var:",
  "s5.li1": "Yazılan metin <strong>sizin girdiğiniz metindir</strong>. WatermarkIT hiçbir zaman kendi adımızı, bir cihaz tanımlayıcısını, konumunuzu veya kendine ait gizli izleme verilerini eklemez.",
  "s5.li2": "Bu meta veri, dışa aktarılan dosyaya yazılır, dolayısıyla <strong>gönderdiğiniz her yere o dosyayla birlikte gider</strong>. Bu, tam olarak özelliğin amacıdır — ama fotoğrafı paylaştığınız kişilerin oraya koyduğunuz adı okuyabileceği anlamına da gelir.",
  "s5.p3": "Künye varsayılan olarak açıktır ve kapatmak size kalmıştır: tek bir dışa aktarım için Dışa Aktar sayfasından, tüm dışa aktarımlar için Ayarlar’dan kapatabilirsiniz. Mevcut fotoğraflarınız asla değiştirilmez — her dışa aktarım yeni bir dosya olarak yazılır.",
  "s6.h": "Yerel Veri Depolama",
  "s6.p1": "Uygulama aşağıdaki verileri <strong>yalnızca cihazınızda</strong> saklar:",
  "s6.li1": "Oluşturduğunuz filigran şablonları ve hazır ayarlar (ad, yazı tipi, boyut, renk, saydamlık, döndürme, döşeme ve konum)",
  "s6.li2": "Kaydettiğiniz şablonlar için küçük resim önizlemeleri",
  "s6.li3": "Son Çalışmalarınız — dışa aktardığınız fotoğrafların, tekrar açabilmeniz veya yeniden dışa aktarabilmeniz için yerel geçmişi",
  "s6.li4": "Varsayılan dışa aktarma kalitesi, formatı, seçtiğiniz dil ve telif satırınızın dahil edilip edilmeyeceği gibi uygulama tercihleriniz",
  "s6.p2": "Bu veriler cihazınızdan asla çıkmaz. Uygulamanın yerel kapsayıcısında saklanır ve Uygulamayı kaldırdığınızda otomatik olarak silinir.",
  "s7.h": "Üçüncü Taraf Hizmetleri",
  "s7.p1": "Uygulama, verilerinizi üçüncü taraf reklam ağlarıyla paylaşmaz. Uygulama analitiği, çökme raporlaması veya abonelik yönetimi için doğrulanmış üçüncü taraf SDK’lar veya hizmet sağlayıcılar kullanabiliriz. Bu tür hizmetler, yalnızca uygulamanın işlevselliğini desteklemek ve kullanıcı deneyimini iyileştirmek amacıyla entegre edilir.",
  "s8.h": "Çocukların Gizliliği",
  "s8.p1": "WatermarkIT genel bir kitle için tasarlanmıştır. 13 yaşın altındaki çocuklardan bilerek kişisel bilgi toplamayız. Böyle bir bilgiyi yanlışlıkla topladığımızı düşünüyorsanız, hızla ele almamız için lütfen bizimle iletişime geçin.",
  "s9.h": "Veri Güvenliği",
  "s9.p1": "WatermarkIT herhangi bir veri iletmediğinden, güvence altına alınacak aktarım halinde veri bulunmaz. Yerel olarak saklanan tüm veriler (şablonlarınız), cihaz şifresi kullandığınızda etkinleşen iOS’un yerleşik cihaz şifrelemesine tabidir.",
  "s10.h": "Bu Politikadaki Değişiklikler",
  "s10.p1": "Gizlilik Politikamızı zaman zaman güncelleyebiliriz. Herhangi bir değişiklik, güncellenmiş bir “Son Güncelleme” tarihiyle bu sayfada yayınlanacaktır. Değişiklikler için bu politikayı periyodik olarak gözden geçirmenizi öneririz.",
  "s11.h": "Haklarınız",
  "s11.p1": "Bulunduğunuz yere bağlı olarak, yerel düzenlemeler (GDPR veya CCPA gibi) uyarınca verilerinizle ilgili haklara sahip olabilirsiniz. Verilerinizin çoğu (şablonlar ve fotoğraflar gibi) yerel olarak saklandığından, Uygulama içindeki öğeleri değiştirerek veya silerek ya da Uygulamayı kaldırarak bunları doğrudan yönetebilirsiniz.",
  "contact.h": "Gizliliğinizle ilgili sorularınız mı var?",
  "contact.p": "Bu Gizlilik Politikası hakkında herhangi bir sorunuz veya endişeniz varsa bize ulaşın — yardımcı olmaktan memnuniyet duyarız.",
  "footer.support": "Destek",
  "footer.made": "iOS için ❤️ ile yapıldı",
  "s3.li7": "WatermarkIT’i Siri veya Kestirmeler’den çalıştırırsanız aynı şey cihazınızda olur: kestirmenizin verdiği fotoğraf yerel olarak işaretlenir, size gösterilir ve kestirmeye geri verilir. Fotoğraflar’daki WatermarkIT albümüne yalnızca kaydetmeyi seçerseniz eklenir; Uygulama başka bir kopya saklamaz",
  "s4.li4": "<strong>Bildirimler</strong> — isteğe bağlı hatırlatıcılar; hiçbir sunucu olmadan cihazınızda planlanır. iOS yalnızca bir kez, ana ekranda sorar; bunları Uygulama Ayarları’ndaki Hatırlatıcılar bölümünden ya da iOS Ayarları’ndan kapatabilirsiniz.",
  "s3.li8": "Karartma kutuları, logo arka planını kaldırma ve PDF’ler de aynı şekilde, tamamen cihazınızda oluşturulur",
  "s3.li9": "Fotoğraflar’daki Paylaş düğmesiyle WatermarkIT’e gönderdiğiniz fotoğraflar cihazınızda tam olarak aynı şekilde işlenir",
  "s3.li10": "“Fotoğrafı kontrol et”, seçtiğiniz fotoğrafın telif bilgisini, yapay zekâ eğitimi isteğini, konumunu, çekim tarihini ve kamerasını cihazınızda okur ve bir kopyasını saklamaz",
  "s5.p4": "WatermarkIT, kaydettiğiniz fotoğraflara standart IPTC “yapay zekâ eğitimi yok” sinyalini de ekleyebilir; telif bilginiz dosyanın XMP verilerinde de yinelenir. Bu, araçların okuyabildiği bir istektir, kilit değil. Varsayılan olarak açıktır, PDF’lere asla yazılmaz ve Dışa aktarma ekranından veya Ayarlar’dan kapatılabilir.",
  "s5.p5": "Kaydedilen kopyalar orijinal fotoğrafın çekim tarihini ve kamerasını korur, böylece Fotoğraflar’da onun yanında sıralanır. Konum, siz saklamayı seçmedikçe silinir.",
  "s6.li5": "“Düzenlemeye devam et” geri getirebilsin diye bitirmediğiniz bir düzenleme ve içe aktardığınız yazı tipleri"
 },
 "es-MX": {
  "nav.support": "Soporte",
  "lang.label": "Idioma",
  "hero.title": "Política de privacidad",
  "hero.meta": "Fecha de vigencia: 1 de junio de 2026 &nbsp;·&nbsp; Última actualización: 12 de octubre de 2026",
  "trans.note": "Esta traducción se ofrece como referencia; el texto en inglés es el que tiene validez.",
  "sum.1": "Procesamiento en el dispositivo",
  "sum.2": "Enfocado en la privacidad",
  "sum.3": "Sin subidas a la nube",
  "sum.4": "Almacenamiento local seguro",
  "s1.h": "Resumen",
  "s1.p1": "WatermarkIT no recopila, almacena, transmite ni comparte ningún dato personal ni imagen. Todo el procesamiento ocurre por completo en tu dispositivo.",
  "s1.p2": "Esta Política de Privacidad explica cómo la aplicación de iOS WatermarkIT (“la App”, “nosotros”) maneja tu información. Estamos comprometidos con proteger tu privacidad y ser transparentes sobre nuestras prácticas.",
  "s2.h": "Recopilación y uso de datos",
  "s2.p1": "<strong>Nuestro compromiso absoluto:</strong> nunca accedemos, subimos, transmitimos ni almacenamos tus fotos bajo ninguna circunstancia. Todo el procesamiento de imágenes se realiza por completo de forma local en tu dispositivo.",
  "s2.p2": "La App no recopila información de identificación personal (como tu nombre o dirección de correo electrónico). A partir de la versión 1.4.1, la App usa Firebase Analytics y Crashlytics (Google) para entender qué funciones usa realmente la gente y detectar fallos. Reciben qué funciones se usaron, informes de fallos, un identificador aleatorio de tu instalación de la App y una ubicación aproximada (como tu país) que Google deduce de tu dirección IP. Nunca una foto, un nombre de archivo, algo que escribas, ni tu identificador de publicidad. Nada de esto se vincula con tu identidad ni se usa para rastrearte. Puedes desactivarlo en cualquier momento en Ajustes → Privacidad. En cualquier caso, tus fotos siguen siendo 100% privadas y nunca serán accedidas, subidas o almacenadas por nosotros.",
  "s3.h": "Cómo funciona la App",
  "s3.p1": "WatermarkIT es una aplicación completamente sin conexión, que funciona en el dispositivo. Esto es exactamente lo que sucede cuando la usas:",
  "s3.li1": "Eliges una foto — de tu biblioteca de fotos, de tu cámara, o de la app Archivos",
  "s3.li2": "La App lee esa foto localmente en tu dispositivo",
  "s3.li3": "Todo el procesamiento de la marca de agua — texto, logotipos, firmas escritas a mano, códigos QR y mosaico — se realiza por completo en tu dispositivo",
  "s3.li4": "Los códigos QR se generan en el dispositivo con el framework Core Image integrado de Apple; el enlace que ingresas nunca se transmite",
  "s3.li5": "El resultado se guarda de vuelta en tu Carrete local o se comparte a través de la hoja de compartir de iOS",
  "s3.li6": "En ningún momento tu foto, ni ningún dato derivado de ella, se envía a ningún servidor externo",
  "s4.h": "Permisos del dispositivo",
  "s4.p1": "La App solicita los siguientes permisos de iOS:",
  "s4.li1": "<strong>Acceso de lectura a la fototeca</strong> — solo si vuelves a abrir una exportación anterior desde Trabajos recientes, o compartes fotos después de guardarlas, ya que ambas acciones recuperan la foto guardada de tu fototeca. Elegir una foto para marcarla no lo necesita: el selector de fotos de iOS solo entrega a la App las fotos que eliges.",
  "s4.li2": "<strong>Acceso para agregar a la fototeca</strong> — para guardar tus imágenes con marca de agua en el Carrete. Permite a la App agregar fotos, no ver el resto de tu fototeca.",
  "s4.li3": "<strong>Acceso a la cámara</strong> — solo si eliges tomar una nueva foto dentro de la App, para que puedas marcar una toma sin tener que guardar primero una copia sin marcar. La App nunca abre la cámara por sí sola, y las fotos que capturas se manejan exactamente igual que cualquier otra: se procesan en el dispositivo, nunca se suben.",
  "s4.p2": "También puedes importar una imagen a través de la app Archivos. Eso usa el selector de documentos estándar de iOS, que le entrega a la App solo el único archivo que elegiste y no requiere ningún permiso continuo.",
  "s4.p3": "Los permisos de fotos y cámara solo se piden en el momento en que usas la función que los necesita — nunca automáticamente al abrir la app. Puedes revocar cualquiera de ellos en cualquier momento en los Ajustes de iOS.",
  "s5.h": "Información que agregas a tus fotos",
  "s5.p1": "WatermarkIT puede escribir una línea de crédito — tu nombre y aviso de derechos de autor — en los metadatos de las fotos que exportas, usando los campos estándar IPTC y TIFF (Autor, Aviso de derechos de autor, Artista). Esto es lo que permite que tu crédito sobreviva al recorte.",
  "s5.p2": "Vale la pena aclarar dos cosas:",
  "s5.li1": "El texto escrito es <strong>el texto que tú ingresas</strong>. WatermarkIT nunca inserta nuestro propio nombre, un identificador de dispositivo, tu ubicación, ni ningún dato de seguimiento oculto propio.",
  "s5.li2": "Estos metadatos se escriben en el archivo exportado, por lo que <strong>viajan con ese archivo a dondequiera que lo envíes</strong>. Ese es precisamente el propósito de esta función — pero también significa que cualquier persona con quien compartas la foto puede leer el nombre que pusiste ahí.",
  "s5.p3": "El crédito está activado por defecto, y desactivarlo depende de ti: para una exportación concreta en la hoja de exportación, o para todas en Ajustes. Tus fotos existentes nunca se modifican — cada exportación se escribe como un archivo nuevo.",
  "s6.h": "Almacenamiento local de datos",
  "s6.p1": "La App almacena los siguientes datos <strong>solo en tu dispositivo</strong>:",
  "s6.li1": "Plantillas y preajustes de marca de agua que creas (nombre, tipografía, tamaño, color, opacidad, rotación, mosaico y posición)",
  "s6.li2": "Imágenes de vista previa en miniatura de tus plantillas guardadas",
  "s6.li3": "Tu Trabajo reciente — un historial local de las fotos que has exportado, para que puedas volver a abrirlas o exportarlas de nuevo",
  "s6.li4": "Tus preferencias de la app, como la calidad y el formato de exportación predeterminados, el idioma que elegiste, y si se incluye tu línea de crédito",
  "s6.p2": "Estos datos nunca salen de tu dispositivo. Se almacenan en el contenedor local de la App y se eliminan automáticamente si desinstalas la App.",
  "s7.h": "Servicios de terceros",
  "s7.p1": "La App no comparte tus datos con redes publicitarias de terceros. Podemos usar SDKs o proveedores de servicios de terceros verificados para análisis de la app, reportes de fallos, o gestión de suscripciones. Dichos servicios, cuando se usan, se integran estrictamente para respaldar la funcionalidad de la app y mejorar la experiencia del usuario.",
  "s8.h": "Privacidad de los menores",
  "s8.p1": "WatermarkIT está diseñado para un público general. No recopilamos a sabiendas información personal de menores de 13 años. Si crees que hemos recopilado inadvertidamente dicha información, contáctanos para que podamos abordarlo con prontitud.",
  "s9.h": "Seguridad de los datos",
  "s9.p1": "Dado que WatermarkIT no transmite ningún dato, no hay datos en tránsito que proteger. Todos los datos almacenados localmente (tus plantillas) están sujetos al cifrado de dispositivo integrado de iOS, que se activa siempre que usas un código de acceso en el dispositivo.",
  "s10.h": "Cambios a esta política",
  "s10.p1": "Podemos actualizar nuestra Política de Privacidad de vez en cuando. Cualquier cambio se publicará en esta página con una fecha de “Última actualización” renovada. Te recomendamos revisar esta política periódicamente para ver si hay cambios.",
  "s11.h": "Tus derechos",
  "s11.p1": "Según tu ubicación, es posible que tengas derechos relacionados con tus datos conforme a las regulaciones locales (como el RGPD o la CCPA). Dado que la mayoría de tus datos (como plantillas y fotos) se almacena localmente, puedes gestionarlos directamente modificando o eliminando elementos dentro de la App, o desinstalando la App.",
  "contact.h": "¿Preguntas sobre tu privacidad?",
  "contact.p": "Si tienes alguna pregunta o inquietud sobre esta Política de Privacidad, contáctanos — con gusto te ayudamos.",
  "footer.support": "Soporte",
  "footer.made": "Hecho con ❤️ para iOS",
  "s3.li7": "Si ejecutas WatermarkIT desde Siri o Atajos, ocurre lo mismo en tu dispositivo: la foto que pasa tu atajo se marca localmente, se te muestra y se devuelve al atajo. Solo se agrega al álbum WatermarkIT de Fotos si eliges guardarla; la App no guarda ninguna otra copia",
  "s4.li4": "<strong>Notificaciones</strong> — recordatorios opcionales, programados en tu dispositivo sin ningún servidor. iOS lo pregunta una sola vez, en la pantalla de inicio; puedes desactivarlos en Recordatorios dentro de los Ajustes de la App, o en los Ajustes de iOS.",
  "s3.li8": "Los recuadros para tapar, quitar el fondo de los logotipos y los PDF se hacen de la misma forma, por completo en tu dispositivo",
  "s3.li9": "Las fotos que envías a WatermarkIT desde el botón Compartir de Fotos se procesan en tu dispositivo exactamente igual",
  "s3.li10": "“Comprobar una foto” lee el crédito, la petición sobre entrenamiento de IA, la ubicación, la fecha de captura y la cámara de la foto que eliges, en tu dispositivo, y no guarda ninguna copia",
  "s5.p4": "WatermarkIT también puede añadir la señal IPTC estándar de “no entrenar IA” a las fotos que guardas, con tu crédito repetido en los datos XMP del archivo. Es una petición que las herramientas pueden leer, no un candado. Viene activada, nunca se escribe en los PDF y puedes desactivarla en la pantalla Exportar o en Ajustes.",
  "s5.p5": "Las copias guardadas conservan la fecha de captura y la cámara de la foto original, para ordenarse junto a ella en Fotos. La ubicación se elimina salvo que decidas conservarla.",
  "s6.li5": "Una edición que no has terminado, para que “Seguir editando” pueda recuperarla, y las fuentes que importes"
 },
 "pt-BR": {
  "nav.support": "Suporte",
  "lang.label": "Idioma",
  "hero.title": "Política de Privacidade",
  "hero.meta": "Data de Vigência: 1º de junho de 2026 &nbsp;·&nbsp; Última Atualização: 12 de outubro de 2026",
  "trans.note": "Esta tradução é fornecida apenas como referência; o texto em inglês é o que prevalece.",
  "sum.1": "Processamento no aparelho",
  "sum.2": "Focado em privacidade",
  "sum.3": "Sem envio para a nuvem",
  "sum.4": "Armazenamento local seguro",
  "s1.h": "Visão Geral",
  "s1.p1": "O WatermarkIT não coleta, armazena, transmite nem compartilha nenhum dado pessoal ou imagem. Todo o processamento acontece inteiramente no seu aparelho.",
  "s1.p2": "Esta Política de Privacidade explica como o aplicativo iOS WatermarkIT (“o App”, “nós”) trata suas informações. Estamos comprometidos em proteger sua privacidade e em ser transparentes sobre nossas práticas.",
  "s2.h": "Coleta e Uso de Dados",
  "s2.p1": "<strong>Nosso Compromisso Absoluto:</strong> nunca acessamos, enviamos, transmitimos ou armazenamos suas fotos, em nenhuma circunstância. Todo o processamento de imagem é feito inteiramente de forma local no seu aparelho.",
  "s2.p2": "O App não coleta informações de identificação pessoal (como seu nome ou endereço de e-mail). A partir da versão 1.4.1, o App usa Firebase Analytics e Crashlytics (Google) para entender quais recursos são realmente usados e identificar falhas. Eles recebem quais recursos foram usados, relatórios de falhas, um identificador aleatório da sua instalação do App e uma localização aproximada (como seu país) que o Google deduz do seu endereço IP. Nunca uma foto, um nome de arquivo, algo que você digita, ou seu identificador de publicidade. Nada disso é vinculado à sua identidade nem usado para rastreamento. Você pode desativar isso a qualquer momento em Ajustes → Privacidade. De qualquer forma, suas fotos continuam 100% privadas e nunca serão acessadas, enviadas ou armazenadas por nós.",
  "s3.h": "Como o App Funciona",
  "s3.p1": "O WatermarkIT é um aplicativo totalmente offline, que roda no aparelho. Aqui está exatamente o que acontece quando você o usa:",
  "s3.li1": "Você escolhe uma foto — da sua galeria de fotos, da câmera, ou do app Arquivos",
  "s3.li2": "O App lê essa foto localmente no seu aparelho",
  "s3.li3": "Todo o processamento da marca d’água — texto, logotipos, assinaturas manuscritas, códigos QR e mosaico — é feito inteiramente no seu aparelho",
  "s3.li4": "Os códigos QR são gerados no aparelho com o framework Core Image integrado da Apple; o link que você digita nunca é transmitido",
  "s3.li5": "O resultado é salvo de volta no seu Rolo da Câmera local ou compartilhado pela folha de compartilhamento do iOS",
  "s3.li6": "Em nenhum momento sua foto, ou qualquer dado derivado dela, é enviada a qualquer servidor externo",
  "s4.h": "Permissões do Aparelho",
  "s4.p1": "O App solicita as seguintes permissões do iOS:",
  "s4.li1": "<strong>Acesso de leitura à fototeca</strong> — apenas se você reabrir uma exportação anterior em Trabalhos recentes, ou compartilhar fotos depois de salvá-las, já que ambas as ações buscam a foto salva de volta na sua fototeca. Escolher uma foto para marcar não precisa dele: o seletor de fotos do iOS entrega ao App apenas as fotos que você escolher.",
  "s4.li2": "<strong>Acesso para adicionar à fototeca</strong> — para salvar suas imagens com marca d’água no Rolo da Câmera. Ele permite que o App adicione fotos, não que veja o resto da sua fototeca.",
  "s4.li3": "<strong>Acesso à Câmera</strong> — apenas se você escolher tirar uma nova foto dentro do App, para poder marcar uma foto com marca d’água sem antes salvar uma cópia sem marca. O App nunca abre a câmera por conta própria, e as fotos que você captura são tratadas exatamente como qualquer outra: processadas no aparelho, nunca enviadas.",
  "s4.p2": "Você também pode importar uma imagem pelo app Arquivos. Isso usa o seletor de documentos padrão do iOS, que entrega ao App apenas o único arquivo escolhido e não exige nenhuma permissão contínua.",
  "s4.p3": "As permissões de fotos e câmera só são pedidas no momento em que você usa o recurso que precisa delas — nunca automaticamente ao abrir o app. Você pode revogar qualquer uma delas a qualquer momento nos Ajustes do iOS.",
  "s5.h": "Informações que Você Adiciona às Suas Fotos",
  "s5.p1": "O WatermarkIT pode gravar uma linha de crédito — seu nome e aviso de direitos autorais — nos metadados das fotos que você exporta, usando os campos padrão IPTC e TIFF (Autor, Aviso de Direitos Autorais, Artista). É isso que permite que seu crédito sobreviva ao recorte.",
  "s5.p2": "Dois pontos merecem ser esclarecidos:",
  "s5.li1": "O texto gravado é <strong>o texto que você insere</strong>. O WatermarkIT nunca insere nosso próprio nome, um identificador de aparelho, sua localização, ou qualquer dado de rastreamento oculto próprio.",
  "s5.li2": "Esses metadados são gravados no arquivo exportado, portanto <strong>viajam com esse arquivo para onde quer que você o envie</strong>. Esse é exatamente o propósito do recurso — mas também significa que qualquer pessoa com quem você compartilhe a foto pode ler o nome que você colocou ali.",
  "s5.p3": "O crédito vem ativado por padrão, e cabe a você desativá-lo: para uma exportação específica na folha de exportação, ou para todas nos Ajustes. Suas fotos existentes nunca são modificadas — cada exportação é gravada como um novo arquivo.",
  "s6.h": "Armazenamento Local de Dados",
  "s6.p1": "O App armazena os seguintes dados <strong>somente no seu aparelho</strong>:",
  "s6.li1": "Modelos e predefinições de marca d’água que você cria (nome, tipografia, tamanho, cor, opacidade, rotação, mosaico e posição)",
  "s6.li2": "Imagens de pré-visualização em miniatura dos seus modelos salvos",
  "s6.li3": "Seus Trabalhos Recentes — um histórico local das fotos que você exportou, para que possa reabri-las ou reexportá-las",
  "s6.li4": "Suas preferências do app, como qualidade e formato de exportação padrão, o idioma escolhido, e se deve incluir sua linha de crédito",
  "s6.p2": "Esses dados nunca saem do seu aparelho. Eles ficam armazenados no contêiner local do App e são excluídos automaticamente se você desinstalar o App.",
  "s7.h": "Serviços de Terceiros",
  "s7.p1": "O App não compartilha seus dados com redes de publicidade de terceiros. Podemos usar SDKs ou provedores de serviços de terceiros verificados para análise do app, relatórios de falhas, ou gerenciamento de assinaturas. Quaisquer desses serviços são integrados estritamente para apoiar a funcionalidade do app e melhorar a experiência do usuário.",
  "s8.h": "Privacidade de Crianças",
  "s8.p1": "O WatermarkIT foi projetado para um público geral. Não coletamos intencionalmente informações pessoais de crianças menores de 13 anos. Se você acredita que coletamos inadvertidamente essas informações, entre em contato conosco para que possamos resolver isso rapidamente.",
  "s9.h": "Segurança de Dados",
  "s9.p1": "Como o WatermarkIT não transmite nenhum dado, não há dados em trânsito para proteger. Todos os dados armazenados localmente (seus modelos) estão sujeitos à criptografia integrada do aparelho do iOS, que é ativada sempre que você usa uma senha no aparelho.",
  "s10.h": "Alterações a Esta Política",
  "s10.p1": "Podemos atualizar nossa Política de Privacidade de tempos em tempos. Quaisquer alterações serão publicadas nesta página com uma data de “Última Atualização” renovada. Recomendamos que você revise esta política periodicamente para verificar mudanças.",
  "s11.h": "Seus Direitos",
  "s11.p1": "Dependendo da sua localização, você pode ter direitos em relação aos seus dados segundo regulamentações locais (como GDPR ou LGPD). Como a maior parte dos seus dados (como modelos e fotos) é armazenada localmente, você pode gerenciá-los diretamente, modificando ou excluindo itens dentro do App, ou desinstalando o App.",
  "contact.h": "Dúvidas sobre sua privacidade?",
  "contact.p": "Se você tiver alguma dúvida ou preocupação sobre esta Política de Privacidade, fale conosco — teremos prazer em ajudar.",
  "footer.support": "Suporte",
  "footer.made": "Feito com ❤️ para iOS",
  "s3.li7": "Se você executar o WatermarkIT pela Siri ou pelos Atalhos, o mesmo acontece no seu dispositivo: a foto que o atalho passa é marcada localmente, mostrada a você e devolvida ao atalho. Ela só é adicionada ao álbum WatermarkIT no Fotos se você escolher salvá-la; o App não guarda nenhuma outra cópia",
  "s4.li4": "<strong>Notificações</strong> — lembretes opcionais, agendados no seu dispositivo sem nenhum servidor. O iOS pergunta uma única vez, na tela inicial; você pode desativá-los em Lembretes nos Ajustes do App, ou nos Ajustes do iOS.",
  "s3.li8": "As caixas de tarja, a remoção de fundo de logotipos e os PDFs são feitos do mesmo jeito, inteiramente no seu aparelho",
  "s3.li9": "As fotos que você envia ao WatermarkIT pelo botão Compartilhar do Fotos são processadas no seu aparelho exatamente do mesmo jeito",
  "s3.li10": "“Verificar uma foto” lê o crédito, o pedido sobre treinamento de IA, a localização, a data de captura e a câmera da foto que você escolhe, no seu aparelho, e não guarda nenhuma cópia",
  "s5.p4": "O WatermarkIT também pode adicionar o sinal IPTC padrão de “não treinar IA” às fotos que você salva, com seu crédito repetido nos dados XMP do arquivo. É um pedido que as ferramentas leem, não uma trava. Vem ativado, nunca é gravado em PDFs e pode ser desativado na tela Exportar ou em Ajustes.",
  "s5.p5": "As cópias salvas mantêm a data de captura e a câmera da foto original, para ficarem ao lado dela no Fotos. A localização é removida, a menos que você escolha mantê-la.",
  "s6.li5": "Uma edição que você ainda não terminou, para que “Continuar editando” a traga de volta, e as fontes que você importar"
 },
 "zh-HK": {
  "nav.support": "支援",
  "lang.label": "語言",
  "hero.title": "私隱政策",
  "hero.meta": "生效日期：2026 年 6 月 1 日 &nbsp;·&nbsp; 最後更新：2026 年 10 月 12 日",
  "trans.note": "呢個翻譯只供參考，一切以英文版為準。",
  "sum.1": "裝置端處理",
  "sum.2": "重視私隱",
  "sum.3": "唔會上載雲端",
  "sum.4": "安全嘅本機儲存",
  "s1.h": "概覽",
  "s1.p1": "WatermarkIT 唔會收集、儲存、傳輸或者分享任何個人資料或者相片。所有處理都完全喺你部裝置度進行。",
  "s1.p2": "呢份私隱政策解釋 WatermarkIT 呢個 iOS App（下稱「本 App」「我哋」）點樣處理你嘅資訊。我哋承諾保護你嘅私隱，同埋喺我哋嘅做法上保持透明。",
  "s2.h": "資料收集同使用",
  "s2.p1": "<strong>我哋嘅絕對承諾：</strong>喺任何情況下，我哋都唔會存取、上載、傳輸或者儲存你嘅相片。所有影像處理都完全喺你部裝置度本機進行。",
  "s2.p2": "本 App 唔會收集個人識別資訊（例如你嘅姓名或者電郵地址）。由 1.4.1 版本開始，本 App 會用 Firebase Analytics 同 Crashlytics（Google）嚟了解邊啲功能真係有人用緊，同埋擷取當機資訊。佢哋會收到用過嘅功能、當機報告、為你安裝嘅本 App 隨機分配嘅識別碼，以及 Google 根據你嘅 IP 位址推算嘅大概位置（例如國家）。永遠唔包括相片、檔案名稱、你打嘅任何內容，或者你嘅廣告識別碼。呢啲資料唔會同你嘅身分連結，亦唔會用嚟追蹤。你可以隨時喺「設定」→「私隱」關閉呢個功能。無論開定關，你嘅相片都會保持 100% 私隱，我哋絕對唔會存取、上載或者儲存。",
  "s3.h": "本 App 點樣運作",
  "s3.p1": "WatermarkIT 係一個完全離線、喺裝置度運行嘅 App。用嘅時候實際會發生咩事，如下：",
  "s3.li1": "你由相簿、相機或者「檔案」App 入面揀一張相",
  "s3.li2": "本 App 喺你部裝置本機讀取嗰張相",
  "s3.li3": "所有浮水印處理——文字、標誌、手寫簽名、QR 碼同平鋪——都完全喺你部裝置度進行",
  "s3.li4": "QR 碼係用 Apple 內置嘅 Core Image 框架喺裝置度產生，你輸入嘅連結永遠唔會被傳輸",
  "s3.li5": "結果會儲存返落你嘅本機相機膠卷，或者透過 iOS 分享工具分享",
  "s3.li6": "你嘅相片或者由佢衍生嘅任何資料，喺任何時候都唔會傳送去任何外部伺服器",
  "s4.h": "裝置權限",
  "s4.p1": "本 App 會要求以下 iOS 權限：",
  "s4.li1": "<strong>相片圖庫讀取權限</strong> — 只係當你喺「最近的作品」重新打開以前匯出嘅相，或者儲存之後分享相片先需要，因為兩樣都要將已儲存嘅相片由你嘅圖庫攞返出嚟。揀相加浮水印唔需要佢：iOS 相片挑選器只會將你揀咗嘅相片交畀 App。",
  "s4.li2": "<strong>加入相片圖庫權限</strong> — 用嚟將加咗浮水印嘅相片儲存到你嘅相機膠卷。佢只容許 App 加入相片，睇唔到你圖庫其他內容。",
  "s4.li3": "<strong>相機權限</strong>——只有喺你揀喺 App 入面影一張新相嗰陣先會用到，等你唔使先儲存一份未加標記嘅副本就可以直接加浮水印。本 App 絕對唔會自己開相機，而你影嘅相都會同其他相一樣咁處理：喺裝置度處理，絕對唔會上載。",
  "s4.p2": "你都可以透過「檔案」App 匯入圖片。呢個功能用嘅係 iOS 標準文件揀選器，只會將你揀嘅嗰一個檔案畀本 App，唔需要任何持續性嘅權限。",
  "s4.p3": "相片同相機權限只會喺你用緊需要佢哋嘅功能嗰一刻先問——開 App 時絕對唔會自動問。你隨時可以喺 iOS 設定度撤銷呢啲權限。",
  "s5.h": "你加入相片嘅資訊",
  "s5.p1": "WatermarkIT 可以用標準嘅 IPTC 同 TIFF 欄位（作者、版權聲明、藝術家），將一行署名——你嘅姓名同版權——寫入你匯出相片嘅元資料入面。呢個就係點解你嘅署名可以喺裁剪之後都保留落嚟。",
  "s5.p2": "有兩點值得講清楚：",
  "s5.li1": "寫入嘅文字係<strong>你自己輸入嘅文字</strong>。WatermarkIT 絕對唔會插入我哋自己嘅名、裝置識別碼、你嘅位置，或者任何佢自己嘅隱藏追蹤資料。",
  "s5.li2": "呢啲元資料會寫入匯出嘅檔案入面，所以會<strong>跟住個檔案去到你傳送嘅任何地方</strong>。呢個正正就係呢個功能嘅意義所在——但同時亦即係話，任何你分享相片嘅對象都可以睇到你放喺入面嘅名。",
  "s5.p3": "署名預設係開啟嘅，關唔關由你決定：可以喺匯出面板為單次匯出關閉，或者喺設定度為所有匯出關閉。你現有嘅相片永遠唔會被修改——每次匯出都會寫成一個新檔案。",
  "s6.h": "本機資料儲存",
  "s6.p1": "本 App <strong>只會喺你部裝置度</strong>儲存以下資料：",
  "s6.li1": "你建立嘅浮水印範本同預設集（名稱、字體、大細、顏色、透明度、旋轉、平鋪同位置）",
  "s6.li2": "你已儲存範本嘅縮圖預覽",
  "s6.li3": "你嘅「最近作品」——你已匯出相片嘅本機記錄，等你可以重新打開或者再匯出",
  "s6.li4": "你嘅 App 偏好設定，例如預設匯出質素、格式、你揀嘅語言，同埋係咪要包含你嘅署名",
  "s6.p2": "呢啲資料永遠都唔會離開你部裝置。佢哋儲存喺本 App 嘅本機容器入面，如果你解除安裝本 App，就會自動被刪除。",
  "s7.h": "第三方服務",
  "s7.p1": "本 App 唔會將你嘅資料分享畀第三方廣告網絡。我哋可能會使用經驗證嘅第三方 SDK 或者服務供應商，用嚟做 App 分析、當機報告，或者訂閱管理。呢啲服務（如果有嘅話）嘅整合，純粹係為咗支援 App 功能同改善用戶體驗。",
  "s8.h": "兒童私隱",
  "s8.p1": "WatermarkIT 係為一般大眾而設計嘅。我哋唔會刻意收集 13 歲以下兒童嘅個人資訊。如果你認為我哋無意中收集咗呢類資訊，請聯絡我哋，等我哋可以盡快處理。",
  "s9.h": "資料安全",
  "s9.p1": "由於 WatermarkIT 唔會傳輸任何資料，所以冇任何傳輸中嘅資料需要保護。所有本機儲存嘅資料（即你嘅範本）都受 iOS 內置嘅裝置加密保護，只要你部裝置設咗密碼，加密就會啟用。",
  "s10.h": "呢份政策嘅變更",
  "s10.p1": "我哋可能會不時更新私隱政策。任何變更都會刊登喺呢個頁面，並更新「最後更新」日期。我哋鼓勵你定期check返呢份政策有冇任何變更。",
  "s11.h": "你嘅權利",
  "s11.p1": "視乎你所喺嘅地區，你可能就自己嘅資料享有當地法規（例如 GDPR 或者 CCPA）賦予嘅權利。由於你大部分嘅資料（例如範本同相片）都係本機儲存，你可以喺 App 入面直接修改或者刪除項目，或者解除安裝本 App，嚟直接管理呢啲資料。",
  "contact.h": "對你嘅私隱有疑問？",
  "contact.p": "如果你對呢份私隱政策有任何問題或者疑慮，歡迎聯絡我哋——我哋好樂意幫手。",
  "footer.support": "支援",
  "footer.made": "為 iOS 用 ❤️ 打造",
  "s3.li7": "如果你透過 Siri 或者捷徑執行 WatermarkIT，一樣係喺你部機度完成：捷徑傳入嚟嘅相片喺本機加上浮水印，顯示畀你睇，再交返畀捷徑。只有你揀儲存，佢先會加入「相片」入面嘅 WatermarkIT 相簿；App 唔會保留其他副本",
  "s4.li4": "<strong>通知</strong> — 可選嘅提醒，喺你部機度排程，唔涉及任何伺服器。iOS 只會喺主畫面問一次；你可以喺 App 設定嘅「提醒」或者 iOS 設定度關閉。",
  "s3.li8": "塗黑方塊、移除標誌背景同 PDF 都係用同一個方法，完全喺你部機度整",
  "s3.li9": "你喺「相片」嘅「分享」掣傳去 WatermarkIT 嘅相，都係完全一樣喺你部機度處理",
  "s3.li10": "「檢查相片」喺你部機度讀取你揀嘅相片嘅署名、AI 訓練要求、位置、拍攝日期同相機，唔會保留任何副本",
  "s5.p4": "WatermarkIT 亦可以喺你儲存嘅相片加入標準嘅 IPTC「禁止 AI 訓練」標記，並喺檔案嘅 XMP 資料再寫一次你嘅署名。呢個係工具讀到嘅要求，唔係一把鎖。預設係開咗，永遠唔會寫入 PDF，你可以喺匯出畫面或者「設定」度關。",
  "s5.p5": "儲存嘅副本會保留原本相片嘅拍攝日期同相機，所以喺「相片」會排喺原本張相隔籬。除非你揀保留，否則位置資料會被移除。",
  "s6.li5": "未完成嘅編輯（等「繼續編輯」可以帶返佢出嚟），同埋你匯入嘅字體"
 },
 "es-ES": {
  "nav.support": "Soporte",

  "hero.title": "Política de privacidad",
  "hero.meta": "Fecha de entrada en vigor: 1 de junio de 2026 &nbsp;·&nbsp; Última actualización: 12 de octubre de 2026",
  "trans.note": "Esta traducción se ofrece como referencia; el texto en inglés es el que tiene validez.",
  "sum.1": "Procesamiento en el dispositivo",
  "sum.2": "Centrada en la privacidad",
  "sum.3": "Sin subidas a la nube",
  "sum.4": "Almacenamiento local seguro",
  "s1.h": "Resumen",
  "s1.p1": "WatermarkIT no recopila, almacena, transmite ni comparte ningún dato personal ni imagen. Todo el procesamiento ocurre por completo en tu dispositivo.",
  "s1.p2": "Esta política de privacidad explica cómo la aplicación de iOS WatermarkIT (“la App”, “nosotros”) trata tu información. Nos comprometemos a proteger tu privacidad y a ser transparentes sobre nuestras prácticas.",
  "s2.h": "Recopilación y uso de datos",
  "s2.p1": "<strong>Nuestro compromiso absoluto:</strong> no accedemos, subimos, transmitimos ni almacenamos tus fotos nunca, bajo ninguna circunstancia. Todo el procesamiento de imágenes se realiza por completo de forma local en tu dispositivo.",
  "s2.p2": "La App no recopila información de identificación personal (como tu nombre o tu dirección de correo electrónico). Desde la versión 1.4.1, la App utiliza Firebase Analytics y Crashlytics (Google) para entender qué funciones se usan realmente y detectar fallos. Reciben qué funciones se han usado, informes de fallos, un identificador aleatorio de tu instalación de la App y una ubicación aproximada (como tu país) que Google deduce de tu dirección IP. Nunca una foto, un nombre de archivo, algo que escribas ni tu identificador publicitario. Nada de esto se vincula a tu identidad ni se usa para rastrearte. Puedes desactivarlo en cualquier momento en Ajustes → Privacidad. En cualquier caso, tus fotos siguen siendo 100% privadas y nunca serán accedidas, subidas ni almacenadas por nosotros.",
  "s3.h": "Cómo funciona la App",
  "s3.p1": "WatermarkIT es una aplicación completamente sin conexión, que funciona en el dispositivo. Esto es exactamente lo que sucede cuando la usas:",
  "s3.li1": "Eliges una foto — de tu biblioteca de fotos, de la cámara o de la app Archivos",
  "s3.li2": "La App lee esa foto localmente en tu dispositivo",
  "s3.li3": "Todo el procesamiento de la marca de agua — texto, logotipos, firmas escritas a mano, códigos QR y mosaico — se realiza por completo en tu dispositivo",
  "s3.li4": "Los códigos QR se generan en el dispositivo con el framework Core Image integrado de Apple; el enlace que introduces no se transmite nunca",
  "s3.li5": "El resultado se guarda de vuelta en tu Carrete local o se comparte a través de la hoja de compartir de iOS",
  "s3.li6": "En ningún momento se envía tu foto, ni ningún dato derivado de ella, a un servidor externo",
  "s4.h": "Permisos del dispositivo",
  "s4.p1": "La App solicita los siguientes permisos de iOS:",
  "s4.li1": "<strong>Acceso de lectura a la fototeca</strong> — solo si vuelves a abrir una exportación anterior desde Trabajos recientes, o compartes fotos después de guardarlas, ya que ambas acciones recuperan la foto guardada de tu fototeca. Elegir una foto para marcarla no lo necesita: el selector de fotos de iOS solo entrega a la App las fotos que eliges.",
  "s4.li2": "<strong>Acceso para añadir a la fototeca</strong> — para guardar tus imágenes con marca de agua en el Carrete. Permite a la App añadir fotos, no ver el resto de tu fototeca.",
  "s4.li3": "<strong>Acceso a la cámara</strong> — solo si decides hacer una foto nueva dentro de la App, para que puedas marcarla sin tener que guardar antes una copia sin marcar. La App nunca abre la cámara por sí sola, y las fotos que haces se tratan exactamente igual que cualquier otra: se procesan en el dispositivo y no se suben nunca.",
  "s4.p2": "También puedes importar una imagen a través de la app Archivos. Eso usa el selector de documentos estándar de iOS, que solo entrega a la App el único archivo que has elegido y no requiere ningún permiso permanente.",
  "s4.p3": "Los permisos de fotos y cámara solo se piden en el momento en que usas la función que los necesita — nunca automáticamente al abrir la app. Puedes revocar cualquiera de ellos en cualquier momento en los Ajustes de iOS.",
  "s5.h": "Información que añades a tus fotos",
  "s5.p1": "WatermarkIT puede escribir una línea de crédito — tu nombre y un aviso de derechos de autor — en los metadatos de las fotos que exportas, usando los campos estándar IPTC y TIFF (Autor, Aviso de derechos de autor, Artista). Esto es lo que permite que tu crédito sobreviva al recorte.",
  "s5.p2": "Conviene aclarar dos cosas:",
  "s5.li1": "El texto que se escribe es <strong>el que tú introduces</strong>. WatermarkIT nunca inserta nuestro propio nombre, un identificador de dispositivo, tu ubicación, ni ningún dato de seguimiento oculto propio.",
  "s5.li2": "Estos metadatos se escriben en el archivo exportado, así que <strong>viajan con ese archivo allá donde lo envíes</strong>. Ese es precisamente el sentido de esta función — pero también significa que cualquier persona con quien compartas la foto puede leer el nombre que has puesto ahí.",
  "s5.p3": "El crédito está activado por defecto, y desactivarlo depende de ti: para una exportación concreta en la hoja de exportación, o para todas en Ajustes. Tus fotos existentes nunca se modifican — cada exportación se escribe como un archivo nuevo.",
  "s6.h": "Almacenamiento local de datos",
  "s6.p1": "La App almacena los siguientes datos <strong>solo en tu dispositivo</strong>:",
  "s6.li1": "Las plantillas y los preajustes de marca de agua que creas (nombre, tipografía, tamaño, color, opacidad, rotación, mosaico y posición)",
  "s6.li2": "Las miniaturas de vista previa de tus plantillas guardadas",
  "s6.li3": "Tu Trabajo reciente — un historial local de las fotos que has exportado, para que puedas volver a abrirlas o exportarlas de nuevo",
  "s6.li4": "Tus preferencias de la app, como la calidad y el formato de exportación por defecto, el idioma que has elegido, y si se incluye tu línea de crédito",
  "s6.p2": "Estos datos no salen nunca de tu dispositivo. Se guardan en el contenedor local de la App y se eliminan automáticamente si la desinstalas.",
  "s7.h": "Servicios de terceros",
  "s7.p1": "La App no comparte tus datos con redes publicitarias de terceros. Podemos usar SDK o proveedores de servicios de terceros verificados para análisis de la app, informes de fallos o gestión de suscripciones. Cuando se usan, estos servicios se integran únicamente para respaldar el funcionamiento de la app y mejorar la experiencia del usuario.",
  "s8.h": "Privacidad de los menores",
  "s8.p1": "WatermarkIT está pensada para un público general. No recopilamos a sabiendas información personal de menores de 13 años. Si crees que hemos recopilado esa información sin darnos cuenta, ponte en contacto con nosotros para que podamos solucionarlo cuanto antes.",
  "s9.h": "Seguridad de los datos",
  "s9.p1": "Como WatermarkIT no transmite ningún dato, no hay datos en tránsito que proteger. Todos los datos almacenados localmente (tus plantillas) están sujetos al cifrado de dispositivo integrado de iOS, que se activa en cuanto usas un código de acceso en el dispositivo.",
  "s10.h": "Cambios en esta política",
  "s10.p1": "Podemos actualizar esta política de privacidad de vez en cuando. Cualquier cambio se publicará en esta página con una fecha de “Última actualización” renovada. Te recomendamos revisarla de vez en cuando por si hay cambios.",
  "s11.h": "Tus derechos",
  "s11.p1": "Según dónde te encuentres, es posible que tengas derechos sobre tus datos conforme a la normativa local (como el RGPD). Dado que la mayoría de tus datos (como las plantillas y las fotos) se guarda localmente, puedes gestionarlos directamente modificando o eliminando elementos dentro de la App, o desinstalándola.",
  "contact.h": "¿Tienes dudas sobre tu privacidad?",
  "contact.p": "Si tienes alguna pregunta o duda sobre esta política de privacidad, ponte en contacto con nosotros — estaremos encantados de ayudarte.",
  "footer.support": "Soporte",
  "footer.made": "Hecho con ❤️ para iOS",
  "s3.li7": "Si ejecutas WatermarkIT desde Siri o Atajos, ocurre lo mismo en tu dispositivo: la foto que pasa tu atajo se marca localmente, se te muestra y se devuelve al atajo. Solo se añade al álbum WatermarkIT de Fotos si eliges guardarla; la App no guarda ninguna otra copia",
  "s4.li4": "<strong>Notificaciones</strong> — recordatorios opcionales, programados en tu dispositivo sin ningún servidor. iOS lo pregunta una sola vez, en la pantalla de inicio; puedes desactivarlos en Recordatorios dentro de los Ajustes de la App, o en los Ajustes de iOS.",
  "s3.li8": "Los recuadros para tapar, quitar el fondo de los logotipos y los PDF se hacen de la misma forma, por completo en tu dispositivo",
  "s3.li9": "Las fotos que envías a WatermarkIT desde el botón Compartir de Fotos se procesan en tu dispositivo exactamente igual",
  "s3.li10": "“Comprobar una foto” lee el crédito, la petición sobre entrenamiento de IA, la ubicación, la fecha de captura y la cámara de la foto que eliges, en tu dispositivo, y no guarda ninguna copia",
  "s5.p4": "WatermarkIT también puede añadir la señal IPTC estándar de “no entrenar IA” a las fotos que guardas, con tu crédito repetido en los datos XMP del archivo. Es una petición que las herramientas pueden leer, no un candado. Viene activada, nunca se escribe en los PDF y puedes desactivarla en la pantalla Exportar o en Ajustes.",
  "s5.p5": "Las copias guardadas conservan la fecha de captura y la cámara de la foto original, para ordenarse junto a ella en Fotos. La ubicación se elimina salvo que decidas conservarla.",
  "s6.li5": "Una edición que no has terminado, para que “Seguir editando” pueda recuperarla, y las fuentes que importes"
 },
 "he": {
  "nav.support": "תמיכה",
  "lang.label": "שפה",
  "hero.title": "מדיניות פרטיות",
  "hero.meta": "בתוקף מ-1 ביוני 2026 &nbsp;·&nbsp; עדכון אחרון: 12 באוקטובר 2026",
  "trans.note": "התרגום מוצג לנוחותכם בלבד; הנוסח האנגלי הוא המחייב.",
  "sum.1": "עיבוד במכשיר",
  "sum.2": "פרטיות קודם כול",
  "sum.3": "בלי העלאה לענן",
  "sum.4": "אחסון מקומי מאובטח",
  "s1.h": "סקירה",
  "s1.p1": "WatermarkIT לא אוספת, לא שומרת, לא מעבירה ולא משתפת שום מידע אישי או תמונות. כל העיבוד מתבצע במכשיר שלכם בלבד.",
  "s1.p2": "מדיניות פרטיות זו מסבירה כיצד אפליקציית ה-iOS‏ WatermarkIT (‏“האפליקציה”, “אנחנו”) מטפלת במידע שלכם. אנחנו מחויבים להגן על פרטיותכם ולהיות שקופים לגבי הנהלים שלנו.",
  "s2.h": "איסוף מידע ושימוש בו",
  "s2.p1": "<strong>ההתחייבות המוחלטת שלנו:</strong> אנחנו לעולם לא ניגשים לתמונות שלכם, לא מעלים, לא מעבירים ולא שומרים אותן, בשום מקרה. כל עיבוד התמונות מתבצע באופן מקומי במכשיר שלכם בלבד.",
  "s2.p2": "האפליקציה לא אוספת מידע מזהה אישי (כמו שם או כתובת אימייל). החל מגרסה 1.4.1, האפליקציה משתמשת ב-Firebase Analytics וב-Crashlytics (של Google) כדי להבין אילו תכונות אנשים באמת משתמשים בהן ולזהות קריסות. הם מקבלים את התכונות שבהן נעשה שימוש, דיווחי קריסה, מזהה אקראי של ההתקנה שלכם של האפליקציה ומיקום משוער (כמו המדינה שלכם) ש-Google מסיקה מכתובת ה-IP שלכם. לעולם לא תמונה, שם קובץ, משהו שהקלדתם, או מזהה הפרסומות שלכם. שום דבר מזה לא מקושר לזהות שלכם ולא משמש למעקב. אפשר לכבות את זה בכל רגע בהגדרות ← פרטיות. בכל מקרה, התמונות שלכם נשארות פרטיות ב-100% ולעולם לא ניגש אליהן, נעלה אותן או נשמור אותן.",
  "s3.h": "איך האפליקציה עובדת",
  "s3.p1": "WatermarkIT היא אפליקציה שפועלת כולה במכשיר ובלי חיבור לאינטרנט. זה בדיוק מה שקורה כשמשתמשים בה:",
  "s3.li1": "אתם בוחרים תמונה — מספריית התמונות, מהמצלמה או מאפליקציית Files",
  "s3.li2": "האפליקציה קוראת את התמונה באופן מקומי במכשיר",
  "s3.li3": "כל עיבוד סימן המים — טקסט, לוגואים, חתימות בכתב יד, קודי QR ואריחים — מתבצע במכשיר שלכם בלבד",
  "s3.li4": "קודי QR נוצרים במכשיר בעזרת מסגרת Core Image המובנית של Apple; הקישור שאתם מזינים לעולם לא מועבר",
  "s3.li5": "התוצאה נשמרת בגליל המצלמה המקומי או משותפת דרך גיליון השיתוף של iOS",
  "s3.li6": "בשום שלב התמונה שלכם, או מידע שנגזר ממנה, לא נשלחים לשרת חיצוני",
  "s4.h": "הרשאות מכשיר",
  "s4.p1": "האפליקציה מבקשת את הרשאות ה-iOS הבאות:",
  "s4.li1": "<strong>גישת קריאה לספריית התמונות</strong> — רק אם פותחים מחדש ייצוא קודם מ’עבודות אחרונות’ או משתפים תמונות אחרי ששמרתם אותן, כי בשני המקרים התמונה השמורה מועתקת בחזרה החוצה מהספרייה. לבחירת תמונה לסימון היא לא נדרשת: בוחר התמונות של iOS מעביר לאפליקציה רק את התמונות שבחרתם.",
  "s4.li2": "<strong>גישת הוספה לספריית התמונות</strong> — כדי לשמור את התמונות המסומנות בגליל המצלמה. היא מאפשרת לאפליקציה להוסיף תמונות, לא לראות את שאר הספרייה.",
  "s4.li3": "<strong>גישה למצלמה</strong> — רק אם בחרתם לצלם תמונה חדשה בתוך האפליקציה, כדי שתוכלו לסמן צילום בלי לשמור קודם עותק לא מסומן. האפליקציה אף פעם לא פותחת את המצלמה מעצמה, ותמונות שצילמתם מטופלות בדיוק כמו כל תמונה אחרת: מעובדות במכשיר, לעולם לא מועלות.",
  "s4.p2": "אפשר גם לייבא תמונה דרך אפליקציית Files. זה נעשה באמצעות בוחר המסמכים התקני של iOS, שמעביר לאפליקציה רק את הקובץ הבודד שבחרתם ולא דורש הרשאה מתמשכת.",
  "s4.p3": "הרשאות התמונות והמצלמה מתבקשות רק ברגע שמשתמשים בתכונה שזקוקה להן — אף פעם לא אוטומטית בהפעלה. אפשר לבטל כל אחת מההרשאות האלה בכל עת בהגדרות iOS.",
  "s5.h": "מידע שאתם מוסיפים לתמונות",
  "s5.p1": "WatermarkIT יכולה לכתוב שורת קרדיט — השם שלכם וזכויות היוצרים — במטא-נתונים של התמונות שאתם מייצאים, בשדות התקניים IPTC ו-TIFF ‏(Byline, Copyright Notice, Artist). זה מה שמאפשר לקרדיט לשרוד חיתוך.",
  "s5.p2": "שני דברים חשוב להבהיר:",
  "s5.li1": "הטקסט שנכתב הוא <strong>הטקסט שאתם מזינים</strong>. WatermarkIT לעולם לא מוסיפה את השם שלנו, מזהה מכשיר, את המיקום שלכם או נתוני מעקב נסתרים כלשהם.",
  "s5.li2": "המטא-נתונים האלה נכתבים בקובץ המיוצא, ולכן <strong>הם נוסעים עם הקובץ לכל מקום שאליו תשלחו אותו</strong>. זו בדיוק מטרת התכונה — אבל המשמעות היא שכל מי שתשתפו איתו את התמונה יכול לקרוא את השם שכתבתם.",
  "s5.p3": "הקרדיט מופעל כברירת מחדל, וההחלטה לכבות אותו שלכם: לייצוא בודד במסך הייצוא, או לכל הייצואים בהגדרות. התמונות הקיימות שלכם לעולם לא משתנות — כל ייצוא נכתב כקובץ חדש.",
  "s6.h": "אחסון מידע מקומי",
  "s6.p1": "האפליקציה שומרת את המידע הבא <strong>במכשיר שלכם בלבד</strong>:",
  "s6.li1": "תבניות סימן מים שאתם יוצרים (שם, גופן, גודל, צבע, שקיפות, סיבוב, אריחים ומיקום)",
  "s6.li2": "תמונות תצוגה מקדימה ממוזערות של התבניות השמורות",
  "s6.li3": "‘עבודות אחרונות’ — היסטוריה מקומית של התמונות שייצאתם, כדי שתוכלו לפתוח אותן מחדש או לייצא שוב",
  "s6.li4": "העדפות האפליקציה, כמו איכות ופורמט ייצוא ברירת מחדל, השפה שבחרתם והאם לכלול את שורת הקרדיט",
  "s6.p2": "המידע הזה לעולם לא עוזב את המכשיר. הוא נשמר במכל המקומי של האפליקציה ונמחק אוטומטית אם מסירים את האפליקציה.",
  "s7.h": "שירותי צד שלישי",
  "s7.p1": "האפליקציה לא משתפת את המידע שלכם עם רשתות פרסום של צד שלישי. ייתכן שנשתמש ב-SDK או בספקי שירות מאומתים של צד שלישי לניתוח שימוש באפליקציה, לדיווח על קריסות או לניהול מינויים. שירותים כאלה משולבים אך ורק כדי לתמוך בפעולת האפליקציה ולשפר את חוויית השימוש.",
  "s8.h": "פרטיות ילדים",
  "s8.p1": "WatermarkIT מיועדת לקהל הכללי. איננו אוספים ביודעין מידע אישי מילדים מתחת לגיל 13. אם אתם סבורים שאספנו מידע כזה בטעות, צרו איתנו קשר כדי שנוכל לטפל בכך מיד.",
  "s9.h": "אבטחת מידע",
  "s9.p1": "מאחר ש-WatermarkIT לא מעבירה שום מידע, אין מידע בתעבורה שצריך לאבטח. כל המידע שנשמר מקומית (התבניות שלכם) מוגן בהצפנה המובנית של iOS, שפועלת בכל פעם שאתם משתמשים בקוד גישה למכשיר.",
  "s10.h": "שינויים במדיניות",
  "s10.p1": "ייתכן שנעדכן את מדיניות הפרטיות מעת לעת. כל שינוי יפורסם בדף זה עם תאריך ‘עדכון אחרון’ מעודכן. אנחנו ממליצים לעיין במדיניות מדי פעם.",
  "s11.h": "הזכויות שלכם",
  "s11.p1": "בהתאם למקום מגוריכם, ייתכן שיש לכם זכויות לגבי המידע שלכם לפי הדין המקומי (כגון GDPR או CCPA). מאחר שרוב המידע שלכם (כמו תבניות ותמונות) נשמר מקומית, אפשר לנהל אותו ישירות — לשנות או למחוק פריטים באפליקציה, או להסיר את האפליקציה.",
  "contact.h": "שאלות על הפרטיות שלכם?",
  "contact.p": "אם יש לכם שאלות או חששות לגבי מדיניות פרטיות זו, פנו אלינו — נשמח לעזור.",
  "footer.support": "תמיכה",
  "footer.made": "נוצר באהבה ❤️ ל-iOS",
  "s3.li7": "אם מפעילים את WatermarkIT דרך Siri או קיצורים, אותו דבר קורה במכשיר: התמונה שהקיצור מעביר מסומנת מקומית, מוצגת לכם ומוחזרת לקיצור. היא מתווספת לאלבום WatermarkIT ב’תמונות’ רק אם בחרתם לשמור אותה; האפליקציה לא שומרת שום עותק אחר",
  "s4.li4": "<strong>התראות</strong> — תזכורות אופציונליות, שמתוזמנות במכשיר בלי שום שרת. iOS שואל פעם אחת, במסך הבית; אפשר לכבות אותן תחת ‘תזכורות’ בהגדרות האפליקציה, או בהגדרות iOS.",
  "s3.li8": "תיבות ‘השחרה’, הסרת רקע מלוגו וקובצי PDF נוצרים באותה דרך, כולם במכשיר שלכם",
  "s3.li9": "תמונות שאתם שולחים ל-WatermarkIT מכפתור ‘שיתוף’ ב’תמונות’ מעובדות במכשיר בדיוק באותה דרך",
  "s3.li10": "‘בדיקת תמונה’ קוראת במכשיר את הקרדיט, הבקשה לגבי אימון AI, המיקום, תאריך הצילום והמצלמה של תמונה שבחרתם, ולא שומרת ממנה שום עותק",
  "s5.p4": "WatermarkIT יכולה גם להוסיף לתמונות שאתם שומרים את האות התקני של IPTC ‏‘לא לאימון AI’, עם הקרדיט שלכם שחוזר בנתוני ה-XMP של הקובץ. זו בקשה שכלים יכולים לקרוא, לא מנעול. האות מופעל כברירת מחדל, לעולם לא נכתב בקובצי PDF, ואפשר לכבות אותו במסך הייצוא או בהגדרות.",
  "s5.p5": "עותקים שמורים שומרים על תאריך הצילום והמצלמה של התמונה המקורית, כך שב’תמונות’ הם ממוינים לצדה. המיקום מוסר, אלא אם בחרתם לשמור אותו.",
  "s6.li5": "עריכה שלא סיימתם, כדי ש’המשך עריכה’ יוכל להחזיר אותה, וגופנים שאתם מייבאים"
 },
 "it": {
  "nav.support": "Assistenza",
  "lang.label": "Lingua",
  "hero.title": "Informativa sulla privacy",
  "hero.meta": "Data di entrata in vigore: 1 giugno 2026 &nbsp;·&nbsp; Ultimo aggiornamento: 12 ottobre 2026",
  "trans.note": "Questa traduzione è fornita per comodità; fa fede la versione inglese.",
  "sum.1": "Elaborazione sul dispositivo",
  "sum.2": "Attenta alla privacy",
  "sum.3": "Nessun caricamento nel cloud",
  "sum.4": "Archiviazione locale sicura",
  "s1.h": "Panoramica",
  "s1.p1": "WatermarkIT non raccoglie, conserva, trasmette né condivide dati personali o immagini. Tutta l’elaborazione avviene interamente sul tuo dispositivo.",
  "s1.p2": "Questa Informativa sulla privacy spiega come l’applicazione iOS WatermarkIT (“l’App”, “noi”) tratta le tue informazioni. Ci impegniamo a proteggere la tua privacy e a essere trasparenti sulle nostre pratiche.",
  "s2.h": "Raccolta e uso dei dati",
  "s2.p1": "<strong>Il nostro impegno assoluto:</strong> non consultiamo, carichiamo, trasmettiamo né conserviamo mai le tue foto, in nessuna circostanza. Tutta l’elaborazione delle immagini avviene interamente in locale sul tuo dispositivo.",
  "s2.p2": "L’App non raccoglie informazioni di identificazione personale (come il tuo nome o indirizzo email). Dalla versione 1.4.1, l’App utilizza Firebase Analytics e Crashlytics (Google) per capire quali funzioni vengono realmente usate e per rilevare i crash. Ricevono le funzioni usate, i report dei crash, un identificativo casuale della tua installazione dell’App e una posizione approssimativa (come il tuo paese) che Google ricava dal tuo indirizzo IP. Mai una foto, un nome file, qualcosa che digiti, o il tuo identificativo pubblicitario. Nulla di tutto questo viene collegato alla tua identità o usato per il tracciamento. Puoi disattivarlo in qualsiasi momento in Impostazioni → Privacy. In ogni caso, le tue foto restano private al 100% e non saranno mai consultate, caricate o conservate da noi.",
  "s3.h": "Come funziona l’App",
  "s3.p1": "WatermarkIT è un’applicazione completamente offline che lavora sul dispositivo. Ecco esattamente cosa succede quando la usi:",
  "s3.li1": "Scegli una foto — dalla libreria foto, dalla fotocamera o dall’app File",
  "s3.li2": "L’App legge la foto in locale sul tuo dispositivo",
  "s3.li3": "Tutta l’elaborazione della filigrana — testo, loghi, firme a mano, codici QR e mosaico — avviene interamente sul tuo dispositivo",
  "s3.li4": "I codici QR vengono generati sul dispositivo con il framework Core Image integrato di Apple; il link che inserisci non viene mai trasmesso",
  "s3.li5": "Il risultato viene salvato nel Rullino locale o condiviso tramite il foglio di condivisione di iOS",
  "s3.li6": "In nessun momento la tua foto, o dati derivati da essa, vengono inviati a un server esterno",
  "s4.h": "Permessi del dispositivo",
  "s4.p1": "L’App richiede i seguenti permessi di iOS:",
  "s4.li1": "<strong>Accesso in lettura alla libreria foto</strong> — solo se riapri un’esportazione passata da Lavori recenti o condividi foto dopo averle salvate, perché in entrambi i casi la foto salvata viene ricopiata fuori dalla libreria. Per scegliere una foto da firmare non serve: il selettore foto di iOS passa all’App solo le foto che scegli.",
  "s4.li2": "<strong>Accesso in aggiunta alla libreria foto</strong> — per salvare le immagini con filigrana nel Rullino. Permette all’App di aggiungere foto, non di vedere il resto della libreria.",
  "s4.li3": "<strong>Accesso alla fotocamera</strong> — solo se scegli di scattare una nuova foto dall’App, così puoi firmare uno scatto senza salvarne prima una copia senza marchio. L’App non apre mai la fotocamera da sola, e le foto che scatti sono trattate esattamente come tutte le altre: elaborate sul dispositivo, mai caricate.",
  "s4.p2": "Puoi anche importare un’immagine tramite l’app File. In questo caso si usa il selettore di documenti standard di iOS, che passa all’App solo il singolo file che scegli e non richiede alcun permesso permanente.",
  "s4.p3": "I permessi per foto e fotocamera vengono richiesti solo nel momento in cui usi la funzione che ne ha bisogno — mai automaticamente all’avvio. Puoi revocarli in qualsiasi momento nelle Impostazioni di iOS.",
  "s5.h": "Informazioni che aggiungi alle tue foto",
  "s5.p1": "WatermarkIT può scrivere una riga di credito — il tuo nome e il copyright — nei metadati delle foto che esporti, usando i campi standard IPTC e TIFF (Byline, Copyright Notice, Artist). È questo che permette al credito di sopravvivere al ritaglio.",
  "s5.p2": "Due cose meritano chiarezza:",
  "s5.li1": "Il testo scritto è <strong>il testo che inserisci tu</strong>. WatermarkIT non inserisce mai il nostro nome, un identificativo del dispositivo, la tua posizione o dati di tracciamento nascosti di alcun tipo.",
  "s5.li2": "Questi metadati vengono scritti nel file esportato, quindi <strong>viaggiano con il file ovunque lo invii</strong>. È proprio lo scopo della funzione — ma significa che chiunque riceva la foto può leggere il nome che hai inserito.",
  "s5.p3": "Il credito è attivo per impostazione predefinita, e sta a te disattivarlo: per una singola esportazione nella schermata Esporta, o per tutte in Impostazioni. Le tue foto esistenti non vengono mai modificate — ogni esportazione viene scritta come un nuovo file.",
  "s6.h": "Archiviazione locale dei dati",
  "s6.p1": "L’App conserva i seguenti dati <strong>solo sul tuo dispositivo</strong>:",
  "s6.li1": "I modelli di filigrana e i preset che crei (nome, carattere, dimensione, colore, opacità, rotazione, mosaico e posizione)",
  "s6.li2": "Le miniature di anteprima dei modelli salvati",
  "s6.li3": "I tuoi Lavori recenti — una cronologia locale delle foto che hai esportato, così puoi riaprirle o riesportarle",
  "s6.li4": "Le tue preferenze dell’app, come qualità e formato di esportazione predefiniti, la lingua scelta e se includere la riga di credito",
  "s6.p2": "Questi dati non lasciano mai il tuo dispositivo. Sono conservati nel contenitore locale dell’App e vengono eliminati automaticamente se disinstalli l’App.",
  "s7.h": "Servizi di terze parti",
  "s7.p1": "L’App non condivide i tuoi dati con reti pubblicitarie di terze parti. Potremmo usare SDK o fornitori di servizi di terze parti verificati per statistiche dell’app, report sugli arresti anomali o gestione degli abbonamenti. Tali servizi sono integrati esclusivamente per supportare il funzionamento dell’app e migliorare l’esperienza d’uso.",
  "s8.h": "Privacy dei minori",
  "s8.p1": "WatermarkIT è pensata per un pubblico generale. Non raccogliamo consapevolmente informazioni personali da bambini sotto i 13 anni. Se ritieni che abbiamo raccolto inavvertitamente tali informazioni, contattaci così da poter intervenire tempestivamente.",
  "s9.h": "Sicurezza dei dati",
  "s9.p1": "Poiché WatermarkIT non trasmette alcun dato, non ci sono dati in transito da proteggere. Tutti i dati conservati in locale (i tuoi modelli) sono protetti dalla crittografia integrata di iOS, attiva ogni volta che usi un codice del dispositivo.",
  "s10.h": "Modifiche a questa informativa",
  "s10.p1": "Potremmo aggiornare la nostra Informativa sulla privacy di tanto in tanto. Eventuali modifiche saranno pubblicate in questa pagina con una data di “Ultimo aggiornamento” aggiornata. Ti invitiamo a rileggere periodicamente questa informativa.",
  "s11.h": "I tuoi diritti",
  "s11.p1": "A seconda di dove ti trovi, potresti avere diritti sui tuoi dati in base alle normative locali (come il GDPR o il CCPA). Poiché la maggior parte dei tuoi dati (come modelli e foto) è conservata in locale, puoi gestirli direttamente modificando o eliminando elementi nell’App, oppure disinstallandola.",
  "contact.h": "Domande sulla tua privacy?",
  "contact.p": "Se hai domande o dubbi su questa Informativa sulla privacy, scrivici — saremo felici di aiutarti.",
  "footer.support": "Assistenza",
  "footer.made": "Fatto con ❤️ per iOS",
  "s3.li7": "Se usi WatermarkIT da Siri o Comandi Rapidi, succede lo stesso sul tuo dispositivo: la foto che il comando rapido passa viene firmata in locale, mostrata a te e restituita al comando rapido. Viene aggiunta all’album WatermarkIT in Foto solo se scegli di salvarla; l’App non ne conserva altre copie",
  "s4.li4": "<strong>Notifiche</strong> — promemoria facoltativi, programmati sul tuo dispositivo senza alcun server. iOS lo chiede una sola volta, nella schermata Home; puoi disattivarli in Promemoria nelle Impostazioni dell’App, o nelle Impostazioni di iOS.",
  "s3.li8": "I riquadri “Oscura”, la rimozione dello sfondo del logo e i PDF sono creati allo stesso modo, interamente sul tuo dispositivo",
  "s3.li9": "Le foto che invii a WatermarkIT dal pulsante Condividi in Foto vengono elaborate sul tuo dispositivo esattamente allo stesso modo",
  "s3.li10": "Controlla una foto legge il credito, la richiesta sull’addestramento IA, la posizione, la data di scatto e la fotocamera di una foto che scegli, sul tuo dispositivo, e non ne conserva alcuna copia",
  "s5.p4": "WatermarkIT può anche aggiungere alle foto che salvi il segnale IPTC standard “niente addestramento IA”, con il tuo credito ripetuto nei dati XMP del file. È una richiesta che gli strumenti possono leggere, non un lucchetto. È attivo per impostazione predefinita, non viene mai scritto nei PDF e sta a te disattivarlo nella schermata Esporta o in Impostazioni.",
  "s5.p5": "Le copie salvate conservano la data di scatto e la fotocamera della foto originale, così in Foto compaiono accanto a essa. La posizione viene rimossa, a meno che tu non scelga di mantenerla.",
  "s6.li5": "Una modifica che non hai finito, così “Continua a modificare” può riportarla, e i caratteri che importi"
 },
 "ko": {
  "nav.support": "지원",
  "lang.label": "언어",
  "hero.title": "개인정보 처리방침",
  "hero.meta": "시행일: 2026년 6월 1일 &nbsp;·&nbsp; 최종 업데이트: 2026년 10월 12일",
  "trans.note": "이 번역은 편의를 위해 제공되며, 영어 원문이 기준입니다.",
  "sum.1": "기기 내 처리",
  "sum.2": "개인정보 우선",
  "sum.3": "클라우드 업로드 없음",
  "sum.4": "안전한 로컬 저장",
  "s1.h": "개요",
  "s1.p1": "WatermarkIT는 어떤 개인 데이터나 이미지도 수집, 저장, 전송, 공유하지 않습니다. 모든 처리는 전적으로 기기 안에서 이루어집니다.",
  "s1.p2": "이 개인정보 처리방침은 WatermarkIT iOS 애플리케이션(이하 ‘앱’, ‘저희’)이 정보를 어떻게 다루는지 설명합니다. 저희는 개인정보를 보호하고 운영 방식을 투명하게 공개하기 위해 노력합니다.",
  "s2.h": "데이터 수집 및 이용",
  "s2.p1": "<strong>저희의 절대적인 약속:</strong> 어떤 경우에도 사진에 접근하거나, 업로드하거나, 전송하거나, 보관하지 않습니다. 모든 이미지 처리는 전적으로 기기 안에서 수행됩니다.",
  "s2.p2": "앱은 이름이나 이메일 주소 같은 개인 식별 정보를 수집하지 않습니다. 1.4.1 버전부터 앱은 실제로 어떤 기능이 사용되는지 파악하고 충돌을 감지하기 위해 Firebase Analytics와 Crashlytics(Google)를 사용합니다. 이들은 사용된 기능, 충돌 보고서, 앱 설치마다 무작위로 부여되는 식별자, 그리고 Google이 IP 주소로 추정한 대략적인 위치(예: 국가)를 받습니다. 사진, 파일 이름, 입력한 내용, 광고 식별자는 절대 포함되지 않습니다. 이 중 어느 것도 사용자의 신원과 연결되거나 추적에 사용되지 않습니다. 설정 → 개인정보 보호에서 언제든 끌 수 있습니다. 어느 쪽이든 사진은 100% 비공개로 유지되며 저희가 접근, 업로드, 보관하는 일은 없습니다.",
  "s3.h": "앱의 작동 방식",
  "s3.p1": "WatermarkIT는 완전히 오프라인으로 기기 안에서 작동하는 애플리케이션입니다. 사용할 때 정확히 다음과 같은 일이 일어납니다:",
  "s3.li1": "사진을 고릅니다 — 사진 보관함, 카메라, 또는 파일 앱에서",
  "s3.li2": "앱이 그 사진을 기기 안에서 읽습니다",
  "s3.li3": "텍스트, 로고, 손으로 그린 서명, QR 코드, 타일 등 모든 워터마크 처리가 전적으로 기기 안에서 수행됩니다",
  "s3.li4": "QR 코드는 Apple 내장 Core Image 프레임워크로 기기에서 생성되며, 입력한 링크는 전송되지 않습니다",
  "s3.li5": "결과는 기기의 카메라 롤에 저장되거나 iOS 공유 시트로 공유됩니다",
  "s3.li6": "어느 시점에도 사진이나 사진에서 파생된 데이터가 외부 서버로 전송되지 않습니다",
  "s4.h": "기기 권한",
  "s4.p1": "앱은 다음 iOS 권한을 요청합니다:",
  "s4.li1": "<strong>사진 보관함 읽기 권한</strong> — 최근 작업에서 지난 내보내기를 다시 열거나 저장 후 사진을 공유할 때만 필요합니다. 두 경우 모두 저장된 사진을 보관함에서 다시 꺼내 오기 때문입니다. 워터마크를 넣을 사진을 고를 때는 필요 없습니다: iOS 사진 선택기가 고른 사진만 앱에 넘겨 줍니다.",
  "s4.li2": "<strong>사진 보관함 추가 권한</strong> — 워터마크를 넣은 이미지를 카메라 롤에 저장하기 위해. 앱이 사진을 추가할 수 있게 할 뿐, 보관함의 나머지를 볼 수는 없습니다.",
  "s4.li3": "<strong>카메라 권한</strong> — 앱 안에서 새 사진을 찍기로 한 경우에만 필요하며, 표시 없는 사본을 먼저 저장하지 않고도 찍은 사진에 워터마크를 넣을 수 있게 합니다. 앱은 스스로 카메라를 열지 않으며, 찍은 사진도 다른 사진과 똑같이 다룹니다: 기기에서 처리되고, 업로드되지 않습니다.",
  "s4.p2": "파일 앱을 통해 이미지를 가져올 수도 있습니다. 이때는 iOS 표준 문서 선택기를 쓰며, 고른 파일 하나만 앱에 넘겨 주고 지속적인 권한은 필요 없습니다.",
  "s4.p3": "사진과 카메라 권한은 해당 기능을 쓰는 순간에만 요청하며 — 실행할 때 자동으로 요청하지 않습니다. 이 권한들은 언제든 iOS 설정에서 철회할 수 있습니다.",
  "s5.h": "사진에 추가하는 정보",
  "s5.p1": "WatermarkIT는 표준 IPTC와 TIFF 필드(Byline, Copyright Notice, Artist)를 사용해, 내보내는 사진의 메타데이터에 이름과 저작권으로 된 저작자 표시를 기록할 수 있습니다. 덕분에 잘라내도 저작자 표시가 남습니다.",
  "s5.p2": "두 가지를 분명히 해 둡니다:",
  "s5.li1": "기록되는 것은 <strong>직접 입력한 텍스트</strong>입니다. WatermarkIT는 저희 이름, 기기 식별자, 위치, 숨겨진 추적 데이터를 절대 넣지 않습니다.",
  "s5.li2": "이 메타데이터는 내보낸 파일에 기록되므로 <strong>파일을 보내는 곳 어디든 함께 이동합니다</strong>. 그것이 바로 이 기능의 목적이지만, 사진을 받은 사람 누구나 넣은 이름을 읽을 수 있다는 뜻이기도 합니다.",
  "s5.p3": "저작자 표시는 기본으로 켜져 있으며 끄는 것은 당신의 선택입니다: 내보내기 화면에서 개별 내보내기마다, 또는 설정에서 모든 내보내기에 대해 끌 수 있습니다. 기존 사진은 절대 수정되지 않으며 — 모든 내보내기는 새 파일로 기록됩니다.",
  "s6.h": "로컬 데이터 저장",
  "s6.p1": "앱은 다음 데이터를 <strong>기기에만</strong> 저장합니다:",
  "s6.li1": "직접 만든 워터마크 템플릿과 프리셋(이름, 서체, 크기, 색상, 불투명도, 회전, 타일, 위치)",
  "s6.li2": "저장한 템플릿의 미리보기 썸네일",
  "s6.li3": "최근 작업 — 다시 열거나 다시 내보낼 수 있도록 내보낸 사진의 로컬 기록",
  "s6.li4": "기본 내보내기 품질, 형식, 선택한 언어, 저작자 표시 포함 여부 등 앱 환경설정",
  "s6.p2": "이 데이터는 기기를 떠나지 않습니다. 앱의 로컬 컨테이너에 저장되며, 앱을 삭제하면 자동으로 삭제됩니다.",
  "s7.h": "제3자 서비스",
  "s7.p1": "앱은 데이터를 제3자 광고 네트워크와 공유하지 않습니다. 앱 분석, 충돌 보고, 구독 관리를 위해 검증된 제3자 SDK나 서비스 제공업체를 쓸 수 있습니다. 그러한 서비스는 오직 앱 기능을 지원하고 사용자 경험을 개선하기 위해 통합됩니다.",
  "s8.h": "아동의 개인정보",
  "s8.p1": "WatermarkIT는 일반 사용자를 위해 만들어졌습니다. 저희는 13세 미만 아동의 개인정보를 고의로 수집하지 않습니다. 그러한 정보가 의도치 않게 수집되었다고 생각되면 연락해 주세요. 신속히 조치하겠습니다.",
  "s9.h": "데이터 보안",
  "s9.p1": "WatermarkIT는 어떤 데이터도 전송하지 않으므로 보호해야 할 전송 중 데이터가 없습니다. 기기에 저장된 모든 데이터(템플릿)는 기기 암호를 사용할 때 켜지는 iOS 내장 암호화의 보호를 받습니다.",
  "s10.h": "방침의 변경",
  "s10.p1": "저희는 개인정보 처리방침을 수시로 업데이트할 수 있습니다. 변경 사항은 ‘최종 업데이트’ 날짜를 갱신해 이 페이지에 게시합니다. 변경 사항이 있는지 주기적으로 확인해 주세요.",
  "s11.h": "이용자의 권리",
  "s11.p1": "거주 지역에 따라 현지 법규(GDPR, CCPA 등)에 따른 데이터 관련 권리가 있을 수 있습니다. 데이터 대부분(템플릿, 사진 등)이 기기에 저장되므로, 앱 안에서 항목을 수정하거나 삭제하거나 앱을 삭제해 직접 관리할 수 있습니다.",
  "contact.h": "개인정보에 대해 궁금한 점이 있나요?",
  "contact.p": "이 개인정보 처리방침에 대해 질문이나 우려가 있다면 연락해 주세요 — 기꺼이 도와드리겠습니다.",
  "footer.support": "지원",
  "footer.made": "iOS를 위해 ❤️로 만들었습니다",
  "s3.li7": "Siri나 단축어에서 WatermarkIT를 실행해도 기기에서 똑같이 처리됩니다: 단축어가 넘긴 사진에 기기에서 표시를 넣고, 보여 준 다음, 단축어로 돌려줍니다. 저장하기로 한 경우에만 사진 앱의 WatermarkIT 앨범에 추가되며, 앱은 다른 사본을 남기지 않습니다",
  "s4.li4": "<strong>알림</strong> — 선택 사항인 알림으로, 서버 없이 기기에서 예약됩니다. iOS가 홈 화면에서 한 번 묻습니다. 앱 설정의 알림이나 iOS 설정에서 끌 수 있습니다.",
  "s3.li8": "‘가리기’ 상자, 로고 배경 제거, PDF도 같은 방식으로 전적으로 기기 안에서 만들어집니다",
  "s3.li9": "사진 앱의 공유 버튼으로 WatermarkIT에 보낸 사진도 기기에서 똑같은 방식으로 처리됩니다",
  "s3.li10": "사진 확인은 고른 사진의 저작자 표시, AI 학습 요청, 위치, 촬영 날짜, 카메라를 기기에서 읽으며, 사본을 남기지 않습니다",
  "s5.p4": "WatermarkIT는 저장하는 사진에 표준 IPTC ‘AI 학습 금지’ 신호도 추가할 수 있으며, 저작자 표시는 파일의 XMP 데이터에 한 번 더 기록됩니다. 도구가 읽을 수 있는 요청이지 자물쇠는 아닙니다. 기본으로 켜져 있고, PDF에는 기록되지 않으며, 내보내기 화면이나 설정에서 끌 수 있습니다.",
  "s5.p5": "저장한 사본은 원본 사진의 촬영 날짜와 카메라를 유지해 사진 앱에서 원본 옆에 정렬됩니다. 위치는 유지하기로 선택하지 않는 한 제거됩니다.",
  "s6.li5": "마치지 않은 편집 — ‘계속 편집’으로 다시 불러올 수 있도록 — 과 가져온 서체"
 },
 "th": {
  "nav.support": "ความช่วยเหลือ",
  "lang.label": "ภาษา",
  "hero.title": "นโยบายความเป็นส่วนตัว",
  "hero.meta": "มีผลบังคับใช้: 1 มิถุนายน 2026 &nbsp;·&nbsp; อัปเดตล่าสุด: 12 ตุลาคม 2026",
  "trans.note": "คำแปลนี้มีไว้เพื่อความสะดวก ฉบับภาษาอังกฤษเป็นฉบับที่ใช้อ้างอิง",
  "sum.1": "ประมวลผลบนอุปกรณ์",
  "sum.2": "ให้ความสำคัญกับความเป็นส่วนตัว",
  "sum.3": "ไม่อัปโหลดขึ้นคลาวด์",
  "sum.4": "จัดเก็บในเครื่องอย่างปลอดภัย",
  "s1.h": "ภาพรวม",
  "s1.p1": "WatermarkIT ไม่เก็บรวบรวม จัดเก็บ ส่ง หรือแชร์ข้อมูลส่วนบุคคลหรือรูปภาพใด ๆ การประมวลผลทั้งหมดเกิดขึ้นบนอุปกรณ์ของคุณเท่านั้น",
  "s1.p2": "นโยบายความเป็นส่วนตัวนี้อธิบายว่าแอปพลิเคชัน iOS WatermarkIT (“แอป”, “เรา”) จัดการข้อมูลของคุณอย่างไร เรามุ่งมั่นที่จะปกป้องความเป็นส่วนตัวของคุณและเปิดเผยแนวปฏิบัติของเราอย่างโปร่งใส",
  "s2.h": "การเก็บรวบรวมและการใช้ข้อมูล",
  "s2.p1": "<strong>คำมั่นอย่างเด็ดขาดของเรา:</strong> เราไม่เคยเข้าถึง อัปโหลด ส่ง หรือจัดเก็บรูปภาพของคุณไม่ว่ากรณีใด การประมวลผลภาพทั้งหมดทำบนอุปกรณ์ของคุณเท่านั้น",
  "s2.p2": "แอปไม่เก็บข้อมูลระบุตัวตนส่วนบุคคล (เช่น ชื่อหรืออีเมลของคุณ) ตั้งแต่เวอร์ชัน 1.4.1 เป็นต้นไป แอปใช้ Firebase Analytics และ Crashlytics (ของ Google) เพื่อทำความเข้าใจว่าฟีเจอร์ใดถูกใช้งานจริง และเพื่อตรวจจับการขัดข้อง โดยจะได้รับข้อมูลฟีเจอร์ที่ใช้ รายงานข้อขัดข้อง ตัวระบุแบบสุ่มของการติดตั้งแอปของคุณ และตำแหน่งโดยประมาณ (เช่น ประเทศ) ที่ Google อนุมานจากที่อยู่ IP ของคุณ ไม่เคยรวมรูปภาพ ชื่อไฟล์ สิ่งที่คุณพิมพ์ หรือรหัสโฆษณาของคุณ ข้อมูลเหล่านี้ไม่ถูกเชื่อมโยงกับตัวตนของคุณและไม่ถูกใช้เพื่อการติดตาม คุณสามารถปิดสิ่งนี้ได้ทุกเมื่อในการตั้งค่า → ความเป็นส่วนตัว ไม่ว่าจะเปิดหรือปิด รูปภาพของคุณยังคงเป็นส่วนตัว 100% และเราจะไม่เข้าถึง อัปโหลด หรือจัดเก็บ",
  "s3.h": "แอปทำงานอย่างไร",
  "s3.p1": "WatermarkIT เป็นแอปพลิเคชันที่ทำงานบนอุปกรณ์แบบออฟไลน์ทั้งหมด นี่คือสิ่งที่เกิดขึ้นเมื่อคุณใช้งาน:",
  "s3.li1": "คุณเลือกรูปภาพ — จากคลังรูปภาพ จากกล้อง หรือจากแอปไฟล์",
  "s3.li2": "แอปอ่านรูปภาพนั้นบนอุปกรณ์ของคุณ",
  "s3.li3": "การประมวลผลลายน้ำทั้งหมด — ข้อความ โลโก้ ลายเซ็นที่วาดด้วยมือ QR โค้ด และการเรียงต่อ — ทำบนอุปกรณ์ของคุณเท่านั้น",
  "s3.li4": "QR โค้ดสร้างบนอุปกรณ์ด้วยเฟรมเวิร์ก Core Image ในตัวของ Apple ลิงก์ที่คุณป้อนจะไม่ถูกส่งออกไป",
  "s3.li5": "ผลลัพธ์จะถูกบันทึกลงม้วนฟิล์มในเครื่องหรือแชร์ผ่านแผ่นแชร์ของ iOS",
  "s3.li6": "ไม่มีขั้นตอนใดที่รูปภาพของคุณหรือข้อมูลที่ได้จากรูปภาพถูกส่งไปยังเซิร์ฟเวอร์ภายนอก",
  "s4.h": "สิทธิ์ของอุปกรณ์",
  "s4.p1": "แอปขอสิทธิ์ iOS ต่อไปนี้:",
  "s4.li1": "<strong>สิทธิ์อ่านคลังรูปภาพ</strong> — เฉพาะเมื่อคุณเปิดงานที่เคยส่งออกจากงานล่าสุดอีกครั้ง หรือแชร์รูปหลังบันทึก เพราะทั้งสองกรณีต้องคัดลอกรูปที่บันทึกไว้ออกมาจากคลัง การเลือกรูปเพื่อใส่ลายน้ำไม่ต้องใช้สิทธิ์นี้: ตัวเลือกรูปภาพของ iOS ส่งให้แอปเฉพาะรูปที่คุณเลือก",
  "s4.li2": "<strong>สิทธิ์เพิ่มลงคลังรูปภาพ</strong> — เพื่อบันทึกภาพที่ใส่ลายน้ำแล้วลงม้วนฟิล์ม สิทธิ์นี้ให้แอปเพิ่มรูปได้ แต่มองไม่เห็นรูปอื่นในคลัง",
  "s4.li3": "<strong>สิทธิ์ใช้กล้อง</strong> — เฉพาะเมื่อคุณเลือกถ่ายรูปใหม่ในแอป เพื่อให้ใส่ลายน้ำได้โดยไม่ต้องบันทึกสำเนาที่ไม่มีลายน้ำก่อน แอปไม่เปิดกล้องเอง และรูปที่ถ่ายจะได้รับการจัดการเหมือนรูปอื่นทุกประการ: ประมวลผลบนอุปกรณ์ ไม่เคยอัปโหลด",
  "s4.p2": "คุณยังนำเข้าภาพผ่านแอปไฟล์ได้ ซึ่งใช้ตัวเลือกเอกสารมาตรฐานของ iOS ที่ส่งให้แอปเฉพาะไฟล์เดียวที่คุณเลือก และไม่ต้องใช้สิทธิ์ต่อเนื่อง",
  "s4.p3": "สิทธิ์รูปภาพและกล้องจะขอเฉพาะตอนที่คุณใช้คุณสมบัติที่ต้องใช้สิทธิ์นั้น — ไม่ขออัตโนมัติตอนเปิดแอป คุณเพิกถอนสิทธิ์เหล่านี้ได้ทุกเมื่อในการตั้งค่า iOS",
  "s5.h": "ข้อมูลที่คุณเพิ่มลงในรูปภาพ",
  "s5.p1": "WatermarkIT เขียนบรรทัดเครดิต — ชื่อและลิขสิทธิ์ของคุณ — ลงในเมทาดาทาของรูปที่ส่งออกได้ โดยใช้ฟิลด์มาตรฐาน IPTC และ TIFF (Byline, Copyright Notice, Artist) ซึ่งทำให้เครดิตอยู่รอดแม้ถูกครอป",
  "s5.p2": "มีสองเรื่องที่ควรชัดเจน:",
  "s5.li1": "ข้อความที่เขียนคือ <strong>ข้อความที่คุณป้อนเอง</strong> WatermarkIT ไม่เคยใส่ชื่อของเรา ตัวระบุอุปกรณ์ ตำแหน่งของคุณ หรือข้อมูลติดตามที่ซ่อนอยู่ใด ๆ",
  "s5.li2": "เมทาดาทานี้ถูกเขียนลงในไฟล์ที่ส่งออก จึง <strong>ติดไปกับไฟล์ทุกที่ที่คุณส่ง</strong> นั่นคือจุดประสงค์ของคุณสมบัตินี้ — แต่ก็หมายความว่าทุกคนที่ได้รับรูปจะอ่านชื่อที่คุณใส่ไว้ได้",
  "s5.p3": "เครดิตเปิดไว้เป็นค่าเริ่มต้น และคุณเลือกปิดได้: ปิดสำหรับการส่งออกครั้งเดียวในหน้าส่งออก หรือทุกครั้งในการตั้งค่า รูปภาพที่มีอยู่ของคุณจะไม่ถูกแก้ไข — การส่งออกทุกครั้งจะเขียนเป็นไฟล์ใหม่",
  "s6.h": "การจัดเก็บข้อมูลในเครื่อง",
  "s6.p1": "แอปจัดเก็บข้อมูลต่อไปนี้ <strong>บนอุปกรณ์ของคุณเท่านั้น</strong>:",
  "s6.li1": "เทมเพลตลายน้ำและพรีเซ็ตที่คุณสร้าง (ชื่อ แบบอักษร ขนาด สี ความทึบ การหมุน การเรียงต่อ และตำแหน่ง)",
  "s6.li2": "ภาพตัวอย่างขนาดย่อของเทมเพลตที่บันทึกไว้",
  "s6.li3": "งานล่าสุด — ประวัติในเครื่องของรูปที่คุณส่งออก เพื่อให้เปิดหรือส่งออกใหม่ได้",
  "s6.li4": "การตั้งค่าแอปของคุณ เช่น คุณภาพและรูปแบบการส่งออกเริ่มต้น ภาษาที่เลือก และการใส่บรรทัดเครดิตหรือไม่",
  "s6.p2": "ข้อมูลนี้ไม่เคยออกจากอุปกรณ์ของคุณ ถูกจัดเก็บในพื้นที่ภายในของแอป และจะถูกลบอัตโนมัติเมื่อคุณถอนการติดตั้งแอป",
  "s7.h": "บริการของบุคคลที่สาม",
  "s7.p1": "แอปไม่แชร์ข้อมูลของคุณกับเครือข่ายโฆษณาของบุคคลที่สาม เราอาจใช้ SDK หรือผู้ให้บริการบุคคลที่สามที่ผ่านการตรวจสอบสำหรับการวิเคราะห์แอป การรายงานข้อขัดข้อง หรือการจัดการการสมัครสมาชิก บริการดังกล่าวถูกรวมไว้เพื่อสนับสนุนการทำงานของแอปและปรับปรุงประสบการณ์ผู้ใช้เท่านั้น",
  "s8.h": "ความเป็นส่วนตัวของเด็ก",

  const SUPPORTED = Object.keys(I18N);
  const RTL = new Set(['ar', 'he']);

  // ?lang= wins (that is what the app passes), then a previous choice on this
  // device, then the browser's own preference. Anything unrecognised falls back
  // to English rather than showing empty nodes.
  function resolveLang() {
    const q = new URLSearchParams(location.search).get('lang');
    let stored = null;
    try { stored = localStorage.getItem('wmk-lang'); } catch (e) {}
    for (const cand of [q, stored, ...(navigator.languages || [navigator.language || ''])]) {
      if (!cand) continue;
      if (I18N[cand]) return cand;
      const low = cand.toLowerCase();
      // Older browsers still report Hebrew as "iw".
      if (low === 'iw' || low.startsWith('iw-')) return 'he';
      if (low.startsWith('zh')) {
        // Hong Kong gets its own dedicated locale (distinct in-app wording
        // from Taiwan); Macau has no locale of its own and reads Taiwan's.
        if (low.includes('hk')) return 'zh-HK';
        return /hant|tw|mo/.test(low) ? 'zh-Hant' : 'zh-Hans';
      }
      if (low.startsWith('es')) {
        // es-ES (Spain) is its own locale; every other Spanish-speaking
        // region (Mexico and, absent a metadata locale of their own, the
        // rest of Latin America) reads es-MX — there is no separate App
        // Store Connect locale for Argentina, Colombia, Chile, etc., and
        // es-MX is the one this app's own metadata uses to reach them.
        const region = low.split('-')[1];
        return region === 'es' ? 'es-ES' : 'es-MX';
      }
      const base = low.split('-')[0];
      const hit = SUPPORTED.find(l => l.toLowerCase().split('-')[0] === base);
      if (hit) return hit;
    }
    return 'en';
  }

  function applyLang(lang) {
    const dict = I18N[lang] || I18N.en;
    const root = document.documentElement;
    root.lang = lang;
    root.dir = RTL.has(lang) ? 'rtl' : 'ltr';

    document.querySelectorAll('[data-i18n]').forEach(el => {
      const v = dict[el.dataset.i18n];
      if (v !== undefined) el.innerHTML = v;   // authored strings, not user input
    });

    document.title = 'WatermarkIT \u2014 ' + (dict['hero.title'] || '');
    const pick = document.getElementById('langpick');
    if (pick) { pick.value = lang; pick.setAttribute('aria-label', dict['lang.label'] || 'Language'); }

    // Carry the choice across the site's own links so the next page opens in
    // the same language.
    document.querySelectorAll('a[href]').forEach(a => {
      const href = a.getAttribute('href');
      if (!href || !/^(index|support|privacy)\.html/.test(href)) return;
      const u = new URL(href, location.href);
      u.searchParams.set('lang', lang);
      a.setAttribute('href', u.pathname.split('/').pop() + u.search);
    });

    try { localStorage.setItem('wmk-lang', lang); } catch (e) {}
  }

  applyLang(resolveLang());

  document.getElementById('langpick').addEventListener('change', e => {
    applyLang(e.target.value);
    const u = new URL(location.href);
    u.searchParams.set('lang', e.target.value);
    history.replaceState(null, '', u);
  });

  document.getElementById('yr-privacy').textContent = new Date().getFullYear();
</script>
