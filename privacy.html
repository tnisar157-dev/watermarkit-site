<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WatermarkIT — Privacy Policy</title>
  <meta name="description" content="WatermarkIT Privacy Policy. Your photos never leave your device. No data collection, no accounts, no cloud storage." />
  <link rel="icon" type="image/png" href="appicon.png" />
  <link rel="apple-touch-icon" href="appicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green: #0B8340;
      --green-light: #30D158;
      --gradient: linear-gradient(135deg, #04642F 0%, #0B8340 100%);
      --bg: #0C0C0E;
      --surface: #161618;
      --surface2: #1D1D20;
      --border: rgba(255,255,255,0.08);
      --text: #F0F0F2;
      --muted: #98989E;
      --radius: 16px;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, sans-serif;
      line-height: 1.7;
      min-height: 100vh;
    }

    /* NAV */
    nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(10,10,15,0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
    }
    .nav-inner {
      max-width: 860px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--text);
      font-weight: 700;
      font-size: 18px;
    }
    .logo-icon {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      object-fit: cover;
    }
    .nav-link {
      color: var(--muted);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      transition: color 0.2s;
    }
    .nav-link:hover { color: var(--text); }

    /* HERO */
    .hero {
      background: var(--gradient);
      padding: 80px 24px 100px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .hero::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 0;
      right: 0;
      height: 60px;
      background: var(--bg);
      clip-path: ellipse(60% 100% at 50% 100%);
    }
    .hero h1 {
      font-size: clamp(30px, 5vw, 48px);
      font-weight: 800;
      letter-spacing: -1px;
      margin-bottom: 16px;
    }
    .hero .meta {
      font-size: 15px;
      opacity: 0.75;
    }

    /* SUMMARY PILL */
    .summary-strip {
      background: rgba(48, 209, 88, 0.12);
      border: 1px solid rgba(48, 209, 88, 0.35);
      border-radius: var(--radius);
      padding: 24px 28px;
      margin-bottom: 48px;
      display: flex;
      gap: 32px;
      flex-wrap: wrap;
    }
    .summary-item {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      font-weight: 500;
      color: var(--text);
    }
    .check {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: rgba(48, 209, 88, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 12px;
    }

    /* CONTENT */
    .content {
      max-width: 860px;
      margin: 0 auto;
      padding: 64px 24px 100px;
    }

    /* POLICY SECTIONS */
    .policy-section {
      margin-bottom: 48px;
    }
    .policy-section h2 {
      font-size: 19px;
      font-weight: 700;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .policy-section h2 .num {
      display: inline-flex;
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: rgba(48, 209, 88, 0.2);
      color: var(--green-light);
      font-size: 13px;
      font-weight: 700;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .policy-section p {
      color: #B4B4BC;
      font-size: 15px;
      margin-bottom: 14px;
    }
    .policy-section ul {
      list-style: none;
      padding: 0;
    }
    .policy-section ul li {
      color: #B4B4BC;
      font-size: 15px;
      padding: 6px 0 6px 24px;
      position: relative;
    }
    .policy-section ul li::before {
      content: '→';
      position: absolute;
      left: 0;
      color: var(--green-light);
      font-weight: 600;
    }
    .highlight {
      background: rgba(48, 209, 88, 0.1);
      border: 1px solid rgba(48, 209, 88, 0.25);
      border-radius: 10px;
      padding: 16px 20px;
      color: var(--text) !important;
      font-weight: 500;
    }

    /* CONTACT */
    .contact-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 36px;
      text-align: center;
      margin-top: 56px;
    }
    .contact-box h2 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 10px;
    }
    .contact-box p {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 22px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--gradient);
      color: white;
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      font-weight: 600;
      padding: 13px 26px;
      border-radius: 100px;
      text-decoration: none;
      transition: opacity 0.2s, transform 0.2s;
    }
    .btn:hover { opacity: 0.9; transform: scale(1.02); }

    /* FOOTER */
    footer {
      border-top: 1px solid var(--border);
      padding: 32px 24px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }
    footer a { color: var(--green-light); text-decoration: none; }
    footer a:hover { text-decoration: underline; }

    /* ── i18n ───────────────────────────────────── */
    .langpick {
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 100px;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 500;
      padding: 7px 12px;
      cursor: pointer;
appearance: none;
    }
    .langpick:focus-visible { outline: 2px solid var(--green-light); outline-offset: 2px; }
    .trans-note {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
      border-inline-start: 2px solid var(--border);
      padding-inline-start: 12px;
      margin-bottom: 28px;
    }
    .trans-note:empty { display: none; }
    /* Fourteen languages made 'Português (Brasil)' the longest option, and a
       native <select>'s closed width follows its widest option, not the
       selected one — capping it with an ellipsis keeps the box a constant,
       predictable size regardless of which language (or how many) are added.
       The open dropdown is unaffected and still shows every option in full. */
    @media (max-width: 480px) {
      .nav-inner { padding: 0 16px; }
      .langpick { max-width: 84px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      /* Several of the fourteen languages' short forms (Russian, French,
         Portuguese...) still ran the fixed English wordmark + link + picker
         past 375px even after nav.privacy was shortened — the wordmark is a
         brand name and does not translate down. The footer repeats this same
         link on both pages, so hiding it here loses no destination, only a
         redundant shortcut, matching the CTA already dropped on index.html
         at this width. */
      .nav-link { display: none; }
    }
    /* Mirror the few rules that are physically, not logically, sided. */
    [dir="rtl"] .policy-section ul li { padding: 6px 24px 6px 0; }
    [dir="rtl"] .policy-section ul li::before { left: auto; right: 0; content: '←'; }
    [dir="rtl"] .faq-question { text-align: right; }
    :lang(ar) body { font-family: 'Inter', 'Geeza Pro', system-ui, sans-serif; }
    :lang(ja) body { font-family: 'Inter', 'Hiragino Sans', 'Yu Gothic', system-ui, sans-serif; }
    :lang(zh-Hans) body { font-family: 'Inter', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif; }
    :lang(zh-Hant) body { font-family: 'Inter', 'PingFang TC', 'Microsoft JhengHei', system-ui, sans-serif; }
    :lang(zh-HK) body { font-family: 'Inter', 'PingFang HK', 'PingFang TC', system-ui, sans-serif; }
    :lang(ru) body { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    :lang(vi) body { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    :lang(tr) body { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    :lang(he) body { font-family: 'Inter', 'Arial Hebrew', 'SF Hebrew', system-ui, sans-serif; }
    :lang(ko) body { font-family: 'Inter', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif; word-break: keep-all; }
    :lang(th) body { font-family: 'Inter', 'Thonburi', 'Leelawadee UI', system-ui, sans-serif; }
  </style>
</head>

<script>
  // Translations. English is the source text and stays authoritative.
  const I18N = {
 "en": {
  "nav.support": "Support",
  "lang.label": "Language",
  "hero.title": "Privacy Policy",
  "hero.meta": "Effective Date: June 1, 2026 &nbsp;·&nbsp; Last Updated: October 12, 2026",

  "s1.h": "Overview",
  "s1.p1": "WatermarkIT does not collect, store, transmit, or share any personal data or images. All processing happens entirely on your device.",
  "s1.p2": "This Privacy Policy explains how the WatermarkIT iOS application (“the App”, “we”, “us”) handles your information. We are committed to protecting your privacy and being transparent about our practices.",
  "s2.h": "Data Collection and Usage",
  "s2.p1": "<strong>Our Absolute Commitment:</strong> We never access, upload, transmit, or store your photos under any circumstances. All image processing is performed entirely locally on your device.",
  "s2.p2": "The App does not collect personal identification information (such as your name or email address). As of version 1.4.1, it uses Firebase Analytics and Crashlytics (Google) to see which features people actually use and to catch crashes. They receive which features were used, crash reports, a random identifier for your installation of the App, and an approximate location (such as your country) that Google derives from your IP address. Never a photo, a filename, anything you type, or your advertising identifier. None of this is linked to your identity or used for tracking. You can turn this off anytime in Settings → Privacy. Your photos remain 100% private either way, and are never accessed, uploaded, or stored by us.",
  "s3.h": "How the App Works",
  "s3.p1": "WatermarkIT is a fully offline, on-device application. Here is exactly what happens when you use it:",
  "s3.li1": "You choose a photo — from your photo library, from your camera, or from the Files app",
  "s3.li2": "The App reads that photo locally on your device",

  "s3.li5": "The result is saved back to your local Camera Roll or shared via the iOS Share Sheet",
  "s3.li6": "At no point is your photo, or any data derived from it, sent to any external server",
  "s4.h": "Device Permissions",
  "s4.p1": "The App requests the following iOS permissions:",
  "s4.li1": "<strong>Photo Library Read Access</strong> — only if you reopen a past export from Recent Work, or share photos after saving them, since both copy your saved photo back out of your library. Choosing a photo to watermark does not need it: the iOS photo picker hands the App only the photos you pick.",
  "s4.li2": "<strong>Photo Library Add Access</strong> — to save your watermarked images to your Camera Roll. This lets the App add photos, not see the rest of your library.",
  "s4.li3": "<strong>Camera Access</strong> — only if you choose to take a new photo inside the App, so you can watermark a shot without first saving an unmarked copy. The App never opens the camera on its own, and photos you capture are handled exactly like any other: processed on-device, never uploaded.",
  "s4.p2": "You may also import an image through the Files app. That uses the standard iOS document picker, which hands the App only the single file you pick and requires no ongoing permission.",
  "s4.p3": "Photo and camera permissions are requested only at the moment you use the feature that needs them — never automatically on launch. You can revoke any of these permissions at any time in iOS Settings.",
  "s5.h": "Information You Add to Your Photos",
  "s5.p1": "WatermarkIT can write a credit line — your name and copyright — into the metadata of the photos you export, using the standard IPTC and TIFF fields (Byline, Copyright Notice, Artist). This is what allows your credit to survive cropping.",
  "s5.p2": "Two things are worth being clear about:",
  "s5.li1": "The text written is <strong>the text you enter</strong>. WatermarkIT never inserts our name, a device identifier, your location, or any hidden tracking data of its own.",
  "s5.li2": "This metadata is written into the exported file, so it <strong>travels with that file wherever you send it</strong>. That is precisely the point of the feature — but it does mean anyone you share the photo with can read the name you put there.",
  "s5.p3": "The credit is on by default, and yours to switch off: turn it off for an individual export on the Export sheet, or for every export in Settings. Your existing photos are never modified — every export is written as a new file.",

  "s6.p2": "This data never leaves your device. It is stored in the App’s local container and is deleted automatically if you uninstall the App.",

  "s7.p1": "The App does not share your data with third-party advertising networks. We may use verified third-party SDKs or service providers for app analytics, crash reporting, or subscription management. Any such services are integrated strictly to support the app’s functionality and improve user experience.",
  "s8.h": "Children’s Privacy",
  "s8.p1": "WatermarkIT is designed for a general audience. We do not knowingly collect personal information from children under the age of 13. If you believe we have inadvertently collected such information, please contact us so we can promptly address it.",

  "s10.p1": "We may update our Privacy Policy from time to time. Any changes will be posted on this page with an updated “Last Updated” date. We encourage you to review this policy periodically for any changes.",
  "s11.h": "Your Rights",
  "s11.p1": "Depending on your location, you may have rights regarding your data under local regulations (such as GDPR or CCPA). Since the majority of your data (like templates and photos) is stored locally, you can manage it directly by modifying or deleting items inside the App, or by uninstalling the App.",

  "contact.p": "If you have any questions or concerns about this Privacy Policy, reach out — we’re happy to help.",

  "s3.li8": "Black-out boxes, logo background removal and PDFs are made the same way, entirely on your device",
  "s3.li9": "Photos you send to WatermarkIT from the Share button in Photos are processed on your device in exactly the same way",
  "s3.li10": "Check a Photo reads the credit, AI-training request, location, capture date and camera of a photo you pick, on your device, and keeps no copy of it",
  "s5.p4": "WatermarkIT can also add the standard IPTC “no AI training” signal to the photos you save, with your credit repeated in the file’s XMP data. It is a request tools can read, not a lock. It is on by default, never written into PDFs, and yours to switch off on the Export screen or in Settings.",
  "s5.p5": "Saved copies keep the original photo’s capture date and camera, so they sort beside it in Photos. Location is removed unless you choose to keep it.",
  "s6.li5": "An edit you have not finished, so “Continue editing” can bring it back, and any fonts you import"
 },
 "ar": {
  "nav.support": "الدعم",
  "lang.label": "اللغة",
  "hero.title": "سياسة الخصوصية",
  "hero.meta": "تاريخ السريان: 1 يونيو 2026 &nbsp;·&nbsp; آخر تحديث: 12 أكتوبر 2026",
  "trans.note": "هذه الترجمة مقدّمة للتسهيل فقط، والنسخة الإنجليزية هي المرجع المعتمد.",
  "sum.1": "معالجة على الجهاز",
  "sum.2": "تركّز على الخصوصية",
  "sum.3": "لا رفع إلى السحابة",
  "sum.4": "تخزين محلي آمن",
  "s1.h": "نظرة عامة",
  "s1.p1": "لا يجمع WatermarkIT أي بيانات شخصية أو صور ولا يخزّنها أو ينقلها أو يشاركها. تتم كل المعالجة على جهازك بالكامل.",
  "s1.p2": "توضّح سياسة الخصوصية هذه كيف يتعامل تطبيق WatermarkIT لـ iOS (“التطبيق”، “نحن”) مع معلوماتك. نحن ملتزمون بحماية خصوصيتك وبالشفافية في ممارساتنا.",
  "s2.h": "جمع البيانات واستخدامها",
  "s2.p1": "<strong>التزامنا المطلق:</strong> لا نصل إلى صورك ولا نرفعها أو ننقلها أو نخزّنها تحت أي ظرف. تتم معالجة الصور محليًا على جهازك بالكامل.",
  "s2.p2": "لا يجمع التطبيق معلومات تعريف شخصية (مثل اسمك أو بريدك الإلكتروني). اعتبارًا من الإصدار 1.4.1، يستخدم التطبيق Firebase Analytics و Crashlytics (من Google) لمعرفة الميزات التي يستخدمها الأشخاص فعليًا ولرصد الأعطال. يتلقيان الميزات التي استُخدمت، وتقارير الأعطال، ومعرّفًا عشوائيًا لنسخة التطبيق المثبتة لديك، وموقعًا تقريبيًا (مثل بلدك) تستنتجه Google من عنوان IP الخاص بك. لا يشمل ذلك أبدًا صورك أو أسماء ملفاتها أو أي شيء تكتبه، ولا معرّف الإعلانات الخاص بجهازك. لا يُربط أي من ذلك بهويتك ولا يُستخدم للتتبع. يمكنك إيقاف ذلك في أي وقت من الإعدادات ← الخصوصية. تبقى صورك خاصة بنسبة 100% في الحالتين، ولن نقوم أبدًا بالوصول إليها أو رفعها أو تخزينها.",
  "s3.h": "كيف يعمل التطبيق",
  "s3.p1": "WatermarkIT تطبيق يعمل دون اتصال وعلى الجهاز بالكامل. إليك ما يحدث بالضبط عند استخدامه:",
  "s3.li1": "تختار صورة — من مكتبة الصور أو الكاميرا أو تطبيق الملفات",
  "s3.li2": "يقرأ التطبيق تلك الصورة محليًا على جهازك",
  "s3.li3": "تتم كل معالجة العلامة المائية — النص والشعارات والتوقيعات اليدوية ورموز QR والتكرار — على جهازك بالكامل",
  "s3.li4": "تُنشأ رموز QR على الجهاز باستخدام إطار Core Image من أبل، ولا يُرسل الرابط الذي تدخله أبدًا",
  "s3.li5": "تُحفظ النتيجة في ألبوم الصور لديك أو تُشارك عبر ورقة المشاركة في iOS",
  "s3.li6": "لا تُرسل صورتك، أو أي بيانات مستمدة منها، إلى أي خادم خارجي في أي وقت",
  "s4.h": "أذونات الجهاز",
  "s4.p1": "يطلب التطبيق أذونات iOS التالية:",
  "s4.li1": "<strong>إذن قراءة مكتبة الصور</strong> — فقط إذا أعدت فتح تصدير سابق من الأعمال الأخيرة، أو شاركت الصور بعد حفظها، لأن كليهما ينسخ صورتك المحفوظة من مكتبتك. أما اختيار صورة لوضع العلامة عليها فلا يحتاجه: منتقي الصور في iOS لا يسلّم التطبيق إلا الصور التي تختارها.",
  "s4.li2": "<strong>إذن الإضافة إلى مكتبة الصور</strong> — لحفظ صورك المعلَّمة في ألبوم الكاميرا. يسمح هذا للتطبيق بإضافة الصور، لا برؤية بقية مكتبتك.",
  "s4.li3": "<strong>إذن الكاميرا</strong> — فقط إذا اخترت التقاط صورة جديدة داخل التطبيق، لتضع علامة على لقطة دون حفظ نسخة غير معلّمة أولًا. لا يفتح التطبيق الكاميرا من تلقاء نفسه، وتُعامَل الصور التي تلتقطها مثل غيرها تمامًا: تُعالَج على الجهاز ولا تُرفع أبدًا.",
  "s4.p2": "يمكنك أيضًا استيراد صورة عبر تطبيق الملفات، وذلك عبر منتقي المستندات القياسي في iOS الذي يمنح التطبيق الملف المحدد فقط دون أي إذن دائم.",
  "s4.p3": "لا تُطلب أذونات الصور والكاميرا إلا لحظة استخدامك الميزة التي تحتاجها — ولا تُطلب تلقائيًا عند التشغيل أبدًا. ويمكنك إلغاء أي منها في أي وقت من إعدادات iOS.",
  "s5.h": "المعلومات التي تضيفها إلى صورك",
  "s5.p1": "يمكن لـ WatermarkIT كتابة سطر نسبة — اسمك وحقوق النشر — في بيانات الصور التي تصدّرها، باستخدام حقول IPTC وTIFF القياسية. وهذا ما يجعل نسبتك تبقى بعد الاقتصاص.",
  "s5.p2": "ينبغي توضيح أمرين:",
  "s5.li1": "النص المكتوب هو <strong>النص الذي تدخله أنت</strong>. لا يضيف WatermarkIT اسمنا أو معرّف جهاز أو موقعك أو أي بيانات تتبّع خفية.",
  "s5.li2": "تُكتب هذه البيانات داخل الملف المُصدَّر، لذا <strong>تنتقل معه أينما أرسلته</strong>. وهذا هو الهدف من الميزة — لكنه يعني أيضًا أن كل من تشاركه الصورة يمكنه قراءة الاسم الذي وضعته.",
  "s5.p3": "سطر الإشارة مفعّل افتراضيًا، والقرار لك في إيقافه: أوقفه لعملية تصدير واحدة من ورقة التصدير، أو لكل عمليات التصدير من الإعدادات. لا تُعدَّل صورك الحالية أبدًا — فكل تصدير يُكتب كملف جديد.",
  "s6.h": "التخزين المحلي للبيانات",
  "s6.p1": "يخزّن التطبيق البيانات التالية <strong>على جهازك فقط</strong>:",
  "s6.li1": "القوالب والإعدادات المسبقة التي تنشئها (الاسم والخط والحجم واللون والشفافية والدوران والتكرار والموضع)",
  "s6.li2": "صور المعاينة المصغّرة لقوالبك المحفوظة",
  "s6.li3": "أعمالك الأخيرة — سجل محلي للصور التي صدّرتها، لتتمكّن من فتحها أو تصديرها مجددًا",
  "s6.li4": "تفضيلات التطبيق، مثل جودة التصدير الافتراضية والصيغة واللغة التي اخترتها وما إذا كنت تريد تضمين سطر النسبة",
  "s6.p2": "لا تغادر هذه البيانات جهازك أبدًا. فهي مخزّنة في حاوية التطبيق المحلية وتُحذف تلقائيًا عند إلغاء تثبيت التطبيق.",
  "s7.h": "خدمات الطرف الثالث",
  "s7.p1": "لا يشارك التطبيق بياناتك مع شبكات الإعلانات. وقد نستخدم حزم SDK أو مزوّدي خدمات موثوقين لتحليلات التطبيق أو تقارير الأعطال أو إدارة الاشتراكات، وذلك حصرًا لدعم وظائف التطبيق وتحسين التجربة.",
  "s8.h": "خصوصية الأطفال",
  "s8.p1": "صُمّم WatermarkIT لجمهور عام. ولا نجمع عن علم معلومات شخصية من الأطفال دون الثالثة عشرة. إذا كنت تعتقد أننا جمعنا مثل هذه المعلومات عن غير قصد، فيرجى التواصل معنا لمعالجة الأمر سريعًا.",
  "s9.h": "أمان البيانات",
  "s9.p1": "لأن WatermarkIT لا ينقل أي بيانات، فلا توجد بيانات أثناء النقل تحتاج إلى حماية. وجميع البيانات المخزّنة محليًا خاضعة لتشفير iOS المدمج، الذي يعمل عند استخدام رمز دخول للجهاز.",
  "s10.h": "التغييرات على هذه السياسة",
  "s10.p1": "قد نحدّث سياسة الخصوصية من وقت لآخر. وستُنشر أي تغييرات على هذه الصفحة مع تحديث تاريخ “آخر تحديث”. نشجّعك على مراجعة هذه السياسة دوريًا.",
  "s11.h": "حقوقك",
  "s11.p1": "تبعًا لموقعك، قد تتمتع بحقوق تتعلق ببياناتك بموجب الأنظمة المحلية (مثل GDPR أو CCPA). وبما أن معظم بياناتك مخزّنة محليًا، يمكنك إدارتها مباشرة بتعديل العناصر أو حذفها داخل التطبيق، أو بإلغاء تثبيته.",
  "contact.h": "لديك أسئلة عن خصوصيتك؟",
  "contact.p": "إذا كانت لديك أي أسئلة أو مخاوف بشأن سياسة الخصوصية هذه، تواصل معنا — يسعدنا مساعدتك.",
  "footer.support": "الدعم",
  "footer.made": "صُنع بـ ❤️ لـ iOS",
  "s3.li7": "إذا شغّلت WatermarkIT من Siri أو الاختصارات، يحدث الأمر نفسه على جهازك: تُعلَّم الصورة التي يمرّرها الاختصار محليًا وتُعرض عليك ثم تُعاد إليه. ولا تُضاف إلى ألبوم WatermarkIT في الصور إلا إذا اخترت حفظها؛ ولا يحتفظ التطبيق بأي نسخة أخرى",
  "s4.li4": "<strong>الإشعارات</strong> — تذكيرات اختيارية تُجدوَل على جهازك دون أي خادم. يسأل iOS مرة واحدة في الشاشة الرئيسية، ويمكنك إيقافها من «التذكيرات» في إعدادات التطبيق أو من إعدادات iOS.",
  "s3.li8": "تُنشأ مربعات التعتيم وإزالة خلفية الشعار وملفات PDF بالطريقة نفسها، على جهازك بالكامل",
  "s3.li9": "الصور التي ترسلها إلى WatermarkIT من زر «مشاركة» في تطبيق الصور تُعالَج على جهازك بالطريقة نفسها تمامًا",
  "s3.li10": "تقرأ ميزة «افحص صورة» النسبة وطلب عدم تدريب الذكاء الاصطناعي والموقع وتاريخ الالتقاط والكاميرا من الصورة التي تختارها، على جهازك، ولا تحتفظ بأي نسخة منها",
  "s5.p4": "ويمكن لـ WatermarkIT أيضًا إضافة إشارة IPTC القياسية «عدم التدريب بالذكاء الاصطناعي» إلى الصور التي تحفظها، مع تكرار نسبتك في بيانات XMP داخل الملف. إنها طلب تقرؤه الأدوات، وليست قفلًا. وهي مفعّلة افتراضيًا، ولا تُكتب أبدًا في ملفات PDF، ويمكنك إيقافها من شاشة «تصدير» أو من «الإعدادات».",
  "s5.p5": "تحتفظ النسخ المحفوظة بتاريخ التقاط الصورة الأصلية والكاميرا، لتظهر بجانبها في تطبيق الصور. ويُحذف الموقع ما لم تختر الإبقاء عليه.",
  "s6.li5": "تعديل لم تُكمله بعد، لتعيده «متابعة التعديل»، وأي خطوط تستوردها"
 },
 "ja": {
  "nav.support": "サポート",
  "lang.label": "言語",
  "hero.title": "プライバシーポリシー",
  "hero.meta": "発効日: 2026年6月1日 &nbsp;·&nbsp; 最終更新: 2026年10月12日",
  "trans.note": "この翻訳は便宜上のものであり、正文は英語版です。",
  "sum.1": "デバイス内で処理",
  "sum.2": "プライバシー重視",
  "sum.3": "クラウドへの送信なし",
  "sum.4": "安全なローカル保存",
  "s1.h": "概要",
  "s1.p1": "WatermarkIT は個人データや画像を一切収集・保存・送信・共有しません。すべての処理はお使いのデバイス内で完結します。",
  "s1.p2": "本プライバシーポリシーは、iOS アプリ WatermarkIT（以下「本アプリ」）がお客様の情報をどのように扱うかを説明するものです。当方はお客様のプライバシーを保護し、その取り扱いについて透明であることをお約束します。",
  "s2.h": "データの収集と利用",
  "s2.p1": "<strong>当方の確約:</strong> いかなる場合も、お客様の写真にアクセスしたり、アップロード・送信・保存したりすることはありません。画像処理はすべてデバイス内でローカルに行われます。",
  "s2.p2": "本アプリは氏名やメールアドレスなどの個人識別情報を収集しません。バージョン1.4.1以降、どの機能が実際に使われているかを把握し、クラッシュを検知するために Firebase Analytics と Crashlytics（Google）を使用しています。送信されるのは、使われた機能、クラッシュレポート、本アプリのインストールごとのランダムな識別子、そして Google が IP アドレスから推定するおおよその地域（国など）です。写真、ファイル名、入力した内容、広告識別子が含まれることは決してありません。これらがお客様の身元と結び付けられたり、トラッキングに使われたりすることはありません。この機能は「設定」→「プライバシー」からいつでもオフにできます。いずれの場合も、お客様の写真は 100% 非公開のままであり、当方がアクセス・アップロード・保存することはありません。",
  "s3.h": "本アプリの仕組み",
  "s3.p1": "WatermarkIT は完全にオフラインで動作する、デバイス内完結型のアプリです。ご利用時に起きることは次のとおりです。",
  "s3.li1": "写真ライブラリ、カメラ、または「ファイル」App から写真を選びます",
  "s3.li2": "本アプリはその写真をデバイス内でローカルに読み込みます",
  "s3.li3": "テキスト、ロゴ、手書き署名、QR コード、タイル表示を含むすべての透かし処理は、デバイス内で行われます",
  "s3.li4": "QR コードは Apple 標準の Core Image フレームワークを使ってデバイス内で生成され、入力されたリンクが送信されることはありません",
  "s3.li5": "結果はカメラロールに保存されるか、iOS の共有シートで共有されます",
  "s3.li6": "お客様の写真、およびそこから派生したデータが外部サーバーに送信されることは一切ありません",
  "s4.h": "デバイスの許可",
  "s4.p1": "本アプリは次の iOS の許可を求めます。",
  "s4.li1": "<strong>写真ライブラリの読み取り</strong> — 「最近の作業」から過去の書き出しを開き直すとき、または保存後に写真を共有するときだけ。どちらも保存した写真をライブラリから取り出すためです。透かしを入れる写真を選ぶだけなら不要です。iOS の写真ピッカーは、選んだ写真だけをアプリに渡します。",
  "s4.li2": "<strong>写真ライブラリへの追加</strong> — 透かしを入れた画像をカメラロールに保存するため。写真を追加できるだけで、ライブラリのほかの写真を見ることはできません。",
  "s4.li3": "<strong>カメラ</strong> — アプリ内で新しく写真を撮る場合にのみ使用します。透かしのない元画像を保存せずにそのまま加工できます。本アプリが自動でカメラを起動することはなく、撮影した写真も他と同様にデバイス内で処理され、アップロードされることはありません。",
  "s4.p2": "「ファイル」App から画像を読み込むこともできます。これは iOS 標準のドキュメントピッカーを使うもので、選択した 1 つのファイルだけが本アプリに渡され、継続的な許可は必要ありません。",
  "s4.p3": "写真とカメラの許可は、それが必要な機能を使うその時にだけ求められ、起動時に自動で求めることはありません。これらの許可は iOS の設定からいつでも取り消せます。",
  "s5.h": "写真に追加される情報",
  "s5.p1": "WatermarkIT は、書き出す写真のメタデータに、お名前と著作権表示（クレジット）を標準の IPTC および TIFF フィールドを使って書き込むことができます。これにより、トリミングされてもクレジットが残ります。",
  "s5.p2": "次の 2 点を明確にしておきます。",
  "s5.li1": "書き込まれるのは <strong>お客様が入力したテキスト</strong> です。WatermarkIT が当方の名前、デバイス識別子、位置情報、その他の隠れた追跡データを挿入することはありません。",
  "s5.li2": "このメタデータは書き出したファイル自体に書き込まれるため、<strong>そのファイルを送った先へも一緒に付いていきます</strong>。それがこの機能の目的ですが、写真を共有した相手はそこに書かれた名前を読めるということでもあります。",
  "s5.p3": "クレジットは初期設定でオンになっており、オフにするかどうかはあなたが決められます。個別の書き出しは書き出しシートで、すべての書き出しは「設定」でオフにできます。既存の写真が変更されることはなく、書き出しは毎回新しいファイルとして作成されます。",
  "s6.h": "ローカルへのデータ保存",
  "s6.p1": "本アプリは次のデータを <strong>お使いのデバイス内にのみ</strong> 保存します。",
  "s6.li1": "作成した透かしのテンプレートとプリセット（名前、書体、サイズ、色、不透明度、回転、タイル表示、位置）",
  "s6.li2": "保存したテンプレートのサムネイル画像",
  "s6.li3": "最近の作業 — 書き出した写真のローカル履歴。開き直したり、書き出し直したりできます",
  "s6.li4": "既定の書き出し品質、フォーマット、選択した表示言語、クレジットを含めるかどうかなどの設定",
  "s6.p2": "これらのデータがデバイスから出ることはありません。本アプリのローカルコンテナに保存され、アプリを削除すると自動的に消去されます。",
  "s7.h": "第三者のサービス",
  "s7.p1": "本アプリはお客様のデータを広告ネットワークと共有しません。アプリの分析、クラッシュレポート、サブスクリプション管理のために、信頼できる第三者の SDK やサービスを利用する場合がありますが、いずれもアプリの機能を支え、体験を改善する目的に限られます。",
  "s8.h": "お子様のプライバシー",
  "s8.p1": "WatermarkIT は一般の利用者を対象としています。13 歳未満のお子様から意図的に個人情報を収集することはありません。万一そうした情報を収集してしまったと思われる場合は、速やかに対応しますのでご連絡ください。",
  "s9.h": "データの安全性",
  "s9.p1": "WatermarkIT はデータを送信しないため、保護すべき通信中のデータが存在しません。ローカルに保存されるデータは、デバイスにパスコードを設定していれば有効になる iOS 標準の暗号化によって保護されます。",
  "s10.h": "本ポリシーの変更",
  "s10.p1": "本プライバシーポリシーは随時更新されることがあります。変更があった場合は、「最終更新」日を更新のうえ本ページに掲載します。定期的にご確認いただくことをおすすめします。",
  "s11.h": "お客様の権利",
  "s11.p1": "お住まいの地域によっては、現地の規制（GDPR や CCPA など）に基づきご自身のデータに関する権利が認められる場合があります。データの大半はローカルに保存されているため、アプリ内で項目を編集・削除するか、アプリを削除することで直接管理できます。",
  "contact.h": "プライバシーについてご質問がありますか？",
  "contact.p": "本プライバシーポリシーについてご不明な点やご懸念があれば、お気軽にご連絡ください。",
  "footer.support": "サポート",
  "footer.made": "iOS のために ❤️ を込めて",
  "s3.li7": "Siri やショートカットから WatermarkIT を実行した場合も、処理はすべてデバイス上で行われます。ショートカットから渡された写真はローカルで透かしを入れられ、あなたに表示されたうえでショートカットに戻されます。「写真」の WatermarkIT アルバムに追加されるのは、保存を選んだときだけです。アプリがそれ以外にコピーを保持することはありません",
  "s4.li4": "<strong>通知</strong> — 任意のリマインダーで、サーバーを使わずデバイス上でスケジュールされます。iOS がホーム画面で一度だけ尋ねます。アプリの「設定」の「リマインダー」、または iOS の設定でオフにできます。",
  "s3.li8": "黒塗りのボックス、ロゴの背景削除、PDF も同じように、すべてデバイス上で作成されます",
  "s3.li9": "「写真」の「共有」ボタンから WatermarkIT に送った写真も、まったく同じようにデバイス上で処理されます",
  "s3.li10": "「写真をチェック」は、選んだ写真のクレジット、AI学習の拒否、位置情報、撮影日時、カメラをデバイス上で読み取り、写真のコピーは保持しません",
  "s5.p4": "WatermarkIT は、保存する写真に標準の IPTC「AI学習不可」シグナルを加え、クレジットをファイルの XMP データにも記録できます。ツールが読み取れる意思表示であり、ロックではありません。初期設定でオンになっており、PDF には書き込まれず、書き出し画面または「設定」でオフにできます。",
  "s5.p5": "保存したコピーには元の写真の撮影日時とカメラが残るため、「写真」で元の写真の隣に並びます。位置情報は、残すと選ばない限り削除されます。",
  "s6.li5": "「編集を続ける」で戻れるよう、途中の編集内容、および読み込んだフォント"
 },
 "zh-Hans": {
  "nav.support": "支持",
  "lang.label": "语言",
  "hero.title": "隐私政策",
  "hero.meta": "生效日期：2026 年 6 月 1 日 &nbsp;·&nbsp; 最后更新：2026 年 10 月 12 日",
  "trans.note": "本译文仅供参考，以英文版为准。",
  "sum.1": "设备端处理",
  "sum.2": "注重隐私",
  "sum.3": "不上传云端",
  "sum.4": "安全的本地存储",
  "s1.h": "概述",
  "s1.p1": "WatermarkIT 不会收集、存储、传输或共享任何个人数据或图片。所有处理均完全在您的设备上完成。",
  "s1.p2": "本隐私政策说明 WatermarkIT iOS 应用（下称“本应用”“我们”）如何处理您的信息。我们承诺保护您的隐私，并对我们的做法保持透明。",
  "s2.h": "数据的收集与使用",
  "s2.p1": "<strong>我们的绝对承诺：</strong>在任何情况下，我们都不会访问、上传、传输或存储您的照片。所有图像处理均完全在您的设备本地进行。",
  "s2.p2": "本应用不会收集个人身份信息（如姓名或电子邮件地址）。自 1.4.1 版本起，本应用使用 Firebase Analytics 和 Crashlytics（Google）来了解用户实际使用了哪些功能，并捕获崩溃信息。它们会收到所使用的功能、崩溃报告、为你安装的本应用随机分配的标识符，以及 Google 根据你的 IP 地址推断的大致位置（例如国家）。绝不包含照片、文件名、你输入的任何内容，也不包含你的广告标识符。这些数据不会与你的身份关联，也不会用于跟踪。你可以随时在「设置」→「隐私」中关闭此功能。无论是否开启，你的照片都将保持 100% 私密，我们绝不会访问、上传或存储它们。",
  "s3.h": "本应用的工作方式",
  "s3.p1": "WatermarkIT 是一款完全离线、在设备上运行的应用。使用时的具体流程如下：",
  "s3.li1": "您从照片图库、相机或“文件”App 中选择一张照片",
  "s3.li2": "本应用在您的设备本地读取该照片",
  "s3.li3": "所有水印处理——文字、徽标、手写签名、二维码与平铺——均完全在您的设备上完成",
  "s3.li4": "二维码使用 Apple 内置的 Core Image 框架在设备端生成，您输入的链接绝不会被传输",
  "s3.li5": "结果保存回您的本地相册，或通过 iOS 共享面板分享",
  "s3.li6": "您的照片及由其衍生的任何数据，在任何环节都不会被发送到外部服务器",
  "s4.h": "设备权限",
  "s4.p1": "本应用会请求以下 iOS 权限：",
  "s4.li1": "<strong>照片图库读取权限</strong> — 仅当你从“最近的作品”重新打开以前导出的照片，或在存储后分享照片时才需要，因为这两种操作都要把已存储的照片从图库中取回。选择要加水印的照片并不需要它：iOS 照片选择器只会把你选中的照片交给 App。",
  "s4.li2": "<strong>照片图库添加权限</strong> — 用于将加好水印的图片存储到你的相机胶卷。它只允许 App 添加照片，无法查看图库中的其他内容。",
  "s4.li3": "<strong>相机权限</strong>——仅当您选择在应用内拍摄新照片时使用，让您无需先保存无水印的原图即可直接加水印。本应用绝不会自行开启相机，您拍摄的照片与其他照片一样：在设备端处理，绝不上传。",
  "s4.p2": "您也可以通过“文件”App 导入图片。这会使用 iOS 标准的文稿选择器，它只将您选中的那一个文件交给本应用，无需任何持续授权。",
  "s4.p3": "照片与相机权限只会在你使用需要它们的功能时才请求——绝不会在启动时自动请求。你可以随时在 iOS 设置中撤销这些权限。",
  "s5.h": "您添加到照片中的信息",
  "s5.p1": "WatermarkIT 可以使用标准的 IPTC 和 TIFF 字段，将署名信息——您的姓名与版权声明——写入所导出照片的元数据中。这正是署名能在裁剪后依然保留的原因。",
  "s5.p2": "有两点需要说明：",
  "s5.li1": "写入的内容是 <strong>您自己输入的文字</strong>。WatermarkIT 绝不会插入我们的名称、设备标识符、您的位置或任何隐藏的追踪数据。",
  "s5.li2": "该元数据写入导出的文件中，因此会 <strong>随文件一同传递到您发送的任何地方</strong>。这正是此功能的用意——但也意味着您分享照片的对象都能读到您填写的姓名。",
  "s5.p3": "署名默认开启，是否关闭由你决定：可在导出面板中为单次导出关闭，或在设置中为所有导出关闭。你现有的照片永远不会被修改——每次导出都会写成一个新文件。",
  "s6.h": "本地数据存储",
  "s6.p1": "本应用 <strong>仅在您的设备上</strong> 存储以下数据：",
  "s6.li1": "您创建的水印模板与预设（名称、字体、大小、颜色、不透明度、旋转、平铺与位置）",
  "s6.li2": "已保存模板的缩略图",
  "s6.li3": "最近作品——您导出过的照片的本地记录，方便重新打开或再次导出",
  "s6.li4": "应用偏好设置，例如默认导出质量、格式、你所选择的语言，以及是否包含署名",
  "s6.p2": "这些数据绝不会离开您的设备。它们存储在本应用的本地容器中，并在您卸载应用时自动删除。",
  "s7.h": "第三方服务",
  "s7.p1": "本应用不会与第三方广告网络共享您的数据。我们可能会使用经过验证的第三方 SDK 或服务商，用于应用分析、崩溃报告或订阅管理。此类服务的接入严格限于支持应用功能和改善使用体验。",
  "s8.h": "儿童隐私",
  "s8.p1": "WatermarkIT 面向普通用户设计。我们不会在知情的情况下收集 13 岁以下儿童的个人信息。若您认为我们无意中收集了此类信息，请联系我们，我们会尽快处理。",
  "s9.h": "数据安全",
  "s9.p1": "由于 WatermarkIT 不传输任何数据，因此不存在需要保护的传输中数据。所有本地存储的数据都受 iOS 内置设备加密保护，只要您为设备设置了密码，该加密即会启用。",
  "s10.h": "本政策的变更",
  "s10.p1": "我们可能会不时更新隐私政策。任何变更都会发布在本页面，并更新“最后更新”日期。建议您定期查看本政策。",
  "s11.h": "您的权利",
  "s11.p1": "根据您所在地区，您可能依据当地法规（如 GDPR 或 CCPA）享有与数据相关的权利。由于您的大部分数据（如模板和照片）都存储在本地，您可以在应用内修改或删除相关项目，或卸载应用，以直接进行管理。",
  "contact.h": "对隐私有疑问？",
  "contact.p": "如果您对本隐私政策有任何疑问或顾虑，欢迎联系我们，我们很乐意提供帮助。",
  "footer.support": "支持",
  "footer.made": "为 iOS 用 ❤️ 打造",
  "s3.li7": "如果你通过 Siri 或快捷指令运行 WatermarkIT，一切同样在你的设备上完成：快捷指令传入的照片在本地加上水印，显示给你，再交回快捷指令。只有在你选择存储时，它才会被添加到“照片”中的 WatermarkIT 相簿；App 不会保留其他副本",
  "s4.li4": "<strong>通知</strong> — 可选的提醒，在你的设备上排程，不涉及任何服务器。iOS 只会在主屏幕上询问一次；你可以在 App 设置的“提醒”中或 iOS 设置中关闭。",
  "s3.li8": "涂黑方块、标志背景移除与 PDF 也以同样的方式完全在你的设备上生成",
  "s3.li9": "你从“照片”的“共享”按钮发送到 WatermarkIT 的照片，也完全以同样的方式在你的设备上处理",
  "s3.li10": "“检查照片”在你的设备上读取所选照片的署名、AI 训练请求、位置、拍摄日期与相机，不保留任何副本",
  "s5.p4": "WatermarkIT 还可以在你存储的照片中加入标准的 IPTC“禁止 AI 训练”标记，并在文件的 XMP 数据中重复写入你的署名。这是工具可读取的请求，而不是锁。默认开启，从不写入 PDF，你可以在导出界面或“设置”中关闭。",
  "s5.p5": "存储的副本保留原照片的拍摄日期与相机，因此在“照片”中会排在原照片旁边。除非你选择保留，否则会移除位置信息。",
  "s6.li5": "尚未完成的编辑（以便“继续编辑”将其恢复），以及你导入的字体"
 },
 "zh-Hant": {
  "nav.support": "支援",
  "lang.label": "語言",
  "hero.title": "隱私權政策",
  "hero.meta": "生效日期：2026 年 6 月 1 日 &nbsp;·&nbsp; 最後更新：2026 年 10 月 12 日",
  "trans.note": "本譯文僅供參考，以英文版為準。",
  "sum.1": "裝置端處理",
  "sum.2": "重視隱私",
  "sum.3": "不上傳雲端",
  "sum.4": "安全的本機儲存",
  "s1.h": "總覽",
  "s1.p1": "WatermarkIT 不會收集、儲存、傳輸或分享任何個人資料或圖片。所有處理都完全在您的裝置上完成。",
  "s1.p2": "本隱私權政策說明 WatermarkIT iOS App（下稱「本 App」「我們」）如何處理您的資訊。我們承諾保護您的隱私，並對我們的做法保持透明。",
  "s2.h": "資料的收集與使用",
  "s2.p1": "<strong>我們的絕對承諾：</strong>在任何情況下，我們都不會存取、上傳、傳輸或儲存您的照片。所有影像處理都完全在您的裝置本機進行。",
  "s2.p2": "本 App 不會收集個人識別資訊（如姓名或電子郵件地址）。自 1.4.1 版起，本 App 使用 Firebase Analytics 與 Crashlytics（Google）來了解使用者實際使用了哪些功能，並擷取當機資訊。它們會收到所使用的功能、當機報告、為你安裝的本 App 隨機指派的識別碼，以及 Google 根據你的 IP 位址推估的大致位置（例如國家）。絕不包含照片、檔案名稱、你輸入的任何內容，也不包含你的廣告識別碼。這些資料不會與你的身分連結，也不會用於追蹤。你可以隨時在「設定」→「隱私」中關閉此功能。無論是否開啟，你的照片都會保持 100% 私密，我們絕不會存取、上傳或儲存。",
  "s3.h": "本 App 的運作方式",
  "s3.p1": "WatermarkIT 是一款完全離線、在裝置上執行的 App。使用時的實際流程如下：",
  "s3.li1": "您從照片圖庫、相機或「檔案」App 中選擇一張照片",
  "s3.li2": "本 App 在您的裝置本機讀取該照片",
  "s3.li3": "所有浮水印處理——文字、標誌、手寫簽名、QR 碼與並排重複——都完全在您的裝置上完成",
  "s3.li4": "QR 碼是使用 Apple 內建的 Core Image 框架在裝置端產生，您輸入的連結絕不會被傳輸",
  "s3.li5": "結果會儲存回您的本機相機膠卷，或透過 iOS 分享工作表分享",
  "s3.li6": "您的照片以及由其衍生的任何資料，在任何環節都不會被傳送到外部伺服器",
  "s4.h": "裝置權限",
  "s4.p1": "本 App 會要求下列 iOS 權限：",
  "s4.li1": "<strong>照片圖庫讀取權限</strong> — 僅在你從「最近的作品」重新開啟以前匯出的照片，或在儲存後分享照片時才需要，因為這兩種操作都要把已儲存的照片從圖庫中取回。選擇要加浮水印的照片並不需要它：iOS 照片挑選器只會把你選取的照片交給 App。",
  "s4.li2": "<strong>照片圖庫加入權限</strong> — 用於將加好浮水印的圖片儲存到你的相機膠卷。它只允許 App 加入照片，無法查看圖庫中的其他內容。",
  "s4.li3": "<strong>相機權限</strong>——僅在您選擇於 App 內拍攝新照片時使用，讓您不必先儲存未加浮水印的原始檔即可直接加註。本 App 絕不會自行開啟相機，您拍攝的照片與其他照片一樣：在裝置端處理，絕不上傳。",
  "s4.p2": "您也可以透過「檔案」App 匯入影像。這會使用 iOS 標準的文件選擇器，只將您選取的那一個檔案交給本 App，不需要任何持續授權。",
  "s4.p3": "照片與相機權限只會在你使用需要它們的功能時才要求——絕不會在啟動時自動要求。你可以隨時在 iOS 設定中撤銷這些權限。",
  "s5.h": "您加入照片中的資訊",
  "s5.p1": "WatermarkIT 可以使用標準的 IPTC 與 TIFF 欄位，將署名資訊——您的姓名與版權聲明——寫入您匯出照片的中繼資料。這正是署名能在裁切後依然保留的原因。",
  "s5.p2": "有兩點需要說明：",
  "s5.li1": "寫入的內容是 <strong>您自己輸入的文字</strong>。WatermarkIT 絕不會插入我們的名稱、裝置識別碼、您的位置或任何隱藏的追蹤資料。",
  "s5.li2": "這些中繼資料會寫入匯出的檔案，因此會 <strong>隨檔案一同傳到您傳送的任何地方</strong>。這正是此功能的用意——但也表示您分享照片的對象都能讀到您填寫的姓名。",
  "s5.p3": "署名預設為開啟，是否關閉由你決定：可在匯出面板中為單次匯出關閉，或在設定中為所有匯出關閉。你現有的照片永遠不會被修改——每次匯出都會寫成一個新檔案。",
  "s6.h": "本機資料儲存",
  "s6.p1": "本 App <strong>僅在您的裝置上</strong> 儲存下列資料：",
  "s6.li1": "您建立的浮水印範本與預設集（名稱、字型、大小、顏色、不透明度、旋轉、並排重複與位置）",
  "s6.li2": "已儲存範本的縮圖",
  "s6.li3": "最近作品——您匯出過的照片的本機記錄，方便重新開啟或再次匯出",
  "s6.li4": "App 偏好設定，例如預設匯出品質、格式、你所選擇的語言，以及是否包含署名",
  "s6.p2": "這些資料絕不會離開您的裝置。它們儲存在本 App 的本機容器中，並在您移除 App 時自動刪除。",
  "s7.h": "第三方服務",
  "s7.p1": "本 App 不會與第三方廣告聯播網分享您的資料。我們可能會使用經過驗證的第三方 SDK 或服務供應商，用於 App 分析、當機報告或訂閱管理。此類服務的整合嚴格限於支援 App 功能與改善使用體驗。",
  "s8.h": "兒童隱私",
  "s8.p1": "WatermarkIT 是為一般使用者設計的。我們不會在知情的情況下收集 13 歲以下兒童的個人資訊。若您認為我們無意中收集了此類資訊，請與我們聯絡，我們會盡快處理。",
  "s9.h": "資料安全",
  "s9.p1": "由於 WatermarkIT 不傳輸任何資料，因此不存在需要保護的傳輸中資料。所有本機儲存的資料都受 iOS 內建的裝置加密保護，只要您為裝置設定了密碼，該加密便會啟用。",
  "s10.h": "本政策的變更",
  "s10.p1": "我們可能會不時更新隱私權政策。任何變更都會公布在本頁面，並更新「最後更新」日期。建議您定期查看本政策。",
  "s11.h": "您的權利",
  "s11.p1": "依您所在地區，您可能依據當地法規（如 GDPR 或 CCPA）享有與資料相關的權利。由於您的大部分資料（如範本與照片）都儲存在本機，您可以在 App 內修改或刪除項目，或移除 App，以直接管理。",
  "contact.h": "對隱私有疑問嗎？",
  "contact.p": "如果您對本隱私權政策有任何疑問或疑慮，歡迎與我們聯絡，我們很樂意提供協助。",
  "footer.support": "支援",
  "footer.made": "為 iOS 用 ❤️ 打造",
  "s3.li7": "如果你透過 Siri 或捷徑執行 WatermarkIT，一切同樣在你的裝置上完成：捷徑傳入的照片在本機加上浮水印，顯示給你，再交回捷徑。只有在你選擇儲存時，它才會加入「照片」中的 WatermarkIT 相簿；App 不會保留其他副本",
  "s4.li4": "<strong>通知</strong> — 可選的提醒，在你的裝置上排程，不涉及任何伺服器。iOS 只會在主畫面詢問一次；你可以在 App 設定的「提醒」或 iOS 設定中關閉。",
  "s3.li8": "塗黑方塊、標誌背景移除與 PDF 也以同樣的方式完全在你的裝置上產生",
  "s3.li9": "你從「照片」的「分享」按鈕傳送到 WatermarkIT 的照片，也完全以同樣的方式在你的裝置上處理",
  "s3.li10": "「檢查照片」在你的裝置上讀取所選照片的署名、AI 訓練要求、位置、拍攝日期與相機，不保留任何副本",
  "s5.p4": "WatermarkIT 還可以在你儲存的照片中加入標準的 IPTC「禁止 AI 訓練」標記，並在檔案的 XMP 資料中重複寫入你的署名。這是工具可讀取的請求，而不是鎖。預設開啟，從不寫入 PDF，你可以在匯出畫面或「設定」中關閉。",
  "s5.p5": "儲存的副本保留原照片的拍攝日期與相機，因此在「照片」中會排在原照片旁邊。除非你選擇保留，否則會移除位置資訊。",
  "s6.li5": "尚未完成的編輯（以便「繼續編輯」將其復原），以及你匯入的字體"
 },
 "fr": {
  "nav.support": "Assistance",
  "lang.label": "Langue",
  "hero.title": "Politique de confidentialité",
  "hero.meta": "Date d’entrée en vigueur : 1er juin 2026 &nbsp;·&nbsp; Dernière mise à jour : 12 octobre 2026",
  "trans.note": "Cette traduction est fournie à titre indicatif ; la version anglaise fait foi.",
  "sum.1": "Traitement sur l’appareil",
  "sum.2": "Axé sur la confidentialité",
  "sum.3": "Aucun envoi vers le cloud",
  "sum.4": "Stockage local sécurisé",
  "s1.h": "Aperçu",
  "s1.p1": "WatermarkIT ne collecte, ne stocke, ne transmet ni ne partage aucune donnée personnelle ni aucune image. Tout le traitement se déroule entièrement sur votre appareil.",
  "s1.p2": "Cette politique de confidentialité explique comment l’application iOS WatermarkIT (« l’Application », « nous ») traite vos informations. Nous nous engageons à protéger votre vie privée et à être transparents sur nos pratiques.",
  "s2.h": "Collecte et utilisation des données",
  "s2.p1": "<strong>Notre engagement absolu :</strong> nous n’accédons jamais à vos photos, ne les téléchargeons, ne les transmettons ni ne les stockons, en aucune circonstance. Tout le traitement d’image s’effectue entièrement en local sur votre appareil.",
  "s2.p2": "L’Application ne collecte aucune information d’identification personnelle (comme votre nom ou votre adresse e-mail). Depuis la version 1.4.1, elle utilise Firebase Analytics et Crashlytics (Google) pour comprendre quelles fonctionnalités sont réellement utilisées et détecter les plantages. Ils reçoivent les fonctionnalités utilisées, les rapports de plantage, un identifiant aléatoire propre à votre installation de l’Application et une localisation approximative (par exemple votre pays) que Google déduit de votre adresse IP. Jamais vos photos, leurs noms de fichier, ce que vous tapez, ni votre identifiant publicitaire. Rien de tout cela n’est lié à votre identité ni utilisé à des fins de suivi. Vous pouvez désactiver cela à tout moment dans Réglages → Confidentialité. Dans tous les cas, vos photos restent privées à 100 % et ne sont jamais consultées, téléchargées ou stockées par nous.",
  "s3.h": "Comment fonctionne l’Application",
  "s3.p1": "WatermarkIT est une application entièrement hors ligne, fonctionnant sur l’appareil. Voici exactement ce qui se passe lorsque vous l’utilisez :",
  "s3.li1": "Vous choisissez une photo — depuis votre photothèque, votre appareil photo, ou l’app Fichiers",
  "s3.li2": "L’Application lit cette photo localement sur votre appareil",
  "s3.li3": "Tout le traitement du filigrane — texte, logos, signatures manuscrites, codes QR et mosaïque — s’effectue entièrement sur votre appareil",
  "s3.li4": "Les codes QR sont générés sur l’appareil grâce au framework Core Image intégré d’Apple ; le lien que vous saisissez n’est jamais transmis",
  "s3.li5": "Le résultat est enregistré dans votre pellicule locale ou partagé via la feuille de partage iOS",
  "s3.li6": "À aucun moment votre photo, ou toute donnée qui en est dérivée, n’est envoyée à un serveur externe",
  "s4.h": "Autorisations de l’appareil",
  "s4.p1": "L’Application demande les autorisations iOS suivantes :",
  "s4.li1": "<strong>Accès en lecture à la photothèque</strong> — uniquement si vous rouvrez un export passé depuis Travaux récents, ou partagez des photos après les avoir enregistrées, car ces deux actions récupèrent la photo enregistrée dans votre photothèque. Choisir une photo à filigraner n’en a pas besoin : le sélecteur de photos d’iOS ne transmet à l’App que les photos que vous choisissez.",
  "s4.li2": "<strong>Accès en ajout à la photothèque</strong> — pour enregistrer vos images filigranées dans votre Pellicule. Il permet à l’App d’ajouter des photos, pas de voir le reste de votre photothèque.",
  "s4.li3": "<strong>Accès à l’appareil photo</strong> — uniquement si vous choisissez de prendre une nouvelle photo dans l’Application, afin de pouvoir filigraner une prise de vue sans d’abord enregistrer une copie non marquée. L’Application n’ouvre jamais l’appareil photo d’elle-même, et les photos que vous prenez sont traitées exactement comme n’importe quelle autre : traitées sur l’appareil, jamais téléchargées.",
  "s4.p2": "Vous pouvez aussi importer une image via l’app Fichiers. Cela utilise le sélecteur de documents standard d’iOS, qui ne transmet à l’Application que le seul fichier choisi et ne nécessite aucune autorisation permanente.",
  "s4.p3": "Les autorisations photo et appareil photo ne sont demandées qu’au moment où vous utilisez la fonction qui en a besoin — jamais automatiquement au lancement. Vous pouvez révoquer chacune de ces autorisations à tout moment dans les Réglages d’iOS.",
  "s5.h": "Informations que vous ajoutez à vos photos",
  "s5.p1": "WatermarkIT peut inscrire une mention — votre nom et vos droits d’auteur — dans les métadonnées des photos que vous exportez, en utilisant les champs IPTC et TIFF standard (Créateur, Mention de droits d’auteur, Artiste). C’est ce qui permet à votre mention de survivre au recadrage.",
  "s5.p2": "Deux points méritent d’être précisés :",
  "s5.li1": "Le texte inscrit est <strong>le texte que vous saisissez</strong>. WatermarkIT n’insère jamais notre propre nom, un identifiant d’appareil, votre position, ou toute donnée de suivi cachée qui lui serait propre.",
  "s5.li2": "Ces métadonnées sont inscrites dans le fichier exporté, et <strong>voyagent donc avec ce fichier partout où vous l’envoyez</strong>. C’est précisément l’objectif de cette fonctionnalité — mais cela signifie aussi que quiconque avec qui vous partagez la photo peut lire le nom que vous y avez inscrit.",
  "s5.p3": "Le crédit est activé par défaut, et c’est à vous de le désactiver : pour un export donné dans la feuille d’export, ou pour tous les exports dans les Réglages. Vos photos existantes ne sont jamais modifiées — chaque export est écrit dans un nouveau fichier.",
  "s6.h": "Stockage local des données",
  "s6.p1": "L’Application stocke les données suivantes <strong>uniquement sur votre appareil</strong> :",
  "s6.li1": "Les modèles et préréglages de filigrane que vous créez (nom, police, taille, couleur, opacité, rotation, mosaïque et position)",
  "s6.li2": "Les images d’aperçu miniature de vos modèles enregistrés",
  "s6.li3": "Votre travail récent — un historique local des photos que vous avez exportées, pour pouvoir les rouvrir ou les réexporter",
  "s6.li4": "Vos préférences d’application, comme la qualité et le format d’export par défaut, la langue choisie, et l’inclusion ou non de votre mention",
  "s6.p2": "Ces données ne quittent jamais votre appareil. Elles sont stockées dans le conteneur local de l’Application et supprimées automatiquement si vous désinstallez l’Application.",
  "s7.h": "Services tiers",
  "s7.p1": "L’Application ne partage pas vos données avec des réseaux publicitaires tiers. Nous pouvons utiliser des SDK ou fournisseurs de services tiers vérifiés pour l’analyse d’utilisation de l’app, les rapports de plantage, ou la gestion des abonnements. De tels services, le cas échéant, sont intégrés strictement pour soutenir le fonctionnement de l’app et améliorer l’expérience utilisateur.",
  "s8.h": "Confidentialité des enfants",
  "s8.p1": "WatermarkIT est conçu pour un public général. Nous ne collectons pas sciemment d’informations personnelles auprès d’enfants de moins de 13 ans. Si vous pensez que nous avons collecté par inadvertance de telles informations, contactez-nous afin que nous puissions y remédier rapidement.",
  "s9.h": "Sécurité des données",
  "s9.p1": "WatermarkIT ne transmettant aucune donnée, il n’y a aucune donnée en transit à sécuriser. Toutes les données stockées localement (vos modèles) sont soumises au chiffrement intégré d’iOS, activé dès que vous utilisez un code d’accès sur votre appareil.",
  "s10.h": "Modifications de cette politique",
  "s10.p1": "Nous pouvons mettre à jour notre politique de confidentialité de temps à autre. Tout changement sera publié sur cette page avec une date de « Dernière mise à jour » actualisée. Nous vous encourageons à consulter cette politique périodiquement pour tout changement.",
  "s11.h": "Vos droits",
  "s11.p1": "Selon votre lieu de résidence, vous pouvez disposer de droits concernant vos données en vertu des réglementations locales (comme le RGPD ou le CCPA). La majorité de vos données (comme les modèles et les photos) étant stockée localement, vous pouvez les gérer directement en modifiant ou supprimant des éléments dans l’Application, ou en désinstallant l’Application.",
  "contact.h": "Des questions sur votre vie privée ?",
  "contact.p": "Si vous avez des questions ou des préoccupations concernant cette politique de confidentialité, contactez-nous — nous serons heureux de vous aider.",
  "footer.support": "Assistance",
  "footer.made": "Conçu avec ❤️ pour iOS",
  "s3.li7": "Si vous lancez WatermarkIT depuis Siri ou Raccourcis, tout se passe de la même façon sur votre appareil : la photo transmise par votre raccourci est marquée localement, vous est montrée, puis lui est renvoyée. Elle n’est ajoutée à l’album WatermarkIT de Photos que si vous choisissez de l’enregistrer ; l’App n’en garde aucune autre copie",
  "s4.li4": "<strong>Notifications</strong> — des rappels facultatifs, programmés sur votre appareil sans aucun serveur. iOS pose la question une seule fois, sur l’écran d’accueil ; vous pouvez les désactiver sous Rappels dans les Réglages de l’App, ou dans les Réglages d’iOS.",
  "s3.li8": "Les rectangles de masquage, la suppression de l’arrière-plan des logos et les PDF sont créés de la même façon, entièrement sur votre appareil",
  "s3.li9": "Les photos envoyées à WatermarkIT depuis le bouton Partager de Photos sont traitées exactement de la même façon, sur votre appareil",
  "s3.li10": "« Vérifier une photo » lit le crédit, la demande liée à l’entraînement d’IA, la localisation, la date de prise de vue et l’appareil de la photo choisie, sur votre appareil, et n’en garde aucune copie",
  "s5.p4": "WatermarkIT peut aussi ajouter le signal IPTC standard « pas d’entraînement d’IA » aux photos que vous enregistrez, en répétant votre crédit dans les données XMP du fichier. C’est une demande lisible par les outils, pas un verrou. Il est activé par défaut, n’est jamais écrit dans les PDF, et vous pouvez le désactiver sur l’écran Exporter ou dans Réglages.",
  "s5.p5": "Les copies enregistrées gardent la date de prise de vue et l’appareil de la photo d’origine, pour se ranger à côté d’elle dans Photos. La localisation est retirée, sauf si vous choisissez de la garder.",
  "s6.li5": "Une modification inachevée, pour que « Reprendre la modification » la retrouve, et les polices que vous importez"
 },
 "de": {
  "nav.support": "Support",
  "lang.label": "Sprache",
  "hero.title": "Datenschutzerklärung",
  "hero.meta": "Gültig ab: 1. Juni 2026 &nbsp;·&nbsp; Zuletzt aktualisiert: 12. Oktober 2026",
  "trans.note": "Diese Übersetzung dient nur der Verständlichkeit; maßgeblich ist die englische Fassung.",
  "sum.1": "Verarbeitung auf dem Gerät",
  "sum.2": "Datenschutzorientiert",
  "sum.3": "Keine Cloud-Uploads",
  "sum.4": "Sichere lokale Speicherung",
  "s1.h": "Überblick",
  "s1.p1": "WatermarkIT sammelt, speichert, überträgt oder teilt keine personenbezogenen Daten oder Bilder. Die gesamte Verarbeitung erfolgt vollständig auf Ihrem Gerät.",
  "s1.p2": "Diese Datenschutzerklärung erläutert, wie die iOS-App WatermarkIT („die App“, „wir“) mit Ihren Informationen umgeht. Wir setzen uns dafür ein, Ihre Privatsphäre zu schützen und unsere Praktiken transparent darzustellen.",
  "s2.h": "Datenerhebung und -nutzung",
  "s2.p1": "<strong>Unsere uneingeschränkte Zusage:</strong> Wir greifen unter keinen Umständen auf Ihre Fotos zu, laden sie hoch, übertragen oder speichern sie. Die gesamte Bildverarbeitung erfolgt vollständig lokal auf Ihrem Gerät.",
  "s2.p2": "Die App erhebt keine personenbezogenen Identifikationsdaten (wie Ihren Namen oder Ihre E-Mail-Adresse). Seit Version 1.4.1 verwendet die App Firebase Analytics und Crashlytics (Google), um zu verstehen, welche Funktionen tatsächlich genutzt werden, und um Abstürze zu erfassen. Übermittelt werden die genutzten Funktionen, Absturzberichte, eine zufällige Kennung für Ihre Installation der App sowie ein ungefährer Standort (etwa Ihr Land), den Google aus Ihrer IP-Adresse ableitet. Niemals ein Foto, ein Dateiname, etwas, das Sie eingeben, oder Ihre Werbekennung. Nichts davon wird mit Ihrer Identität verknüpft oder zum Tracking verwendet. Sie können dies jederzeit in Einstellungen → Datenschutz deaktivieren. In jedem Fall bleiben Ihre Fotos zu 100 % privat und werden von uns niemals aufgerufen, hochgeladen oder gespeichert.",
  "s3.h": "So funktioniert die App",
  "s3.p1": "WatermarkIT ist eine vollständig offline arbeitende App, die auf dem Gerät läuft. Hier ist genau, was passiert, wenn Sie sie verwenden:",
  "s3.li1": "Sie wählen ein Foto aus — aus Ihrer Fotomediathek, mit der Kamera, oder aus der Dateien-App",
  "s3.li2": "Die App liest dieses Foto lokal auf Ihrem Gerät",
  "s3.li3": "Die gesamte Wasserzeichen-Verarbeitung — Text, Logos, handgeschriebene Unterschriften, QR-Codes und Kacheln — erfolgt vollständig auf Ihrem Gerät",
  "s3.li4": "QR-Codes werden auf dem Gerät mit Apples integriertem Core-Image-Framework erzeugt; der von Ihnen eingegebene Link wird niemals übertragen",
  "s3.li5": "Das Ergebnis wird in Ihrem lokalen Fotoalbum gespeichert oder über das iOS-Freigabemenü geteilt",
  "s3.li6": "Zu keinem Zeitpunkt wird Ihr Foto oder daraus abgeleitete Daten an einen externen Server gesendet",
  "s4.h": "Geräteberechtigungen",
  "s4.p1": "Die App fordert die folgenden iOS-Berechtigungen an:",
  "s4.li1": "<strong>Lesezugriff auf die Fotomediathek</strong> — nur wenn Sie einen früheren Export unter „Zuletzt bearbeitet“ erneut öffnen oder Fotos nach dem Sichern teilen, denn beides holt Ihr gesichertes Foto wieder aus der Mediathek. Zum Auswählen eines Fotos ist er nicht nötig: Die Fotoauswahl von iOS übergibt der App nur die Fotos, die Sie auswählen.",
  "s4.li2": "<strong>Hinzufügen zur Fotomediathek</strong> — um Ihre markierten Bilder in Ihrer Aufnahmen-Übersicht zu sichern. Damit kann die App Fotos hinzufügen, aber den Rest Ihrer Mediathek nicht sehen.",
  "s4.li3": "<strong>Kamerazugriff</strong> — nur wenn Sie sich entscheiden, ein neues Foto innerhalb der App aufzunehmen, damit Sie eine Aufnahme mit Wasserzeichen versehen können, ohne zuerst eine unmarkierte Kopie zu speichern. Die App öffnet die Kamera niemals von selbst, und von Ihnen aufgenommene Fotos werden genau wie jedes andere behandelt: auf dem Gerät verarbeitet, niemals hochgeladen.",
  "s4.p2": "Sie können ein Bild auch über die Dateien-App importieren. Dabei wird der standardmäßige iOS-Dokumentenpicker verwendet, der der App nur die eine ausgewählte Datei übergibt und keine dauerhafte Berechtigung erfordert.",
  "s4.p3": "Foto- und Kameraberechtigungen werden erst in dem Moment angefragt, in dem Sie die Funktion nutzen, die sie braucht – nie automatisch beim Start. Sie können jede dieser Berechtigungen jederzeit in den iOS-Einstellungen widerrufen.",
  "s5.h": "Informationen, die Sie Ihren Fotos hinzufügen",
  "s5.p1": "WatermarkIT kann einen Namensvermerk — Ihren Namen und Ihr Copyright — in die Metadaten der von Ihnen exportierten Fotos schreiben, unter Verwendung der standardmäßigen IPTC- und TIFF-Felder (Urheber, Copyright-Vermerk, Künstler). Dadurch übersteht Ihr Vermerk das Zuschneiden.",
  "s5.p2": "Zwei Dinge sollten klar sein:",
  "s5.li1": "Der geschriebene Text ist <strong>der von Ihnen eingegebene Text</strong>. WatermarkIT fügt niemals unseren eigenen Namen, eine Gerätekennung, Ihren Standort oder eigene verborgene Tracking-Daten ein.",
  "s5.li2": "Diese Metadaten werden in die exportierte Datei geschrieben und <strong>reisen daher mit dieser Datei überall dorthin, wohin Sie sie senden</strong>. Das ist genau der Sinn dieser Funktion — bedeutet aber auch, dass jeder, mit dem Sie das Foto teilen, den dort hinterlegten Namen lesen kann.",
  "s5.p3": "Der Credit ist standardmäßig eingeschaltet, und Sie entscheiden, ob Sie ihn ausschalten: für einen einzelnen Export im Export-Fenster oder für alle Exporte in den Einstellungen. Ihre vorhandenen Fotos werden nie verändert – jeder Export wird als neue Datei geschrieben.",
  "s6.h": "Lokale Datenspeicherung",
  "s6.p1": "Die App speichert die folgenden Daten <strong>ausschließlich auf Ihrem Gerät</strong>:",
  "s6.li1": "Von Ihnen erstellte Wasserzeichen-Vorlagen und -Voreinstellungen (Name, Schriftart, Größe, Farbe, Deckkraft, Drehung, Kachelung und Position)",
  "s6.li2": "Miniaturvorschaubilder Ihrer gespeicherten Vorlagen",
  "s6.li3": "Ihre „Letzte Arbeiten“ — ein lokaler Verlauf der von Ihnen exportierten Fotos, damit Sie sie erneut öffnen oder exportieren können",
  "s6.li4": "Ihre App-Einstellungen, wie Standard-Exportqualität, -format, Ihre gewählte Sprache, und ob Ihr Namensvermerk enthalten sein soll",
  "s6.p2": "Diese Daten verlassen niemals Ihr Gerät. Sie werden im lokalen Container der App gespeichert und automatisch gelöscht, wenn Sie die App deinstallieren.",
  "s7.h": "Dienste von Drittanbietern",
  "s7.p1": "Die App teilt Ihre Daten nicht mit Werbenetzwerken Dritter. Wir können geprüfte SDKs oder Dienstanbieter Dritter für App-Analysen, Absturzberichte oder Abonnementverwaltung nutzen. Solche Dienste werden ausschließlich integriert, um die Funktionalität der App zu unterstützen und die Nutzererfahrung zu verbessern.",
  "s8.h": "Datenschutz für Kinder",
  "s8.p1": "WatermarkIT ist für ein allgemeines Publikum konzipiert. Wir sammeln wissentlich keine personenbezogenen Daten von Kindern unter 13 Jahren. Sollten Sie glauben, dass wir versehentlich solche Informationen erfasst haben, kontaktieren Sie uns bitte, damit wir dies umgehend beheben können.",
  "s9.h": "Datensicherheit",
  "s9.p1": "Da WatermarkIT keine Daten überträgt, gibt es keine Daten während der Übertragung zu schützen. Alle lokal gespeicherten Daten (Ihre Vorlagen) unterliegen der in iOS integrierten Geräteverschlüsselung, die aktiviert ist, sobald Sie einen Gerätecode verwenden.",
  "s10.h": "Änderungen dieser Richtlinie",
  "s10.p1": "Wir können unsere Datenschutzerklärung von Zeit zu Zeit aktualisieren. Änderungen werden auf dieser Seite mit einem aktualisierten Datum „Zuletzt aktualisiert“ veröffentlicht. Wir empfehlen Ihnen, diese Richtlinie regelmäßig auf Änderungen zu überprüfen.",
  "s11.h": "Ihre Rechte",
  "s11.p1": "Je nach Ihrem Standort haben Sie möglicherweise Rechte in Bezug auf Ihre Daten gemäß lokalen Vorschriften (wie DSGVO oder CCPA). Da der Großteil Ihrer Daten (wie Vorlagen und Fotos) lokal gespeichert wird, können Sie sie direkt verwalten, indem Sie Elemente innerhalb der App ändern oder löschen, oder indem Sie die App deinstallieren.",
  "contact.h": "Fragen zu Ihrer Privatsphäre?",
  "contact.p": "Falls Sie Fragen oder Bedenken zu dieser Datenschutzerklärung haben, melden Sie sich bei uns — wir helfen Ihnen gerne weiter.",
  "footer.support": "Support",
  "footer.made": "Mit ❤️ für iOS gemacht",
  "s3.li7": "Wenn Sie WatermarkIT über Siri oder Kurzbefehle ausführen, geschieht dasselbe auf Ihrem Gerät: Das Foto, das Ihr Kurzbefehl übergibt, wird lokal markiert, Ihnen angezeigt und an den Kurzbefehl zurückgegeben. Zum WatermarkIT-Album in Fotos wird es nur hinzugefügt, wenn Sie es sichern möchten; eine andere Kopie behält die App nicht",
  "s4.li4": "<strong>Mitteilungen</strong> — optionale Erinnerungen, die auf Ihrem Gerät geplant werden, ganz ohne Server. iOS fragt einmal, auf dem Startbildschirm; Sie können sie unter „Erinnerungen“ in den Einstellungen der App oder in den iOS-Einstellungen ausschalten.",
  "s3.li8": "Schwärzungsfelder, das Entfernen von Logo-Hintergründen und PDFs entstehen genauso, vollständig auf Ihrem Gerät",
  "s3.li9": "Fotos, die Sie über die Teilen-Taste in Fotos an WatermarkIT senden, werden genauso auf Ihrem Gerät verarbeitet",
  "s3.li10": "„Foto prüfen“ liest Vermerk, KI-Training-Hinweis, Standort, Aufnahmedatum und Kamera eines von Ihnen gewählten Fotos auf Ihrem Gerät und behält keine Kopie davon",
  "s5.p4": "WatermarkIT kann den Fotos, die Sie sichern, außerdem das standardisierte IPTC-Signal „kein KI-Training“ hinzufügen und Ihren Vermerk in den XMP-Daten der Datei wiederholen. Es ist eine Bitte, die Tools lesen können, keine Sperre. Es ist standardmäßig an, wird nie in PDFs geschrieben und lässt sich auf dem Export-Bildschirm oder in den Einstellungen ausschalten.",
  "s5.p5": "Gesicherte Kopien behalten Aufnahmedatum und Kamera des Originals, damit sie in Fotos daneben einsortiert werden. Der Standort wird entfernt, außer Sie entscheiden sich, ihn zu behalten.",
  "s6.li5": "Eine noch nicht abgeschlossene Bearbeitung, damit „Weiter bearbeiten“ sie zurückholen kann, sowie Schriften, die Sie importieren"
 },
 "ru": {
  "nav.support": "Поддержка",
  "lang.label": "Язык",
  "hero.title": "Политика конфиденциальности",
  "hero.meta": "Дата вступления в силу: 1 июня 2026 г. &nbsp;·&nbsp; Последнее обновление: 12 октября 2026 г.",
  "trans.note": "Этот перевод предоставлен для удобства; основной текст — на английском языке.",
  "sum.1": "Обработка на устройстве",
  "sum.2": "Ориентация на приватность",
  "sum.3": "Без загрузки в облако",
  "sum.4": "Безопасное локальное хранение",
  "s1.h": "Обзор",
  "s1.p1": "WatermarkIT не собирает, не хранит, не передаёт и не делится никакими личными данными или изображениями. Вся обработка происходит полностью на вашем устройстве.",
  "s1.p2": "Настоящая политика конфиденциальности объясняет, как приложение WatermarkIT для iOS («Приложение», «мы») обрабатывает вашу информацию. Мы стремимся защищать вашу конфиденциальность и быть прозрачными в отношении наших практик.",
  "s2.h": "Сбор и использование данных",
  "s2.p1": "<strong>Наше безоговорочное обязательство:</strong> мы никогда ни при каких обстоятельствах не получаем доступ к вашим фото, не загружаем, не передаём и не храним их. Вся обработка изображений выполняется полностью локально на вашем устройстве.",
  "s2.p2": "Приложение не собирает личную идентифицирующую информацию (например, ваше имя или адрес электронной почты). Начиная с версии 1.4.1 приложение использует Firebase Analytics и Crashlytics (Google), чтобы понимать, какие функции реально используются, и отслеживать сбои. Они получают сведения об использованных функциях, отчёты о сбоях, случайный идентификатор вашей установки приложения и приблизительное местоположение (например, страну), которое Google определяет по вашему IP-адресу. Никогда — ваши фото, имена файлов, то, что вы вводите, или идентификатор рекламы. Ничто из этого не связывается с вашей личностью и не используется для отслеживания. Вы можете отключить это в любой момент в Настройках → Конфиденциальность. В любом случае ваши фото остаются на 100% приватными и никогда не будут доступны нам, загружены или сохранены нами.",
  "s3.h": "Как работает Приложение",
  "s3.p1": "WatermarkIT — это полностью офлайн-приложение, работающее на устройстве. Вот что именно происходит при его использовании:",
  "s3.li1": "Вы выбираете фото — из библиотеки фото, с камеры или из приложения «Файлы»",
  "s3.li2": "Приложение считывает это фото локально на вашем устройстве",
  "s3.li3": "Вся обработка водяного знака — текст, логотипы, рукописные подписи, QR-коды и замощение — выполняется полностью на вашем устройстве",
  "s3.li4": "QR-коды создаются на устройстве с помощью встроенного фреймворка Apple Core Image; введённая вами ссылка никогда не передаётся",
  "s3.li5": "Результат сохраняется в вашу локальную «Фотоплёнку» или передаётся через меню общего доступа iOS",
  "s3.li6": "Ваше фото или любые данные, полученные из него, никогда и ни при каких условиях не отправляются на внешний сервер",
  "s4.h": "Разрешения устройства",
  "s4.p1": "Приложение запрашивает следующие разрешения iOS:",
  "s4.li1": "<strong>Доступ на чтение медиатеки</strong> — только если вы снова открываете прошлый экспорт из «Недавних работ» или делитесь фото после сохранения: в обоих случаях сохранённое фото забирается из медиатеки. Для выбора фото он не нужен — системный выбор фото iOS передаёт Приложению только выбранные вами снимки.",
  "s4.li2": "<strong>Добавление в медиатеку</strong> — чтобы сохранять фото с водяным знаком в «Фотопленку». Это разрешение позволяет добавлять фото, но не видеть остальную медиатеку.",
  "s4.li3": "<strong>Доступ к камере</strong> — только если вы решите сделать новое фото внутри Приложения, чтобы вы могли отметить снимок водяным знаком, не сохраняя сначала немаркированную копию. Приложение никогда не открывает камеру самостоятельно, а сделанные вами фото обрабатываются точно так же, как и любые другие: обрабатываются на устройстве, никогда не загружаются.",
  "s4.p2": "Вы также можете импортировать изображение через приложение «Файлы». При этом используется стандартный выбор документов iOS, который передаёт Приложению только один выбранный файл и не требует постоянного разрешения.",
  "s4.p3": "Разрешения на доступ к фото и камере запрашиваются только в тот момент, когда вы используете функцию, которой они нужны, — никогда автоматически при запуске. Любое из этих разрешений можно отозвать в любой момент в настройках iOS.",
  "s5.h": "Информация, которую вы добавляете к своим фото",
  "s5.p1": "WatermarkIT может записать указание авторства — ваше имя и знак авторского права — в метаданные экспортируемых вами фото, используя стандартные поля IPTC и TIFF (автор, уведомление об авторских правах, художник). Именно это позволяет вашей метке авторства пережить обрезку.",
  "s5.p2": "Стоит прояснить два момента:",
  "s5.li1": "Записываемый текст — это <strong>текст, который вводите вы сами</strong>. WatermarkIT никогда не вставляет собственное название, идентификатор устройства, ваше местоположение или какие-либо скрытые данные отслеживания.",
  "s5.li2": "Эти метаданные записываются в экспортированный файл, поэтому они <strong>путешествуют вместе с этим файлом всюду, куда бы вы его ни отправили</strong>. В этом и заключается смысл этой функции — но это также означает, что любой, с кем вы поделитесь фото, сможет прочитать указанное вами имя.",
  "s5.p3": "Подпись включена по умолчанию, и отключить её решаете вы: для отдельного экспорта — в окне экспорта, для всех — в настройках. Ваши существующие фото никогда не изменяются — каждый экспорт записывается как новый файл.",
  "s6.h": "Локальное хранение данных",
  "s6.p1": "Приложение хранит следующие данные <strong>только на вашем устройстве</strong>:",
  "s6.li1": "Созданные вами шаблоны и пресеты водяных знаков (название, шрифт, размер, цвет, прозрачность, поворот, замощение и положение)",
  "s6.li2": "Миниатюры предпросмотра для ваших сохранённых шаблонов",
  "s6.li3": "«Недавние работы» — локальную историю экспортированных вами фото, чтобы вы могли снова открыть или переэкспортировать их",
  "s6.li4": "Ваши настройки приложения, такие как качество и формат экспорта по умолчанию, выбранный вами язык, и следует ли включать указание авторства",
  "s6.p2": "Эти данные никогда не покидают ваше устройство. Они хранятся в локальном контейнере Приложения и автоматически удаляются при удалении Приложения.",
  "s7.h": "Сторонние сервисы",
  "s7.p1": "Приложение не передаёт ваши данные сторонним рекламным сетям. Мы можем использовать проверенные сторонние SDK или поставщиков услуг для аналитики приложения, отчётов о сбоях или управления подписками. Такие сервисы, если они используются, интегрируются исключительно для поддержки функциональности приложения и улучшения пользовательского опыта.",
  "s8.h": "Конфиденциальность детей",
  "s8.p1": "WatermarkIT рассчитан на широкую аудиторию. Мы сознательно не собираем личную информацию от детей младше 13 лет. Если вы считаете, что мы непреднамеренно собрали такую информацию, свяжитесь с нами, чтобы мы могли оперативно это исправить.",
  "s9.h": "Безопасность данных",
  "s9.p1": "Поскольку WatermarkIT не передаёт никаких данных, защищать данные при передаче не требуется. Все данные, хранящиеся локально (ваши шаблоны), защищены встроенным шифрованием устройства iOS, которое активируется при использовании кода доступа к устройству.",
  "s10.h": "Изменения в этой политике",
  "s10.p1": "Мы можем время от времени обновлять нашу политику конфиденциальности. Любые изменения будут опубликованы на этой странице с обновлённой датой «Последнее обновление». Мы рекомендуем периодически просматривать эту политику на предмет изменений.",
  "s11.h": "Ваши права",
  "s11.p1": "В зависимости от вашего местонахождения у вас могут быть права в отношении ваших данных согласно местным нормам (таким как GDPR или CCPA). Поскольку большая часть ваших данных (например, шаблоны и фото) хранится локально, вы можете управлять ими напрямую, изменяя или удаляя элементы внутри Приложения, либо удалив Приложение.",
  "contact.h": "Вопросы о вашей конфиденциальности?",
  "contact.p": "Если у вас есть вопросы или опасения по поводу этой политики конфиденциальности, свяжитесь с нами — мы будем рады помочь.",
  "footer.support": "Поддержка",
  "footer.made": "Сделано с ❤️ для iOS",
  "s3.li7": "Если вы запускаете WatermarkIT через Siri или Команды, всё так же происходит на вашем устройстве: фото, переданное командой, обрабатывается локально, показывается вам и возвращается в команду. В альбом WatermarkIT в «Фото» оно добавляется, только если вы решите его сохранить; других копий Приложение не хранит",
  "s4.li4": "<strong>Уведомления</strong> — необязательные напоминания, которые планируются на вашем устройстве без участия сервера. iOS спрашивает один раз, на главном экране; отключить их можно в разделе «Напоминания» в настройках Приложения или в настройках iOS.",
  "s3.li8": "Плашки закрашивания, удаление фона логотипа и PDF создаются так же — полностью на вашем устройстве",
  "s3.li9": "Фото, которые вы отправляете в WatermarkIT кнопкой «Поделиться» в «Фото», обрабатываются на вашем устройстве точно так же",
  "s3.li10": "«Проверить фото» считывает с выбранного фото подпись авторства, запрос об обучении ИИ, геопозицию, дату съёмки и камеру — на вашем устройстве, не сохраняя копию",
  "s5.p4": "WatermarkIT также может добавить в сохраняемые фото стандартный сигнал IPTC «без обучения ИИ», продублировав вашу подпись авторства в данных XMP файла. Это просьба, которую читают сервисы, а не замок. По умолчанию он включён, никогда не записывается в PDF и отключается на экране экспорта или в настройках.",
  "s5.p5": "Сохранённые копии сохраняют дату съёмки и камеру оригинала, поэтому в «Фото» они оказываются рядом с ним. Геопозиция удаляется, если вы не решите её оставить.",
  "s6.li5": "Незавершённое редактирование, чтобы «Продолжить редактирование» могло его вернуть, и импортированные вами шрифты"
 },
 "nl": {
  "nav.support": "Ondersteuning",
  "lang.label": "Taal",
  "hero.title": "Privacybeleid",
  "hero.meta": "Ingangsdatum: 1 juni 2026 &nbsp;·&nbsp; Laatst bijgewerkt: 12 oktober 2026",
  "trans.note": "Deze vertaling is bedoeld ter ondersteuning; de Engelse versie is leidend.",
  "sum.1": "Verwerking op het apparaat",
  "sum.2": "Gericht op privacy",
  "sum.3": "Geen cloud-uploads",
  "sum.4": "Veilige lokale opslag",
  "s1.h": "Overzicht",
  "s1.p1": "WatermarkIT verzamelt, bewaart, verzendt of deelt geen persoonlijke gegevens of afbeeldingen. Alle verwerking gebeurt volledig op je apparaat.",
  "s1.p2": "Dit privacybeleid legt uit hoe de iOS-app WatermarkIT (“de App”, “wij”) met je informatie omgaat. Wij zetten ons in om je privacy te beschermen en transparant te zijn over onze werkwijze.",
  "s2.h": "Gegevensverzameling en -gebruik",
  "s2.p1": "<strong>Onze absolute toezegging:</strong> we krijgen nooit toegang tot je foto’s, uploaden, verzenden of bewaren ze onder geen enkele omstandigheid. Alle beeldverwerking gebeurt volledig lokaal op je apparaat.",
  "s2.p2": "De App verzamelt geen persoonlijke identificatiegegevens (zoals je naam of e-mailadres). Vanaf versie 1.4.1 gebruikt de App Firebase Analytics en Crashlytics (Google) om te begrijpen welke functies mensen daadwerkelijk gebruiken en om crashes op te sporen. Ze ontvangen welke functies gebruikt zijn, crashrapporten, een willekeurige ID voor jouw installatie van de App en een globale locatie (zoals je land) die Google afleidt uit je IP-adres. Nooit een foto, bestandsnaam, iets wat je typt, of je advertentie-ID. Niets hiervan wordt aan je identiteit gekoppeld of gebruikt om je te volgen. Je kunt dit altijd uitzetten via Instellingen → Privacy. In beide gevallen blijven je foto’s 100% privé en worden ze nooit door ons benaderd, geüpload of bewaard.",
  "s3.h": "Hoe de App werkt",
  "s3.p1": "WatermarkIT is een volledig offline app die op het apparaat draait. Dit gebeurt er precies wanneer je de app gebruikt:",
  "s3.li1": "Je kiest een foto — uit je fotobibliotheek, met de camera, of via de app Bestanden",
  "s3.li2": "De App leest die foto lokaal op je apparaat",
  "s3.li3": "Alle watermerkverwerking — tekst, logo’s, handgeschreven handtekeningen, QR-codes en tegels — gebeurt volledig op je apparaat",
  "s3.li4": "QR-codes worden op het apparaat gegenereerd met Apples ingebouwde Core Image-framework; de link die je invoert wordt nooit verzonden",
  "s3.li5": "Het resultaat wordt opgeslagen in je lokale Camerarol of gedeeld via het iOS-deelvenster",
  "s3.li6": "Op geen enkel moment wordt je foto, of daarvan afgeleide gegevens, naar een externe server gestuurd",
  "s4.h": "Apparaatmachtigingen",
  "s4.p1": "De App vraagt de volgende iOS-machtigingen aan:",
  "s4.li1": "<strong>Leestoegang tot de fotobibliotheek</strong> — alleen als je een eerdere export opnieuw opent vanuit Recent werk, of foto’s deelt na het bewaren, omdat beide je bewaarde foto weer uit je bibliotheek halen. Een foto kiezen om te markeren heeft het niet nodig: de fotokiezer van iOS geeft de App alleen de foto’s die jij kiest.",
  "s4.li2": "<strong>Toevoegen aan de fotobibliotheek</strong> — om je gemarkeerde afbeeldingen in je Filmrol te bewaren. Hiermee kan de App foto’s toevoegen, maar niet de rest van je bibliotheek zien.",
  "s4.li3": "<strong>Cameratoegang</strong> — alleen als je ervoor kiest om een nieuwe foto binnen de App te maken, zodat je een opname van een watermerk kunt voorzien zonder eerst een ongemarkeerde kopie op te slaan. De App opent de camera nooit uit zichzelf, en foto’s die je maakt worden precies als elke andere behandeld: verwerkt op het apparaat, nooit geüpload.",
  "s4.p2": "Je kunt ook een afbeelding importeren via de app Bestanden. Dat gebruikt de standaard iOS-documentkiezer, die alleen het ene door jou gekozen bestand aan de App geeft en geen doorlopende machtiging vereist.",
  "s4.p3": "Toestemming voor foto’s en camera wordt pas gevraagd op het moment dat je de functie gebruikt die ze nodig heeft — nooit automatisch bij het opstarten. Je kunt elk van deze toestemmingen op elk moment intrekken in de iOS-instellingen.",
  "s5.h": "Informatie die je aan je foto’s toevoegt",
  "s5.p1": "WatermarkIT kan een naamsvermelding — je naam en copyright — wegschrijven naar de metadata van de foto’s die je exporteert, met behulp van de standaard IPTC- en TIFF-velden (maker, copyrightvermelding, artiest). Hierdoor overleeft je vermelding het bijsnijden.",
  "s5.p2": "Twee dingen zijn de moeite waard om duidelijk te maken:",
  "s5.li1": "De geschreven tekst is <strong>de tekst die je zelf invoert</strong>. WatermarkIT voegt nooit onze eigen naam, een apparaat-ID, je locatie, of enige verborgen trackinggegevens van zichzelf toe.",
  "s5.li2": "Deze metadata wordt in het geëxporteerde bestand geschreven en <strong>reist dus mee met dat bestand, waar je het ook naartoe stuurt</strong>. Dat is precies het doel van deze functie — maar het betekent ook dat iedereen met wie je de foto deelt, de naam die je daar hebt geplaatst kan lezen.",
  "s5.p3": "De vermelding staat standaard aan, en jij bepaalt of ze uit gaat: voor één export in het exportvenster, of voor alle exports in Instellingen. Je bestaande foto’s worden nooit gewijzigd — elke export wordt als nieuw bestand geschreven.",
  "s6.h": "Lokale gegevensopslag",
  "s6.p1": "De App bewaart de volgende gegevens <strong>alleen op je apparaat</strong>:",
  "s6.li1": "Watermerksjablonen en voorinstellingen die je maakt (naam, lettertype, grootte, kleur, dekking, rotatie, tegels en positie)",
  "s6.li2": "Miniatuurvoorbeelden van je opgeslagen sjablonen",
  "s6.li3": "Je Recente Werk — een lokale geschiedenis van foto’s die je hebt geëxporteerd, zodat je ze opnieuw kunt openen of exporteren",
  "s6.li4": "Je app-voorkeuren, zoals standaard exportkwaliteit, formaat, je gekozen taal, en of je naamsvermelding moet worden opgenomen",
  "s6.p2": "Deze gegevens verlaten nooit je apparaat. Ze worden opgeslagen in de lokale container van de App en automatisch verwijderd als je de App verwijdert.",
  "s7.h": "Diensten van derden",
  "s7.p1": "De App deelt je gegevens niet met externe advertentienetwerken. We kunnen geverifieerde externe SDK’s of dienstverleners gebruiken voor app-analyse, crashrapportage of abonnementsbeheer. Dergelijke diensten worden, indien van toepassing, strikt geïntegreerd om de functionaliteit van de app te ondersteunen en de gebruikerservaring te verbeteren.",
  "s8.h": "Privacy van kinderen",
  "s8.p1": "WatermarkIT is bedoeld voor een algemeen publiek. We verzamelen niet bewust persoonlijke informatie van kinderen jonger dan 13 jaar. Als je denkt dat we per ongeluk dergelijke informatie hebben verzameld, neem dan contact met ons op, zodat we dit snel kunnen verhelpen.",
  "s9.h": "Gegevensbeveiliging",
  "s9.p1": "Omdat WatermarkIT geen gegevens verzendt, is er geen data-in-transit om te beveiligen. Alle lokaal opgeslagen gegevens (je sjablonen) vallen onder de ingebouwde apparaatversleuteling van iOS, die actief is zodra je een toegangscode op je apparaat gebruikt.",
  "s10.h": "Wijzigingen in dit beleid",
  "s10.p1": "We kunnen ons privacybeleid van tijd tot tijd bijwerken. Eventuele wijzigingen worden op deze pagina geplaatst met een bijgewerkte datum “Laatst bijgewerkt”. We raden je aan dit beleid periodiek te controleren op wijzigingen.",
  "s11.h": "Jouw rechten",
  "s11.p1": "Afhankelijk van je locatie kun je rechten hebben met betrekking tot je gegevens onder lokale regelgeving (zoals AVG of CCPA). Omdat het merendeel van je gegevens (zoals sjablonen en foto’s) lokaal wordt opgeslagen, kun je ze direct beheren door items in de App te wijzigen of te verwijderen, of door de App te verwijderen.",
  "contact.h": "Vragen over je privacy?",
  "contact.p": "Heb je vragen of zorgen over dit privacybeleid? Neem contact met ons op — we helpen je graag verder.",
  "footer.support": "Ondersteuning",
  "footer.made": "Gemaakt met ❤️ voor iOS",
  "s3.li7": "Als je WatermarkIT via Siri of Opdrachten gebruikt, gebeurt hetzelfde op je apparaat: de foto die je opdracht doorgeeft, wordt lokaal gemarkeerd, aan je getoond en teruggegeven aan de opdracht. Hij wordt alleen aan het WatermarkIT-album in Foto’s toegevoegd als je ervoor kiest hem te bewaren; de App bewaart geen andere kopie",
  "s4.li4": "<strong>Meldingen</strong> — optionele herinneringen, gepland op je apparaat zonder enige server. iOS vraagt het één keer, op het beginscherm; je kunt ze uitzetten onder Herinneringen in de instellingen van de App, of in de iOS-instellingen.",
  "s3.li8": "Zwarte vlakken, achtergrond verwijderen bij logo’s en pdf’s worden op dezelfde manier gemaakt, volledig op je toestel",
  "s3.li9": "Foto’s die je vanuit de Deel-knop in Foto’s naar WatermarkIT stuurt, worden op precies dezelfde manier op je toestel verwerkt",
  "s3.li10": "‘Foto controleren’ leest de vermelding, het AI-trainingsverzoek, de locatie, de opnamedatum en de camera van een foto die je kiest, op je toestel, en bewaart er geen kopie van",
  "s5.p4": "WatermarkIT kan ook het standaard IPTC-signaal ‘geen AI-training’ toevoegen aan de foto’s die je bewaart, met je vermelding herhaald in de XMP-gegevens van het bestand. Het is een verzoek dat tools kunnen lezen, geen slot. Het staat standaard aan, wordt nooit in pdf’s geschreven en zet je uit op het exportscherm of in Instellingen.",
  "s5.p5": "Bewaarde kopieën houden de opnamedatum en camera van de originele foto, zodat ze er in Foto’s naast komen te staan. De locatie wordt verwijderd, tenzij je ervoor kiest die te bewaren.",
  "s6.li5": "Een bewerking die je nog niet hebt afgerond, zodat ‘Verder bewerken’ die terug kan halen, en lettertypen die je importeert"
 },
 "vi": {
  "nav.support": "Hỗ trợ",
  "lang.label": "Ngôn ngữ",
  "hero.title": "Chính sách quyền riêng tư",
  "hero.meta": "Ngày hiệu lực: 1 tháng 6, 2026 &nbsp;·&nbsp; Cập nhật lần cuối: 12 tháng 10, 2026",
  "trans.note": "Bản dịch này chỉ mang tính tham khảo; bản tiếng Anh là bản chính thức.",
  "sum.1": "Xử lý trên thiết bị",
  "sum.2": "Chú trọng quyền riêng tư",
  "sum.3": "Không tải lên đám mây",
  "sum.4": "Lưu trữ cục bộ an toàn",
  "s1.h": "Tổng quan",
  "s1.p1": "WatermarkIT không thu thập, lưu trữ, truyền tải, hay chia sẻ bất kỳ dữ liệu cá nhân hay hình ảnh nào. Mọi xử lý đều diễn ra hoàn toàn trên thiết bị của bạn.",
  "s1.p2": "Chính sách quyền riêng tư này giải thích cách ứng dụng iOS WatermarkIT (“Ứng dụng”, “chúng tôi”) xử lý thông tin của bạn. Chúng tôi cam kết bảo vệ quyền riêng tư của bạn và minh bạch về các thực hành của mình.",
  "s2.h": "Thu thập và Sử dụng Dữ liệu",
  "s2.p1": "<strong>Cam kết tuyệt đối của chúng tôi:</strong> chúng tôi không bao giờ truy cập, tải lên, truyền tải hay lưu trữ ảnh của bạn trong bất kỳ trường hợp nào. Mọi xử lý hình ảnh được thực hiện hoàn toàn cục bộ trên thiết bị của bạn.",
  "s2.p2": "Ứng dụng không thu thập thông tin nhận dạng cá nhân (như tên hoặc địa chỉ email của bạn). Kể từ phiên bản 1.4.1, ứng dụng dùng Firebase Analytics và Crashlytics (Google) để biết tính năng nào thực sự được dùng và phát hiện sự cố. Chúng nhận các tính năng đã dùng, báo cáo sự cố, một mã định danh ngẫu nhiên cho bản cài đặt ứng dụng của bạn và vị trí gần đúng (chẳng hạn quốc gia) mà Google suy ra từ địa chỉ IP của bạn. Không bao giờ là ảnh, tên tệp, bất cứ gì bạn nhập, hay mã định danh quảng cáo của bạn. Không dữ liệu nào trong số này được liên kết với danh tính của bạn hay dùng để theo dõi. Bạn có thể tắt tính năng này bất cứ lúc nào trong Cài đặt → Quyền riêng tư. Dù bật hay tắt, ảnh của bạn vẫn luôn riêng tư 100% và sẽ không bao giờ bị chúng tôi truy cập, tải lên hay lưu trữ.",
  "s3.h": "Cách Ứng dụng Hoạt động",
  "s3.p1": "WatermarkIT là một ứng dụng hoàn toàn ngoại tuyến, hoạt động trên thiết bị. Đây là chính xác những gì xảy ra khi bạn sử dụng nó:",
  "s3.li1": "Bạn chọn một bức ảnh — từ thư viện ảnh, từ camera, hoặc từ ứng dụng Tệp",
  "s3.li2": "Ứng dụng đọc bức ảnh đó cục bộ trên thiết bị của bạn",
  "s3.li3": "Mọi xử lý hình mờ — văn bản, logo, chữ ký viết tay, mã QR và lát kín — được thực hiện hoàn toàn trên thiết bị của bạn",
  "s3.li4": "Mã QR được tạo trên thiết bị bằng khung Core Image tích hợp sẵn của Apple; đường liên kết bạn nhập không bao giờ được truyền đi",
  "s3.li5": "Kết quả được lưu trở lại Cuộn phim Camera cục bộ của bạn hoặc chia sẻ qua Trình chia sẻ của iOS",
  "s3.li6": "Không lúc nào ảnh của bạn, hoặc bất kỳ dữ liệu nào bắt nguồn từ nó, được gửi tới bất kỳ máy chủ bên ngoài nào",
  "s4.h": "Quyền truy cập Thiết bị",
  "s4.p1": "Ứng dụng yêu cầu các quyền iOS sau:",
