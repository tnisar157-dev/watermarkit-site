  "s2.p2": "لا يجمع التطبيق حاليًا معلومات تعريف شخصية (مثل اسمك أو بريدك الإلكتروني). وإذا أضفنا مستقبلًا ميزات مثل الحسابات أو الاشتراكات أو تقارير الاستخدام والأعطال، فستبقى صورك خاصة بالكامل ولن يتم الوصول إليها أو رفعها أو تخزينها من قبلنا.",
  "s3.h": "كيف يعمل التطبيق",
  "s3.p1": "WatermarkIT تطبيق يعمل دون اتصال وعلى الجهاز بالكامل. إليك ما يحدث بالضبط عند استخدامه:",
  "s3.li1": "تختار صورة — من مكتبة الصور أو الكاميرا أو تطبيق الملفات",
  "s3.li2": "يقرأ التطبيق تلك الصورة محليًا على جهازك",
  "s3.li3": "تتم كل معالجة العلامة المائية — النص والشعارات والتوقيعات اليدوية ورموز QR والتكرار — على جهازك بالكامل",
  "s3.li4": "تُنشأ رموز QR على الجهاز باستخدام إطار Core Image من أبل، ولا يُرسل الرابط الذي تدخله أبدًا",
  "s3.li5": "تُحفظ النتيجة في ألبوم الصور لديك أو تُشارك عبر ورقة المشاركة في iOS",
  "s3.li6": "لا تُرسل صورتك، أو أي بيانات مستمدة منها، إلى أي خادم خارجي في أي وقت",
  "s4.h": "أذونات الجهاز",
  "s4.p1": "يطلب التطبيق أذونات iOS التالية:",
  "s4.li1": "<strong>إذن قراءة مكتبة الصور</strong> — لتتمكّن من اختيار الصور التي تريد وضع علامة عليها. لا نصل إلا إلى الصور التي تختارها صراحة.",
  "s4.li2": "<strong>إذن الكتابة إلى مكتبة الصور</strong> — لحفظ الصور بعد وضع العلامة في ألبوم الصور.",
  "s4.li3": "<strong>إذن الكاميرا</strong> — فقط إذا اخترت التقاط صورة جديدة داخل التطبيق، لتضع علامة على لقطة دون حفظ نسخة غير معلّمة أولًا. لا يفتح التطبيق الكاميرا من تلقاء نفسه، وتُعامَل الصور التي تلتقطها مثل غيرها تمامًا: تُعالَج على الجهاز ولا تُرفع أبدًا.",
  "s4.p2": "يمكنك أيضًا استيراد صورة عبر تطبيق الملفات، وذلك عبر منتقي المستندات القياسي في iOS الذي يمنح التطبيق الملف المحدد فقط دون أي إذن دائم.",
  "s4.p3": "لا تُطلب هذه الأذونات إلا عند محاولة استخدام الميزة ذات الصلة — وليس تلقائيًا عند التشغيل. ويمكنك سحبها في أي وقت من إعدادات iOS ← الخصوصية والأمان.",
  "s5.h": "المعلومات التي تضيفها إلى صورك",
  "s5.p1": "يمكن لـ WatermarkIT كتابة سطر نسبة — اسمك وحقوق النشر — في بيانات الصور التي تصدّرها، باستخدام حقول IPTC وTIFF القياسية. وهذا ما يجعل نسبتك تبقى بعد الاقتصاص.",
  "s5.p2": "ينبغي توضيح أمرين:",
  "s5.li1": "النص المكتوب هو <strong>النص الذي تدخله أنت</strong>. لا يضيف WatermarkIT اسمنا أو معرّف جهاز أو موقعك أو أي بيانات تتبّع خفية.",
  "s5.li2": "تُكتب هذه البيانات داخل الملف المُصدَّر، لذا <strong>تنتقل معه أينما أرسلته</strong>. وهذا هو الهدف من الميزة — لكنه يعني أيضًا أن كل من تشاركه الصورة يمكنه قراءة الاسم الذي وضعته.",
  "s5.p3": "سطر النسبة اختياري. يمكنك إيقافه لعملية تصدير واحدة من ورقة التصدير، أو تعطيله افتراضيًا من الإعدادات. ولا تُعدّل صورك الحالية أبدًا — فكل تصدير يُكتب كملف جديد.",
  "s6.h": "التخزين المحلي للبيانات",
  "s6.p1": "يخزّن التطبيق البيانات التالية <strong>على جهازك فقط</strong>:",
  "s6.li1": "القوالب والإعدادات المسبقة التي تنشئها (الاسم والخط والحجم واللون والشفافية والدوران والتكرار والموضع)",
  "s6.li2": "صور المعاينة المصغّرة لقوالبك المحفوظة",
  "s6.li3": "أعمالك الأخيرة — سجل محلي للصور التي صدّرتها، لتتمكّن من فتحها أو تصديرها مجددًا",
  "s6.li4": "تفضيلات التطبيق، مثل جودة التصدير الافتراضية والصيغة واللغة التي اخترتها وما إذا كنت تريد تضمين سطر النسبة",
  "s6.p2": "لا تغادر هذه البيانات جهازك أبدًا. فهي مخزّنة في حاوية التطبيق المحلية وتُحذف تلقائيًا عند إلغاء تثبيت التطبيق.",
  "s7.h": "خدمات الطرف الثالث",
  "s7.p1": "لا يشارك التطبيق بياناتك مع شبكات الإعلانات. وقد نستخدم حزم SDK أو مزوّدي خدمات موثوقين لتحليلات التطبيق أو تقارير الأعطال أو إدارة الاشتراكات، وذلك حصرًا لدعم وظائف التطبيق وتحسين التجربة.",
  "s8.h": "خصوصية الأطفال",
  "s8.p1": "صُمّم WatermarkIT لجمهور عام. ولا نجمع عن علم معلومات شخصية من الأطفال دون الثالثة عشرة. إذا كنت تعتقد أننا جمعنا مثل هذه المعلومات عن غير قصد، فيرجى التواصل معنا لمعالجة الأمر سريعًا.",
  "s9.h": "أمان البيانات",
  "s9.p1": "لأن WatermarkIT لا ينقل أي بيانات، فلا توجد بيانات أثناء النقل تحتاج إلى حماية. وجميع البيانات المخزّنة محليًا خاضعة لتشفير iOS المدمج، الذي يعمل عند استخدام رمز دخول للجهاز.",
  "s10.h": "التغييرات على هذه السياسة",
  "s10.p1": "قد نحدّث سياسة الخصوصية من وقت لآخر. وستُنشر أي تغييرات على هذه الصفحة مع تحديث تاريخ “آخر تحديث”. نشجّعك على مراجعة هذه السياسة دوريًا.",
  "s11.h": "حقوقك",
  "s11.p1": "تبعًا لموقعك، قد تتمتع بحقوق تتعلق ببياناتك بموجب الأنظمة المحلية (مثل GDPR أو CCPA). وبما أن معظم بياناتك مخزّنة محليًا، يمكنك إدارتها مباشرة بتعديل العناصر أو حذفها داخل التطبيق، أو بإلغاء تثبيته.",
  "contact.h": "لديك أسئلة عن خصوصيتك؟",
  "contact.p": "إذا كانت لديك أي أسئلة أو مخاوف بشأن سياسة الخصوصية هذه، تواصل معنا — يسعدنا مساعدتك.",
  "footer.support": "الدعم",
  "footer.made": "صُنع بـ ❤️ لـ iOS"
 },
 "ja": {
  "nav.support": "サポート",
  "lang.label": "言語",
  "hero.title": "プライバシーポリシー",
  "hero.meta": "発効日: 2026年6月1日 &nbsp;·&nbsp; 最終更新: 2026年9月11日",
  "trans.note": "この翻訳は便宜上のものであり、正文は英語版です。",
  "sum.1": "デバイス内で処理",
  "sum.2": "プライバシー重視",
  "sum.3": "クラウドへの送信なし",
  "sum.4": "安全なローカル保存",
  "s1.h": "概要",
  "s1.p1": "WatermarkIT は個人データや画像を一切収集・保存・送信・共有しません。すべての処理はお使いのデバイス内で完結します。",
  "s1.p2": "本プライバシーポリシーは、iOS アプリ WatermarkIT（以下「本アプリ」）がお客様の情報をどのように扱うかを説明するものです。当方はお客様のプライバシーを保護し、その取り扱いについて透明であることをお約束します。",
  "s2.h": "データの収集と利用",
  "s2.p1": "<strong>当方の確約:</strong> いかなる場合も、お客様の写真にアクセスしたり、アップロード・送信・保存したりすることはありません。画像処理はすべてデバイス内でローカルに行われます。",
  "s2.p2": "現在、本アプリは氏名やメールアドレスなどの個人識別情報を収集しません。将来的にアカウント、サブスクリプション、利用状況の分析やクラッシュレポートなどの機能を導入する場合でも、お客様の写真は 100% 非公開のままであり、当方がアクセス・アップロード・保存することはありません。",
  "s3.h": "本アプリの仕組み",
  "s3.p1": "WatermarkIT は完全にオフラインで動作する、デバイス内完結型のアプリです。ご利用時に起きることは次のとおりです。",
  "s3.li1": "写真ライブラリ、カメラ、または「ファイル」App から写真を選びます",
  "s3.li2": "本アプリはその写真をデバイス内でローカルに読み込みます",
  "s3.li3": "テキスト、ロゴ、手書き署名、QR コード、タイル表示を含むすべての透かし処理は、デバイス内で行われます",
  "s3.li4": "QR コードは Apple 標準の Core Image フレームワークを使ってデバイス内で生成され、入力されたリンクが送信されることはありません",
  "s3.li5": "結果はカメラロールに保存されるか、iOS の共有シートで共有されます",
  "s3.li6": "お客様の写真、およびそこから派生したデータが外部サーバーに送信されることは一切ありません",
  "s4.h": "デバイスの許可",
  "s4.p1": "本アプリは次の iOS の許可を求めます。",
  "s4.li1": "<strong>写真ライブラリの読み取り</strong> — 透かしを入れる写真を選べるようにするためです。お客様が明示的に選んだ写真のみにアクセスします。",
  "s4.li2": "<strong>写真ライブラリへの書き込み</strong> — 透かしを入れた画像をカメラロールに保存するためです。",
  "s4.li3": "<strong>カメラ</strong> — アプリ内で新しく写真を撮る場合にのみ使用します。透かしのない元画像を保存せずにそのまま加工できます。本アプリが自動でカメラを起動することはなく、撮影した写真も他と同様にデバイス内で処理され、アップロードされることはありません。",
  "s4.p2": "「ファイル」App から画像を読み込むこともできます。これは iOS 標準のドキュメントピッカーを使うもので、選択した 1 つのファイルだけが本アプリに渡され、継続的な許可は必要ありません。",
  "s4.p3": "これらの許可は該当する機能を使おうとした時点で初めて求められ、起動時に自動で求めることはありません。iOS の「設定」→「プライバシーとセキュリティ」からいつでも取り消せます。",
  "s5.h": "写真に追加される情報",
  "s5.p1": "WatermarkIT は、書き出す写真のメタデータに、お名前と著作権表示（クレジット）を標準の IPTC および TIFF フィールドを使って書き込むことができます。これにより、トリミングされてもクレジットが残ります。",
  "s5.p2": "次の 2 点を明確にしておきます。",
  "s5.li1": "書き込まれるのは <strong>お客様が入力したテキスト</strong> です。WatermarkIT が当方の名前、デバイス識別子、位置情報、その他の隠れた追跡データを挿入することはありません。",
  "s5.li2": "このメタデータは書き出したファイル自体に書き込まれるため、<strong>そのファイルを送った先へも一緒に付いていきます</strong>。それがこの機能の目的ですが、写真を共有した相手はそこに書かれた名前を読めるということでもあります。",
  "s5.p3": "クレジットは任意です。書き出し画面で 1 回ごとにオフにすることも、設定で既定をオフにすることもできます。既存の写真が変更されることはなく、書き出しは常に新しいファイルとして保存されます。",
  "s6.h": "ローカルへのデータ保存",
  "s6.p1": "本アプリは次のデータを <strong>お使いのデバイス内にのみ</strong> 保存します。",
  "s6.li1": "作成した透かしのテンプレートとプリセット（名前、書体、サイズ、色、不透明度、回転、タイル表示、位置）",
  "s6.li2": "保存したテンプレートのサムネイル画像",
  "s6.li3": "最近の作業 — 書き出した写真のローカル履歴。開き直したり、書き出し直したりできます",
  "s6.li4": "既定の書き出し品質、フォーマット、選択した表示言語、クレジットを含めるかどうかなどの設定",
  "s6.p2": "これらのデータがデバイスから出ることはありません。本アプリのローカルコンテナに保存され、アプリを削除すると自動的に消去されます。",
  "s7.h": "第三者のサービス",
  "s7.p1": "本アプリはお客様のデータを広告ネットワークと共有しません。アプリの分析、クラッシュレポート、サブスクリプション管理のために、信頼できる第三者の SDK やサービスを利用する場合がありますが、いずれもアプリの機能を支え、体験を改善する目的に限られます。",
  "s8.h": "お子様のプライバシー",
  "s8.p1": "WatermarkIT は一般の利用者を対象としています。13 歳未満のお子様から意図的に個人情報を収集することはありません。万一そうした情報を収集してしまったと思われる場合は、速やかに対応しますのでご連絡ください。",
  "s9.h": "データの安全性",
  "s9.p1": "WatermarkIT はデータを送信しないため、保護すべき通信中のデータが存在しません。ローカルに保存されるデータは、デバイスにパスコードを設定していれば有効になる iOS 標準の暗号化によって保護されます。",
  "s10.h": "本ポリシーの変更",
  "s10.p1": "本プライバシーポリシーは随時更新されることがあります。変更があった場合は、「最終更新」日を更新のうえ本ページに掲載します。定期的にご確認いただくことをおすすめします。",
  "s11.h": "お客様の権利",
  "s11.p1": "お住まいの地域によっては、現地の規制（GDPR や CCPA など）に基づきご自身のデータに関する権利が認められる場合があります。データの大半はローカルに保存されているため、アプリ内で項目を編集・削除するか、アプリを削除することで直接管理できます。",
  "contact.h": "プライバシーについてご質問がありますか？",
  "contact.p": "本プライバシーポリシーについてご不明な点やご懸念があれば、お気軽にご連絡ください。",
  "footer.support": "サポート",
  "footer.made": "iOS のために ❤️ を込めて"
 },
 "zh-Hans": {
  "nav.support": "支持",
  "lang.label": "语言",
  "hero.title": "隐私政策",
  "hero.meta": "生效日期：2026 年 6 月 1 日 &nbsp;·&nbsp; 最后更新：2026 年 9 月 11 日",
  "trans.note": "本译文仅供参考，以英文版为准。",
  "sum.1": "设备端处理",
  "sum.2": "注重隐私",
  "sum.3": "不上传云端",
  "sum.4": "安全的本地存储",
  "s1.h": "概述",
  "s1.p1": "WatermarkIT 不会收集、存储、传输或共享任何个人数据或图片。所有处理均完全在您的设备上完成。",
  "s1.p2": "本隐私政策说明 WatermarkIT iOS 应用（下称“本应用”“我们”）如何处理您的信息。我们承诺保护您的隐私，并对我们的做法保持透明。",
  "s2.h": "数据的收集与使用",
  "s2.p1": "<strong>我们的绝对承诺：</strong>在任何情况下，我们都不会访问、上传、传输或存储您的照片。所有图像处理均完全在您的设备本地进行。",
  "s2.p2": "目前，本应用不收集个人身份信息（如姓名或电子邮件地址）。即使我们将来推出账户、订阅或基础的使用分析／崩溃报告等功能，您的照片仍将 100% 保持私密，我们绝不会访问、上传或存储它们。",
  "s3.h": "本应用的工作方式",
  "s3.p1": "WatermarkIT 是一款完全离线、在设备上运行的应用。使用时的具体流程如下：",
  "s3.li1": "您从照片图库、相机或“文件”App 中选择一张照片",
  "s3.li2": "本应用在您的设备本地读取该照片",
  "s3.li3": "所有水印处理——文字、徽标、手写签名、二维码与平铺——均完全在您的设备上完成",
  "s3.li4": "二维码使用 Apple 内置的 Core Image 框架在设备端生成，您输入的链接绝不会被传输",
  "s3.li5": "结果保存回您的本地相册，或通过 iOS 共享面板分享",
  "s3.li6": "您的照片及由其衍生的任何数据，在任何环节都不会被发送到外部服务器",
  "s4.h": "设备权限",
  "s4.p1": "本应用会请求以下 iOS 权限：",
  "s4.li1": "<strong>照片图库读取权限</strong>——以便您选择要添加水印的照片。我们只访问您明确选择的照片。",
  "s4.li2": "<strong>照片图库写入权限</strong>——以便将添加水印后的图片保存回您的相册。",
  "s4.li3": "<strong>相机权限</strong>——仅当您选择在应用内拍摄新照片时使用，让您无需先保存无水印的原图即可直接加水印。本应用绝不会自行开启相机，您拍摄的照片与其他照片一样：在设备端处理，绝不上传。",
  "s4.p2": "您也可以通过“文件”App 导入图片。这会使用 iOS 标准的文稿选择器，它只将您选中的那一个文件交给本应用，无需任何持续授权。",
  "s4.p3": "这些权限只会在您尝试使用相关功能时才请求，绝不会在启动时自动请求。您可以随时在 iOS“设置”→“隐私与安全性”中撤销。",
  "s5.h": "您添加到照片中的信息",
  "s5.p1": "WatermarkIT 可以使用标准的 IPTC 和 TIFF 字段，将署名信息——您的姓名与版权声明——写入所导出照片的元数据中。这正是署名能在裁剪后依然保留的原因。",
  "s5.p2": "有两点需要说明：",
  "s5.li1": "写入的内容是 <strong>您自己输入的文字</strong>。WatermarkIT 绝不会插入我们的名称、设备标识符、您的位置或任何隐藏的追踪数据。",
  "s5.li2": "该元数据写入导出的文件中，因此会 <strong>随文件一同传递到您发送的任何地方</strong>。这正是此功能的用意——但也意味着您分享照片的对象都能读到您填写的姓名。",
  "s5.p3": "署名是可选的。您可以在导出面板中为单次导出关闭它，或在设置中默认关闭。您的现有照片绝不会被修改——每次导出都会写为新文件。",
  "s6.h": "本地数据存储",
  "s6.p1": "本应用 <strong>仅在您的设备上</strong> 存储以下数据：",
  "s6.li1": "您创建的水印模板与预设（名称、字体、大小、颜色、不透明度、旋转、平铺与位置）",
  "s6.li2": "已保存模板的缩略图",
  "s6.li3": "最近作品——您导出过的照片的本地记录，方便重新打开或再次导出",
  "s6.li4": "应用偏好设置，例如默认导出质量、格式、你所选择的语言，以及是否包含署名",
  "s6.p2": "这些数据绝不会离开您的设备。它们存储在本应用的本地容器中，并在您卸载应用时自动删除。",
  "s7.h": "第三方服务",
  "s7.p1": "本应用不会与第三方广告网络共享您的数据。我们可能会使用经过验证的第三方 SDK 或服务商，用于应用分析、崩溃报告或订阅管理。此类服务的接入严格限于支持应用功能和改善使用体验。",
  "s8.h": "儿童隐私",
  "s8.p1": "WatermarkIT 面向普通用户设计。我们不会在知情的情况下收集 13 岁以下儿童的个人信息。若您认为我们无意中收集了此类信息，请联系我们，我们会尽快处理。",
  "s9.h": "数据安全",
  "s9.p1": "由于 WatermarkIT 不传输任何数据，因此不存在需要保护的传输中数据。所有本地存储的数据都受 iOS 内置设备加密保护，只要您为设备设置了密码，该加密即会启用。",
  "s10.h": "本政策的变更",
  "s10.p1": "我们可能会不时更新隐私政策。任何变更都会发布在本页面，并更新“最后更新”日期。建议您定期查看本政策。",
  "s11.h": "您的权利",
  "s11.p1": "根据您所在地区，您可能依据当地法规（如 GDPR 或 CCPA）享有与数据相关的权利。由于您的大部分数据（如模板和照片）都存储在本地，您可以在应用内修改或删除相关项目，或卸载应用，以直接进行管理。",
  "contact.h": "对隐私有疑问？",
  "contact.p": "如果您对本隐私政策有任何疑问或顾虑，欢迎联系我们，我们很乐意提供帮助。",
  "footer.support": "支持",
  "footer.made": "为 iOS 用 ❤️ 打造"
 },
 "zh-Hant": {
  "nav.support": "支援",
  "lang.label": "語言",
  "hero.title": "隱私權政策",
  "hero.meta": "生效日期：2026 年 6 月 1 日 &nbsp;·&nbsp; 最後更新：2026 年 9 月 11 日",
  "trans.note": "本譯文僅供參考，以英文版為準。",
  "sum.1": "裝置端處理",
  "sum.2": "重視隱私",
  "sum.3": "不上傳雲端",
  "sum.4": "安全的本機儲存",
  "s1.h": "總覽",
  "s1.p1": "WatermarkIT 不會收集、儲存、傳輸或分享任何個人資料或圖片。所有處理都完全在您的裝置上完成。",
  "s1.p2": "本隱私權政策說明 WatermarkIT iOS App（下稱「本 App」「我們」）如何處理您的資訊。我們承諾保護您的隱私，並對我們的做法保持透明。",
  "s2.h": "資料的收集與使用",
  "s2.p1": "<strong>我們的絕對承諾：</strong>在任何情況下，我們都不會存取、上傳、傳輸或儲存您的照片。所有影像處理都完全在您的裝置本機進行。",
  "s2.p2": "目前本 App 不會收集個人識別資訊（如姓名或電子郵件地址）。即使我們日後推出帳號、訂閱或基本的使用分析／當機報告等功能，您的照片仍會 100% 保持私密，我們絕不會存取、上傳或儲存。",
  "s3.h": "本 App 的運作方式",
  "s3.p1": "WatermarkIT 是一款完全離線、在裝置上執行的 App。使用時的實際流程如下：",
  "s3.li1": "您從照片圖庫、相機或「檔案」App 中選擇一張照片",
  "s3.li2": "本 App 在您的裝置本機讀取該照片",
  "s3.li3": "所有浮水印處理——文字、標誌、手寫簽名、QR 碼與並排重複——都完全在您的裝置上完成",
  "s3.li4": "QR 碼是使用 Apple 內建的 Core Image 框架在裝置端產生，您輸入的連結絕不會被傳輸",
  "s3.li5": "結果會儲存回您的本機相機膠卷，或透過 iOS 分享工作表分享",
  "s3.li6": "您的照片以及由其衍生的任何資料，在任何環節都不會被傳送到外部伺服器",
  "s4.h": "裝置權限",
  "s4.p1": "本 App 會要求下列 iOS 權限：",
  "s4.li1": "<strong>照片圖庫讀取權限</strong>——讓您能選擇要加上浮水印的照片。我們只會存取您明確選擇的照片。",
  "s4.li2": "<strong>照片圖庫寫入權限</strong>——將加上浮水印的影像儲存回您的相機膠卷。",
  "s4.li3": "<strong>相機權限</strong>——僅在您選擇於 App 內拍攝新照片時使用，讓您不必先儲存未加浮水印的原始檔即可直接加註。本 App 絕不會自行開啟相機，您拍攝的照片與其他照片一樣：在裝置端處理，絕不上傳。",
  "s4.p2": "您也可以透過「檔案」App 匯入影像。這會使用 iOS 標準的文件選擇器，只將您選取的那一個檔案交給本 App，不需要任何持續授權。",
  "s4.p3": "這些權限只會在您嘗試使用相關功能時才要求，絕不會在啟動時自動要求。您可以隨時在 iOS「設定」→「隱私權與安全性」中撤銷。",
  "s5.h": "您加入照片中的資訊",
  "s5.p1": "WatermarkIT 可以使用標準的 IPTC 與 TIFF 欄位，將署名資訊——您的姓名與版權聲明——寫入您匯出照片的中繼資料。這正是署名能在裁切後依然保留的原因。",
  "s5.p2": "有兩點需要說明：",
  "s5.li1": "寫入的內容是 <strong>您自己輸入的文字</strong>。WatermarkIT 絕不會插入我們的名稱、裝置識別碼、您的位置或任何隱藏的追蹤資料。",
  "s5.li2": "這些中繼資料會寫入匯出的檔案，因此會 <strong>隨檔案一同傳到您傳送的任何地方</strong>。這正是此功能的用意——但也表示您分享照片的對象都能讀到您填寫的姓名。",
  "s5.p3": "署名是選用的。您可以在匯出工作表中為單次匯出關閉它，或在設定中預設關閉。您現有的照片絕不會被更動——每次匯出都會寫成新的檔案。",
  "s6.h": "本機資料儲存",
  "s6.p1": "本 App <strong>僅在您的裝置上</strong> 儲存下列資料：",
  "s6.li1": "您建立的浮水印範本與預設集（名稱、字型、大小、顏色、不透明度、旋轉、並排重複與位置）",
  "s6.li2": "已儲存範本的縮圖",
  "s6.li3": "最近作品——您匯出過的照片的本機記錄，方便重新開啟或再次匯出",
  "s6.li4": "App 偏好設定，例如預設匯出品質、格式、你所選擇的語言，以及是否包含署名",
  "s6.p2": "這些資料絕不會離開您的裝置。它們儲存在本 App 的本機容器中，並在您移除 App 時自動刪除。",
  "s7.h": "第三方服務",
  "s7.p1": "本 App 不會與第三方廣告聯播網分享您的資料。我們可能會使用經過驗證的第三方 SDK 或服務供應商，用於 App 分析、當機報告或訂閱管理。此類服務的整合嚴格限於支援 App 功能與改善使用體驗。",
  "s8.h": "兒童隱私",
  "s8.p1": "WatermarkIT 是為一般使用者設計的。我們不會在知情的情況下收集 13 歲以下兒童的個人資訊。若您認為我們無意中收集了此類資訊，請與我們聯絡，我們會盡快處理。",
  "s9.h": "資料安全",
  "s9.p1": "由於 WatermarkIT 不傳輸任何資料，因此不存在需要保護的傳輸中資料。所有本機儲存的資料都受 iOS 內建的裝置加密保護，只要您為裝置設定了密碼，該加密便會啟用。",
  "s10.h": "本政策的變更",
  "s10.p1": "我們可能會不時更新隱私權政策。任何變更都會公布在本頁面，並更新「最後更新」日期。建議您定期查看本政策。",
  "s11.h": "您的權利",
  "s11.p1": "依您所在地區，您可能依據當地法規（如 GDPR 或 CCPA）享有與資料相關的權利。由於您的大部分資料（如範本與照片）都儲存在本機，您可以在 App 內修改或刪除項目，或移除 App，以直接管理。",
  "contact.h": "對隱私有疑問嗎？",
  "contact.p": "如果您對本隱私權政策有任何疑問或疑慮，歡迎與我們聯絡，我們很樂意提供協助。",
  "footer.support": "支援",
  "footer.made": "為 iOS 用 ❤️ 打造"
 },
 "fr": {
  "nav.support": "Assistance",
  "lang.label": "Langue",
  "hero.title": "Politique de confidentialité",
  "hero.meta": "Date d’entrée en vigueur : 1er juin 2026 &nbsp;·&nbsp; Dernière mise à jour : 11 septembre 2026",
  "trans.note": "Cette traduction est fournie à titre indicatif ; la version anglaise fait foi.",
  "sum.1": "Traitement sur l’appareil",
  "sum.2": "Axé sur la confidentialité",
  "sum.3": "Aucun envoi vers le cloud",
  "sum.4": "Stockage local sécurisé",
  "s1.h": "Aperçu",
  "s1.p1": "WatermarkIT ne collecte, ne stocke, ne transmet ni ne partage aucune donnée personnelle ni aucune image. Tout le traitement se déroule entièrement sur votre appareil.",
  "s1.p2": "Cette politique de confidentialité explique comment l’application iOS WatermarkIT (« l’Application », « nous ») traite vos informations. Nous nous engageons à protéger votre vie privée et à être transparents sur nos pratiques.",
  "s2.h": "Collecte et utilisation des données",
  "s2.p1": "<strong>Notre engagement absolu :</strong> nous n’accédons jamais à vos photos, ne les téléchargeons, ne les transmettons ni ne les stockons, en aucune circonstance. Tout le traitement d’image s’effectue entièrement en local sur votre appareil.",
  "s2.p2": "À l’heure actuelle, l’Application ne collecte aucune information d’identification personnelle (comme votre nom ou votre adresse e-mail). Si nous introduisons à l’avenir des fonctionnalités telles que des comptes utilisateurs, des abonnements ou des analyses d’utilisation/rapports de diagnostic de base, vos photos resteront entièrement privées à 100 % et ne seront jamais consultées, téléchargées ou stockées par nous.",
  "s3.h": "Comment fonctionne l’Application",
  "s3.p1": "WatermarkIT est une application entièrement hors ligne, fonctionnant sur l’appareil. Voici exactement ce qui se passe lorsque vous l’utilisez :",
  "s3.li1": "Vous choisissez une photo — depuis votre photothèque, votre appareil photo, ou l’app Fichiers",
  "s3.li2": "L’Application lit cette photo localement sur votre appareil",
  "s3.li3": "Tout le traitement du filigrane — texte, logos, signatures manuscrites, codes QR et mosaïque — s’effectue entièrement sur votre appareil",
  "s3.li4": "Les codes QR sont générés sur l’appareil grâce au framework Core Image intégré d’Apple ; le lien que vous saisissez n’est jamais transmis",
  "s3.li5": "Le résultat est enregistré dans votre pellicule locale ou partagé via la feuille de partage iOS",
  "s3.li6": "À aucun moment votre photo, ou toute donnée qui en est dérivée, n’est envoyée à un serveur externe",
  "s4.h": "Autorisations de l’appareil",
  "s4.p1": "L’Application demande les autorisations iOS suivantes :",
  "s4.li1": "<strong>Accès en lecture à la photothèque</strong> — pour vous permettre de sélectionner les photos que vous souhaitez filigraner. Nous n’accédons qu’aux photos que vous choisissez explicitement.",
  "s4.li2": "<strong>Accès en écriture à la photothèque</strong> — pour enregistrer vos images filigranées dans votre pellicule.",
  "s4.li3": "<strong>Accès à l’appareil photo</strong> — uniquement si vous choisissez de prendre une nouvelle photo dans l’Application, afin de pouvoir filigraner une prise de vue sans d’abord enregistrer une copie non marquée. L’Application n’ouvre jamais l’appareil photo d’elle-même, et les photos que vous prenez sont traitées exactement comme n’importe quelle autre : traitées sur l’appareil, jamais téléchargées.",
  "s4.p2": "Vous pouvez aussi importer une image via l’app Fichiers. Cela utilise le sélecteur de documents standard d’iOS, qui ne transmet à l’Application que le seul fichier choisi et ne nécessite aucune autorisation permanente.",
  "s4.p3": "Ces autorisations ne sont demandées qu’au moment où vous essayez d’utiliser la fonctionnalité concernée — jamais automatiquement au lancement. Vous pouvez les révoquer à tout moment dans Réglages iOS → Confidentialité et sécurité.",
  "s5.h": "Informations que vous ajoutez à vos photos",
  "s5.p1": "WatermarkIT peut inscrire une mention — votre nom et vos droits d’auteur — dans les métadonnées des photos que vous exportez, en utilisant les champs IPTC et TIFF standard (Créateur, Mention de droits d’auteur, Artiste). C’est ce qui permet à votre mention de survivre au recadrage.",
  "s5.p2": "Deux points méritent d’être précisés :",
  "s5.li1": "Le texte inscrit est <strong>le texte que vous saisissez</strong>. WatermarkIT n’insère jamais notre propre nom, un identifiant d’appareil, votre position, ou toute donnée de suivi cachée qui lui serait propre.",
  "s5.li2": "Ces métadonnées sont inscrites dans le fichier exporté, et <strong>voyagent donc avec ce fichier partout où vous l’envoyez</strong>. C’est précisément l’objectif de cette fonctionnalité — mais cela signifie aussi que quiconque avec qui vous partagez la photo peut lire le nom que vous y avez inscrit.",
  "s5.p3": "La mention est facultative. Vous pouvez la désactiver pour un export individuel depuis la feuille d’export, ou la désactiver par défaut dans Réglages. Vos photos existantes ne sont jamais modifiées — chaque export est écrit comme un nouveau fichier.",
  "s6.h": "Stockage local des données",
  "s6.p1": "L’Application stocke les données suivantes <strong>uniquement sur votre appareil</strong> :",
  "s6.li1": "Les modèles et préréglages de filigrane que vous créez (nom, police, taille, couleur, opacité, rotation, mosaïque et position)",
  "s6.li2": "Les images d’aperçu miniature de vos modèles enregistrés",
  "s6.li3": "Votre travail récent — un historique local des photos que vous avez exportées, pour pouvoir les rouvrir ou les réexporter",
  "s6.li4": "Vos préférences d’application, comme la qualité et le format d’export par défaut, la langue choisie, et l’inclusion ou non de votre mention",
  "s6.p2": "Ces données ne quittent jamais votre appareil. Elles sont stockées dans le conteneur local de l’Application et supprimées automatiquement si vous désinstallez l’Application.",
  "s7.h": "Services tiers",
  "s7.p1": "L’Application ne partage pas vos données avec des réseaux publicitaires tiers. Nous pouvons utiliser des SDK ou fournisseurs de services tiers vérifiés pour l’analyse d’utilisation de l’app, les rapports de plantage, ou la gestion des abonnements. De tels services, le cas échéant, sont intégrés strictement pour soutenir le fonctionnement de l’app et améliorer l’expérience utilisateur.",
  "s8.h": "Confidentialité des enfants",
  "s8.p1": "WatermarkIT est conçu pour un public général. Nous ne collectons pas sciemment d’informations personnelles auprès d’enfants de moins de 13 ans. Si vous pensez que nous avons collecté par inadvertance de telles informations, contactez-nous afin que nous puissions y remédier rapidement.",
  "s9.h": "Sécurité des données",
  "s9.p1": "WatermarkIT ne transmettant aucune donnée, il n’y a aucune donnée en transit à sécuriser. Toutes les données stockées localement (vos modèles) sont soumises au chiffrement intégré d’iOS, activé dès que vous utilisez un code d’accès sur votre appareil.",
  "s10.h": "Modifications de cette politique",
  "s10.p1": "Nous pouvons mettre à jour notre politique de confidentialité de temps à autre. Tout changement sera publié sur cette page avec une date de « Dernière mise à jour » actualisée. Nous vous encourageons à consulter cette politique périodiquement pour tout changement.",
  "s11.h": "Vos droits",
  "s11.p1": "Selon votre lieu de résidence, vous pouvez disposer de droits concernant vos données en vertu des réglementations locales (comme le RGPD ou le CCPA). La majorité de vos données (comme les modèles et les photos) étant stockée localement, vous pouvez les gérer directement en modifiant ou supprimant des éléments dans l’Application, ou en désinstallant l’Application.",
  "contact.h": "Des questions sur votre vie privée ?",
  "contact.p": "Si vous avez des questions ou des préoccupations concernant cette politique de confidentialité, contactez-nous — nous serons heureux de vous aider.",
  "footer.support": "Assistance",
  "footer.made": "Conçu avec ❤️ pour iOS"
 },
 "de": {
  "nav.support": "Support",
  "lang.label": "Sprache",
  "hero.title": "Datenschutzerklärung",
  "hero.meta": "Gültig ab: 1. Juni 2026 &nbsp;·&nbsp; Zuletzt aktualisiert: 11. September 2026",
  "trans.note": "Diese Übersetzung dient nur der Verständlichkeit; maßgeblich ist die englische Fassung.",
  "sum.1": "Verarbeitung auf dem Gerät",
  "sum.2": "Datenschutzorientiert",
  "sum.3": "Keine Cloud-Uploads",
  "sum.4": "Sichere lokale Speicherung",
  "s1.h": "Überblick",
  "s1.p1": "WatermarkIT sammelt, speichert, überträgt oder teilt keine personenbezogenen Daten oder Bilder. Die gesamte Verarbeitung erfolgt vollständig auf Ihrem Gerät.",
  "s1.p2": "Diese Datenschutzerklärung erläutert, wie die iOS-App WatermarkIT („die App“, „wir“) mit Ihren Informationen umgeht. Wir setzen uns dafür ein, Ihre Privatsphäre zu schützen und unsere Praktiken transparent darzustellen.",
  "s2.h": "Datenerhebung und -nutzung",
  "s2.p1": "<strong>Unsere uneingeschränkte Zusage:</strong> Wir greifen unter keinen Umständen auf Ihre Fotos zu, laden sie hoch, übertragen oder speichern sie. Die gesamte Bildverarbeitung erfolgt vollständig lokal auf Ihrem Gerät.",
  "s2.p2": "Derzeit erhebt die App keine personenbezogenen Identifikationsdaten (wie Ihren Namen oder Ihre E-Mail-Adresse). Sollten wir künftig Funktionen wie Benutzerkonten, Abonnements oder grundlegende Nutzungsanalysen/Diagnoseberichte einführen, bleiben Ihre Fotos weiterhin zu 100 % privat und werden von uns niemals aufgerufen, hochgeladen oder gespeichert.",
  "s3.h": "So funktioniert die App",
  "s3.p1": "WatermarkIT ist eine vollständig offline arbeitende App, die auf dem Gerät läuft. Hier ist genau, was passiert, wenn Sie sie verwenden:",
  "s3.li1": "Sie wählen ein Foto aus — aus Ihrer Fotomediathek, mit der Kamera, oder aus der Dateien-App",
  "s3.li2": "Die App liest dieses Foto lokal auf Ihrem Gerät",
  "s3.li3": "Die gesamte Wasserzeichen-Verarbeitung — Text, Logos, handgeschriebene Unterschriften, QR-Codes und Kacheln — erfolgt vollständig auf Ihrem Gerät",
  "s3.li4": "QR-Codes werden auf dem Gerät mit Apples integriertem Core-Image-Framework erzeugt; der von Ihnen eingegebene Link wird niemals übertragen",
  "s3.li5": "Das Ergebnis wird in Ihrem lokalen Fotoalbum gespeichert oder über das iOS-Freigabemenü geteilt",
  "s3.li6": "Zu keinem Zeitpunkt wird Ihr Foto oder daraus abgeleitete Daten an einen externen Server gesendet",
  "s4.h": "Geräteberechtigungen",
  "s4.p1": "Die App fordert die folgenden iOS-Berechtigungen an:",
  "s4.li1": "<strong>Lesezugriff auf die Fotomediathek</strong> — damit Sie Fotos auswählen können, die Sie mit einem Wasserzeichen versehen möchten. Wir greifen nur auf Fotos zu, die Sie ausdrücklich auswählen.",
  "s4.li2": "<strong>Schreibzugriff auf die Fotomediathek</strong> — um Ihre mit Wasserzeichen versehenen Bilder in Ihrem Fotoalbum zu speichern.",
  "s4.li3": "<strong>Kamerazugriff</strong> — nur wenn Sie sich entscheiden, ein neues Foto innerhalb der App aufzunehmen, damit Sie eine Aufnahme mit Wasserzeichen versehen können, ohne zuerst eine unmarkierte Kopie zu speichern. Die App öffnet die Kamera niemals von selbst, und von Ihnen aufgenommene Fotos werden genau wie jedes andere behandelt: auf dem Gerät verarbeitet, niemals hochgeladen.",
  "s4.p2": "Sie können ein Bild auch über die Dateien-App importieren. Dabei wird der standardmäßige iOS-Dokumentenpicker verwendet, der der App nur die eine ausgewählte Datei übergibt und keine dauerhafte Berechtigung erfordert.",
  "s4.p3": "Diese Berechtigungen werden nur in dem Moment angefordert, in dem Sie versuchen, die entsprechende Funktion zu nutzen — niemals automatisch beim Start. Sie können sie jederzeit in den iOS-Einstellungen → Datenschutz & Sicherheit widerrufen.",
  "s5.h": "Informationen, die Sie Ihren Fotos hinzufügen",
  "s5.p1": "WatermarkIT kann einen Namensvermerk — Ihren Namen und Ihr Copyright — in die Metadaten der von Ihnen exportierten Fotos schreiben, unter Verwendung der standardmäßigen IPTC- und TIFF-Felder (Urheber, Copyright-Vermerk, Künstler). Dadurch übersteht Ihr Vermerk das Zuschneiden.",
  "s5.p2": "Zwei Dinge sollten klar sein:",
  "s5.li1": "Der geschriebene Text ist <strong>der von Ihnen eingegebene Text</strong>. WatermarkIT fügt niemals unseren eigenen Namen, eine Gerätekennung, Ihren Standort oder eigene verborgene Tracking-Daten ein.",
  "s5.li2": "Diese Metadaten werden in die exportierte Datei geschrieben und <strong>reisen daher mit dieser Datei überall dorthin, wohin Sie sie senden</strong>. Das ist genau der Sinn dieser Funktion — bedeutet aber auch, dass jeder, mit dem Sie das Foto teilen, den dort hinterlegten Namen lesen kann.",
  "s5.p3": "Der Vermerk ist optional. Sie können ihn für einen einzelnen Export im Export-Bildschirm deaktivieren oder standardmäßig in den Einstellungen ausschalten. Ihre vorhandenen Fotos werden niemals verändert — jeder Export wird als neue Datei geschrieben.",
  "s6.h": "Lokale Datenspeicherung",
  "s6.p1": "Die App speichert die folgenden Daten <strong>ausschließlich auf Ihrem Gerät</strong>:",
  "s6.li1": "Von Ihnen erstellte Wasserzeichen-Vorlagen und -Voreinstellungen (Name, Schriftart, Größe, Farbe, Deckkraft, Drehung, Kachelung und Position)",
  "s6.li2": "Miniaturvorschaubilder Ihrer gespeicherten Vorlagen",
  "s6.li3": "Ihre „Letzte Arbeiten“ — ein lokaler Verlauf der von Ihnen exportierten Fotos, damit Sie sie erneut öffnen oder exportieren können",
  "s6.li4": "Ihre App-Einstellungen, wie Standard-Exportqualität, -format, Ihre gewählte Sprache, und ob Ihr Namensvermerk enthalten sein soll",
  "s6.p2": "Diese Daten verlassen niemals Ihr Gerät. Sie werden im lokalen Container der App gespeichert und automatisch gelöscht, wenn Sie die App deinstallieren.",
  "s7.h": "Dienste von Drittanbietern",
  "s7.p1": "Die App teilt Ihre Daten nicht mit Werbenetzwerken Dritter. Wir können geprüfte SDKs oder Dienstanbieter Dritter für App-Analysen, Absturzberichte oder Abonnementverwaltung nutzen. Solche Dienste werden ausschließlich integriert, um die Funktionalität der App zu unterstützen und die Nutzererfahrung zu verbessern.",
  "s8.h": "Datenschutz für Kinder",
  "s8.p1": "WatermarkIT ist für ein allgemeines Publikum konzipiert. Wir sammeln wissentlich keine personenbezogenen Daten von Kindern unter 13 Jahren. Sollten Sie glauben, dass wir versehentlich solche Informationen erfasst haben, kontaktieren Sie uns bitte, damit wir dies umgehend beheben können.",
  "s9.h": "Datensicherheit",
  "s9.p1": "Da WatermarkIT keine Daten überträgt, gibt es keine Daten während der Übertragung zu schützen. Alle lokal gespeicherten Daten (Ihre Vorlagen) unterliegen der in iOS integrierten Geräteverschlüsselung, die aktiviert ist, sobald Sie einen Gerätecode verwenden.",
  "s10.h": "Änderungen dieser Richtlinie",
  "s10.p1": "Wir können unsere Datenschutzerklärung von Zeit zu Zeit aktualisieren. Änderungen werden auf dieser Seite mit einem aktualisierten Datum „Zuletzt aktualisiert“ veröffentlicht. Wir empfehlen Ihnen, diese Richtlinie regelmäßig auf Änderungen zu überprüfen.",
  "s11.h": "Ihre Rechte",
  "s11.p1": "Je nach Ihrem Standort haben Sie möglicherweise Rechte in Bezug auf Ihre Daten gemäß lokalen Vorschriften (wie DSGVO oder CCPA). Da der Großteil Ihrer Daten (wie Vorlagen und Fotos) lokal gespeichert wird, können Sie sie direkt verwalten, indem Sie Elemente innerhalb der App ändern oder löschen, oder indem Sie die App deinstallieren.",
  "contact.h": "Fragen zu Ihrer Privatsphäre?",
  "contact.p": "Falls Sie Fragen oder Bedenken zu dieser Datenschutzerklärung haben, melden Sie sich bei uns — wir helfen Ihnen gerne weiter.",
  "footer.support": "Support",
  "footer.made": "Mit ❤️ für iOS gemacht"
 },
 "ru": {
  "nav.support": "Поддержка",
  "lang.label": "Язык",
  "hero.title": "Политика конфиденциальности",
  "hero.meta": "Дата вступления в силу: 1 июня 2026 г. &nbsp;·&nbsp; Последнее обновление: 11 сентября 2026 г.",
  "trans.note": "Этот перевод предоставлен для удобства; основной текст — на английском языке.",
  "sum.1": "Обработка на устройстве",
  "sum.2": "Ориентация на приватность",
  "sum.3": "Без загрузки в облако",
  "sum.4": "Безопасное локальное хранение",
  "s1.h": "Обзор",
  "s1.p1": "WatermarkIT не собирает, не хранит, не передаёт и не делится никакими личными данными или изображениями. Вся обработка происходит полностью на вашем устройстве.",
  "s1.p2": "Настоящая политика конфиденциальности объясняет, как приложение WatermarkIT для iOS («Приложение», «мы») обрабатывает вашу информацию. Мы стремимся защищать вашу конфиденциальность и быть прозрачными в отношении наших практик.",
  "s2.h": "Сбор и использование данных",
  "s2.p1": "<strong>Наше безоговорочное обязательство:</strong> мы никогда ни при каких обстоятельствах не получаем доступ к вашим фото, не загружаем, не передаём и не храним их. Вся обработка изображений выполняется полностью локально на вашем устройстве.",
  "s2.p2": "На данный момент Приложение не собирает личную идентифицирующую информацию (например, ваше имя или адрес электронной почты). Если в будущем мы введём такие функции, как учётные записи пользователей, подписки или базовую аналитику использования/отчёты о диагностике, ваши фото по-прежнему останутся на 100% приватными и никогда не будут доступны нам, загружены или сохранены нами.",
  "s3.h": "Как работает Приложение",
  "s3.p1": "WatermarkIT — это полностью офлайн-приложение, работающее на устройстве. Вот что именно происходит при его использовании:",
  "s3.li1": "Вы выбираете фото — из библиотеки фото, с камеры или из приложения «Файлы»",
  "s3.li2": "Приложение считывает это фото локально на вашем устройстве",
  "s3.li3": "Вся обработка водяного знака — текст, логотипы, рукописные подписи, QR-коды и замощение — выполняется полностью на вашем устройстве",
  "s3.li4": "QR-коды создаются на устройстве с помощью встроенного фреймворка Apple Core Image; введённая вами ссылка никогда не передаётся",
  "s3.li5": "Результат сохраняется в вашу локальную «Фотоплёнку» или передаётся через меню общего доступа iOS",
  "s3.li6": "Ваше фото или любые данные, полученные из него, никогда и ни при каких условиях не отправляются на внешний сервер",
  "s4.h": "Разрешения устройства",
  "s4.p1": "Приложение запрашивает следующие разрешения iOS:",
  "s4.li1": "<strong>Доступ на чтение к библиотеке фото</strong> — чтобы вы могли выбирать фото, которые хотите отметить водяным знаком. Мы получаем доступ только к тем фото, которые вы явно выбираете.",
  "s4.li2": "<strong>Доступ на запись в библиотеку фото</strong> — чтобы сохранить изображения с водяным знаком обратно в вашу «Фотоплёнку».",
  "s4.li3": "<strong>Доступ к камере</strong> — только если вы решите сделать новое фото внутри Приложения, чтобы вы могли отметить снимок водяным знаком, не сохраняя сначала немаркированную копию. Приложение никогда не открывает камеру самостоятельно, а сделанные вами фото обрабатываются точно так же, как и любые другие: обрабатываются на устройстве, никогда не загружаются.",
  "s4.p2": "Вы также можете импортировать изображение через приложение «Файлы». При этом используется стандартный выбор документов iOS, который передаёт Приложению только один выбранный файл и не требует постоянного разрешения.",
  "s4.p3": "Эти разрешения запрашиваются только в момент, когда вы пытаетесь использовать соответствующую функцию, — никогда автоматически при запуске. Вы можете отозвать их в любое время в настройках iOS → Конфиденциальность и безопасность.",
  "s5.h": "Информация, которую вы добавляете к своим фото",
  "s5.p1": "WatermarkIT может записать указание авторства — ваше имя и знак авторского права — в метаданные экспортируемых вами фото, используя стандартные поля IPTC и TIFF (автор, уведомление об авторских правах, художник). Именно это позволяет вашей метке авторства пережить обрезку.",
  "s5.p2": "Стоит прояснить два момента:",
  "s5.li1": "Записываемый текст — это <strong>текст, который вводите вы сами</strong>. WatermarkIT никогда не вставляет собственное название, идентификатор устройства, ваше местоположение или какие-либо скрытые данные отслеживания.",
  "s5.li2": "Эти метаданные записываются в экспортированный файл, поэтому они <strong>путешествуют вместе с этим файлом всюду, куда бы вы его ни отправили</strong>. В этом и заключается смысл этой функции — но это также означает, что любой, с кем вы поделитесь фото, сможет прочитать указанное вами имя.",
  "s5.p3": "Указание авторства необязательно. Вы можете отключить его для отдельного экспорта на экране экспорта или отключить по умолчанию в настройках. Ваши существующие фото никогда не изменяются — каждый экспорт записывается как новый файл.",
  "s6.h": "Локальное хранение данных",
  "s6.p1": "Приложение хранит следующие данные <strong>только на вашем устройстве</strong>:",
  "s6.li1": "Созданные вами шаблоны и пресеты водяных знаков (название, шрифт, размер, цвет, прозрачность, поворот, замощение и положение)",
  "s6.li2": "Миниатюры предпросмотра для ваших сохранённых шаблонов",
  "s6.li3": "«Недавние работы» — локальную историю экспортированных вами фото, чтобы вы могли снова открыть или переэкспортировать их",
  "s6.li4": "Ваши настройки приложения, такие как качество и формат экспорта по умолчанию, выбранный вами язык, и следует ли включать указание авторства",
  "s6.p2": "Эти данные никогда не покидают ваше устройство. Они хранятся в локальном контейнере Приложения и автоматически удаляются при удалении Приложения.",
  "s7.h": "Сторонние сервисы",
  "s7.p1": "Приложение не передаёт ваши данные сторонним рекламным сетям. Мы можем использовать проверенные сторонние SDK или поставщиков услуг для аналитики приложения, отчётов о сбоях или управления подписками. Такие сервисы, если они используются, интегрируются исключительно для поддержки функциональности приложения и улучшения пользовательского опыта.",
  "s8.h": "Конфиденциальность детей",
  "s8.p1": "WatermarkIT рассчитан на широкую аудиторию. Мы сознательно не собираем личную информацию от детей младше 13 лет. Если вы считаете, что мы непреднамеренно собрали такую информацию, свяжитесь с нами, чтобы мы могли оперативно это исправить.",
  "s9.h": "Безопасность данных",
  "s9.p1": "Поскольку WatermarkIT не передаёт никаких данных, защищать данные при передаче не требуется. Все данные, хранящиеся локально (ваши шаблоны), защищены встроенным шифрованием устройства iOS, которое активируется при использовании кода доступа к устройству.",
  "s10.h": "Изменения в этой политике",
  "s10.p1": "Мы можем время от времени обновлять нашу политику конфиденциальности. Любые изменения будут опубликованы на этой странице с обновлённой датой «Последнее обновление». Мы рекомендуем периодически просматривать эту политику на предмет изменений.",
  "s11.h": "Ваши права",
  "s11.p1": "В зависимости от вашего местонахождения у вас могут быть права в отношении ваших данных согласно местным нормам (таким как GDPR или CCPA). Поскольку большая часть ваших данных (например, шаблоны и фото) хранится локально, вы можете управлять ими напрямую, изменяя или удаляя элементы внутри Приложения, либо удалив Приложение.",
  "contact.h": "Вопросы о вашей конфиденциальности?",
  "contact.p": "Если у вас есть вопросы или опасения по поводу этой политики конфиденциальности, свяжитесь с нами — мы будем рады помочь.",
  "footer.support": "Поддержка",
  "footer.made": "Сделано с ❤️ для iOS"
 },
 "nl": {
  "nav.support": "Ondersteuning",
  "lang.label": "Taal",
  "hero.title": "Privacybeleid",
  "hero.meta": "Ingangsdatum: 1 juni 2026 &nbsp;·&nbsp; Laatst bijgewerkt: 11 september 2026",
  "trans.note": "Deze vertaling is bedoeld ter ondersteuning; de Engelse versie is leidend.",
  "sum.1": "Verwerking op het apparaat",
  "sum.2": "Gericht op privacy",
  "sum.3": "Geen cloud-uploads",
  "sum.4": "Veilige lokale opslag",
  "s1.h": "Overzicht",
  "s1.p1": "WatermarkIT verzamelt, bewaart, verzendt of deelt geen persoonlijke gegevens of afbeeldingen. Alle verwerking gebeurt volledig op je apparaat.",
  "s1.p2": "Dit privacybeleid legt uit hoe de iOS-app WatermarkIT (“de App”, “wij”) met je informatie omgaat. Wij zetten ons in om je privacy te beschermen en transparant te zijn over onze werkwijze.",
  "s2.h": "Gegevensverzameling en -gebruik",
  "s2.p1": "<strong>Onze absolute toezegging:</strong> we krijgen nooit toegang tot je foto’s, uploaden, verzenden of bewaren ze onder geen enkele omstandigheid. Alle beeldverwerking gebeurt volledig lokaal op je apparaat.",
  "s2.p2": "Op dit moment verzamelt de App geen persoonlijke identificatiegegevens (zoals je naam of e-mailadres). Als we in de toekomst functies zoals gebruikersaccounts, abonnementen of basale gebruiksanalyses/diagnostische rapportages introduceren, blijven je foto’s nog steeds 100% privé en zullen ze nooit door ons worden benaderd, geüpload of bewaard.",
  "s3.h": "Hoe de App werkt",
  "s3.p1": "WatermarkIT is een volledig offline app die op het apparaat draait. Dit gebeurt er precies wanneer je de app gebruikt:",
  "s3.li1": "Je kiest een foto — uit je fotobibliotheek, met de camera, of via de app Bestanden",
  "s3.li2": "De App leest die foto lokaal op je apparaat",
  "s3.li3": "Alle watermerkverwerking — tekst, logo’s, handgeschreven handtekeningen, QR-codes en tegels — gebeurt volledig op je apparaat",
  "s3.li4": "QR-codes worden op het apparaat gegenereerd met Apples ingebouwde Core Image-framework; de link die je invoert wordt nooit verzonden",
  "s3.li5": "Het resultaat wordt opgeslagen in je lokale Camerarol of gedeeld via het iOS-deelvenster",
  "s3.li6": "Op geen enkel moment wordt je foto, of daarvan afgeleide gegevens, naar een externe server gestuurd",
  "s4.h": "Apparaatmachtigingen",
  "s4.p1": "De App vraagt de volgende iOS-machtigingen aan:",
  "s4.li1": "<strong>Leestoegang tot de fotobibliotheek</strong> — zodat je foto’s kunt selecteren die je van een watermerk wilt voorzien. We krijgen alleen toegang tot foto’s die je expliciet kiest.",
  "s4.li2": "<strong>Schrijftoegang tot de fotobibliotheek</strong> — om je van watermerk voorziene afbeeldingen terug op te slaan in je Camerarol.",
  "s4.li3": "<strong>Cameratoegang</strong> — alleen als je ervoor kiest om een nieuwe foto binnen de App te maken, zodat je een opname van een watermerk kunt voorzien zonder eerst een ongemarkeerde kopie op te slaan. De App opent de camera nooit uit zichzelf, en foto’s die je maakt worden precies als elke andere behandeld: verwerkt op het apparaat, nooit geüpload.",
  "s4.p2": "Je kunt ook een afbeelding importeren via de app Bestanden. Dat gebruikt de standaard iOS-documentkiezer, die alleen het ene door jou gekozen bestand aan de App geeft en geen doorlopende machtiging vereist.",
  "s4.p3": "Deze machtigingen worden alleen aangevraagd op het moment dat je de betreffende functie probeert te gebruiken — nooit automatisch bij het opstarten. Je kunt ze op elk moment intrekken via iOS-instellingen → Privacy en beveiliging.",
  "s5.h": "Informatie die je aan je foto’s toevoegt",
  "s5.p1": "WatermarkIT kan een naamsvermelding — je naam en copyright — wegschrijven naar de metadata van de foto’s die je exporteert, met behulp van de standaard IPTC- en TIFF-velden (maker, copyrightvermelding, artiest). Hierdoor overleeft je vermelding het bijsnijden.",
  "s5.p2": "Twee dingen zijn de moeite waard om duidelijk te maken:",
  "s5.li1": "De geschreven tekst is <strong>de tekst die je zelf invoert</strong>. WatermarkIT voegt nooit onze eigen naam, een apparaat-ID, je locatie, of enige verborgen trackinggegevens van zichzelf toe.",
  "s5.li2": "Deze metadata wordt in het geëxporteerde bestand geschreven en <strong>reist dus mee met dat bestand, waar je het ook naartoe stuurt</strong>. Dat is precies het doel van deze functie — maar het betekent ook dat iedereen met wie je de foto deelt, de naam die je daar hebt geplaatst kan lezen.",
  "s5.p3": "De vermelding is optioneel. Je kunt hem uitschakelen voor een individuele export op het exportscherm, of standaard uitschakelen in Instellingen. Je bestaande foto’s worden nooit gewijzigd — elke export wordt als een nieuw bestand geschreven.",
  "s6.h": "Lokale gegevensopslag",
  "s6.p1": "De App bewaart de volgende gegevens <strong>alleen op je apparaat</strong>:",
  "s6.li1": "Watermerksjablonen en voorinstellingen die je maakt (naam, lettertype, grootte, kleur, dekking, rotatie, tegels en positie)",
  "s6.li2": "Miniatuurvoorbeelden van je opgeslagen sjablonen",
  "s6.li3": "Je Recente Werk — een lokale geschiedenis van foto’s die je hebt geëxporteerd, zodat je ze opnieuw kunt openen of exporteren",
  "s6.li4": "Je app-voorkeuren, zoals standaard exportkwaliteit, formaat, je gekozen taal, en of je naamsvermelding moet worden opgenomen",
  "s6.p2": "Deze gegevens verlaten nooit je apparaat. Ze worden opgeslagen in de lokale container van de App en automatisch verwijderd als je de App verwijdert.",
  "s7.h": "Diensten van derden",
  "s7.p1": "De App deelt je gegevens niet met externe advertentienetwerken. We kunnen geverifieerde externe SDK’s of dienstverleners gebruiken voor app-analyse, crashrapportage of abonnementsbeheer. Dergelijke diensten worden, indien van toepassing, strikt geïntegreerd om de functionaliteit van de app te ondersteunen en de gebruikerservaring te verbeteren.",
  "s8.h": "Privacy van kinderen",
  "s8.p1": "WatermarkIT is bedoeld voor een algemeen publiek. We verzamelen niet bewust persoonlijke informatie van kinderen jonger dan 13 jaar. Als je denkt dat we per ongeluk dergelijke informatie hebben verzameld, neem dan contact met ons op, zodat we dit snel kunnen verhelpen.",
  "s9.h": "Gegevensbeveiliging",
  "s9.p1": "Omdat WatermarkIT geen gegevens verzendt, is er geen data-in-transit om te beveiligen. Alle lokaal opgeslagen gegevens (je sjablonen) vallen onder de ingebouwde apparaatversleuteling van iOS, die actief is zodra je een toegangscode op je apparaat gebruikt.",
  "s10.h": "Wijzigingen in dit beleid",
  "s10.p1": "We kunnen ons privacybeleid van tijd tot tijd bijwerken. Eventuele wijzigingen worden op deze pagina geplaatst met een bijgewerkte datum “Laatst bijgewerkt”. We raden je aan dit beleid periodiek te controleren op wijzigingen.",
  "s11.h": "Jouw rechten",
  "s11.p1": "Afhankelijk van je locatie kun je rechten hebben met betrekking tot je gegevens onder lokale regelgeving (zoals AVG of CCPA). Omdat het merendeel van je gegevens (zoals sjablonen en foto’s) lokaal wordt opgeslagen, kun je ze direct beheren door items in de App te wijzigen of te verwijderen, of door de App te verwijderen.",
  "contact.h": "Vragen over je privacy?",
  "contact.p": "Heb je vragen of zorgen over dit privacybeleid? Neem contact met ons op — we helpen je graag verder.",
  "footer.support": "Ondersteuning",
  "footer.made": "Gemaakt met ❤️ voor iOS"
 },
 "vi": {
  "nav.support": "Hỗ trợ",
  "lang.label": "Ngôn ngữ",
  "hero.title": "Chính sách quyền riêng tư",
  "hero.meta": "Ngày hiệu lực: 1 tháng 6, 2026 &nbsp;·&nbsp; Cập nhật lần cuối: 11 tháng 9, 2026",
  "trans.note": "Bản dịch này chỉ mang tính tham khảo; bản tiếng Anh là bản chính thức.",
  "sum.1": "Xử lý trên thiết bị",
  "sum.2": "Chú trọng quyền riêng tư",
  "sum.3": "Không tải lên đám mây",
  "sum.4": "Lưu trữ cục bộ an toàn",
  "s1.h": "Tổng quan",
  "s1.p1": "WatermarkIT không thu thập, lưu trữ, truyền tải, hay chia sẻ bất kỳ dữ liệu cá nhân hay hình ảnh nào. Mọi xử lý đều diễn ra hoàn toàn trên thiết bị của bạn.",
  "s1.p2": "Chính sách quyền riêng tư này giải thích cách ứng dụng iOS WatermarkIT (“Ứng dụng”, “chúng tôi”) xử lý thông tin của bạn. Chúng tôi cam kết bảo vệ quyền riêng tư của bạn và minh bạch về các thực hành của mình.",
  "s2.h": "Thu thập và Sử dụng Dữ liệu",
  "s2.p1": "<strong>Cam kết tuyệt đối của chúng tôi:</strong> chúng tôi không bao giờ truy cập, tải lên, truyền tải hay lưu trữ ảnh của bạn trong bất kỳ trường hợp nào. Mọi xử lý hình ảnh được thực hiện hoàn toàn cục bộ trên thiết bị của bạn.",
  "s2.p2": "Hiện tại, Ứng dụng không thu thập thông tin nhận dạng cá nhân (như tên hoặc địa chỉ email của bạn). Nếu trong tương lai chúng tôi giới thiệu các tính năng như tài khoản người dùng, gói đăng ký, hoặc phân tích sử dụng/báo cáo chẩn đoán cơ bản, ảnh của bạn vẫn sẽ hoàn toàn riêng tư 100% và sẽ không bao giờ bị chúng tôi truy cập, tải lên, hay lưu trữ.",
  "s3.h": "Cách Ứng dụng Hoạt động",
  "s3.p1": "WatermarkIT là một ứng dụng hoàn toàn ngoại tuyến, hoạt động trên thiết bị. Đây là chính xác những gì xảy ra khi bạn sử dụng nó:",
  "s3.li1": "Bạn chọn một bức ảnh — từ thư viện ảnh, từ camera, hoặc từ ứng dụng Tệp",
  "s3.li2": "Ứng dụng đọc bức ảnh đó cục bộ trên thiết bị của bạn",
  "s3.li3": "Mọi xử lý hình mờ — văn bản, logo, chữ ký viết tay, mã QR và lát kín — được thực hiện hoàn toàn trên thiết bị của bạn",
  "s3.li4": "Mã QR được tạo trên thiết bị bằng khung Core Image tích hợp sẵn của Apple; đường liên kết bạn nhập không bao giờ được truyền đi",
  "s3.li5": "Kết quả được lưu trở lại Cuộn phim Camera cục bộ của bạn hoặc chia sẻ qua Trình chia sẻ của iOS",
  "s3.li6": "Không lúc nào ảnh của bạn, hoặc bất kỳ dữ liệu nào bắt nguồn từ nó, được gửi tới bất kỳ máy chủ bên ngoài nào",
  "s4.h": "Quyền truy cập Thiết bị",
  "s4.p1": "Ứng dụng yêu cầu các quyền iOS sau:",
  "s4.li1": "<strong>Quyền đọc Thư viện ảnh</strong> — để bạn có thể chọn ảnh muốn đóng hình mờ. Chúng tôi chỉ truy cập những ảnh bạn chọn rõ ràng.",
  "s4.li2": "<strong>Quyền ghi Thư viện ảnh</strong> — để lưu ảnh đã đóng hình mờ trở lại Cuộn phim Camera của bạn.",
  "s4.li3": "<strong>Quyền truy cập Camera</strong> — chỉ khi bạn chọn chụp một bức ảnh mới bên trong Ứng dụng, để bạn có thể đóng hình mờ cho một bức ảnh mà không cần lưu bản chưa đánh dấu trước. Ứng dụng không bao giờ tự mở camera, và ảnh bạn chụp được xử lý y hệt như bất kỳ ảnh nào khác: xử lý trên thiết bị, không bao giờ tải lên.",
  "s4.p2": "Bạn cũng có thể nhập ảnh qua ứng dụng Tệp. Việc này sử dụng trình chọn tài liệu tiêu chuẩn của iOS, chỉ trao cho Ứng dụng đúng một tệp bạn chọn và không yêu cầu quyền lâu dài.",
  "s4.p3": "Các quyền này chỉ được yêu cầu vào thời điểm bạn cố gắng sử dụng tính năng liên quan — không bao giờ tự động khi khởi chạy. Bạn có thể thu hồi chúng bất kỳ lúc nào trong Cài đặt iOS → Quyền riêng tư & Bảo mật.",
  "s5.h": "Thông tin Bạn Thêm vào Ảnh của Mình",
  "s5.p1": "WatermarkIT có thể ghi một dòng ghi công — tên và bản quyền của bạn — vào siêu dữ liệu của những bức ảnh bạn xuất, sử dụng các trường IPTC và TIFF tiêu chuẩn (Byline, Thông báo Bản quyền, Nghệ sĩ). Đây là điều giúp thông tin ghi công của bạn tồn tại qua việc cắt ảnh.",
  "s5.p2": "Có hai điều cần làm rõ:",
  "s5.li1": "Văn bản được ghi là <strong>văn bản bạn nhập vào</strong>. WatermarkIT không bao giờ chèn tên của chúng tôi, mã định danh thiết bị, vị trí của bạn, hay bất kỳ dữ liệu theo dõi ẩn nào của riêng nó.",
  "s5.li2": "Siêu dữ liệu này được ghi vào tệp đã xuất, do đó nó <strong>đi cùng tệp đó tới bất cứ nơi nào bạn gửi</strong>. Đó chính xác là mục đích của tính năng này — nhưng điều đó cũng có nghĩa là bất kỳ ai bạn chia sẻ ảnh cùng đều có thể đọc được tên bạn đã đặt ở đó.",
  "s5.p3": "Thông tin ghi công là tùy chọn. Bạn có thể tắt nó cho một lần xuất riêng lẻ trên trang xuất, hoặc tắt theo mặc định trong Cài đặt. Ảnh hiện có của bạn không bao giờ bị thay đổi — mỗi lần xuất đều được ghi thành một tệp mới.",
  "s6.h": "Lưu trữ Dữ liệu Cục bộ",
  "s6.p1": "Ứng dụng lưu trữ dữ liệu sau <strong>chỉ trên thiết bị của bạn</strong>:",
  "s6.li1": "Các mẫu và cài đặt sẵn hình mờ bạn tạo (tên, kiểu chữ, kích thước, màu sắc, độ mờ, xoay, lát kín và vị trí)",
  "s6.li2": "Hình ảnh xem trước thu nhỏ cho các mẫu bạn đã lưu",
  "s6.li3": "Công việc Gần đây của bạn — lịch sử cục bộ các ảnh bạn đã xuất, để bạn có thể mở lại hoặc xuất lại chúng",
  "s6.li4": "Tùy chọn ứng dụng của bạn, chẳng hạn như chất lượng và định dạng xuất mặc định, ngôn ngữ bạn đã chọn, và có bao gồm dòng ghi công của bạn hay không",
  "s6.p2": "Dữ liệu này không bao giờ rời khỏi thiết bị của bạn. Nó được lưu trữ trong vùng chứa cục bộ của Ứng dụng và tự động bị xóa nếu bạn gỡ cài đặt Ứng dụng.",
  "s7.h": "Dịch vụ Bên thứ ba",
  "s7.p1": "Ứng dụng không chia sẻ dữ liệu của bạn với các mạng quảng cáo bên thứ ba. Chúng tôi có thể sử dụng các SDK hoặc nhà cung cấp dịch vụ bên thứ ba đã được xác minh cho việc phân tích ứng dụng, báo cáo sự cố, hoặc quản lý gói đăng ký. Bất kỳ dịch vụ nào như vậy đều chỉ được tích hợp để hỗ trợ chức năng của ứng dụng và cải thiện trải nghiệm người dùng.",
  "s8.h": "Quyền riêng tư của Trẻ em",
  "s8.p1": "WatermarkIT được thiết kế cho đối tượng người dùng chung. Chúng tôi không cố ý thu thập thông tin cá nhân từ trẻ em dưới 13 tuổi. Nếu bạn tin rằng chúng tôi đã vô tình thu thập thông tin như vậy, vui lòng liên hệ với chúng tôi để chúng tôi có thể xử lý kịp thời.",
  "s9.h": "Bảo mật Dữ liệu",
  "s9.p1": "Vì WatermarkIT không truyền tải bất kỳ dữ liệu nào, nên không có dữ liệu nào đang truyền đi cần được bảo mật. Mọi dữ liệu được lưu trữ cục bộ (các mẫu của bạn) đều tuân theo mã hóa thiết bị tích hợp sẵn của iOS, được kích hoạt bất cứ khi nào bạn sử dụng mã khóa thiết bị.",
  "s10.h": "Thay đổi đối với Chính sách này",
  "s10.p1": "Chúng tôi có thể cập nhật Chính sách Quyền riêng tư của mình theo thời gian. Mọi thay đổi sẽ được đăng trên trang này với ngày “Cập nhật lần cuối” được cập nhật. Chúng tôi khuyến khích bạn xem lại chính sách này định kỳ để nắm bắt mọi thay đổi.",
  "s11.h": "Quyền của Bạn",
  "s11.p1": "Tùy thuộc vào vị trí của bạn, bạn có thể có các quyền liên quan đến dữ liệu của mình theo quy định pháp luật địa phương (như GDPR hoặc CCPA). Vì phần lớn dữ liệu của bạn (như các mẫu và ảnh) được lưu trữ cục bộ, bạn có thể quản lý trực tiếp bằng cách chỉnh sửa hoặc xóa các mục bên trong Ứng dụng, hoặc bằng cách gỡ cài đặt Ứng dụng.",
  "contact.h": "Có câu hỏi về quyền riêng tư của bạn?",
  "contact.p": "Nếu bạn có bất kỳ câu hỏi hoặc lo ngại nào về Chính sách Quyền riêng tư này, hãy liên hệ với chúng tôi — chúng tôi rất sẵn lòng giúp đỡ.",
  "footer.support": "Hỗ trợ",
  "footer.made": "Được làm với ❤️ cho iOS"
 },
 "tr": {
  "nav.support": "Destek",
  "lang.label": "Dil",
  "hero.title": "Gizlilik Politikası",
  "hero.meta": "Yürürlük Tarihi: 1 Haziran 2026 &nbsp;·&nbsp; Son Güncelleme: 11 Eylül 2026",
  "trans.note": "Bu çeviri yalnızca kolaylık amacıyla sunulur; asıl metin İngilizce sürümdür.",
  "sum.1": "Cihaz üzerinde işleme",
  "sum.2": "Gizliliğe odaklı",
  "sum.3": "Buluta yükleme yok",
  "sum.4": "Güvenli yerel depolama",
  "s1.h": "Genel Bakış",
  "s1.p1": "WatermarkIT herhangi bir kişisel veri veya görsel toplamaz, saklamaz, iletmez ya da paylaşmaz. Tüm işleme tamamen cihazınızda gerçekleşir.",
  "s1.p2": "Bu Gizlilik Politikası, WatermarkIT iOS uygulamasının (“Uygulama”, “biz”) bilgilerinizi nasıl işlediğini açıklar. Gizliliğinizi korumaya ve uygulamalarımız konusunda şeffaf olmaya kararlıyız.",
  "s2.h": "Veri Toplama ve Kullanımı",
  "s2.p1": "<strong>Kesin Taahhüdümüz:</strong> Hiçbir koşulda fotoğraflarınıza erişmeyiz, onları yüklemeyiz, iletmeyiz veya saklamayız. Tüm görsel işleme tamamen cihazınızda, yerel olarak gerçekleştirilir.",
  "s2.p2": "Şu anda Uygulama, adınız veya e-posta adresiniz gibi kişisel kimlik bilgilerini toplamamaktadır. İleride kullanıcı hesapları, abonelikler veya temel kullanım analitiği/tanılama raporlaması gibi özellikler eklersek, fotoğraflarınız yine de %100 gizli kalacak ve tarafımızca hiçbir zaman erişilmeyecek, yüklenmeyecek veya saklanmayacaktır.",
  "s3.h": "Uygulama Nasıl Çalışır",
  "s3.p1": "WatermarkIT, cihaz üzerinde çalışan, tamamen çevrimdışı bir uygulamadır. Uygulamayı kullandığınızda tam olarak şunlar gerçekleşir:",
  "s3.li1": "Bir fotoğraf seçersiniz — fotoğraf kitaplığınızdan, kameranızdan ya da Dosyalar uygulamasından",
  "s3.li2": "Uygulama bu fotoğrafı cihazınızda yerel olarak okur",
  "s3.li3": "Tüm filigran işlemleri — metin, logolar, el yazısı imzalar, QR kodları ve döşeme — tamamen cihazınızda gerçekleştirilir",
  "s3.li4": "QR kodları, Apple’ın yerleşik Core Image çerçevesiyle cihaz üzerinde oluşturulur; girdiğiniz bağlantı asla iletilmez",
  "s3.li5": "Sonuç, yerel Kamera Rulonuza kaydedilir veya iOS Paylaşım Sayfası aracılığıyla paylaşılır",
  "s3.li6": "Hiçbir aşamada fotoğrafınız veya ondan türetilen herhangi bir veri, herhangi bir dış sunucuya gönderilmez",
  "s4.h": "Cihaz İzinleri",
  "s4.p1": "Uygulama aşağıdaki iOS izinlerini talep eder:",
  "s4.li1": "<strong>Fotoğraf Kitaplığı Okuma Erişimi</strong> — filigran eklemek istediğiniz fotoğrafları seçebilmeniz için. Yalnızca açıkça seçtiğiniz fotoğraflara erişiriz.",
  "s4.li2": "<strong>Fotoğraf Kitaplığı Yazma Erişimi</strong> — filigranlı görsellerinizi Kamera Rulonuza kaydetmek için.",
  "s4.li3": "<strong>Kamera Erişimi</strong> — yalnızca Uygulama içinde yeni bir fotoğraf çekmeyi seçtiğinizde, önce işaretsiz bir kopya kaydetmeden bir çekime filigran ekleyebilmeniz için. Uygulama kamerayı kendiliğinden asla açmaz ve çektiğiniz fotoğraflar tıpkı diğerleri gibi işlenir: cihazda işlenir, asla yüklenmez.",
  "s4.p2": "Dosyalar uygulaması üzerinden de bir görsel içe aktarabilirsiniz. Bu, Uygulamaya yalnızca seçtiğiniz tek dosyayı veren ve sürekli izin gerektirmeyen standart iOS belge seçiciyi kullanır.",
  "s4.p3": "Bu izinler yalnızca ilgili özelliği kullanmaya çalıştığınız anda istenir — asla başlatma sırasında otomatik olarak değil. Bunları istediğiniz zaman iOS Ayarlar → Gizlilik ve Güvenlik bölümünden iptal edebilirsiniz.",
  "s5.h": "Fotoğraflarınıza Eklediğiniz Bilgiler",
  "s5.p1": "WatermarkIT, dışa aktardığınız fotoğrafların meta verilerine standart IPTC ve TIFF alanlarını (Byline, Telif Hakkı Bildirimi, Sanatçı) kullanarak bir telif satırı — adınızı ve telif hakkınızı — yazabilir. Telif bilginizin kırpmaya dayanmasını sağlayan da budur.",
  "s5.p2": "Netleştirilmesi gereken iki nokta var:",
  "s5.li1": "Yazılan metin <strong>sizin girdiğiniz metindir</strong>. WatermarkIT hiçbir zaman kendi adımızı, bir cihaz tanımlayıcısını, konumunuzu veya kendine ait gizli izleme verilerini eklemez.",
  "s5.li2": "Bu meta veri, dışa aktarılan dosyaya yazılır, dolayısıyla <strong>gönderdiğiniz her yere o dosyayla birlikte gider</strong>. Bu, tam olarak özelliğin amacıdır — ama fotoğrafı paylaştığınız kişilerin oraya koyduğunuz adı okuyabileceği anlamına da gelir.",
  "s5.p3": "Telif bilgisi isteğe bağlıdır. Dışa Aktar sayfasında tek bir dışa aktarma için kapatabilir veya Ayarlar’da varsayılan olarak devre dışı bırakabilirsiniz. Mevcut fotoğraflarınız asla değiştirilmez — her dışa aktarma yeni bir dosya olarak yazılır.",
  "s6.h": "Yerel Veri Depolama",
  "s6.p1": "Uygulama aşağıdaki verileri <strong>yalnızca cihazınızda</strong> saklar:",
  "s6.li1": "Oluşturduğunuz filigran şablonları ve hazır ayarlar (ad, yazı tipi, boyut, renk, saydamlık, döndürme, döşeme ve konum)",
  "s6.li2": "Kaydettiğiniz şablonlar için küçük resim önizlemeleri",
  "s6.li3": "Son Çalışmalarınız — dışa aktardığınız fotoğrafların, tekrar açabilmeniz veya yeniden dışa aktarabilmeniz için yerel geçmişi",
  "s6.li4": "Varsayılan dışa aktarma kalitesi, formatı, seçtiğiniz dil ve telif satırınızın dahil edilip edilmeyeceği gibi uygulama tercihleriniz",
  "s6.p2": "Bu veriler cihazınızdan asla çıkmaz. Uygulamanın yerel kapsayıcısında saklanır ve Uygulamayı kaldırdığınızda otomatik olarak silinir.",
  "s7.h": "Üçüncü Taraf Hizmetleri",
  "s7.p1": "Uygulama, verilerinizi üçüncü taraf reklam ağlarıyla paylaşmaz. Uygulama analitiği, çökme raporlaması veya abonelik yönetimi için doğrulanmış üçüncü taraf SDK’lar veya hizmet sağlayıcılar kullanabiliriz. Bu tür hizmetler, yalnızca uygulamanın işlevselliğini desteklemek ve kullanıcı deneyimini iyileştirmek amacıyla entegre edilir.",
  "s8.h": "Çocukların Gizliliği",
  "s8.p1": "WatermarkIT genel bir kitle için tasarlanmıştır. 13 yaşın altındaki çocuklardan bilerek kişisel bilgi toplamayız. Böyle bir bilgiyi yanlışlıkla topladığımızı düşünüyorsanız, hızla ele almamız için lütfen bizimle iletişime geçin.",
  "s9.h": "Veri Güvenliği",
  "s9.p1": "WatermarkIT herhangi bir veri iletmediğinden, güvence altına alınacak aktarım halinde veri bulunmaz. Yerel olarak saklanan tüm veriler (şablonlarınız), cihaz şifresi kullandığınızda etkinleşen iOS’un yerleşik cihaz şifrelemesine tabidir.",
  "s10.h": "Bu Politikadaki Değişiklikler",
  "s10.p1": "Gizlilik Politikamızı zaman zaman güncelleyebiliriz. Herhangi bir değişiklik, güncellenmiş bir “Son Güncelleme” tarihiyle bu sayfada yayınlanacaktır. Değişiklikler için bu politikayı periyodik olarak gözden geçirmenizi öneririz.",
  "s11.h": "Haklarınız",
  "s11.p1": "Bulunduğunuz yere bağlı olarak, yerel düzenlemeler (GDPR veya CCPA gibi) uyarınca verilerinizle ilgili haklara sahip olabilirsiniz. Verilerinizin çoğu (şablonlar ve fotoğraflar gibi) yerel olarak saklandığından, Uygulama içindeki öğeleri değiştirerek veya silerek ya da Uygulamayı kaldırarak bunları doğrudan yönetebilirsiniz.",
  "contact.h": "Gizliliğinizle ilgili sorularınız mı var?",
  "contact.p": "Bu Gizlilik Politikası hakkında herhangi bir sorunuz veya endişeniz varsa bize ulaşın — yardımcı olmaktan memnuniyet duyarız.",
  "footer.support": "Destek",
  "footer.made": "iOS için ❤️ ile yapıldı"
 },
 "es": {
  "nav.support": "Soporte",
  "lang.label": "Idioma",
  "hero.title": "Política de privacidad",
  "hero.meta": "Fecha de vigencia: 1 de junio de 2026 &nbsp;·&nbsp; Última actualización: 11 de septiembre de 2026",
  "trans.note": "Esta traducción se ofrece como referencia; el texto en inglés es el que tiene validez.",
  "sum.1": "Procesamiento en el dispositivo",
  "sum.2": "Enfocado en la privacidad",
  "sum.3": "Sin subidas a la nube",
  "sum.4": "Almacenamiento local seguro",
  "s1.h": "Resumen",
  "s1.p1": "WatermarkIT no recopila, almacena, transmite ni comparte ningún dato personal ni imagen. Todo el procesamiento ocurre por completo en tu dispositivo.",
  "s1.p2": "Esta Política de Privacidad explica cómo la aplicación de iOS WatermarkIT (“la App”, “nosotros”) maneja tu información. Estamos comprometidos con proteger tu privacidad y ser transparentes sobre nuestras prácticas.",
  "s2.h": "Recopilación y uso de datos",
  "s2.p1": "<strong>Nuestro compromiso absoluto:</strong> nunca accedemos, subimos, transmitimos ni almacenamos tus fotos bajo ninguna circunstancia. Todo el procesamiento de imágenes se realiza por completo de forma local en tu dispositivo.",
  "s2.p2": "Actualmente, la App no recopila información de identificación personal (como tu nombre o dirección de correo electrónico). Si en el futuro introducimos funciones como cuentas de usuario, suscripciones o análisis de uso/reportes de diagnóstico básicos, tus fotos seguirán siendo 100% privadas y nunca serán accedidas, subidas o almacenadas por nosotros.",
  "s3.h": "Cómo funciona la App",
  "s3.p1": "WatermarkIT es una aplicación completamente sin conexión, que funciona en el dispositivo. Esto es exactamente lo que sucede cuando la usas:",
  "s3.li1": "Eliges una foto — de tu biblioteca de fotos, de tu cámara, o de la app Archivos",
  "s3.li2": "La App lee esa foto localmente en tu dispositivo",
  "s3.li3": "Todo el procesamiento de la marca de agua — texto, logotipos, firmas escritas a mano, códigos QR y mosaico — se realiza por completo en tu dispositivo",
  "s3.li4": "Los códigos QR se generan en el dispositivo con el framework Core Image integrado de Apple; el enlace que ingresas nunca se transmite",
  "s3.li5": "El resultado se guarda de vuelta en tu Carrete local o se comparte a través de la hoja de compartir de iOS",
  "s3.li6": "En ningún momento tu foto, ni ningún dato derivado de ella, se envía a ningún servidor externo",
  "s4.h": "Permisos del dispositivo",
  "s4.p1": "La App solicita los siguientes permisos de iOS:",
  "s4.li1": "<strong>Acceso de lectura a la biblioteca de fotos</strong> — para permitirte seleccionar las fotos que quieres marcar con marca de agua. Solo accedemos a las fotos que eliges explícitamente.",
  "s4.li2": "<strong>Acceso de escritura a la biblioteca de fotos</strong> — para guardar tus imágenes con marca de agua de vuelta en tu Carrete.",
  "s4.li3": "<strong>Acceso a la cámara</strong> — solo si eliges tomar una nueva foto dentro de la App, para que puedas marcar una toma sin tener que guardar primero una copia sin marcar. La App nunca abre la cámara por sí sola, y las fotos que capturas se manejan exactamente igual que cualquier otra: se procesan en el dispositivo, nunca se suben.",
  "s4.p2": "También puedes importar una imagen a través de la app Archivos. Eso usa el selector de documentos estándar de iOS, que le entrega a la App solo el único archivo que elegiste y no requiere ningún permiso continuo.",
  "s4.p3": "Estos permisos solo se solicitan en el momento en que intentas usar la función correspondiente — nunca automáticamente al iniciar. Puedes revocarlos en cualquier momento en Ajustes de iOS → Privacidad y seguridad.",
  "s5.h": "Información que agregas a tus fotos",
  "s5.p1": "WatermarkIT puede escribir una línea de crédito — tu nombre y aviso de derechos de autor — en los metadatos de las fotos que exportas, usando los campos estándar IPTC y TIFF (Autor, Aviso de derechos de autor, Artista). Esto es lo que permite que tu crédito sobreviva al recorte.",
  "s5.p2": "Vale la pena aclarar dos cosas:",
  "s5.li1": "El texto escrito es <strong>el texto que tú ingresas</strong>. WatermarkIT nunca inserta nuestro propio nombre, un identificador de dispositivo, tu ubicación, ni ningún dato de seguimiento oculto propio.",
  "s5.li2": "Estos metadatos se escriben en el archivo exportado, por lo que <strong>viajan con ese archivo a dondequiera que lo envíes</strong>. Ese es precisamente el propósito de esta función — pero también significa que cualquier persona con quien compartas la foto puede leer el nombre que pusiste ahí.",
  "s5.p3": "El crédito es opcional. Puedes desactivarlo para una exportación individual en la pantalla de exportación, o desactivarlo de forma predeterminada en Ajustes. Tus fotos existentes nunca se modifican — cada exportación se guarda como un archivo nuevo.",
  "s6.h": "Almacenamiento local de datos",
  "s6.p1": "La App almacena los siguientes datos <strong>solo en tu dispositivo</strong>:",
  "s6.li1": "Plantillas y preajustes de marca de agua que creas (nombre, tipografía, tamaño, color, opacidad, rotación, mosaico y posición)",
  "s6.li2": "Imágenes de vista previa en miniatura de tus plantillas guardadas",
  "s6.li3": "Tu Trabajo reciente — un historial local de las fotos que has exportado, para que puedas volver a abrirlas o exportarlas de nuevo",
  "s6.li4": "Tus preferencias de la app, como la calidad y el formato de exportación predeterminados, el idioma que elegiste, y si se incluye tu línea de crédito",
  "s6.p2": "Estos datos nunca salen de tu dispositivo. Se almacenan en el contenedor local de la App y se eliminan automáticamente si desinstalas la App.",
  "s7.h": "Servicios de terceros",
  "s7.p1": "La App no comparte tus datos con redes publicitarias de terceros. Podemos usar SDKs o proveedores de servicios de terceros verificados para análisis de la app, reportes de fallos, o gestión de suscripciones. Dichos servicios, cuando se usan, se integran estrictamente para respaldar la funcionalidad de la app y mejorar la experiencia del usuario.",
  "s8.h": "Privacidad de los menores",
  "s8.p1": "WatermarkIT está diseñado para un público general. No recopilamos a sabiendas información personal de menores de 13 años. Si crees que hemos recopilado inadvertidamente dicha información, contáctanos para que podamos abordarlo con prontitud.",
  "s9.h": "Seguridad de los datos",
  "s9.p1": "Dado que WatermarkIT no transmite ningún dato, no hay datos en tránsito que proteger. Todos los datos almacenados localmente (tus plantillas) están sujetos al cifrado de dispositivo integrado de iOS, que se activa siempre que usas un código de acceso en el dispositivo.",
  "s10.h": "Cambios a esta política",
  "s10.p1": "Podemos actualizar nuestra Política de Privacidad de vez en cuando. Cualquier cambio se publicará en esta página con una fecha de “Última actualización” renovada. Te recomendamos revisar esta política periódicamente para ver si hay cambios.",
  "s11.h": "Tus derechos",
  "s11.p1": "Según tu ubicación, es posible que tengas derechos relacionados con tus datos conforme a las regulaciones locales (como el RGPD o la CCPA). Dado que la mayoría de tus datos (como plantillas y fotos) se almacena localmente, puedes gestionarlos directamente modificando o eliminando elementos dentro de la App, o desinstalando la App.",
  "contact.h": "¿Preguntas sobre tu privacidad?",
  "contact.p": "Si tienes alguna pregunta o inquietud sobre esta Política de Privacidad, contáctanos — con gusto te ayudamos.",
  "footer.support": "Soporte",
  "footer.made": "Hecho con ❤️ para iOS"
 },
 "pt-BR": {
  "nav.support": "Suporte",
  "lang.label": "Idioma",
  "hero.title": "Política de Privacidade",
  "hero.meta": "Data de Vigência: 1º de junho de 2026 &nbsp;·&nbsp; Última Atualização: 11 de setembro de 2026",
  "trans.note": "Esta tradução é fornecida apenas como referência; o texto em inglês é o que prevalece.",
  "sum.1": "Processamento no aparelho",
  "sum.2": "Focado em privacidade",
  "sum.3": "Sem envio para a nuvem",
  "sum.4": "Armazenamento local seguro",
  "s1.h": "Visão Geral",
  "s1.p1": "O WatermarkIT não coleta, armazena, transmite nem compartilha nenhum dado pessoal ou imagem. Todo o processamento acontece inteiramente no seu aparelho.",
  "s1.p2": "Esta Política de Privacidade explica como o aplicativo iOS WatermarkIT (“o App”, “nós”) trata suas informações. Estamos comprometidos em proteger sua privacidade e em ser transparentes sobre nossas práticas.",
  "s2.h": "Coleta e Uso de Dados",
  "s2.p1": "<strong>Nosso Compromisso Absoluto:</strong> nunca acessamos, enviamos, transmitimos ou armazenamos suas fotos, em nenhuma circunstância. Todo o processamento de imagem é feito inteiramente de forma local no seu aparelho.",
  "s2.p2": "No momento, o App não coleta informações de identificação pessoal (como seu nome ou endereço de e-mail). Se no futuro introduzirmos recursos como contas de usuário, assinaturas ou análises básicas de uso/relatórios de diagnóstico, suas fotos continuarão 100% privadas e nunca serão acessadas, enviadas ou armazenadas por nós.",
  "s3.h": "Como o App Funciona",
  "s3.p1": "O WatermarkIT é um aplicativo totalmente offline, que roda no aparelho. Aqui está exatamente o que acontece quando você o usa:",
  "s3.li1": "Você escolhe uma foto — da sua galeria de fotos, da câmera, ou do app Arquivos",
  "s3.li2": "O App lê essa foto localmente no seu aparelho",
  "s3.li3": "Todo o processamento da marca d’água — texto, logotipos, assinaturas manuscritas, códigos QR e mosaico — é feito inteiramente no seu aparelho",
  "s3.li4": "Os códigos QR são gerados no aparelho com o framework Core Image integrado da Apple; o link que você digita nunca é transmitido",
  "s3.li5": "O resultado é salvo de volta no seu Rolo da Câmera local ou compartilhado pela folha de compartilhamento do iOS",
  "s3.li6": "Em nenhum momento sua foto, ou qualquer dado derivado dela, é enviada a qualquer servidor externo",
  "s4.h": "Permissões do Aparelho",
  "s4.p1": "O App solicita as seguintes permissões do iOS:",
  "s4.li1": "<strong>Acesso de Leitura à Galeria de Fotos</strong> — para permitir que você selecione as fotos que quer marcar com marca d’água. Só acessamos as fotos que você escolhe explicitamente.",
  "s4.li2": "<strong>Acesso de Gravação à Galeria de Fotos</strong> — para salvar suas imagens com marca d’água de volta no seu Rolo da Câmera.",
  "s4.li3": "<strong>Acesso à Câmera</strong> — apenas se você escolher tirar uma nova foto dentro do App, para poder marcar uma foto com marca d’água sem antes salvar uma cópia sem marca. O App nunca abre a câmera por conta própria, e as fotos que você captura são tratadas exatamente como qualquer outra: processadas no aparelho, nunca enviadas.",
  "s4.p2": "Você também pode importar uma imagem pelo app Arquivos. Isso usa o seletor de documentos padrão do iOS, que entrega ao App apenas o único arquivo escolhido e não exige nenhuma permissão contínua.",
  "s4.p3": "Essas permissões só são solicitadas no momento em que você tenta usar o recurso correspondente — nunca automaticamente ao abrir o app. Você pode revogá-las a qualquer momento em Ajustes do iOS → Privacidade e Segurança.",
  "s5.h": "Informações que Você Adiciona às Suas Fotos",
  "s5.p1": "O WatermarkIT pode gravar uma linha de crédito — seu nome e aviso de direitos autorais — nos metadados das fotos que você exporta, usando os campos padrão IPTC e TIFF (Autor, Aviso de Direitos Autorais, Artista). É isso que permite que seu crédito sobreviva ao recorte.",
  "s5.p2": "Dois pontos merecem ser esclarecidos:",
  "s5.li1": "O texto gravado é <strong>o texto que você insere</strong>. O WatermarkIT nunca insere nosso próprio nome, um identificador de aparelho, sua localização, ou qualquer dado de rastreamento oculto próprio.",
  "s5.li2": "Esses metadados são gravados no arquivo exportado, portanto <strong>viajam com esse arquivo para onde quer que você o envie</strong>. Esse é exatamente o propósito do recurso — mas também significa que qualquer pessoa com quem você compartilhe a foto pode ler o nome que você colocou ali.",
  "s5.p3": "O crédito é opcional. Você pode desativá-lo para uma exportação individual na tela de exportação, ou desativá-lo por padrão nos Ajustes. Suas fotos existentes nunca são modificadas — cada exportação é gravada como um novo arquivo.",
  "s6.h": "Armazenamento Local de Dados",
  "s6.p1": "O App armazena os seguintes dados <strong>somente no seu aparelho</strong>:",
  "s6.li1": "Modelos e predefinições de marca d’água que você cria (nome, tipografia, tamanho, cor, opacidade, rotação, mosaico e posição)",
  "s6.li2": "Imagens de pré-visualização em miniatura dos seus modelos salvos",
  "s6.li3": "Seus Trabalhos Recentes — um histórico local das fotos que você exportou, para que possa reabri-las ou reexportá-las",
  "s6.li4": "Suas preferências do app, como qualidade e formato de exportação padrão, o idioma escolhido, e se deve incluir sua linha de crédito",
  "s6.p2": "Esses dados nunca saem do seu aparelho. Eles ficam armazenados no contêiner local do App e são excluídos automaticamente se você desinstalar o App.",
  "s7.h": "Serviços de Terceiros",
  "s7.p1": "O App não compartilha seus dados com redes de publicidade de terceiros. Podemos usar SDKs ou provedores de serviços de terceiros verificados para análise do app, relatórios de falhas, ou gerenciamento de assinaturas. Quaisquer desses serviços são integrados estritamente para apoiar a funcionalidade do app e melhorar a experiência do usuário.",
  "s8.h": "Privacidade de Crianças",
  "s8.p1": "O WatermarkIT foi projetado para um público geral. Não coletamos intencionalmente informações pessoais de crianças menores de 13 anos. Se você acredita que coletamos inadvertidamente essas informações, entre em contato conosco para que possamos resolver isso rapidamente.",
  "s9.h": "Segurança de Dados",
  "s9.p1": "Como o WatermarkIT não transmite nenhum dado, não há dados em trânsito para proteger. Todos os dados armazenados localmente (seus modelos) estão sujeitos à criptografia integrada do aparelho do iOS, que é ativada sempre que você usa uma senha no aparelho.",
  "s10.h": "Alterações a Esta Política",
  "s10.p1": "Podemos atualizar nossa Política de Privacidade de tempos em tempos. Quaisquer alterações serão publicadas nesta página com uma data de “Última Atualização” renovada. Recomendamos que você revise esta política periodicamente para verificar mudanças.",
  "s11.h": "Seus Direitos",
  "s11.p1": "Dependendo da sua localização, você pode ter direitos em relação aos seus dados segundo regulamentações locais (como GDPR ou LGPD). Como a maior parte dos seus dados (como modelos e fotos) é armazenada localmente, você pode gerenciá-los diretamente, modificando ou excluindo itens dentro do App, ou desinstalando o App.",
  "contact.h": "Dúvidas sobre sua privacidade?",
  "contact.p": "Se você tiver alguma dúvida ou preocupação sobre esta Política de Privacidade, fale conosco — teremos prazer em ajudar.",
  "footer.support": "Suporte",
  "footer.made": "Feito com ❤️ para iOS"
 },
 "zh-HK": {
  "nav.support": "支援",
  "lang.label": "語言",
  "hero.title": "私隱政策",
  "hero.meta": "生效日期：2026 年 6 月 1 日 &nbsp;·&nbsp; 最後更新：2026 年 9 月 11 日",
  "trans.note": "呢個翻譯只供參考，一切以英文版為準。",
  "sum.1": "裝置端處理",
  "sum.2": "重視私隱",
  "sum.3": "唔會上載雲端",
  "sum.4": "安全嘅本機儲存",
  "s1.h": "概覽",
  "s1.p1": "WatermarkIT 唔會收集、儲存、傳輸或者分享任何個人資料或者相片。所有處理都完全喺你部裝置度進行。",
  "s1.p2": "呢份私隱政策解釋 WatermarkIT 呢個 iOS App（下稱「本 App」「我哋」）點樣處理你嘅資訊。我哋承諾保護你嘅私隱，同埋喺我哋嘅做法上保持透明。",
  "s2.h": "資料收集同使用",
  "s2.p1": "<strong>我哋嘅絕對承諾：</strong>喺任何情況下，我哋都唔會存取、上載、傳輸或者儲存你嘅相片。所有影像處理都完全喺你部裝置度本機進行。",
  "s2.p2": "目前，本 App 唔會收集個人識別資訊（例如你嘅姓名或者電郵地址）。就算我哋日後推出賬戶、訂閱或者基本使用分析／診斷報告等功能，你嘅相片仍然會保持 100% 私隱，我哋絕對唔會存取、上載或者儲存。",
  "s3.h": "本 App 點樣運作",
  "s3.p1": "WatermarkIT 係一個完全離線、喺裝置度運行嘅 App。用嘅時候實際會發生咩事，如下：",
  "s3.li1": "你由相簿、相機或者「檔案」App 入面揀一張相",
  "s3.li2": "本 App 喺你部裝置本機讀取嗰張相",
  "s3.li3": "所有浮水印處理——文字、標誌、手寫簽名、QR 碼同平鋪——都完全喺你部裝置度進行",
  "s3.li4": "QR 碼係用 Apple 內置嘅 Core Image 框架喺裝置度產生，你輸入嘅連結永遠唔會被傳輸",
  "s3.li5": "結果會儲存返落你嘅本機相機膠卷，或者透過 iOS 分享工具分享",
  "s3.li6": "你嘅相片或者由佢衍生嘅任何資料，喺任何時候都唔會傳送去任何外部伺服器",
  "s4.h": "裝置權限",
  "s4.p1": "本 App 會要求以下 iOS 權限：",
  "s4.li1": "<strong>相簿讀取權限</strong>——等你可以揀想加浮水印嘅相片。我哋只會存取你明確揀嘅相片。",
  "s4.li2": "<strong>相簿寫入權限</strong>——將加咗浮水印嘅圖片儲存返落你嘅相機膠卷。",
  "s4.li3": "<strong>相機權限</strong>——只有喺你揀喺 App 入面影一張新相嗰陣先會用到，等你唔使先儲存一份未加標記嘅副本就可以直接加浮水印。本 App 絕對唔會自己開相機，而你影嘅相都會同其他相一樣咁處理：喺裝置度處理，絕對唔會上載。",
  "s4.p2": "你都可以透過「檔案」App 匯入圖片。呢個功能用嘅係 iOS 標準文件揀選器，只會將你揀嘅嗰一個檔案畀本 App，唔需要任何持續性嘅權限。",
  "s4.p3": "呢啲權限只會喺你試用相關功能嗰一刻先至會要求——絕對唔會喺開啟 App 嗰陣自動要求。你可以隨時喺 iOS「設定」→「私隱與安全性」入面撤銷呢啲權限。",
  "s5.h": "你加入相片嘅資訊",

  const SUPPORTED = Object.keys(I18N);
  const RTL = new Set(['ar']);

  // ?lang= wins (that is what the app passes), then a previous choice on this
  // device, then the browser's own preference. Anything unrecognised falls back
  // to English rather than showing empty nodes.
  function resolveLang() {
    const q = new URLSearchParams(location.search).get('lang');
    let stored = null;
    try { stored = localStorage.getItem('wmk-lang'); } catch (e) {}
    for (const cand of [q, stored, ...(navigator.languages || [navigator.language || ''])]) {
      if (!cand) continue;
      if (I18N[cand]) return cand;
      const low = cand.toLowerCase();
      if (low.startsWith('zh')) {
        return /hant|tw|hk|mo/.test(low) ? 'zh-Hant' : 'zh-Hans';
      }
      const base = low.split('-')[0];
      const hit = SUPPORTED.find(l => l.toLowerCase().split('-')[0] === base);
      if (hit) return hit;
    }
    return 'en';
  }

  function applyLang(lang) {
    const dict = I18N[lang] || I18N.en;
    const root = document.documentElement;
    root.lang = lang;
    root.dir = RTL.has(lang) ? 'rtl' : 'ltr';

    document.querySelectorAll('[data-i18n]').forEach(el => {
      const v = dict[el.dataset.i18n];
      if (v !== undefined) el.innerHTML = v;   // authored strings, not user input
    });

    document.title = 'WatermarkIT \u2014 ' + (dict['hero.title'] || '');
    const pick = document.getElementById('langpick');
    if (pick) { pick.value = lang; pick.setAttribute('aria-label', dict['lang.label'] || 'Language'); }

    // Carry the choice across the site's own links so the next page opens in
    // the same language.
    document.querySelectorAll('a[href]').forEach(a => {
      const href = a.getAttribute('href');
      if (!href || !/^(index|support|privacy)\.html/.test(href)) return;
      const u = new URL(href, location.href);
      u.searchParams.set('lang', lang);
      a.setAttribute('href', u.pathname.split('/').pop() + u.search);
    });

    try { localStorage.setItem('wmk-lang', lang); } catch (e) {}
  }

  applyLang(resolveLang());

  document.getElementById('langpick').addEventListener('change', e => {
    applyLang(e.target.value);
    const u = new URL(location.href);
    u.searchParams.set('lang', e.target.value);
    history.replaceState(null, '', u);
  });

  document.getElementById('yr-privacy').textContent = new Date().getFullYear();
</script>
