  "c3.h": "Salvar predefinições",
  "c3.p": "Depois de salvar uma foto, toque em “Salvar estes ajustes como predefinição” — ou abra Predefinições na tela inicial e toque em “Criar uma predefinição”.",
  "c4.h": "Exportar e compartilhar",
  "c4.p": "Toque em Exportar, escolha a qualidade, o formato (JPEG/PNG/HEIC) e o formato de imagem, depois salve no seu Rolo da Câmera ou compartilhe diretamente.",
  "faq.title": "Perguntas frequentes",
  "q1": "Minhas fotos são enviadas para a internet?",
  "a1": "Não. O WatermarkIT processa tudo 100% no seu aparelho. Suas fotos nunca são enviadas, transmitidas a um servidor, nem compartilhadas com ninguém. Todo o processamento acontece inteiramente no seu aparelho.",
  "q2": "Quantas fotos posso marcar com marca d’água de uma vez?",
  "a2": "Até 250 de uma vez: toque em “Lote” na tela inicial. Você pode parar depois de qualquer foto, e tudo o que já foi salvo continua salvo. Para uma única foto, toque em “Marcar uma foto” — quantas vezes precisar.",
  "q3": "Posso usar meu próprio logotipo como marca d’água?",
  "a3": "Sim! No editor, mude para a aba “Logotipo” e toque em “Enviar logotipo” para importar qualquer imagem da sua galeria de fotos. Você pode redimensionar, reposicionar e ajustar a opacidade do seu logotipo. Arquivos PNG com transparência funcionam melhor.",
  "q4": "Quais formatos de exportação são suportados?",
  "a4": "O WatermarkIT exporta em JPEG (maior compatibilidade), PNG (sem perdas, preserva a transparência do logotipo) e HEIC (mesma qualidade em um arquivo menor). Você também pode escolher um formato de exportação — 1:1, 4:5, 9:16 ou 16:9, com Ajustar ou Preencher —, escolher dimensões Original, Grande ou Web, e nomear os arquivos exportados você mesmo.",
  "q5": "Posso salvar meu estilo de marca d’água para usar depois?",
  "a5": "Sim. Depois de salvar uma foto, toque em “Salvar estes ajustes como predefinição” e dê um nome. Você também pode abrir Predefinições na tela inicial e tocar em “Criar uma predefinição”. Suas predefinições aparecem ao lado das oito integradas, e também na Siri e nos Atalhos.",
  "q6": "O app está pedindo acesso à galeria de fotos. Por quê?",
  "a6": "A escolha da foto usa o seletor de fotos do iOS, que entrega ao WatermarkIT apenas as fotos que você escolher e não precisa de nenhuma permissão. Na primeira vez que você salva, o iOS pergunta se o WatermarkIT pode adicionar fotos — é tudo de que o salvamento precisa. O acesso de leitura só é pedido se você reabrir uma exportação anterior em Trabalhos recentes ou compartilhar fotos depois de salvá-las, porque as duas ações buscam a foto salva de volta na fototeca.",
  "q7": "Como apago uma predefinição personalizada?",
  "a7": "Abra Predefinições, mantenha pressionada uma das suas predefinições e escolha Apagar. As predefinições integradas não podem ser apagadas.",
  "q8": "Qual versão do iOS é necessária?",
  "a8": "O WatermarkIT requer iOS 17.0 ou posterior, e funciona tanto no iPhone quanto no iPad. A versão 1.1.4 reduziu o requisito do iOS 18 — se a App Store já disse que seu dispositivo não era compatível, vale a pena conferir de novo.",
  "q9": "O que há de novo na versão mais recente?",
  "a9": "A versão 1.1.5 aumenta o lote para 250 fotos, adiciona Siri e Atalhos, salva mais rápido e não pede mais para ver toda a sua fototeca na primeira vez que você salva. “Salvar outra cópia” em Trabalhos recentes agora usa a mesma tela de salvamento de um lote, com uma faixa de todas as fotos, e dá a cada arquivo o nome da própria foto. Antes dela, a versão 1.1.4 adicionou o tema claro — que acompanha o seu iPhone, ou fixo em Claro ou Escuro nos Ajustes — e levou o WatermarkIT ao iOS 17. A versão 1.1.3 adicionou nove idiomas, catorze no total, e a 1.1.2 traduziu o app para árabe, japonês e chinês tradicional. A versão 1.1 adicionou a assinatura à mão, o código QR, o mosaico e o copyright invisível, com 22 fontes, oito predefinições integradas e importação da câmera e dos Arquivos.",
  "q10": "Como faço para desenhar minha própria assinatura?",
  "a10": "No editor, mude para a aba Assinatura e desenhe diretamente na foto com o dedo ou o Apple Pencil. Escolha qualquer cor de tinta, e use desfazer e refazer para corrigir um traço sem começar de novo.",
  "q11": "O que são os direitos autorais invisíveis, e eles realmente sobrevivem ao recorte?",
  "a11": "Sim. Além da marca visível, o WatermarkIT pode gravar seu nome e direitos autorais nos campos IPTC e TIFF do arquivo exportado — os locais padrão onde softwares de fotos procuram informações de autoria. Como esses dados vivem no arquivo, e não nos pixels, recortar a imagem não os remove. É o seu próprio nome, nunca o nosso, e você pode desativá-lo em qualquer exportação nos Ajustes ou na tela de exportação. Vale notar que algumas redes sociais removem metadados ao recodificar o que você envia, então trate isso como uma reivindicação forte sobre sua autoria, e não como um cadeado inquebrável.",
  "contact.h": "Ainda precisa de ajuda?",
  "contact.p": "Não encontrou o que procurava? Mande um e-mail para nós e responderemos o mais rápido possível.",
  "footer.privacy": "Política de Privacidade",
  "footer.made": "Feito com ❤️ para iOS",
  "q12": "Quais idiomas o WatermarkIT suporta?",
  "a12": "Alemão, árabe, chinês (simplificado e tradicional), chinês (Hong Kong), espanhol, francês, holandês, inglês, japonês, português, russo, turco e vietnamita — quatorze idiomas a partir da versão 1.1.3. Toda a interface é traduzida, não apenas a página da App Store. O árabe é exibido da direita para a esquerda em todo o app. Você pode mudar o idioma do app nos Ajustes sem mudar o idioma do aparelho, o que é útil se você lê um segundo idioma em um aparelho configurado no seu idioma principal.",
  "q13": "Posso usar o WatermarkIT com a Siri ou os Atalhos?",
  "a13": "Sim. Diga “Marcar uma foto com o WatermarkIT”, ou adicione a ação do WatermarkIT no app Atalhos, e escolha uma foto e uma das suas predefinições. A marca é desenhada no seu dispositivo e o arquivo pronto volta para o seu atalho, para ser salvo, enviado ou passado a outra ação — sem abrir o app. As frases da Siri seguem o idioma do seu iPhone, não o idioma escolhido dentro do app."
 },
 "zh-HK": {
  "nav.privacy": "私隱",
  "lang.label": "語言",
  "trans.note": "呢個翻譯只供參考，一切以英文版為準。",
  "hero.title": "有咩可以幫到你？",
  "hero.sub": "搵吓常見問題嘅答案，或者直接同我哋聯絡。",
  "quick.title": "快速協助",
  "c1.h": "加浮水印",
  "c1.p": "㩒「為相片加上浮水印」，揀「相片圖庫」、「拍照」或者『從「檔案」選擇』——再喺編輯器入面加文字、標誌、簽名或者 QR 碼。",
  "c2.h": "批次模式",
  "c2.p": "喺主畫面㩒「批次」，就可以揀最多 250 張相片，全部套用同一個浮水印。",
  "c3.h": "儲存預設集",
  "c3.p": "儲存相片之後，㩒「將這些設定儲存為預設集」——或者喺主畫面打開「預設集」，㩒「建立預設集」。",
  "c4.h": "匯出同分享",
  "c4.p": "㩒「匯出」，揀質素、格式（JPEG/PNG/HEIC）同形狀，然後儲存落相機膠卷或者直接分享。",
  "faq.title": "常見問題",
  "q1": "我嘅相會唔會上載去互聯網？",
  "a1": "唔會。WatermarkIT 百分百喺你部裝置度處理所有嘢。你嘅相絕對唔會上載、傳去伺服器，或者分享畀任何人。所有處理都完全喺你部裝置度進行。",
  "q2": "一次可以幫幾多張相加浮水印？",
  "a2": "一次最多 250 張：喺主畫面㩒「批次」。你可以喺任何一張之後停，已經儲存咗嘅都會保留。一張相就㩒「為相片加上浮水印」——要幾多次就重複幾多次。",
  "q3": "我可唔可以用自己嘅標誌做浮水印？",
  "a3": "梗係得！喺編輯器入面轉去「標誌」分頁，㩒「上傳標誌」就可以由你嘅相簿匯入任何圖片。你可以調校標誌嘅大細、位置同透明度。有透明背景嘅 PNG 檔效果最好。",
  "q4": "支援邊啲匯出格式？",
  "a4": "WatermarkIT 支援匯出做 JPEG（兼容性最廣）、PNG（無損，保留標誌透明度）同 HEIC（同等質素，檔案細啲）。你仲可以揀匯出形狀——1:1、4:5、9:16 或者 16:9，用符合或者填滿——揀原始、大型或者網頁尺寸，仲可以自己改檔名。",
  "q5": "我可唔可以將浮水印風格儲存起身，遲啲再用？",
  "a5": "得。儲存相片之後，㩒「將這些設定儲存為預設集」再改個名。你亦可以喺主畫面打開「預設集」，㩒「建立預設集」。你嘅預設集會同八組內建預設集一齊顯示，喺 Siri 同捷徑都用得。",
  "q6": "個 App 想攞相簿權限，做咩？",
  "a6": "揀相用嘅係 iOS 相片挑選器，佢只會將你揀咗嘅相片交畀 WatermarkIT，完全唔使任何權限。第一次儲存嘅時候，iOS 會問你准唔准 WatermarkIT 加入相片——儲存只需要呢樣。只有當你喺「最近的作品」重新打開以前匯出嘅相，或者儲存之後分享相片，先會問你攞讀取權限，因為兩樣都要將已儲存嘅相片由圖庫攞返出嚟。",
  "q7": "點樣刪除自訂嘅預設集？",
  "a7": "打開「預設集」，㩒住你自己其中一個預設集，再揀「刪除」。內建預設集係刪唔到嘅。",
  "q8": "需要邊個 iOS 版本？",
  "a8": "WatermarkIT 需要 iOS 17.0 或以上版本，iPhone 同 iPad 都用得。1.1.4 版將最低要求由 iOS 18 降低咗——如果 App Store 之前話你部機唔支援，值得再睇多次。",
  "q9": "最新版本有咩新功能？",
  "a9": "1.1.5 版將一批嘅上限加到 250 張，新增 Siri 同捷徑，儲存得更快，第一次儲存時亦唔會再要求睇晒你成個相片圖庫。喺「最近的作品」用「另存一份副本」，而家會用同批次一樣嘅儲存畫面，有縮圖列睇到每一張，而且每個檔案都用返佢自己相片嘅名。之前嘅 1.1.4 版加咗淺色外觀——跟 iPhone 設定，或者喺設定度固定淺色或深色——同埋支援 iOS 17。1.1.3 版加咗九種語言，總共十四種；1.1.2 版將成個 App 翻譯做阿拉伯文、日文同繁體中文。1.1 版加咗手寫簽名、QR 碼、並排重複同隱形版權資訊，仲有 22 種字型、八組內建預設集，以及由相機同「檔案」匯入。",
  "q10": "點樣自己畫簽名？",
  "a10": "喺編輯器入面轉去「簽名」分頁，用手指或者 Apple Pencil 直接喺相片上面畫。可以揀任何墨水顏色，仲可以用還原同重做嚟修正一筆，唔使成個推翻重畫。",
  "q11": "隱形版權係咩嚟？裁剪之後真係會保留？",
  "a11": "會。除咗睇得見嘅標記之外，WatermarkIT 仲可以將你嘅姓名同版權寫入匯出檔案嘅 IPTC 同 TIFF 欄位——即係相片軟件平時搵作者資訊嗰啲標準位置。因為呢啲資料係存喺個檔案入面，唔係存喺像素度，所以裁剪張相都唔會攞走佢。呢個永遠係你自己嘅名，唔係我哋嘅，你亦可以喺「設定」或者匯出畫面入面為任何一次匯出關閉呢個功能。要留意有啲社交平台喺重新編碼上載內容嗰陣會刪走元資料，所以呢個功能應該當係對你作品嘅有力主張，而唔係一個攻不破嘅鎖。",

  const SUPPORTED = Object.keys(I18N);
  const RTL = new Set(['ar']);

  function resolveLang() {
    const q = new URLSearchParams(location.search).get('lang');
    let stored = null;
    try { stored = localStorage.getItem('wmk-lang'); } catch (e) {}
    for (const cand of [q, stored, ...(navigator.languages || [navigator.language || ''])]) {
      if (!cand) continue;
      if (I18N[cand]) return cand;
      const low = cand.toLowerCase();
      if (low.startsWith('zh')) {
        // Hong Kong gets its own dedicated locale (distinct in-app wording
        // from Taiwan); Macau has no locale of its own and reads Taiwan's.
        if (low.includes('hk')) return 'zh-HK';
        return /hant|tw|mo/.test(low) ? 'zh-Hant' : 'zh-Hans';
      }
      if (low.startsWith('es')) {
        // es-ES (Spain) is its own locale; every other Spanish-speaking
        // region (Mexico and, absent a metadata locale of their own, the
        // rest of Latin America) reads es-MX — there is no separate App
        // Store Connect locale for Argentina, Colombia, Chile, etc., and
        // es-MX is the one this app's own metadata uses to reach them.
        const region = low.split('-')[1];
        return region === 'es' ? 'es-ES' : 'es-MX';
      }
      const base = low.split('-')[0];
      const hit = SUPPORTED.find(l => l.toLowerCase().split('-')[0] === base);
      if (hit) return hit;
    }
    return 'en';
  }

  function applyLang(lang) {
    const dict = I18N[lang] || I18N.en;
    const root = document.documentElement;
    root.lang = lang;
    root.dir = RTL.has(lang) ? 'rtl' : 'ltr';

    document.querySelectorAll('[data-i18n]').forEach(el => {
      const v = dict[el.dataset.i18n];
      if (v !== undefined) el.innerHTML = v;   // authored strings, not user input
    });

    document.title = 'WatermarkIT \u2014 ' + (dict['hero.title'] || '');
    const pick = document.getElementById('langpick');
    if (pick) { pick.value = lang; pick.setAttribute('aria-label', dict['lang.label'] || 'Language'); }

    document.querySelectorAll('a[href]').forEach(a => {
      const href = a.getAttribute('href');
      if (!href || !/^(index|support|privacy)\.html/.test(href)) return;
      const u = new URL(href, location.href);
      u.searchParams.set('lang', lang);
      a.setAttribute('href', u.pathname.split('/').pop() + u.search);
    });

    try { localStorage.setItem('wmk-lang', lang); } catch (e) {}
  }

  applyLang(resolveLang());

  document.getElementById('langpick').addEventListener('change', e => {
    applyLang(e.target.value);
    const u = new URL(location.href);
    u.searchParams.set('lang', e.target.value);
    history.replaceState(null, '', u);
  });

  document.getElementById('yr-support').textContent = new Date().getFullYear();
</script>
