<html lang="en">

<head>

  <title>WatermarkIT — Support</title>
  <meta name="description"
    content="Get help with WatermarkIT — the free, private iOS watermarking app. Browse FAQs or contact us directly." />
  <link rel="icon" type="image/png" href="appicon.png" />
  <link rel="apple-touch-icon" href="appicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --green: #0B8340;
      --green-light: #30D158;
      --green-dark: #04331A;
      --gradient: linear-gradient(135deg, #04642F 0%, #0B8340 100%);
      --bg: #0C0C0E;
      --surface: #161618;
      --surface2: #1D1D20;
      --border: rgba(255, 255, 255, 0.08);
      --text: #F0F0F2;
      --muted: #98989E;
      --radius: 16px;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, sans-serif;
      line-height: 1.6;
      min-height: 100vh;
    }

    /* NAV */
    nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(10, 10, 15, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
    }

    .nav-inner {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--text);
      font-weight: 700;
      font-size: 18px;
    }

    .logo-icon {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      object-fit: cover;
    }

    .nav-link {
      color: var(--muted);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      transition: color 0.2s;
    }

    .nav-link:hover {
      color: var(--text);
    }

    /* HERO */
    .hero {
      background: var(--gradient);
      padding: 80px 24px 100px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .hero::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 0;
      right: 0;
      height: 60px;
      background: var(--bg);
      clip-path: ellipse(60% 100% at 50% 100%);
    }

    .hero h1 {
      font-size: clamp(32px, 5vw, 52px);
      font-weight: 800;
      letter-spacing: -1px;
      margin-bottom: 16px;
    }

    .hero p {
      font-size: 18px;
      opacity: 0.85;
      max-width: 480px;
      margin: 0 auto;
    }

    /* CONTENT */
    .content {
      max-width: 900px;
      margin: 0 auto;
      padding: 64px 24px 100px;
    }

    /* SECTION TITLES */
    .section-title {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 24px;
      letter-spacing: -0.3px;
    }

    /* QUICK CARDS */
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 64px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px 24px;
      transition: border-color 0.2s, transform 0.2s;
    }

    .card:hover {
      border-color: var(--green-light);
      transform: translateY(-2px);
    }

    .card-icon {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      background: rgba(48, 209, 88, 0.18);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 14px;
      font-size: 22px;
    }

    .card h3 {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .card p {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.5;
    }

    /* FAQ */
    .faq {
      margin-bottom: 64px;
    }

    .faq-item {
      border-bottom: 1px solid var(--border);
    }

    .faq-question {
      width: 100%;
      background: none;
      border: none;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      font-weight: 600;
      text-align: left;
      padding: 20px 0;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      transition: color 0.2s;
    }

    .faq-question:hover {
      color: var(--green-light);
    }

    .faq-arrow {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
      border-radius: 50%;
      background: var(--surface2);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.3s, background 0.2s;
    }

    .faq-arrow svg {
      width: 10px;
      height: 10px;
      fill: none;
      stroke: var(--muted);
      stroke-width: 2;
    }

    .faq-item.open .faq-arrow {
      transform: rotate(180deg);
      background: rgba(48, 209, 88, 0.2);
    }

    .faq-item.open .faq-arrow svg {
      stroke: var(--green-light);
    }

    .faq-answer {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.7;
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.35s ease, padding 0.3s;
    }

    .faq-item.open .faq-answer {
      max-height: 300px;
      padding-bottom: 20px;
    }

    /* CONTACT */
    .contact-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 40px;
      text-align: center;
    }

    .contact-box h2 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .contact-box p {
      color: var(--muted);
      font-size: 15px;
      margin-bottom: 28px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--gradient);
      color: white;
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      font-weight: 600;
      padding: 14px 28px;
      border-radius: 100px;
      text-decoration: none;
      border: none;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.2s;
    }

    .btn:hover {
      opacity: 0.9;
      transform: scale(1.02);
    }

    /* FOOTER */
    footer {
      border-top: 1px solid var(--border);
      padding: 32px 24px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }

    footer a {
      color: var(--green-light);
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }

    /* ── i18n ───────────────────────────────────── */
    .langpick {
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 100px;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 500;
      padding: 7px 12px;
      cursor: pointer;
      appearance: none;
    }
    .langpick:focus-visible { outline: 2px solid var(--green-light); outline-offset: 2px; }
    .trans-note {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
      border-inline-start: 2px solid var(--border);
      padding-inline-start: 12px;
      margin-bottom: 28px;
    }
    .trans-note:empty { display: none; }
    [dir="rtl"] .faq-question { text-align: right; }
    :lang(ar) body { font-family: 'Inter', 'Geeza Pro', system-ui, sans-serif; }
    :lang(ja) body { font-family: 'Inter', 'Hiragino Sans', 'Yu Gothic', system-ui, sans-serif; }
    :lang(zh-Hans) body { font-family: 'Inter', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif; }
    :lang(zh-Hant) body { font-family: 'Inter', 'PingFang TC', 'Microsoft JhengHei', system-ui, sans-serif; }
  </style>
</head>

  function toggle(btn) {
    const item = btn.closest('.faq-item');
    const isOpen = item.classList.contains('open');
    document.querySelectorAll('.faq-item.open').forEach(el => el.classList.remove('open'));
    if (!isOpen) item.classList.add('open');
  }

  const SUPPORTED = Object.keys(I18N);
  const RTL = new Set(['ar']);

  function resolveLang() {
    const q = new URLSearchParams(location.search).get('lang');
    let stored = null;
    try { stored = localStorage.getItem('wmk-lang'); } catch (e) {}
    for (const cand of [q, stored, ...(navigator.languages || [navigator.language || ''])]) {
      if (!cand) continue;
      if (I18N[cand]) return cand;
      const low = cand.toLowerCase();
      if (low.startsWith('zh')) {
        return /hant|tw|hk|mo/.test(low) ? 'zh-Hant' : 'zh-Hans';
      }
      const base = low.split('-')[0];
      const hit = SUPPORTED.find(l => l.toLowerCase().split('-')[0] === base);
      if (hit) return hit;
    }
    return 'en';
  }

  function applyLang(lang) {
    const dict = I18N[lang] || I18N.en;
    const root = document.documentElement;
    root.lang = lang;
    root.dir = RTL.has(lang) ? 'rtl' : 'ltr';

    document.querySelectorAll('[data-i18n]').forEach(el => {
      const v = dict[el.dataset.i18n];
      if (v !== undefined) el.innerHTML = v;   // authored strings, not user input
    });

    document.title = 'WatermarkIT \u2014 ' + (dict['hero.title'] || '');
    const pick = document.getElementById('langpick');
    if (pick) { pick.value = lang; pick.setAttribute('aria-label', dict['lang.label'] || 'Language'); }

    document.querySelectorAll('a[href]').forEach(a => {
      const href = a.getAttribute('href');
      if (!href || !/^(index|support|privacy)\.html/.test(href)) return;
      const u = new URL(href, location.href);
      u.searchParams.set('lang', lang);
      a.setAttribute('href', u.pathname.split('/').pop() + u.search);
    });

    try { localStorage.setItem('wmk-lang', lang); } catch (e) {}
  }

  applyLang(resolveLang());

  document.getElementById('langpick').addEventListener('change', e => {
    applyLang(e.target.value);
    const u = new URL(location.href);
    u.searchParams.set('lang', e.target.value);
    history.replaceState(null, '', u);
  });

  document.getElementById('yr-support').textContent = new Date().getFullYear();
</script>
