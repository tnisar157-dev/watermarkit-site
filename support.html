<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WatermarkIT — Support</title>
  <meta name="description"
    content="Get help with WatermarkIT — the private iOS watermarking app. Browse FAQs or contact us directly." />
  <link rel="icon" type="image/png" href="appicon.png" />
  <link rel="apple-touch-icon" href="appicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --green: #0B8340;
      --green-light: #30D158;
      --green-dark: #04331A;
      --gradient: linear-gradient(135deg, #04642F 0%, #0B8340 100%);
      --bg: #0C0C0E;
      --surface: #161618;
      --surface2: #1D1D20;
      --border: rgba(255, 255, 255, 0.08);
      --text: #F0F0F2;
      --muted: #98989E;
      --radius: 16px;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, sans-serif;
      line-height: 1.6;
      min-height: 100vh;
    }

    /* NAV */
    nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(10, 10, 15, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
    }

    .nav-inner {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--text);
      font-weight: 700;
      font-size: 18px;
    }

    .logo-icon {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      object-fit: cover;
    }

    .nav-link {
      color: var(--muted);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      transition: color 0.2s;
    }

    .nav-link:hover {
      color: var(--text);
    }

    /* HERO */
    .hero {
      background: var(--gradient);
      padding: 80px 24px 100px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .hero::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 0;
      right: 0;
      height: 60px;
      background: var(--bg);
      clip-path: ellipse(60% 100% at 50% 100%);
    }

    .hero h1 {
      font-size: clamp(32px, 5vw, 52px);
      font-weight: 800;
      letter-spacing: -1px;
      margin-bottom: 16px;
    }

    .hero p {
      font-size: 18px;
      opacity: 0.85;
      max-width: 480px;
      margin: 0 auto;
    }

    /* CONTENT */
    .content {
      max-width: 900px;
      margin: 0 auto;
      padding: 64px 24px 100px;
    }

    /* SECTION TITLES */
    .section-title {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 24px;
      letter-spacing: -0.3px;
    }

    /* QUICK CARDS */
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 64px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px 24px;
      transition: border-color 0.2s, transform 0.2s;
    }

    .card:hover {
      border-color: var(--green-light);
      transform: translateY(-2px);
    }

    .card-icon {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      background: rgba(48, 209, 88, 0.18);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 14px;
      font-size: 22px;
    }

    .card h3 {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .card p {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.5;
    }

    /* FAQ */
    .faq {
      margin-bottom: 64px;
    }

    .faq-item {
      border-bottom: 1px solid var(--border);
    }

    .faq-question {
      width: 100%;
      background: none;
      border: none;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      font-weight: 600;
      text-align: left;
      padding: 20px 0;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      transition: color 0.2s;
    }

    .faq-question:hover {
      color: var(--green-light);
    }

    .faq-arrow {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
      border-radius: 50%;
      background: var(--surface2);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.3s, background 0.2s;
    }

    .faq-arrow svg {
      width: 10px;
      height: 10px;
      fill: none;
      stroke: var(--muted);
      stroke-width: 2;
    }

    .faq-item.open .faq-arrow {
      transform: rotate(180deg);
      background: rgba(48, 209, 88, 0.2);
    }

    .faq-item.open .faq-arrow svg {
      stroke: var(--green-light);
    }

    .faq-answer {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.7;
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.35s ease, padding 0.3s;
    }

    .faq-item.open .faq-answer {
      max-height: 300px;
      padding-bottom: 20px;
    }

    /* CONTACT */
    .contact-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 40px;
      text-align: center;
    }

    .contact-box h2 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .contact-box p {
      color: var(--muted);
      font-size: 15px;
      margin-bottom: 28px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--gradient);
      color: white;
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      font-weight: 600;
      padding: 14px 28px;
      border-radius: 100px;
      text-decoration: none;
      border: none;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.2s;
    }

    .btn:hover {
      opacity: 0.9;
      transform: scale(1.02);
    }

    /* FOOTER */
    footer {
      border-top: 1px solid var(--border);
      padding: 32px 24px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }

    footer a {
      color: var(--green-light);
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }

    /* ── i18n ───────────────────────────────────── */
    .langpick {
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 100px;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 500;
      padding: 7px 12px;
      cursor: pointer;
      appearance: none;
    }
    .langpick:focus-visible { outline: 2px solid var(--green-light); outline-offset: 2px; }
    .trans-note {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
      border-inline-start: 2px solid var(--border);
      padding-inline-start: 12px;
      margin-bottom: 28px;
    }
    .trans-note:empty { display: none; }
    /* Fourteen languages made 'Português (Brasil)' the longest option, and a
       native <select>'s closed width follows its widest option, not the
       selected one — capping it with an ellipsis keeps the box a constant,
       predictable size regardless of which language (or how many) are added.
       The open dropdown is unaffected and still shows every option in full. */
    @media (max-width: 480px) {
      .nav-inner { padding: 0 16px; }
      .langpick { max-width: 84px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      /* Several of the fourteen languages' short forms (Russian, French,
         Portuguese...) still ran the fixed English wordmark + link + picker
         past 375px even after nav.privacy was shortened — the wordmark is a
         brand name and does not translate down. The footer repeats this same
         link on both pages, so hiding it here loses no destination, only a
         redundant shortcut, matching the CTA already dropped on index.html
         at this width. */
      .nav-link { display: none; }
    }
    [dir="rtl"] .faq-question { text-align: right; }
    :lang(ar) body { font-family: 'Inter', 'Geeza Pro', system-ui, sans-serif; }
    :lang(ja) body { font-family: 'Inter', 'Hiragino Sans', 'Yu Gothic', system-ui, sans-serif; }
    :lang(zh-Hans) body { font-family: 'Inter', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif; }
    :lang(zh-Hant) body { font-family: 'Inter', 'PingFang TC', 'Microsoft JhengHei', system-ui, sans-serif; }
    :lang(zh-HK) body { font-family: 'Inter', 'PingFang HK', 'PingFang TC', system-ui, sans-serif; }
    :lang(ru) body { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    :lang(vi) body { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    :lang(tr) body { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
  </style>
</head>

<script>
  function toggle(btn) {
    const item = btn.closest('.faq-item');
    const isOpen = item.classList.contains('open');
    document.querySelectorAll('.faq-item.open').forEach(el => el.classList.remove('open'));
    if (!isOpen) item.classList.add('open');
  }

  // Translations. English is the source text and stays authoritative.
  const I18N = {
 "en": {
  "nav.privacy": "Privacy",
  "lang.label": "Language",
  "trans.note": "",
  "hero.title": "How can we help?",
  "hero.sub": "Find answers to common questions or get in touch with us directly.",
  "quick.title": "Quick Help",
  "c1.h": "Add a Watermark",
  "c1.p": "Tap “Watermark a Photo” and choose Photo Library, Take a Photo or Choose from Files — then add text, a logo, a signature or a QR code in the editor.",
  "c2.h": "Batch Mode",
  "c2.p": "Tap “Batch” on the home screen to select up to 250 photos and apply the same watermark to all of them.",
  "c3.h": "Save Presets",
  "c3.p": "After saving a photo, tap “Save these settings as a preset” — or open Presets from the home screen and tap “Create a Preset”.",
  "c4.h": "Export &amp; Share",
  "c4.p": "Tap Export, choose your quality, format (JPEG/PNG/HEIC) and shape, then save to your Camera Roll or share directly.",
  "faq.title": "Frequently Asked Questions",
  "q1": "Are my photos uploaded to the internet?",
  "a1": "No. WatermarkIT processes everything 100% on your device. Your photos are never uploaded, sent to a server, or shared with anyone. All processing happens entirely on your device.",
  "q2": "How many photos can I watermark at once?",
  "a2": "Up to 250 in one run: tap “Batch” on the home screen. You can stop a run after any photo, and everything saved so far stays saved. For a single photo, tap “Watermark a Photo” — repeat as many times as you need.",
  "q3": "Can I use my own logo as a watermark?",
  "a3": "Yes! In the editor, switch to the “Logo” tab and tap “Upload Logo” to import any image from your photo library. You can resize, reposition, and set the opacity of your logo. PNG files with transparency work best.",
  "q4": "What export formats are supported?",
  "a4": "WatermarkIT exports in JPEG (widest compatibility), PNG (lossless, preserves logo transparency) and HEIC (same quality at a smaller size). You can also pick an export shape — 1:1, 4:5, 9:16 or 16:9, with Fit or Fill — choose Original, Large or Web dimensions, and name the exported files yourself.",
  "q5": "Can I save my watermark style for later?",
  "a5": "Yes. After you save a photo, tap “Save these settings as a preset” and give it a name. You can also open Presets from the home screen and tap “Create a Preset”. Your presets appear alongside the eight built-in ones, and in Siri and Shortcuts too.",
  "q6": "The app is asking for photo library access. Why?",
  "a6": "Choosing a photo uses the iOS photo picker, which hands WatermarkIT only the photos you pick and needs no permission at all. The first time you save, iOS asks to let WatermarkIT add photos — that is all saving needs. Read access is asked for only if you reopen a past export from Recent work or share photos after saving, because both copy your saved photo back out of the library.",
  "q7": "How do I delete a custom preset?",
  "a7": "Open Presets, press and hold one of your own presets, and choose Delete. The built-in presets cannot be deleted.",
  "q8": "What iOS version is required?",
  "a8": "WatermarkIT requires iOS 17.0 or later, and works on both iPhone and iPad. Version 1.1.4 lowered the requirement from iOS 18 — if the App Store previously told you your device was not supported, it is worth another look.",
  "q9": "What is new in the latest version?",
  "a9": "Version 1.1.5 raises a batch to 250 photos, adds Siri and Shortcuts, saves faster, and no longer asks to see your whole photo library the first time you save. “Save another copy” from Recent work now uses the same saving screen as a batch, with a filmstrip of every photo, and names each file after its own photo. Version 1.1.4 before it added a light theme — follow your iPhone, or pin Light or Dark in Settings — and brought WatermarkIT to iOS 17. Version 1.1.3 added nine more languages for fourteen in total, and 1.1.2 translated the app into Arabic, Japanese and Traditional Chinese. Version 1.1 added the signature, QR code, tiling and invisible copyright, along with 22 typefaces, eight built-in presets, and camera and Files import.",
  "q10": "How do I draw my own signature?",
  "a10": "In the editor, switch to the Signature tab and draw directly on the photo with your finger or Apple Pencil. Pick any ink colour, and use undo and redo to fix a stroke without starting over.",
  "q11": "What is the invisible copyright, and does it really survive cropping?",
  "a11": "Yes. Alongside the visible mark, WatermarkIT can write your name and copyright into the exported file’s IPTC and TIFF fields — the standard places photo software looks for authorship. Because that data lives in the file rather than in the pixels, cropping the image does not remove it. It is your own name, never ours, and you can turn it off for any export in Settings or on the Export sheet. Note that some social platforms strip metadata when they re-encode uploads, so treat it as a strong claim to your work rather than an unbreakable lock.",
  "contact.h": "Still need help?",
  "contact.p": "Can’t find what you’re looking for? Send us an email and we’ll get back to you as soon as possible.",
  "footer.privacy": "Privacy Policy",
  "footer.made": "Made with ❤️ for iOS",
  "q12": "What languages does WatermarkIT support?",
  "a12": "Arabic, Dutch, English, French, German, Japanese, Portuguese, Russian, Simplified and Traditional Chinese, Chinese (Hong Kong), Spanish, Turkish and Vietnamese — fourteen languages as of version 1.1.3. The entire interface is translated, not only the App Store listing. Arabic is laid out right to left throughout. You can change the app’s language in Settings without changing your device language, which is useful if you read a second language on a device set to a first one.",
  "q13": "Can I use WatermarkIT with Siri or Shortcuts?",
  "a13": "Yes. Say “Watermark a photo with WatermarkIT”, or add WatermarkIT’s action in the Shortcuts app, then pick a photo and one of your presets. The mark is drawn on your device and the finished file is handed back to your shortcut, so it can be saved, sent or passed to another action — without opening the app. Siri phrases follow your iPhone’s language, not the language chosen inside the app."
 },
 "ar": {
  "nav.privacy": "الخصوصية",
  "lang.label": "اللغة",
  "trans.note": "هذه الترجمة مقدّمة للتسهيل فقط، والنسخة الإنجليزية هي المرجع المعتمد.",
  "hero.title": "كيف يمكننا مساعدتك؟",
  "hero.sub": "اعثر على إجابات للأسئلة الشائعة أو تواصل معنا مباشرة.",
  "quick.title": "مساعدة سريعة",
  "c1.h": "إضافة علامة مائية",
  "c1.p": "اضغط على «ضع علامة على صورة» واختر «مكتبة الصور» أو «التقاط صورة» أو «اختيار من الملفات» — ثم أضف نصًا أو شعارًا أو توقيعًا أو رمز QR في المحرر.",
  "c2.h": "الوضع الدفعي",
  "c2.p": "اضغط على «دفعة» في الشاشة الرئيسية لتحديد حتى 250 صورة وتطبيق العلامة المائية نفسها عليها جميعًا.",
  "c3.h": "حفظ الإعدادات المسبقة",
  "c3.p": "بعد حفظ صورة، اضغط على «حفظ هذه الإعدادات كإعداد مسبق» — أو افتح «الإعدادات المسبقة» من الشاشة الرئيسية واضغط على «إنشاء إعداد مسبق».",
  "c4.h": "التصدير والمشاركة",
  "c4.p": "اضغط تصدير، واختر الجودة والصيغة (JPEG/PNG/HEIC) والشكل، ثم احفظ في ألبوم الصور أو شارك مباشرة.",
  "faq.title": "الأسئلة الشائعة",
  "q1": "هل تُرفع صوري إلى الإنترنت؟",
  "a1": "لا. يعالج WatermarkIT كل شيء على جهازك بنسبة 100%. لا تُرفع صورك أبدًا ولا تُرسل إلى خادم ولا تُشارك مع أي جهة. تتم كل المعالجة على جهازك بالكامل.",
  "q2": "كم عدد الصور التي يمكنني وضع علامة عليها دفعة واحدة؟",
  "a2": "حتى 250 صورة في تشغيل واحد: اضغط على «دفعة» في الشاشة الرئيسية. يمكنك إيقاف التشغيل بعد أي صورة، ويبقى كل ما حُفظ محفوظًا. ولصورة واحدة، اضغط على «ضع علامة على صورة» — وكرّر ذلك كلما احتجت.",
  "q3": "هل يمكنني استخدام شعاري الخاص كعلامة مائية؟",
  "a3": "نعم! في المحرر، انتقل إلى تبويب «الشعار» واضغط «رفع شعار» لاستيراد أي صورة من مكتبتك. يمكنك تغيير الحجم والموضع والشفافية. وملفات PNG ذات الخلفية الشفافة هي الأنسب.",
  "q4": "ما صيغ التصدير المدعومة؟",
  "a4": "يصدّر WatermarkIT بصيغة JPEG (الأوسع توافقًا) وPNG (بلا فقد، ويحافظ على شفافية الشعار) وHEIC (الجودة نفسها بحجم أصغر). كما يمكنك اختيار شكل التصدير — 1:1 أو 4:5 أو 9:16 أو 16:9 مع ملاءمة أو ملء — واختيار أبعاد أصلية أو كبيرة أو للويب، وتسمية الملفات بنفسك.",
  "q5": "هل يمكنني حفظ نمط العلامة لاستخدامه لاحقًا؟",
  "a5": "نعم. بعد حفظ صورة، اضغط على «حفظ هذه الإعدادات كإعداد مسبق» وأعطه اسمًا. ويمكنك أيضًا فتح «الإعدادات المسبقة» من الشاشة الرئيسية والضغط على «إنشاء إعداد مسبق». تظهر إعداداتك إلى جانب الإعدادات الثمانية المدمجة، وفي Siri والاختصارات أيضًا.",
  "q6": "لماذا يطلب التطبيق الوصول إلى مكتبة الصور؟",
  "a6": "يستخدم اختيار الصورة منتقي الصور في iOS، الذي لا يسلّم WatermarkIT إلا الصور التي تختارها ولا يحتاج إلى أي إذن. عند الحفظ لأول مرة يطلب iOS السماح لـ WatermarkIT بإضافة الصور — وهذا كل ما يحتاجه الحفظ. ولا يُطلب إذن القراءة إلا إذا أعدت فتح تصدير سابق من «الأعمال الأخيرة» أو شاركت الصور بعد حفظها، لأن كليهما ينسخ صورتك المحفوظة من المكتبة.",
  "q7": "كيف أحذف إعدادًا مسبقًا خاصًا؟",
  "a7": "افتح «الإعدادات المسبقة»، ثم اضغط مطولًا على أحد إعداداتك واختر «حذف». لا يمكن حذف الإعدادات المسبقة المدمجة.",
  "q8": "ما إصدار iOS المطلوب؟",
  "a8": "يتطلب WatermarkIT نظام iOS 17.0 أو أحدث، ويعمل على iPhone وiPad. خفّض الإصدار 1.1.4 الحد الأدنى من iOS 18 — فإن أخبرك App Store سابقًا بأن جهازك غير مدعوم، فالأمر يستحق نظرة أخرى.",
  "q9": "ما الجديد في أحدث إصدار؟",
  "a9": "يرفع الإصدار 1.1.5 الدفعة إلى 250 صورة، ويضيف Siri والاختصارات، ويحفظ بسرعة أكبر، ولم يعد يطلب الاطلاع على مكتبة صورك كلها عند الحفظ لأول مرة. وأصبح «حفظ نسخة أخرى» من «الأعمال الأخيرة» يستخدم شاشة الحفظ نفسها التي في الدفعات، مع شريط يعرض كل صورة، ويسمّي كل ملف باسم صورته. وقبله أضاف الإصدار 1.1.4 مظهرًا فاتحًا — يتبع جهازك أو يُثبَّت على الفاتح أو الداكن من الإعدادات — وجعل WatermarkIT يعمل على iOS 17. وأضاف الإصدار 1.1.3 تسع لغات ليصبح المجموع أربع عشرة، وترجم الإصدار 1.1.2 التطبيق إلى العربية واليابانية والصينية التقليدية. أما الإصدار 1.1 فأضاف التوقيع ورمز QR والتكرار وحقوق النشر غير المرئية، مع 22 خطًا وثمانية إعدادات مسبقة مدمجة والاستيراد من الكاميرا والملفات.",
  "q10": "كيف أرسم توقيعي؟",
  "a10": "في المحرر، انتقل إلى تبويب التوقيع وارسم مباشرة على الصورة بإصبعك أو بقلم Apple Pencil. اختر أي لون حبر، واستخدم التراجع والإعادة لتصحيح خط دون البدء من جديد.",
  "q11": "ما حقوق النشر غير المرئية، وهل تصمد فعلًا أمام الاقتصاص؟",
  "a11": "نعم. إلى جانب العلامة المرئية، يمكن لـ WatermarkIT كتابة اسمك وحقوق النشر في حقلي IPTC وTIFF بالملف المُصدَّر، وهما المكانان القياسيان اللذان تبحث فيهما برامج الصور عن نسبة العمل. ولأن هذه البيانات موجودة في الملف لا في وحدات البكسل، فإن اقتصاص الصورة لا يزيلها. إنه اسمك أنت لا اسمنا، ويمكنك إيقافه لأي تصدير من الإعدادات أو من ورقة التصدير. لاحظ أن بعض منصات التواصل تحذف البيانات عند إعادة ترميز الملفات المرفوعة، فاعتبره إثباتًا قويًا لعملك لا قفلًا لا يُكسر.",
  "contact.h": "ما زلت بحاجة إلى مساعدة؟",
  "contact.p": "لم تجد ما تبحث عنه؟ راسلنا بالبريد الإلكتروني وسنرد عليك في أقرب وقت ممكن.",
  "footer.privacy": "سياسة الخصوصية",
  "footer.made": "صُنع بـ ❤️ لـ iOS",
  "q12": "ما اللغات التي يدعمها WatermarkIT؟",
  "a12": "الألمانية والعربية والصينية (المبسطة والتقليدية) والصينية (هونغ كونغ) والإسبانية والفرنسية والإنجليزية والهولندية واليابانية والبرتغالية والروسية والتركية والفيتنامية — أربع عشرة لغة اعتبارًا من الإصدار 1.1.3. الواجهة مترجمة بالكامل، لا قائمة App Store وحدها. وتُعرض العربية من اليمين إلى اليسار في كل الشاشات. ويمكنك تغيير لغة التطبيق من الإعدادات دون تغيير لغة جهازك، وهو أمر مفيد إن كنت تقرأ لغة ثانية على جهاز مضبوط على لغة أولى.",
  "q13": "هل يمكنني استخدام WatermarkIT مع Siri أو الاختصارات؟",
  "a13": "نعم. قل «ضع علامة على صورة باستخدام WatermarkIT»، أو أضف إجراء WatermarkIT في تطبيق الاختصارات، ثم اختر صورة وأحد إعداداتك المسبقة. تُرسم العلامة على جهازك ويعود الملف النهائي إلى الاختصار، ليُحفظ أو يُرسل أو يُمرَّر إلى إجراء آخر — دون فتح التطبيق. تتبع عبارات Siri لغة جهازك، لا اللغة المختارة داخل التطبيق."
 },
 "ja": {
  "nav.privacy": "プライバシー",
  "lang.label": "言語",
  "trans.note": "この翻訳は便宜上のものであり、正文は英語版です。",
  "hero.title": "お困りですか？",
  "hero.sub": "よくある質問から答えを探すか、直接お問い合わせください。",
  "quick.title": "クイックヘルプ",
  "c1.h": "透かしを入れる",
  "c1.p": "「写真に透かしを入れる」をタップし、「写真ライブラリ」「写真を撮る」『「ファイル」から選択』のいずれかを選んで、エディタでテキスト、ロゴ、サイン、QR コードを追加します。",
  "c2.h": "バッチモード",
  "c2.p": "ホーム画面の「一括」をタップすると、最大 250 枚の写真を選んで同じ透かしをまとめて適用できます。",
  "c3.h": "プリセットを保存",
  "c3.p": "写真を保存したあとに「この設定をプリセットとして保存」をタップ。またはホーム画面から「プリセット」を開いて「プリセットを作成」をタップします。",
  "c4.h": "書き出しと共有",
  "c4.p": "書き出しをタップし、品質・フォーマット（JPEG／PNG／HEIC）・形状を選んで、カメラロールに保存するか直接共有します。",
  "faq.title": "よくある質問",
  "q1": "写真はインターネットにアップロードされますか？",
  "a1": "いいえ。WatermarkIT はすべてを 100% お使いのデバイス内で処理します。写真がアップロードされたり、サーバーに送信されたり、誰かと共有されたりすることはありません。処理はすべてデバイス内で完結します。",
  "q2": "一度に何枚の写真に透かしを入れられますか？",
  "a2": "1 回の実行で最大 250 枚です。ホーム画面の「一括」をタップしてください。どの写真の後でも止められ、それまでに保存した写真はそのまま残ります。1 枚だけなら「写真に透かしを入れる」をタップし、必要なだけ繰り返してください。",
  "q3": "自分のロゴを透かしに使えますか？",
  "a3": "はい。エディタで「ロゴ」タブに切り替え、「ロゴをアップロード」をタップすると写真ライブラリから任意の画像を読み込めます。サイズ、位置、不透明度を調整できます。透過のある PNG が最適です。",
  "q4": "対応している書き出し形式は？",
  "a4": "WatermarkIT は JPEG（最も互換性が高い）、PNG（可逆圧縮でロゴの透過を保持）、HEIC（同じ画質でファイルサイズが小さい）で書き出せます。書き出し形状（1:1、4:5、9:16、16:9、フィットまたはフィル）も選べるほか、オリジナル／ラージ／Web のサイズを選び、ファイル名を自分で付けられます。",
  "q5": "透かしのスタイルを保存しておけますか？",
  "a5": "はい。写真を保存したあとに「この設定をプリセットとして保存」をタップして名前を付けます。ホーム画面から「プリセット」を開き「プリセットを作成」をタップすることもできます。作成したプリセットは 8 種類の内蔵プリセットと並んで表示され、Siri やショートカットからも使えます。",
  "q6": "写真ライブラリへのアクセスを求められるのはなぜですか？",
  "a6": "写真の選択には iOS の写真ピッカーを使います。WatermarkIT に渡されるのは選んだ写真だけで、許可は一切必要ありません。初めて保存するとき、iOS が WatermarkIT に写真の追加を許可するか尋ねます。保存に必要なのはそれだけです。読み取りの許可を求めるのは、「最近の作業」から過去の書き出しを開き直すときと、保存後に写真を共有するときだけです。どちらも保存した写真をライブラリから取り出すためです。",
  "q7": "自分で作ったプリセットを削除するには？",
  "a7": "「プリセット」を開き、自分のプリセットを長押しして「削除」を選びます。内蔵のプリセットは削除できません。",
  "q8": "必要な iOS のバージョンは？",
  "a8": "WatermarkIT は iOS 17.0 以降が必要で、iPhone と iPad の両方で動作します。バージョン 1.1.4 で必要条件が iOS 18 から引き下げられました。以前 App Store で「お使いのデバイスには対応していません」と表示された場合は、もう一度確認してみてください。",
  "q9": "最新バージョンの新機能は？",
  "a9": "バージョン 1.1.5 では、一括処理が最大 250 枚になり、Siri とショートカットに対応し、保存が速くなり、初めての保存で写真ライブラリ全体へのアクセスを求めなくなりました。「最近の作業」からの「別のコピーを保存」も一括処理と同じ保存画面になり、フィルムストリップですべての写真を確認でき、各ファイルには元の写真の名前が付きます。その前の 1.1.4 ではライトテーマ（iPhone の設定に合わせるか、設定でライト／ダークに固定）が加わり、iOS 17 に対応しました。1.1.3 では 9 言語が加わって合計 14 言語に、1.1.2 ではアプリがアラビア語、日本語、繁体字中国語に翻訳されました。1.1 では手書きサイン、QR コード、タイル表示、目に見えない著作権表示が加わり、22 書体、8 種類の内蔵プリセット、カメラと「ファイル」からの読み込みにも対応しました。",
  "q10": "自分の署名を手書きするには？",
  "a10": "エディタで「署名」タブに切り替え、指または Apple Pencil で写真に直接描きます。インクの色は自由に選べ、取り消しとやり直しで一筆だけ描き直せます。",
  "q11": "目に見えない著作権表示とは何ですか。本当にトリミングされても残りますか？",
  "a11": "はい。目に見える透かしとは別に、WatermarkIT は書き出したファイルの IPTC および TIFF フィールド（写真ソフトが作者情報を探す標準的な場所）にお名前と著作権表示を書き込めます。このデータはピクセルではなくファイル自体に保存されるため、画像をトリミングしても消えません。書き込まれるのは当方ではなくお客様ご自身の名前で、設定または書き出し画面でいつでもオフにできます。ただし一部の SNS はアップロードを再エンコードする際にメタデータを削除するため、破れない鍵ではなく、著作権を強く主張する手段とお考えください。",
  "contact.h": "まだ解決しませんか？",
  "contact.p": "お探しの情報が見つからない場合は、メールでお問い合わせください。できるだけ早くご返信します。",
  "footer.privacy": "プライバシーポリシー",
  "footer.made": "iOS のために ❤️ を込めて",
  "q12": "WatermarkIT は何語に対応していますか？",
  "a12": "バージョン 1.1.3 の時点で、アラビア語、英語、オランダ語、スペイン語、ドイツ語、トルコ語、日本語、フランス語、ベトナム語、ポルトガル語、ロシア語、繁体字・簡体字中国語、中国語（香港）の 14 言語に対応しています。App Store の掲載情報だけでなく、インターフェース全体が翻訳されています。アラビア語では全画面が右から左のレイアウトになります。デバイスの言語を変えずに設定からアプリの表示言語を変更できるので、第一言語に設定した端末で第二言語を読む方にも便利です。",
  "q13": "Siri やショートカットで使えますか？",
  "a13": "はい。「WatermarkITで写真に透かしを入れる」と話しかけるか、ショートカットアプリで WatermarkIT のアクションを追加し、写真とプリセットを選びます。透かしはデバイス上で描かれ、完成したファイルがショートカットに戻るので、保存や送信、別のアクションへの受け渡しができます。アプリを開く必要はありません。Siri のフレーズは、アプリ内で選んだ言語ではなく iPhone の言語に従います。"
 },
 "zh-Hans": {
  "nav.privacy": "隐私",
  "lang.label": "语言",
  "trans.note": "本译文仅供参考，以英文版为准。",
  "hero.title": "需要什么帮助？",
  "hero.sub": "查找常见问题的答案，或直接与我们联系。",
  "quick.title": "快速帮助",
  "c1.h": "添加水印",
  "c1.p": "点按“为照片添加水印”，选择“照片图库”“拍照”或“从「文件」选择”——然后在编辑器中添加文字、标志、签名或二维码。",
  "c2.h": "批量模式",
  "c2.p": "点按主屏幕上的“批量”，最多选择 250 张照片，并为它们全部套用相同的水印。",
  "c3.h": "存储预设",
  "c3.p": "存储照片后，点按“将这些设置存储为预设”——或从主屏幕打开“预设”，点按“创建预设”。",
  "c4.h": "导出与分享",
  "c4.p": "点按导出，选择质量、格式（JPEG／PNG／HEIC）和形状，然后保存到相册或直接分享。",
  "faq.title": "常见问题",
  "q1": "我的照片会被上传到网络吗？",
  "a1": "不会。WatermarkIT 百分之百在你的设备上完成所有处理。你的照片绝不会被上传、发送到服务器或分享给任何人。所有处理都完全在设备端进行。",
  "q2": "一次可以给多少张照片加水印？",
  "a2": "单次最多 250 张：点按主屏幕上的“批量”。你可以在任意一张后停止，已存储的照片都会保留。单张照片请点按“为照片添加水印”——需要几次就重复几次。",
  "q3": "可以用我自己的徽标作为水印吗？",
  "a3": "当然可以！在编辑器中切换到“徽标”标签，点按“上传徽标”即可从照片图库导入任意图片。你可以调整大小、位置和不透明度。带透明背景的 PNG 效果最佳。",
  "q4": "支持哪些导出格式？",
  "a4": "WatermarkIT 支持导出为 JPEG（兼容性最广）、PNG（无损，保留徽标透明度）和 HEIC（同等画质、体积更小）。你还可以选择导出形状——1:1、4:5、9:16 或 16:9，并选择适应或填充——选择原始、大图或网页尺寸，并自行命名导出的文件。",
  "q5": "可以保存水印样式以便日后使用吗？",
  "a5": "可以。存储照片后，点按“将这些设置存储为预设”并为它命名。你也可以从主屏幕打开“预设”，点按“创建预设”。你的预设会与八种内置预设一起显示，也能在 Siri 和快捷指令中使用。",
  "q6": "App 为什么要请求访问照片图库？",
  "a6": "选择照片使用的是 iOS 照片选择器，它只会把你选中的照片交给 WatermarkIT，完全不需要权限。第一次存储时，iOS 会询问是否允许 WatermarkIT 添加照片——存储只需要这一项。只有当你从“最近的作品”重新打开以前导出的照片，或在存储后分享照片时，才会请求读取权限，因为这两种操作都需要把已存储的照片从图库中取回。",
  "q7": "如何删除自定义预设？",
  "a7": "打开“预设”，按住你自己的某个预设，然后选择“删除”。内置预设无法删除。",
  "q8": "需要什么版本的 iOS？",
  "a8": "WatermarkIT 需要 iOS 17.0 或更高版本，可在 iPhone 和 iPad 上使用。1.1.4 版本将最低要求从 iOS 18 下调——如果 App Store 之前提示你的设备不受支持，不妨再看一次。",
  "q9": "最新版本有哪些新功能？",
  "a9": "1.1.5 版本把批量上限提高到 250 张，新增 Siri 与快捷指令支持，存储更快，第一次存储时也不再要求访问整个照片图库。从“最近的作品”进行的“另存一份副本”现在使用与批量相同的存储界面，带有显示每张照片的缩略图栏，并以每张照片自己的名称命名文件。此前的 1.1.4 版本新增浅色外观——跟随 iPhone，或在设置中固定为浅色或深色——并支持 iOS 17。1.1.3 版本新增九种语言，共计十四种；1.1.2 版本把 App 翻译成阿拉伯语、日语与繁体中文。1.1 版本新增手写签名、二维码、平铺与隐形版权信息，并带来 22 种字体、八种内置预设，以及相机与“文件”导入。",
  "q10": "如何手写自己的签名？",
  "a10": "在编辑器中切换到签名标签，用手指或 Apple Pencil 直接在照片上书写。可选择任意墨水颜色，并用撤销和重做修正某一笔，无需从头再来。",
  "q11": "隐形版权是什么？裁剪后真的还在吗？",
  "a11": "是的。除了可见的水印，WatermarkIT 还能把你的姓名和版权信息写入导出文件的 IPTC 与 TIFF 字段——这是照片软件查找作者信息的标准位置。由于这些数据存放在文件中而非像素里，裁剪图片并不会移除它。写入的始终是你自己的名字，而非我们的，你也可以在设置或导出面板中为任意一次导出关闭它。请注意，部分社交平台在重新编码上传内容时会清除元数据，因此请把它视为对作品归属的有力主张，而非牢不可破的锁。",
  "contact.h": "仍需帮助？",
  "contact.p": "没有找到想要的答案？给我们发邮件，我们会尽快回复你。",
  "footer.privacy": "隐私政策",
  "footer.made": "为 iOS 用 ❤️ 打造",
  "q12": "WatermarkIT 支持哪些语言？",
  "a12": "截至 1.1.3 版本，支持阿拉伯语、德语、法语、荷兰语、英语、日语、葡萄牙语、俄语、西班牙语、土耳其语、简体与繁体中文、中文（香港）以及越南语，共十四种语言。翻译覆盖整个界面，而不只是 App Store 的商店页面。阿拉伯语在所有界面均采用从右至左的排版。你可以在设置中更改 App 的语言，而无需更改设备语言；如果你在设置为母语的设备上阅读第二语言，这会很方便。",
  "q13": "可以通过 Siri 或快捷指令使用 WatermarkIT 吗？",
  "a13": "可以。说出“用WatermarkIT为照片添加水印”，或在“快捷指令”App 中添加 WatermarkIT 的操作，然后选择一张照片和你的一个预设。水印在你的设备上绘制，完成的文件交回快捷指令，可用于存储、发送或传给下一个操作——无需打开 App。Siri 短语跟随 iPhone 的语言，而不是 App 内选择的语言。"
 },
 "zh-Hant": {

  "c1.h": "加入浮水印",

  "faq.title": "常見問題",
  "q1": "我的照片會被上傳到網路嗎？",
  "a1": "不會。WatermarkIT 百分之百在你的裝置上完成所有處理。你的照片絕不會被上傳、傳送到伺服器或分享給任何人。所有處理都完全在裝置端進行。",

  "q3": "可以用我自己的標誌當作浮水印嗎？",
  "a3": "當然可以！在編輯器中切換到「標誌」標籤頁，點一下「上傳標誌」即可從照片圖庫匯入任何圖片。你可以調整大小、位置與不透明度。具透明背景的 PNG 效果最佳。",
  "q4": "支援哪些匯出格式？",
  "a4": "WatermarkIT 支援匯出為 JPEG（相容性最廣）、PNG（無損，保留標誌透明度）與 HEIC（同等品質、檔案更小）。你也可以選擇匯出形狀——1:1、4:5、9:16 或 16:9，並選擇符合或填滿——選擇原始、大型或網頁尺寸，並自行為匯出的檔案命名。",
  "q5": "可以儲存浮水印樣式供日後使用嗎？",
  "a5": "可以。儲存照片後，點一下「將這些設定儲存為預設集」並為它命名。你也可以從主畫面打開「預設集」，點一下「建立預設集」。你的預設集會與八組內建預設集一起顯示，也能在 Siri 和捷徑中使用。",
  "q6": "App 為什麼要求存取照片圖庫？",
  "a6": "選擇照片使用的是 iOS 照片挑選器，它只會把你選取的照片交給 WatermarkIT，完全不需要權限。第一次儲存時，iOS 會詢問是否允許 WatermarkIT 加入照片——儲存只需要這一項。只有當你從「最近的作品」重新開啟以前匯出的照片，或在儲存後分享照片時，才會要求讀取權限，因為這兩種操作都需要把已儲存的照片從圖庫中取回。",
  "q7": "如何刪除自訂的預設集？",
  "a7": "打開「預設集」，按住你自己的某個預設集，然後選擇「刪除」。內建預設集無法刪除。",
  "q8": "需要哪個版本的 iOS？",
  "a8": "WatermarkIT 需要 iOS 17.0 或以上版本，可在 iPhone 和 iPad 上使用。1.1.4 版將最低需求從 iOS 18 調降——如果 App Store 先前告訴你裝置不受支援，不妨再看一次。",
  "q9": "最新版本有哪些新功能？",
  "a9": "1.1.5 版把批次上限提高到 250 張，新增 Siri 與捷徑支援，儲存更快，第一次儲存時也不再要求存取整個照片圖庫。從「最近的作品」進行的「另存一份副本」現在使用與批次相同的儲存畫面，附有顯示每張照片的縮圖列，並以每張照片自己的名稱為檔案命名。先前的 1.1.4 版新增淺色外觀——跟隨 iPhone，或在設定中固定為淺色或深色——並支援 iOS 17。1.1.3 版新增九種語言，共計十四種；1.1.2 版把 App 翻譯成阿拉伯文、日文與繁體中文。1.1 版新增手寫簽名、QR 碼、並排重複與隱形版權資訊，並帶來 22 種字型、八組內建預設集，以及相機與「檔案」匯入。",
  "q10": "如何手寫自己的簽名？",
  "a10": "在編輯器中切換到簽名標籤頁，用手指或 Apple Pencil 直接在照片上書寫。可選擇任何墨水顏色，並以還原和重做修正某一筆，不必重新開始。",
  "q11": "隱形版權是什麼？裁切後真的還在嗎？",
  "a11": "是的。除了可見的浮水印，WatermarkIT 還能將你的姓名與版權資訊寫入匯出檔案的 IPTC 與 TIFF 欄位——這是照片軟體尋找作者資訊的標準位置。由於這些資料存放在檔案中而非像素裡，裁切圖片並不會移除它。寫入的一律是你自己的名字，而非我們的，你也可以在設定或匯出工作表中為任何一次匯出關閉它。請注意，部分社群平台在重新編碼上傳內容時會移除中繼資料，因此請將它視為對作品歸屬的有力主張，而非牢不可破的鎖。",
  "contact.h": "仍需要協助嗎？",
  "contact.p": "沒有找到想要的答案嗎？寄電子郵件給我們，我們會盡快回覆你。",
  "footer.privacy": "隱私權政策",

  "q12": "WatermarkIT 支援哪些語言？",
  "a12": "截至 1.1.3 版，支援阿拉伯文、德文、法文、荷蘭文、英文、日文、葡萄牙文、俄文、西班牙文、土耳其文、簡體與繁體中文、中文（香港）以及越南文，共十四種語言。翻譯涵蓋整個介面，而不只是 App Store 的商店頁面。阿拉伯文在所有畫面均採用由右至左的排版。你可以在設定中更改 App 的語言，而不必更改裝置語言；如果你在設定為母語的裝置上閱讀第二語言，這會很方便。",
  "q13": "可以透過 Siri 或捷徑使用 WatermarkIT 嗎？",

 },
 "fr": {
  "nav.privacy": "Confidentialité",
  "lang.label": "Langue",
  "trans.note": "Cette traduction est fournie à titre indicatif ; la version anglaise fait foi.",
  "hero.title": "Comment pouvons-nous vous aider ?",
  "hero.sub": "Trouvez des réponses aux questions courantes ou contactez-nous directement.",
  "quick.title": "Aide rapide",
  "c1.h": "Ajouter un filigrane",
  "c1.p": "Touchez « Filigraner une photo » et choisissez Photothèque, Prendre une photo ou Choisir dans « Fichiers » — puis ajoutez du texte, un logo, une signature ou un code QR dans l’éditeur.",
  "c2.h": "Mode par lot",
  "c2.p": "Touchez « Lot » sur l’écran d’accueil pour sélectionner jusqu’à 250 photos et leur appliquer le même filigrane.",
  "c3.h": "Enregistrer des préréglages",
  "c3.p": "Après avoir enregistré une photo, touchez « Enregistrer ces réglages comme préréglage » — ou ouvrez Préréglages depuis l’écran d’accueil et touchez « Créer un préréglage ».",
  "c4.h": "Exporter et partager",
  "c4.p": "Touchez Exporter, choisissez la qualité, le format (JPEG/PNG/HEIC) et le format d’image, puis enregistrez dans votre pellicule ou partagez directement.",
  "faq.title": "Questions fréquentes",
  "q1": "Mes photos sont-elles envoyées sur Internet ?",
  "a1": "Non. WatermarkIT traite tout à 100 % sur votre appareil. Vos photos ne sont jamais envoyées, transmises à un serveur, ni partagées avec qui que ce soit. Tout le traitement se fait entièrement sur votre appareil.",
  "q2": "Combien de photos puis-je filigraner à la fois ?",
  "a2": "Jusqu’à 250 en une fois : touchez « Lot » sur l’écran d’accueil. Vous pouvez arrêter après n’importe quelle photo, et tout ce qui a déjà été enregistré le reste. Pour une seule photo, touchez « Filigraner une photo » — autant de fois que nécessaire.",
  "q3": "Puis-je utiliser mon propre logo comme filigrane ?",
  "a3": "Oui ! Dans l’éditeur, passez à l’onglet « Logo » et touchez « Importer un logo » pour importer n’importe quelle image de votre photothèque. Vous pouvez redimensionner, repositionner et régler l’opacité de votre logo. Les fichiers PNG avec transparence donnent les meilleurs résultats.",
  "q4": "Quels formats d’export sont pris en charge ?",
  "a4": "WatermarkIT exporte en JPEG (compatibilité la plus large), PNG (sans perte, préserve la transparence du logo) et HEIC (même qualité pour un fichier plus léger). Vous pouvez aussi choisir un format d’image — 1:1, 4:5, 9:16 ou 16:9, en ajustement ou en remplissage — choisir des dimensions originale, grande ou web, et nommer vous-même les fichiers exportés.",
  "q5": "Puis-je enregistrer mon style de filigrane pour plus tard ?",
  "a5": "Oui. Après avoir enregistré une photo, touchez « Enregistrer ces réglages comme préréglage » et donnez-lui un nom. Vous pouvez aussi ouvrir Préréglages depuis l’écran d’accueil et toucher « Créer un préréglage ». Vos préréglages apparaissent à côté des huit préréglages intégrés, ainsi que dans Siri et Raccourcis.",
  "q6": "L’app demande l’accès à ma photothèque. Pourquoi ?",
  "a6": "Le choix d’une photo passe par le sélecteur de photos d’iOS, qui ne transmet à WatermarkIT que les photos que vous choisissez et ne demande aucune autorisation. Au premier enregistrement, iOS vous demande d’autoriser WatermarkIT à ajouter des photos — c’est tout ce dont l’enregistrement a besoin. L’accès en lecture n’est demandé que si vous rouvrez un export passé depuis Travaux récents ou partagez des photos après les avoir enregistrées, car ces deux actions récupèrent la photo enregistrée dans la photothèque.",
  "q7": "Comment supprimer un préréglage personnalisé ?",
  "a7": "Ouvrez Préréglages, maintenez le doigt sur l’un de vos préréglages et choisissez Supprimer. Les préréglages intégrés ne peuvent pas être supprimés.",
  "q8": "Quelle version d’iOS est requise ?",
  "a8": "WatermarkIT nécessite iOS 17.0 ou ultérieur, et fonctionne sur iPhone comme sur iPad. La version 1.1.4 a abaissé l’exigence depuis iOS 18 — si l’App Store vous a indiqué auparavant que votre appareil n’était pas compatible, cela vaut la peine de revérifier.",
  "q9": "Quoi de neuf dans la dernière version ?",
  "a9": "La version 1.1.5 porte un lot à 250 photos, ajoute Siri et Raccourcis, enregistre plus vite et ne demande plus à voir toute votre photothèque au premier enregistrement. « Enregistrer une autre copie » depuis Travaux récents utilise désormais le même écran d’enregistrement qu’un lot, avec une bande montrant chaque photo, et nomme chaque fichier d’après sa propre photo. Avant elle, la version 1.1.4 a ajouté un thème clair — qui suit votre iPhone, ou fixé sur Clair ou Sombre dans les Réglages — et rendu WatermarkIT compatible avec iOS 17. La version 1.1.3 a ajouté neuf langues, pour quatorze au total, et la 1.1.2 a traduit l’app en arabe, en japonais et en chinois traditionnel. La version 1.1 a ajouté la signature manuscrite, le code QR, la mosaïque et le copyright invisible, avec 22 polices, huit préréglages intégrés et l’import depuis l’appareil photo et Fichiers.",
  "q10": "Comment dessiner ma propre signature ?",
  "a10": "Dans l’éditeur, passez à l’onglet Signature et dessinez directement sur la photo avec votre doigt ou l’Apple Pencil. Choisissez la couleur d’encre de votre choix, et utilisez annuler et rétablir pour corriger un trait sans tout recommencer.",
  "q11": "Qu’est-ce que le droit d’auteur invisible, et survit-il vraiment au recadrage ?",
  "a11": "Oui. En plus de la marque visible, WatermarkIT peut inscrire votre nom et vos droits d’auteur dans les champs IPTC et TIFF du fichier exporté — les emplacements standard où les logiciels photo recherchent la paternité de l’œuvre. Comme cette donnée vit dans le fichier plutôt que dans les pixels, recadrer l’image ne la supprime pas. C’est votre propre nom, jamais le nôtre, et vous pouvez la désactiver pour n’importe quel export depuis Réglages ou depuis la feuille d’export. Notez que certaines plateformes sociales suppriment les métadonnées lors du réencodage des fichiers envoyés, donc considérez-la comme une preuve solide plutôt qu’un verrou infaillible.",
  "contact.h": "Besoin d’aide supplémentaire ?",
  "contact.p": "Vous ne trouvez pas ce que vous cherchez ? Envoyez-nous un e-mail et nous vous répondrons dès que possible.",
  "footer.privacy": "Politique de confidentialité",
  "footer.made": "Conçu avec ❤️ pour iOS",
  "q12": "Quelles langues WatermarkIT prend-il en charge ?",
  "a12": "Allemand, anglais, arabe, chinois simplifié et traditionnel, chinois (Hong Kong), espagnol, français, japonais, néerlandais, portugais, russe, turc et vietnamien, à partir de la version 1.1.3, soit quatorze langues au total. L’intégralité de l’interface est traduite, pas seulement la fiche App Store. L’arabe s’affiche de droite à gauche partout. Vous pouvez changer la langue de l’app dans Réglages sans changer la langue de votre appareil, ce qui est utile si vous lisez une seconde langue sur un appareil réglé dans une première.",
  "q13": "Puis-je utiliser WatermarkIT avec Siri ou Raccourcis ?",
  "a13": "Oui. Dites « Filigraner une photo avec WatermarkIT », ou ajoutez l’action de WatermarkIT dans l’app Raccourcis, puis choisissez une photo et l’un de vos préréglages. La marque est dessinée sur votre appareil et le fichier terminé est renvoyé à votre raccourci, qui peut l’enregistrer, l’envoyer ou le passer à une autre action — sans ouvrir l’app. Les phrases Siri suivent la langue de votre iPhone, pas celle choisie dans l’app."
 },
 "de": {
  "nav.privacy": "Datenschutz",
  "lang.label": "Sprache",
  "trans.note": "Diese Übersetzung dient nur der Verständlichkeit; maßgeblich ist die englische Fassung.",
  "hero.title": "Wie können wir helfen?",
  "hero.sub": "Finden Sie Antworten auf häufige Fragen oder kontaktieren Sie uns direkt.",
  "quick.title": "Schnellhilfe",
  "c1.h": "Ein Wasserzeichen hinzufügen",
  "c1.p": "Tippen Sie auf „Foto mit Wasserzeichen versehen“ und wählen Sie Fotomediathek, Foto aufnehmen oder Aus „Dateien“ wählen — und fügen Sie dann Text, ein Logo, eine Unterschrift oder einen QR-Code im Editor hinzu.",
  "c2.h": "Stapelmodus",
  "c2.p": "Tippen Sie auf dem Startbildschirm auf „Stapel“, um bis zu 250 Fotos auszuwählen und auf alle dasselbe Wasserzeichen anzuwenden.",
  "c3.h": "Voreinstellungen sichern",
  "c3.p": "Tippen Sie nach dem Sichern eines Fotos auf „Diese Einstellungen als Voreinstellung sichern“ — oder öffnen Sie Voreinstellungen auf dem Startbildschirm und tippen Sie auf „Voreinstellung erstellen“.",
  "c4.h": "Exportieren und teilen",
  "c4.p": "Tippen Sie auf Exportieren, wählen Sie Qualität, Format (JPEG/PNG/HEIC) und Format aus, und speichern Sie dann in Ihrem Fotoalbum oder teilen Sie direkt.",
  "faq.title": "Häufig gestellte Fragen",
  "q1": "Werden meine Fotos ins Internet hochgeladen?",
  "a1": "Nein. WatermarkIT verarbeitet alles zu 100 % auf Ihrem Gerät. Ihre Fotos werden niemals hochgeladen, an einen Server gesendet oder mit jemandem geteilt. Die gesamte Verarbeitung erfolgt vollständig auf Ihrem Gerät.",
  "q2": "Wie viele Fotos kann ich auf einmal mit einem Wasserzeichen versehen?",
  "a2": "Bis zu 250 in einem Durchgang: Tippen Sie auf dem Startbildschirm auf „Stapel“. Sie können nach jedem Foto stoppen, und alles bereits Gesicherte bleibt gesichert. Für ein einzelnes Foto tippen Sie auf „Foto mit Wasserzeichen versehen“ — so oft Sie möchten.",
  "q3": "Kann ich mein eigenes Logo als Wasserzeichen verwenden?",
  "a3": "Ja! Wechseln Sie im Editor zum Tab „Logo“ und tippen Sie auf „Logo hochladen“, um ein beliebiges Bild aus Ihrer Fotomediathek zu importieren. Sie können Größe, Position und Deckkraft Ihres Logos anpassen. PNG-Dateien mit Transparenz funktionieren am besten.",
  "q4": "Welche Exportformate werden unterstützt?",
  "a4": "WatermarkIT exportiert in JPEG (breiteste Kompatibilität), PNG (verlustfrei, erhält Logo-Transparenz) und HEIC (gleiche Qualität bei kleinerer Größe). Sie können außerdem ein Exportformat wählen — 1:1, 4:5, 9:16 oder 16:9, mit Anpassen oder Ausfüllen —, Original-, große oder Web-Abmessungen wählen und die exportierten Dateien selbst benennen.",
  "q5": "Kann ich meinen Wasserzeichen-Stil für später speichern?",
  "a5": "Ja. Tippen Sie nach dem Sichern eines Fotos auf „Diese Einstellungen als Voreinstellung sichern“ und geben Sie ihr einen Namen. Sie können auch Voreinstellungen auf dem Startbildschirm öffnen und auf „Voreinstellung erstellen“ tippen. Ihre Voreinstellungen erscheinen neben den acht integrierten – und auch in Siri und Kurzbefehlen.",
  "q6": "Die App fragt nach Zugriff auf die Fotomediathek. Warum?",
  "a6": "Zum Auswählen eines Fotos dient die Fotoauswahl von iOS. Sie übergibt WatermarkIT nur die Fotos, die Sie auswählen, und braucht keinerlei Berechtigung. Beim ersten Sichern fragt iOS, ob WatermarkIT Fotos hinzufügen darf – mehr braucht das Sichern nicht. Lesezugriff wird nur angefragt, wenn Sie einen früheren Export unter „Zuletzt bearbeitet“ erneut öffnen oder Fotos nach dem Sichern teilen, denn beides holt das gesicherte Foto wieder aus der Mediathek.",
  "q7": "Wie lösche ich eine eigene Voreinstellung?",
  "a7": "Öffnen Sie Voreinstellungen, halten Sie eine Ihrer eigenen Voreinstellungen gedrückt und wählen Sie Löschen. Die integrierten Voreinstellungen können nicht gelöscht werden.",
  "q8": "Welche iOS-Version wird benötigt?",
  "a8": "WatermarkIT erfordert iOS 17.0 oder neuer und funktioniert auf iPhone und iPad. Version 1.1.4 hat die Anforderung von iOS 18 gesenkt – falls der App Store Ihnen früher mitgeteilt hat, dass Ihr Gerät nicht unterstützt wird, lohnt sich ein zweiter Blick.",
  "q9": "Was ist neu in der aktuellsten Version?",
  "a9": "Version 1.1.5 erhöht einen Stapel auf 250 Fotos, bringt Siri und Kurzbefehle, sichert schneller und fragt beim ersten Sichern nicht mehr nach Zugriff auf Ihre ganze Fotomediathek. „Weitere Kopie sichern“ unter „Zuletzt bearbeitet“ nutzt jetzt denselben Sichern-Bildschirm wie ein Stapel, mit einem Filmstreifen aller Fotos, und benennt jede Datei nach ihrem eigenen Foto. Davor brachte Version 1.1.4 ein helles Design – passend zu Ihrem iPhone oder in den Einstellungen auf Hell oder Dunkel festgelegt – und WatermarkIT auf iOS 17. Version 1.1.3 fügte neun Sprachen hinzu, insgesamt vierzehn, und 1.1.2 übersetzte die App ins Arabische, Japanische und traditionelle Chinesisch. Version 1.1 brachte die handschriftliche Unterschrift, den QR-Code, die Kachelung und das unsichtbare Copyright, dazu 22 Schriften, acht integrierte Voreinstellungen sowie den Import aus Kamera und Dateien.",
  "q10": "Wie zeichne ich meine eigene Unterschrift?",
  "a10": "Wechseln Sie im Editor zum Tab Unterschrift und zeichnen Sie mit Ihrem Finger oder dem Apple Pencil direkt auf das Foto. Wählen Sie eine beliebige Tintenfarbe und nutzen Sie Rückgängig und Wiederholen, um einen Strich zu korrigieren, ohne von vorne zu beginnen.",
  "q11": "Was ist der unsichtbare Copyright-Vermerk, und übersteht er wirklich das Zuschneiden?",
  "a11": "Ja. Neben der sichtbaren Markierung kann WatermarkIT Ihren Namen und Ihr Copyright in die IPTC- und TIFF-Felder der exportierten Datei schreiben — die Standardorte, an denen Fotosoftware nach der Urheberschaft sucht. Da diese Daten in der Datei und nicht in den Pixeln stecken, entfernt ein Zuschnitt des Bildes sie nicht. Es ist Ihr eigener Name, nie unserer, und Sie können ihn für jeden Export in den Einstellungen oder auf dem Export-Bildschirm ausschalten. Beachten Sie, dass manche soziale Plattformen Metadaten beim erneuten Kodieren von Uploads entfernen — betrachten Sie ihn also als starken Nachweis Ihrer Urheberschaft, nicht als unzerbrechliches Schloss.",
  "contact.h": "Noch Hilfe nötig?",
  "contact.p": "Finden Sie nicht, wonach Sie suchen? Schreiben Sie uns eine E-Mail, und wir melden uns so schnell wie möglich bei Ihnen.",
  "footer.privacy": "Datenschutzerklärung",
  "footer.made": "Mit ❤️ für iOS gemacht",
  "q12": "Welche Sprachen unterstützt WatermarkIT?",
  "a12": "Arabisch, Chinesisch (vereinfacht und traditionell), Chinesisch (Hongkong), Deutsch, Englisch, Französisch, Japanisch, Niederländisch, Portugiesisch, Russisch, Spanisch, Türkisch und Vietnamesisch — vierzehn Sprachen ab Version 1.1.3. Die gesamte Oberfläche ist übersetzt, nicht nur der App-Store-Eintrag. Arabisch wird durchgängig von rechts nach links dargestellt. Sie können die Sprache der App in den Einstellungen ändern, ohne die Gerätesprache zu ändern — nützlich, wenn Sie eine Zweitsprache auf einem Gerät lesen, das auf Ihre Erstsprache eingestellt ist.",
  "q13": "Kann ich WatermarkIT mit Siri oder Kurzbefehlen nutzen?",
  "a13": "Ja. Sagen Sie „Foto in WatermarkIT mit Wasserzeichen versehen“ oder fügen Sie in der Kurzbefehle-App die Aktion von WatermarkIT hinzu, und wählen Sie dann ein Foto und eine Ihrer Voreinstellungen. Die Markierung wird auf Ihrem Gerät gezeichnet und die fertige Datei an Ihren Kurzbefehl zurückgegeben – zum Sichern, Senden oder Weiterreichen an eine andere Aktion, ohne die App zu öffnen. Siri-Phrasen folgen der Sprache Ihres iPhone, nicht der in der App gewählten Sprache."
 },
 "ru": {
  "nav.privacy": "Конфиденциальность",
  "lang.label": "Язык",
  "trans.note": "Этот перевод предоставлен для удобства; основной текст — на английском языке.",
  "hero.title": "Чем мы можем помочь?",
  "hero.sub": "Найдите ответы на частые вопросы или свяжитесь с нами напрямую.",
  "quick.title": "Быстрая помощь",
  "c1.h": "Добавить водяной знак",
  "c1.p": "Нажмите «Добавить водяной знак» и выберите «Медиатека „Фото“», «Сделать снимок» или «Выбрать в „Файлах“» — а затем добавьте текст, логотип, подпись или QR-код в редакторе.",
  "c2.h": "Пакетный режим",
  "c2.p": "Нажмите «Пакет» на главном экране, чтобы выбрать до 250 фото и применить ко всем один и тот же водяной знак.",
  "c3.h": "Сохранение пресетов",
  "c3.p": "После сохранения фото нажмите «Сохранить эти настройки как пресет» — или откройте «Пресеты» на главном экране и нажмите «Создать пресет».",
  "c4.h": "Экспорт и общий доступ",
  "c4.p": "Нажмите «Экспорт», выберите качество, формат (JPEG/PNG/HEIC) и форму, затем сохраните в «Фото» или поделитесь напрямую.",
  "faq.title": "Часто задаваемые вопросы",
  "q1": "Загружаются ли мои фото в интернет?",
  "a1": "Нет. WatermarkIT обрабатывает всё на 100% на вашем устройстве. Ваши фото никогда не загружаются, не отправляются на сервер и не передаются кому-либо ещё. Вся обработка происходит полностью на вашем устройстве.",
  "q2": "Сколько фото можно отметить одновременно?",
  "a2": "До 250 за один проход: нажмите «Пакет» на главном экране. Можно остановиться после любого фото — всё уже сохранённое останется. Для одного фото нажмите «Добавить водяной знак» и повторяйте сколько нужно.",
  "q3": "Могу ли я использовать свой логотип как водяной знак?",
  "a3": "Да! В редакторе переключитесь на вкладку «Логотип» и нажмите «Загрузить логотип», чтобы импортировать любое изображение из вашей фотопленки. Вы можете изменять размер, положение и прозрачность логотипа. Лучше всего подходят файлы PNG с прозрачностью.",
  "q4": "Какие форматы экспорта поддерживаются?",
  "a4": "WatermarkIT экспортирует в JPEG (наилучшая совместимость), PNG (без потерь, сохраняет прозрачность логотипа) и HEIC (то же качество при меньшем размере). Также можно выбрать форму экспорта — 1:1, 4:5, 9:16 или 16:9, с подгонкой или заполнением, — выбрать исходный, крупный или веб-размер и самостоятельно назвать экспортированные файлы.",
  "q5": "Могу ли я сохранить стиль водяного знака на будущее?",
  "a5": "Да. После сохранения фото нажмите «Сохранить эти настройки как пресет» и дайте ему имя. Также можно открыть «Пресеты» на главном экране и нажать «Создать пресет». Ваши пресеты появятся рядом с восемью встроенными — и в Siri и Командах тоже.",
  "q6": "Приложение запрашивает доступ к фотопленке. Почему?",
  "a6": "Фото выбирается через системный выбор фото iOS: он передаёт WatermarkIT только выбранные вами снимки и не требует никаких разрешений. При первом сохранении iOS спросит, разрешить ли WatermarkIT добавлять фото, — больше для сохранения ничего не нужно. Доступ на чтение запрашивается, только если вы снова открываете прошлый экспорт из «Недавних работ» или делитесь фото после сохранения, потому что в обоих случаях сохранённое фото забирается из медиатеки.",
  "q7": "Как удалить собственный пресет?",
  "a7": "Откройте «Пресеты», нажмите и удерживайте один из своих пресетов и выберите «Удалить». Встроенные пресеты удалить нельзя.",
  "q8": "Какая версия iOS требуется?",
  "a8": "Для WatermarkIT нужна iOS 17.0 или новее; приложение работает и на iPhone, и на iPad. В версии 1.1.4 требование снижено с iOS 18 — если раньше App Store сообщал, что ваше устройство не поддерживается, стоит проверить ещё раз.",
  "q9": "Что нового в последней версии?",
  "a9": "В версии 1.1.5 пакет вырос до 250 фото, появились Siri и Команды, сохранение стало быстрее, а при первом сохранении приложение больше не просит доступ ко всей медиатеке. «Сохранить ещё одну копию» из «Недавних работ» теперь использует тот же экран сохранения, что и пакет, с лентой всех фото, и называет каждый файл по своему снимку. До этого версия 1.1.4 добавила светлую тему — по настройке iPhone или закреплённую в «Настройках» — и поддержку iOS 17. Версия 1.1.3 добавила девять языков, всего четырнадцать, а 1.1.2 перевела приложение на арабский, японский и традиционный китайский. Версия 1.1 добавила рукописную подпись, QR-код, плитку и невидимый копирайт, а также 22 шрифта, восемь встроенных пресетов и импорт с камеры и из «Файлов».",
  "q10": "Как нарисовать собственную подпись?",
  "a10": "В редакторе переключитесь на вкладку «Подпись» и рисуйте прямо на фото пальцем или Apple Pencil. Выберите любой цвет чернил и используйте отмену и повтор действий, чтобы исправить штрих, не начиная заново.",
  "q11": "Что такое невидимый знак авторского права и действительно ли он переживает обрезку?",
  "a11": "Да. Помимо видимого знака, WatermarkIT может записать ваше имя и авторские права в поля IPTC и TIFF экспортированного файла — стандартные места, где фотопрограммы ищут информацию об авторстве. Поскольку эти данные хранятся в файле, а не в пикселях, обрезка изображения их не удаляет. Это ваше собственное имя, никогда не наше, и вы можете отключить его для любого экспорта в настройках или на экране экспорта. Учтите, что некоторые социальные платформы удаляют метаданные при повторном кодировании загружаемых файлов, поэтому воспринимайте это как весомое доказательство авторства, а не как неразрушимый замок.",
  "contact.h": "Всё ещё нужна помощь?",
  "contact.p": "Не нашли то, что искали? Напишите нам письмо, и мы ответим вам как можно скорее.",
  "footer.privacy": "Политика конфиденциальности",
  "footer.made": "Сделано с ❤️ для iOS",
  "q12": "Какие языки поддерживает WatermarkIT?",
  "a12": "Арабский, английский, вьетнамский, голландский, испанский, китайский (упрощённый и традиционный), китайский (Гонконг), немецкий, португальский, русский, турецкий, французский и японский — четырнадцать языков начиная с версии 1.1.3. Переведён весь интерфейс целиком, а не только страница в App Store. Арабский везде отображается справа налево. Вы можете изменить язык приложения в настройках, не меняя язык устройства, — это удобно, если вы читаете на втором языке на устройстве, настроенном на родной.",
  "q13": "Можно ли использовать WatermarkIT с Siri или Командами?",
  "a13": "Да. Скажите «Добавить водяной знак в WatermarkIT» или добавьте действие WatermarkIT в приложении «Команды», затем выберите фото и один из своих пресетов. Знак рисуется на вашем устройстве, а готовый файл возвращается в команду — его можно сохранить, отправить или передать следующему действию, не открывая приложение. Фразы Siri следуют языку iPhone, а не языку, выбранному в приложении."
 },
 "nl": {
  "nav.privacy": "Privacy",
  "lang.label": "Taal",
  "trans.note": "Deze vertaling is bedoeld ter ondersteuning; de Engelse versie is leidend.",
  "hero.title": "Hoe kunnen we helpen?",
  "hero.sub": "Vind antwoorden op veelgestelde vragen of neem rechtstreeks contact met ons op.",
  "quick.title": "Snelle hulp",
  "c1.h": "Een watermerk toevoegen",
  "c1.p": "Tik op “Zet een watermerk op een foto” en kies Fotobibliotheek, Maak een foto of Kies uit ‘Bestanden’ — en voeg dan tekst, een logo, een handtekening of een QR-code toe in de editor.",
  "c2.h": "Batchmodus",
  "c2.p": "Tik op het beginscherm op “Batch” om tot 250 foto’s te selecteren en hetzelfde watermerk op alle toe te passen.",
  "c3.h": "Voorinstellingen bewaren",
  "c3.p": "Tik na het bewaren van een foto op “Bewaar deze instellingen als voorinstelling” — of open Voorinstellingen vanaf het beginscherm en tik op “Maak een voorinstelling”.",
  "c4.h": "Exporteren en delen",
  "c4.p": "Tik op Exporteren, kies je kwaliteit, formaat (JPEG/PNG/HEIC) en vorm, en sla dan op in je Camerarol of deel rechtstreeks.",
  "faq.title": "Veelgestelde vragen",
  "q1": "Worden mijn foto’s naar het internet geüpload?",
  "a1": "Nee. WatermarkIT verwerkt alles voor 100% op je apparaat. Je foto’s worden nooit geüpload, naar een server gestuurd of met iemand gedeeld. Alle verwerking gebeurt volledig op je apparaat.",
  "q2": "Hoeveel foto’s kan ik tegelijk van een watermerk voorzien?",
  "a2": "Tot 250 in één run: tik op “Batch” op het beginscherm. Je kunt na elke foto stoppen, en alles wat al bewaard is blijft bewaard. Voor één foto tik je op “Zet een watermerk op een foto” — zo vaak als je nodig hebt.",
  "q3": "Kan ik mijn eigen logo als watermerk gebruiken?",
  "a3": "Ja! Schakel in de editor over naar het tabblad “Logo” en tik op “Logo uploaden” om een afbeelding uit je fotobibliotheek te importeren. Je kunt de grootte, positie en dekking van je logo aanpassen. PNG-bestanden met transparantie werken het beste.",
  "q4": "Welke exportformaten worden ondersteund?",
  "a4": "WatermarkIT exporteert in JPEG (breedste compatibiliteit), PNG (verliesvrij, behoudt logo-transparantie) en HEIC (dezelfde kwaliteit bij een kleiner formaat). Je kunt ook een exportvorm kiezen — 1:1, 4:5, 9:16 of 16:9, met Passend of Vullend —, Originele, Grote of Web-afmetingen kiezen, en de geëxporteerde bestanden zelf een naam geven.",
  "q5": "Kan ik mijn watermerkstijl bewaren voor later?",
  "a5": "Ja. Tik na het bewaren van een foto op “Bewaar deze instellingen als voorinstelling” en geef hem een naam. Je kunt ook Voorinstellingen openen vanaf het beginscherm en op “Maak een voorinstelling” tikken. Je voorinstellingen staan naast de acht ingebouwde, en ook in Siri en Opdrachten.",
  "q6": "De app vraagt om toegang tot mijn fotobibliotheek. Waarom?",
  "a6": "Een foto kiezen gaat via de fotokiezer van iOS, die WatermarkIT alleen de foto’s geeft die jij kiest en geen enkele toestemming nodig heeft. De eerste keer dat je bewaart, vraagt iOS of WatermarkIT foto’s mag toevoegen — meer heeft bewaren niet nodig. Leestoegang wordt alleen gevraagd als je een eerdere export opnieuw opent vanuit Recent werk of foto’s deelt na het bewaren, omdat beide je bewaarde foto weer uit de bibliotheek halen.",
  "q7": "Hoe verwijder ik een eigen voorinstelling?",
  "a7": "Open Voorinstellingen, houd een van je eigen voorinstellingen ingedrukt en kies Verwijder. De ingebouwde voorinstellingen kunnen niet worden verwijderd.",
  "q8": "Welke iOS-versie is vereist?",
  "a8": "WatermarkIT vereist iOS 17.0 of nieuwer en werkt op zowel iPhone als iPad. Versie 1.1.4 verlaagde de eis van iOS 18 — als de App Store je eerder vertelde dat je apparaat niet werd ondersteund, is het de moeite waard om opnieuw te kijken.",
  "q9": "Wat is er nieuw in de laatste versie?",
  "a9": "Versie 1.1.5 verhoogt een batch naar 250 foto’s, voegt Siri en Opdrachten toe, bewaart sneller en vraagt bij de eerste keer bewaren niet meer om je hele fotobibliotheek te zien. “Bewaar nog een kopie” vanuit Recent werk gebruikt nu hetzelfde bewaarscherm als een batch, met een strook van elke foto, en geeft elk bestand de naam van zijn eigen foto. Daarvoor voegde versie 1.1.4 een licht thema toe — dat je iPhone volgt, of vastgezet op Licht of Donker in Instellingen — en bracht WatermarkIT naar iOS 17. Versie 1.1.3 voegde negen talen toe, veertien in totaal, en 1.1.2 vertaalde de app naar het Arabisch, Japans en Traditioneel Chinees. Versie 1.1 voegde de handtekening, QR-code, tegels en het onzichtbare copyright toe, met 22 lettertypen, acht ingebouwde voorinstellingen en importeren vanuit de camera en Bestanden.",
  "q10": "Hoe teken ik mijn eigen handtekening?",
  "a10": "Schakel in de editor over naar het tabblad Handtekening en teken rechtstreeks op de foto met je vinger of Apple Pencil. Kies elke gewenste inktkleur, en gebruik ongedaan maken en opnieuw om een lijn te corrigeren zonder opnieuw te beginnen.",
  "q11": "Wat is het onzichtbare copyright, en overleeft het echt het bijsnijden?",
  "a11": "Ja. Naast het zichtbare merkteken kan WatermarkIT je naam en copyright wegschrijven naar de IPTC- en TIFF-velden van het geëxporteerde bestand — de standaardplekken waar fotosoftware naar auteurschap zoekt. Omdat die gegevens in het bestand zitten en niet in de pixels, verwijdert bijsnijden van de afbeelding ze niet. Het is jouw eigen naam, nooit de onze, en je kunt hem voor elke export uitschakelen in Instellingen of op het exportscherm. Let op: sommige sociale platforms verwijderen metadata bij het opnieuw coderen van uploads, dus zie het als een sterk bewijs van je auteurschap, niet als een onbreekbaar slot.",
  "contact.h": "Nog hulp nodig?",
  "contact.p": "Vind je niet wat je zoekt? Stuur ons een e-mail en we reageren zo snel mogelijk.",
  "footer.privacy": "Privacybeleid",
  "footer.made": "Gemaakt met ❤️ voor iOS",
  "q12": "Welke talen ondersteunt WatermarkIT?",
  "a12": "Arabisch, Chinees (vereenvoudigd en traditioneel), Chinees (Hongkong), Duits, Engels, Frans, Japans, Nederlands, Portugees, Russisch, Spaans, Turks en Vietnamees — veertien talen vanaf versie 1.1.3. De volledige interface is vertaald, niet alleen de App Store-vermelding. Arabisch wordt overal van rechts naar links weergegeven. Je kunt de taal van de app wijzigen in Instellingen zonder de taal van je apparaat te veranderen, handig als je een tweede taal leest op een apparaat dat op je eerste taal staat ingesteld.",
  "q13": "Kan ik WatermarkIT gebruiken met Siri of Opdrachten?",
  "a13": "Ja. Zeg “Zet een watermerk op een foto met WatermarkIT”, of voeg de actie van WatermarkIT toe in de Opdrachten-app, en kies dan een foto en een van je voorinstellingen. Het merkteken wordt op je apparaat getekend en het klare bestand gaat terug naar je opdracht, om te bewaren, te versturen of door te geven aan een andere actie — zonder de app te openen. Siri-zinnen volgen de taal van je iPhone, niet de taal die je in de app kiest."
 },
 "vi": {
  "nav.privacy": "Quyền riêng tư",
  "lang.label": "Ngôn ngữ",
  "trans.note": "Bản dịch này chỉ mang tính tham khảo; bản tiếng Anh là bản chính thức.",
  "hero.title": "Chúng tôi có thể giúp gì?",
  "hero.sub": "Tìm câu trả lời cho các câu hỏi thường gặp hoặc liên hệ trực tiếp với chúng tôi.",
  "quick.title": "Trợ giúp nhanh",
  "c1.h": "Thêm hình mờ",
  "c1.p": "Chạm “Đóng hình mờ lên ảnh” và chọn Thư viện ảnh, Chụp ảnh hoặc Chọn từ «Tệp» — sau đó thêm văn bản, logo, chữ ký hoặc mã QR trong trình chỉnh sửa.",
  "c2.h": "Chế độ hàng loạt",
  "c2.p": "Chạm “Hàng loạt” trên màn hình chính để chọn tối đa 250 ảnh và áp cùng một hình mờ cho tất cả.",
  "c3.h": "Lưu cài đặt sẵn",
  "c3.p": "Sau khi lưu ảnh, chạm “Lưu các cài đặt này thành cài đặt sẵn” — hoặc mở Cài đặt sẵn từ màn hình chính và chạm “Tạo cài đặt sẵn”.",
  "c4.h": "Xuất và chia sẻ",
  "c4.p": "Chạm Xuất, chọn chất lượng, định dạng (JPEG/PNG/HEIC) và tỉ lệ, sau đó lưu vào Cuộn phim Camera hoặc chia sẻ trực tiếp.",
  "faq.title": "Câu hỏi thường gặp",
  "q1": "Ảnh của tôi có được tải lên internet không?",
  "a1": "Không. WatermarkIT xử lý mọi thứ 100% trên thiết bị của bạn. Ảnh của bạn không bao giờ được tải lên, gửi tới máy chủ, hay chia sẻ với bất kỳ ai. Mọi xử lý diễn ra hoàn toàn trên thiết bị của bạn.",
  "q2": "Tôi có thể đóng hình mờ cho bao nhiêu ảnh cùng lúc?",
  "a2": "Tối đa 250 ảnh mỗi lượt: chạm “Hàng loạt” trên màn hình chính. Bạn có thể dừng sau bất kỳ ảnh nào, và mọi ảnh đã lưu vẫn được giữ. Với một ảnh, chạm “Đóng hình mờ lên ảnh” — lặp lại bao nhiêu lần tùy ý.",
  "q3": "Tôi có thể dùng logo của riêng mình làm hình mờ không?",
  "a3": "Có chứ! Trong trình chỉnh sửa, chuyển sang thẻ “Logo” và chạm “Tải logo lên” để nhập bất kỳ ảnh nào từ thư viện ảnh của bạn. Bạn có thể thay đổi kích thước, vị trí, và độ mờ của logo. Tệp PNG có nền trong suốt cho kết quả tốt nhất.",
  "q4": "Những định dạng xuất nào được hỗ trợ?",
  "a4": "WatermarkIT xuất dưới dạng JPEG (tương thích rộng nhất), PNG (không mất dữ liệu, giữ độ trong suốt của logo) và HEIC (chất lượng tương đương với dung lượng nhỏ hơn). Bạn cũng có thể chọn tỉ lệ xuất — 1:1, 4:5, 9:16 hoặc 16:9, với Vừa khít hoặc Lấp đầy — chọn kích thước Gốc, Lớn hoặc Web, và tự đặt tên cho các tệp đã xuất.",
  "q5": "Tôi có thể lưu phong cách hình mờ để dùng sau không?",
  "a5": "Có. Sau khi lưu ảnh, chạm “Lưu các cài đặt này thành cài đặt sẵn” và đặt tên. Bạn cũng có thể mở Cài đặt sẵn từ màn hình chính và chạm “Tạo cài đặt sẵn”. Các cài đặt sẵn của bạn hiện cạnh tám cài đặt sẵn có sẵn, và cả trong Siri và Phím tắt.",
  "q6": "Ứng dụng đang yêu cầu quyền truy cập thư viện ảnh. Tại sao?",
  "a6": "Việc chọn ảnh dùng trình chọn ảnh của iOS, chỉ trao cho WatermarkIT những ảnh bạn chọn và không cần quyền nào cả. Lần đầu lưu, iOS sẽ hỏi có cho WatermarkIT thêm ảnh không — việc lưu chỉ cần vậy. Quyền đọc chỉ được hỏi khi bạn mở lại một bản xuất cũ từ Việc gần đây hoặc chia sẻ ảnh sau khi lưu, vì cả hai đều lấy lại ảnh đã lưu từ thư viện.",
  "q7": "Làm sao để xoá cài đặt sẵn tự tạo?",
  "a7": "Mở Cài đặt sẵn, nhấn giữ một cài đặt sẵn của bạn và chọn Xoá. Không thể xoá các cài đặt sẵn có sẵn.",
  "q8": "Cần phiên bản iOS nào?",
  "a8": "WatermarkIT yêu cầu iOS 17.0 trở lên, và hoạt động trên cả iPhone lẫn iPad. Phiên bản 1.1.4 đã hạ yêu cầu từ iOS 18 — nếu trước đây App Store báo thiết bị của bạn không được hỗ trợ, hãy thử xem lại.",
  "q9": "Phiên bản mới nhất có gì mới?",
  "a9": "Phiên bản 1.1.5 nâng mỗi lượt lên 250 ảnh, thêm Siri và Phím tắt, lưu nhanh hơn, và không còn yêu cầu xem toàn bộ thư viện ảnh ở lần lưu đầu tiên. “Lưu một bản sao khác” từ Việc gần đây nay dùng cùng màn hình lưu như khi xử lý hàng loạt, có dải ảnh hiển thị từng ảnh, và đặt tên mỗi tệp theo ảnh gốc của nó. Trước đó, phiên bản 1.1.4 thêm giao diện sáng — theo iPhone, hoặc cố định Sáng hay Tối trong Cài đặt — và đưa WatermarkIT lên iOS 17. Phiên bản 1.1.3 thêm chín ngôn ngữ, tổng cộng mười bốn, còn 1.1.2 dịch ứng dụng sang tiếng Ả Rập, tiếng Nhật và tiếng Trung Phồn thể. Phiên bản 1.1 thêm chữ ký tay, mã QR, lát kín và bản quyền ẩn, cùng 22 kiểu chữ, tám cài đặt sẵn có sẵn và nhập từ camera và Tệp.",
  "q10": "Làm sao để tự vẽ chữ ký của mình?",
  "a10": "Trong trình chỉnh sửa, chuyển sang thẻ Chữ ký và vẽ trực tiếp lên ảnh bằng ngón tay hoặc Apple Pencil. Chọn bất kỳ màu mực nào, và dùng hoàn tác cùng làm lại để sửa một nét vẽ mà không cần bắt đầu lại từ đầu.",
  "q11": "Bản quyền vô hình là gì, và nó có thực sự tồn tại qua việc cắt ảnh không?",
  "a11": "Có. Bên cạnh dấu hiển thị, WatermarkIT có thể ghi tên và bản quyền của bạn vào các trường IPTC và TIFF của tệp đã xuất — những nơi tiêu chuẩn mà phần mềm ảnh tìm kiếm thông tin tác quyền. Vì dữ liệu đó nằm trong tệp chứ không phải trong các điểm ảnh, việc cắt ảnh không xóa nó đi. Đó là tên của riêng bạn, không bao giờ là của chúng tôi, và bạn có thể tắt nó cho bất kỳ lần xuất nào trong Cài đặt hoặc trên trang xuất. Lưu ý rằng một số nền tảng mạng xã hội xóa siêu dữ liệu khi mã hóa lại ảnh tải lên, vì vậy hãy xem đây là một tuyên bố mạnh mẽ về quyền tác giả hơn là một ổ khóa không thể phá vỡ.",
  "contact.h": "Vẫn cần trợ giúp?",
  "contact.p": "Không tìm thấy điều bạn cần? Gửi email cho chúng tôi và chúng tôi sẽ phản hồi sớm nhất có thể.",
  "footer.privacy": "Chính sách quyền riêng tư",
  "footer.made": "Được làm với ❤️ cho iOS",
  "q12": "WatermarkIT hỗ trợ những ngôn ngữ nào?",
  "a12": "Tiếng Ả Rập, tiếng Anh, tiếng Bồ Đào Nha, tiếng Đức, tiếng Hà Lan, tiếng Nga, tiếng Nhật, tiếng Pháp, tiếng Tây Ban Nha, tiếng Thổ Nhĩ Kỳ, tiếng Trung (giản thể và phồn thể), tiếng Trung (Hồng Kông) và tiếng Việt — mười bốn ngôn ngữ kể từ phiên bản 1.1.3. Toàn bộ giao diện được dịch, không chỉ trang trên App Store. Tiếng Ả Rập được trình bày từ phải sang trái ở mọi nơi. Bạn có thể đổi ngôn ngữ của ứng dụng trong Cài đặt mà không cần đổi ngôn ngữ thiết bị, hữu ích nếu bạn đọc ngôn ngữ thứ hai trên một thiết bị đặt theo ngôn ngữ thứ nhất.",
  "q13": "Tôi có thể dùng WatermarkIT với Siri hoặc Phím tắt không?",
  "a13": "Có. Nói “Đóng hình mờ lên ảnh bằng WatermarkIT”, hoặc thêm tác vụ của WatermarkIT trong ứng dụng Phím tắt, rồi chọn một ảnh và một cài đặt sẵn của bạn. Dấu được vẽ trên thiết bị và tệp hoàn chỉnh được trả về phím tắt để lưu, gửi hoặc chuyển cho tác vụ khác — không cần mở ứng dụng. Câu lệnh Siri theo ngôn ngữ của iPhone, không theo ngôn ngữ chọn trong ứng dụng."
 },
 "tr": {
  "nav.privacy": "Gizlilik",
  "lang.label": "Dil",
  "trans.note": "Bu çeviri yalnızca kolaylık amacıyla sunulur; asıl metin İngilizce sürümdür.",
  "hero.title": "Nasıl yardımcı olabiliriz?",
  "hero.sub": "Sık sorulan sorulara yanıt bulun ya da doğrudan bizimle iletişime geçin.",
  "quick.title": "Hızlı Yardım",
  "c1.h": "Filigran Ekleme",
  "c1.p": "“Fotoğrafa filigran ekle”ye dokunun ve Fotoğraf arşivi, Fotoğraf çek ya da “Dosyalar”dan seç’i seçin — sonra düzenleyicide metin, logo, imza veya QR kodu ekleyin.",
  "c2.h": "Toplu Mod",
  "c2.p": "250 fotoğrafa kadar seçip hepsine aynı filigranı uygulamak için ana ekranda “Toplu”ya dokunun.",
  "c3.h": "Hazır Ayar Kaydetme",
  "c3.p": "Bir fotoğrafı kaydettikten sonra “Bu ayarları hazır ayar olarak kaydet”e dokunun — ya da ana ekrandan Hazır ayarlar’ı açıp “Hazır ayar oluştur”a dokunun.",
  "c4.h": "Dışa Aktarma ve Paylaşma",
  "c4.p": "Dışa Aktar’a dokunun, kalite, format (JPEG/PNG/HEIC) ve oranı seçin, sonra Kamera Rulosu’na kaydedin veya doğrudan paylaşın.",
  "faq.title": "Sık Sorulan Sorular",
  "q1": "Fotoğraflarım internete mi yükleniyor?",
  "a1": "Hayır. WatermarkIT her şeyi %100 cihazınızda işler. Fotoğraflarınız asla yüklenmez, bir sunucuya gönderilmez ya da kimseyle paylaşılmaz. Tüm işleme tamamen cihazınızda gerçekleşir.",
  "q2": "Aynı anda kaç fotoğrafa filigran ekleyebilirim?",
  "a2": "Tek seferde 250’ye kadar: ana ekranda “Toplu”ya dokunun. Herhangi bir fotoğraftan sonra durabilirsiniz; o ana kadar kaydedilenler kayıtlı kalır. Tek bir fotoğraf için “Fotoğrafa filigran ekle”ye dokunun — gerektiği kadar tekrarlayın.",
  "q3": "Kendi logomu filigran olarak kullanabilir miyim?",
  "a3": "Evet! Düzenleyicide “Logo” sekmesine geçin ve fotoğraf kitaplığınızdan herhangi bir görseli içe aktarmak için “Logo Yükle”ye dokunun. Logonuzun boyutunu, konumunu ve saydamlığını ayarlayabilirsiniz. Saydamlığı olan PNG dosyaları en iyi sonucu verir.",
  "q4": "Hangi dışa aktarma formatları destekleniyor?",
  "a4": "WatermarkIT; JPEG (en geniş uyumluluk), PNG (kayıpsız, logo saydamlığını korur) ve HEIC (aynı kalitede daha küçük boyut) olarak dışa aktarır. Ayrıca bir dışa aktarma oranı seçebilirsiniz — Sığdır veya Doldur ile 1:1, 4:5, 9:16 ya da 16:9 — Orijinal, Büyük veya Web boyutlarını seçip dosyaları kendiniz adlandırabilirsiniz.",
  "q5": "Filigran stilimi sonra kullanmak üzere kaydedebilir miyim?",
  "a5": "Evet. Bir fotoğrafı kaydettikten sonra “Bu ayarları hazır ayar olarak kaydet”e dokunup bir ad verin. Ana ekrandan Hazır ayarlar’ı açıp “Hazır ayar oluştur”a da dokunabilirsiniz. Hazır ayarlarınız sekiz yerleşik hazır ayarın yanında ve Siri ile Kestirmeler’de de görünür.",
  "q6": "Uygulama fotoğraf kitaplığı erişimi istiyor. Neden?",
  "a6": "Fotoğraf seçimi iOS fotoğraf seçicisini kullanır; bu seçici WatermarkIT’e yalnızca seçtiğiniz fotoğrafları verir ve hiçbir izin gerektirmez. İlk kaydettiğinizde iOS, WatermarkIT’in fotoğraf eklemesine izin verip vermediğinizi sorar — kaydetmek için gereken yalnızca budur. Okuma izni yalnızca Son çalışmalar’dan eski bir dışa aktarımı yeniden açtığınızda ya da kaydettikten sonra fotoğraf paylaştığınızda istenir, çünkü ikisi de kaydedilmiş fotoğrafı arşivden geri alır.",
  "q7": "Kendi hazır ayarımı nasıl silerim?",
  "a7": "Hazır ayarlar’ı açın, kendi hazır ayarlarınızdan birine basılı tutun ve Sil’i seçin. Yerleşik hazır ayarlar silinemez.",
  "q8": "Hangi iOS sürümü gerekiyor?",
  "a8": "WatermarkIT, iOS 17.0 veya üzerini gerektirir ve hem iPhone’da hem iPad’de çalışır. Sürüm 1.1.4 gereksinimi iOS 18’den düşürdü — App Store daha önce cihazınızın desteklenmediğini söylediyse bir kez daha bakmaya değer.",
  "q9": "En son sürümde neler yeni?",
  "a9": "Sürüm 1.1.5 toplu işlemi 250 fotoğrafa çıkarıyor, Siri ve Kestirmeler desteği ekliyor, daha hızlı kaydediyor ve ilk kayıtta artık tüm fotoğraf arşivinizi görmek istemiyor. Son çalışmalar’dan “Başka bir kopya kaydet” artık toplu işlemle aynı kaydetme ekranını, her fotoğrafı gösteren bir şeritle birlikte kullanıyor ve her dosyayı kendi fotoğrafının adıyla adlandırıyor. Ondan önce sürüm 1.1.4 açık tema ekledi — iPhone’unuzu izleyen ya da Ayarlar’da Açık veya Koyu olarak sabitlenen — ve WatermarkIT’i iOS 17’ye getirdi. Sürüm 1.1.3 dokuz dil ekleyerek toplamı on dörde çıkardı; 1.1.2 uygulamayı Arapça, Japonca ve Geleneksel Çinceye çevirdi. Sürüm 1.1 el yazısı imza, QR kod, döşeme ve görünmez telif hakkını; 22 yazı tipi, sekiz yerleşik hazır ayar ve kamera ile Dosyalar’dan içe aktarmayı ekledi.",
  "q10": "Kendi imzamı nasıl çizerim?",
  "a10": "Düzenleyicide İmza sekmesine geçin ve parmağınızla ya da Apple Pencil ile doğrudan fotoğrafın üzerine çizin. İstediğiniz mürekkep rengini seçin ve baştan başlamadan bir çizgiyi düzeltmek için geri al ile yinele’yi kullanın.",
  "q11": "Görünmez telif hakkı nedir ve kırpmaya gerçekten dayanıklı mıdır?",
  "a11": "Evet. Görünür işaretin yanı sıra WatermarkIT, adınızı ve telif hakkınızı dışa aktarılan dosyanın IPTC ve TIFF alanlarına da yazabilir — fotoğraf yazılımlarının yazarlık bilgisi için baktığı standart yerler. Bu veri piksellerde değil dosyanın kendisinde yaşadığından, görseli kırpmak onu kaldırmaz. Bu sizin adınızdır, asla bizim değil, ve Ayarlar’dan veya Dışa Aktar sayfasından herhangi bir dışa aktarma için kapatabilirsiniz. Bazı sosyal platformların yüklemeleri yeniden kodlarken meta verileri sildiğini unutmayın; bu yüzden onu kırılmaz bir kilit değil, eserinize güçlü bir kanıt olarak görün.",
  "contact.h": "Hâlâ yardıma mı ihtiyacınız var?",
  "contact.p": "Aradığınızı bulamadınız mı? Bize e-posta gönderin, en kısa sürede size dönüş yapalım.",
  "footer.privacy": "Gizlilik Politikası",
  "footer.made": "iOS için ❤️ ile yapıldı",
  "q12": "WatermarkIT hangi dilleri destekliyor?",
  "a12": "1.1.3 sürümü itibarıyla Almanca, Arapça, Çince (basitleştirilmiş ve geleneksel), Çince (Hong Kong), Fransızca, Hollandaca, İngilizce, İspanyolca, Japonca, Portekizce, Rusça, Türkçe ve Vietnamca — toplam on dört dil. Yalnızca App Store sayfası değil, arayüzün tamamı çevrilmiştir. Arapça her yerde sağdan sola düzenlenir. Cihaz dilinizi değiştirmeden Ayarlar’dan uygulamanın dilini değiştirebilirsiniz; bu, ana dilinize ayarlı bir cihazda ikinci bir dil okuyorsanız işinize yarar.",
  "q13": "WatermarkIT’i Siri veya Kestirmeler ile kullanabilir miyim?",
  "a13": "Evet. “WatermarkIT ile fotoğrafa filigran ekle” deyin ya da Kestirmeler uygulamasında WatermarkIT’in eylemini ekleyin, ardından bir fotoğraf ve hazır ayarlarınızdan birini seçin. İşaret cihazınızda çizilir ve bitmiş dosya kestirmenize geri verilir; kaydedebilir, gönderebilir ya da başka bir eyleme aktarabilirsiniz — uygulamayı açmadan. Siri ifadeleri uygulama içinde seçilen dili değil, iPhone’unuzun dilini izler."
 },
 "es-MX": {
  "nav.privacy": "Privacidad",
  "lang.label": "Idioma",
  "trans.note": "Esta traducción se ofrece como referencia; el texto en inglés es el que tiene validez.",
  "hero.title": "¿Cómo podemos ayudarte?",
  "hero.sub": "Encuentra respuestas a preguntas frecuentes o contáctanos directamente.",
  "quick.title": "Ayuda rápida",
  "c1.h": "Agregar una marca de agua",
  "c1.p": "Toca “Poner marca de agua a una foto” y elige Fototeca, Hacer una foto o Elegir de «Archivos» — y luego agrega texto, un logotipo, una firma o un código QR en el editor.",
  "c2.h": "Modo por lotes",
  "c2.p": "Toca “Lote” en la pantalla de inicio para seleccionar hasta 250 fotos y aplicar la misma marca de agua a todas.",
  "c3.h": "Guardar preajustes",
  "c3.p": "Después de guardar una foto, toca “Guardar estos ajustes como preajuste” — o abre Preajustes desde la pantalla de inicio y toca “Crear un preajuste”.",
  "c4.h": "Exportar y compartir",
  "c4.p": "Toca Exportar, elige la calidad, el formato (JPEG/PNG/HEIC) y la forma, y luego guarda en tu Carrete o comparte directamente.",
  "faq.title": "Preguntas frecuentes",
  "q1": "¿Mis fotos se suben a internet?",
  "a1": "No. WatermarkIT procesa todo al 100% en tu dispositivo. Tus fotos nunca se suben, se envían a un servidor ni se comparten con nadie. Todo el procesamiento ocurre por completo en tu dispositivo.",
  "q2": "¿Cuántas fotos puedo marcar a la vez?",
  "a2": "Hasta 250 en una pasada: toca “Lote” en la pantalla de inicio. Puedes detenerte tras cualquier foto, y todo lo guardado hasta ese momento se conserva. Para una sola foto, toca “Poner marca de agua a una foto” — repítelo las veces que necesites.",
  "q3": "¿Puedo usar mi propio logotipo como marca de agua?",
  "a3": "¡Sí! En el editor, cambia a la pestaña “Logotipo” y toca “Subir logotipo” para importar cualquier imagen de tu biblioteca de fotos. Puedes cambiar el tamaño, la posición y la opacidad de tu logotipo. Los archivos PNG con transparencia funcionan mejor.",
  "q4": "¿Qué formatos de exportación se admiten?",
  "a4": "WatermarkIT exporta en JPEG (mayor compatibilidad), PNG (sin pérdida, conserva la transparencia del logotipo) y HEIC (misma calidad en menor tamaño). También puedes elegir una forma de exportación — 1:1, 4:5, 9:16 o 16:9, con Ajustar o Rellenar —, elegir tamaños Original, Grande o Web, y ponerles nombre tú mismo a los archivos exportados.",
  "q5": "¿Puedo guardar mi estilo de marca de agua para más tarde?",
  "a5": "Sí. Después de guardar una foto, toca “Guardar estos ajustes como preajuste” y ponle un nombre. También puedes abrir Preajustes desde la pantalla de inicio y tocar “Crear un preajuste”. Tus preajustes aparecen junto a los ocho integrados, y también en Siri y Atajos.",
  "q6": "La app está pidiendo acceso a mi biblioteca de fotos. ¿Por qué?",
  "a6": "Para elegir una foto se usa el selector de fotos de iOS, que solo entrega a WatermarkIT las fotos que eliges y no necesita ningún permiso. La primera vez que guardas, iOS pregunta si WatermarkIT puede agregar fotos — es todo lo que necesita guardar. El acceso de lectura solo se pide si vuelves a abrir una exportación anterior desde Trabajos recientes o compartes fotos después de guardarlas, porque ambas acciones recuperan la foto guardada de la fototeca.",
  "q7": "¿Cómo elimino un preajuste propio?",
  "a7": "Abre Preajustes, mantén pulsado uno de tus preajustes y elige Eliminar. Los preajustes integrados no se pueden eliminar.",
  "q8": "¿Qué versión de iOS se requiere?",
  "a8": "WatermarkIT requiere iOS 17.0 o posterior, y funciona tanto en iPhone como en iPad. La versión 1.1.4 bajó el requisito desde iOS 18 — si antes el App Store te dijo que tu dispositivo no era compatible, vale la pena volver a mirar.",
  "q9": "¿Qué hay de nuevo en la última versión?",
  "a9": "La versión 1.1.5 amplía un lote a 250 fotos, agrega Siri y Atajos, guarda más rápido y ya no pide ver toda tu fototeca la primera vez que guardas. “Guardar otra copia” desde Trabajos recientes ahora usa la misma pantalla de guardado que un lote, con una tira de todas las fotos, y nombra cada archivo según su propia foto. Antes, la versión 1.1.4 añadió un tema claro — que sigue a tu iPhone, o fijo en Claro u Oscuro desde Ajustes — y llevó WatermarkIT a iOS 17. La versión 1.1.3 añadió nueve idiomas, catorce en total, y la 1.1.2 tradujo la app al árabe, japonés y chino tradicional. La versión 1.1 añadió la firma a mano, el código QR, el mosaico y el copyright invisible, junto con 22 tipografías, ocho preajustes integrados e importación desde la cámara y Archivos.",
  "q10": "¿Cómo dibujo mi propia firma?",
  "a10": "En el editor, cambia a la pestaña Firma y dibuja directamente sobre la foto con tu dedo o el Apple Pencil. Elige cualquier color de tinta, y usa deshacer y rehacer para corregir un trazo sin empezar de nuevo.",
  "q11": "¿Qué es el derecho de autor invisible, y realmente sobrevive al recorte?",
  "a11": "Sí. Además de la marca visible, WatermarkIT puede escribir tu nombre y tus derechos de autor en los campos IPTC y TIFF del archivo exportado — los lugares estándar donde el software de fotos busca la autoría. Como esos datos viven en el archivo y no en los píxeles, recortar la imagen no los elimina. Es tu propio nombre, nunca el nuestro, y puedes desactivarlo para cualquier exportación en Ajustes o en la pantalla de exportación. Ten en cuenta que algunas plataformas sociales eliminan los metadatos al recodificar lo que subes, así que trátalo como una reclamación sólida sobre tu trabajo y no como un candado infalible.",
  "contact.h": "¿Aún necesitas ayuda?",
  "contact.p": "¿No encuentras lo que buscas? Envíanos un correo y te responderemos lo antes posible.",
  "footer.privacy": "Política de privacidad",
  "footer.made": "Hecho con ❤️ para iOS",
  "q12": "¿Qué idiomas admite WatermarkIT?",
  "a12": "Alemán, árabe, chino (simplificado y tradicional), chino (Hong Kong), español, francés, inglés, japonés, neerlandés, portugués, ruso, turco y vietnamita — catorce idiomas a partir de la versión 1.1.3. Se traduce toda la interfaz, no solo la ficha de la App Store. El árabe se muestra de derecha a izquierda en toda la app. Puedes cambiar el idioma de la app en Ajustes sin cambiar el idioma de tu dispositivo, algo útil si lees un segundo idioma en un dispositivo configurado en tu idioma principal.",
  "q13": "¿Puedo usar WatermarkIT con Siri o Atajos?",
  "a13": "Sí. Di “Poner marca de agua a una foto con WatermarkIT”, o agrega la acción de WatermarkIT en la app Atajos, y luego elige una foto y uno de tus preajustes. La marca se dibuja en tu dispositivo y el archivo terminado vuelve a tu atajo, para guardarlo, enviarlo o pasarlo a otra acción — sin abrir la app. Las frases de Siri siguen el idioma de tu iPhone, no el que elijas dentro de la app."
 },
 "pt-BR": {
  "nav.privacy": "Privacidade",
  "lang.label": "Idioma",
  "trans.note": "Esta tradução é fornecida apenas como referência; o texto em inglês é o que prevalece.",
  "hero.title": "Como podemos ajudar?",

  "quick.title": "Ajuda rápida",
