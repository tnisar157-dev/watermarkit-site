<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WatermarkIT — Free Photo Watermark App for iPhone &amp; iPad</title>
  <meta name="description" content="WatermarkIT is a free, private iOS app for watermarking photos — text, logo, hand-drawn signature, QR code or tiled marks, plus invisible copyright that survives cropping. 100% on-device. iOS 18+." />
  <link rel="icon" type="image/png" href="appicon.png" />
  <link rel="apple-touch-icon" href="appicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green: #0B8340;
      --green-light: #30D158;
      --green-dim: rgba(48,209,88,0.15);
      --gradient: linear-gradient(135deg, #04642F 0%, #0B8340 100%);
      --gradient-text: linear-gradient(135deg, #7CFFA8 0%, #30D158 100%);
      --bg: #0C0C0E;
      --surface: #161618;
      --surface2: #1D1D20;
      --border: rgba(255,255,255,0.08);
      --text: #F0F0F2;
      --muted: #98989E;
      --radius: 18px;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, sans-serif;
      line-height: 1.6;
      overflow-x: hidden;
    }

    /* ── NAV ─────────────────────────────────────── */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 200;
      background: rgba(10,10,15,0.8);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-bottom: 1px solid var(--border);
    }
    .nav-inner {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 66px;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--text);
      font-weight: 800;
      font-size: 18px;
      letter-spacing: -0.3px;
    }
    .logo-icon {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      object-fit: cover;
    }
    .nav-links { display: flex; align-items: center; gap: 32px; }
    .nav-link {
      color: var(--muted);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      transition: color 0.2s;
    }
    .nav-link:hover { color: var(--text); }
    .nav-cta {
      background: var(--gradient);
      color: white;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      padding: 9px 20px;
      border-radius: 100px;
      transition: opacity 0.2s, transform 0.2s;
    }
    .nav-cta:hover { opacity: 0.88; transform: scale(1.03); }

    /* ── HERO ────────────────────────────────────── */
    .hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 120px 24px 80px;
      position: relative;
      overflow: hidden;
    }
    .hero-glow {
      position: absolute;
      width: 700px; height: 700px;
      background: radial-gradient(circle, rgba(48,209,88,0.28) 0%, transparent 70%);
      border-radius: 50%;
      top: 50%; left: 50%;
      transform: translate(-50%, -55%);
      pointer-events: none;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--green-dim);
      border: 1px solid rgba(48,209,88,0.4);
      border-radius: 100px;
      padding: 6px 16px;
      font-size: 13px;
      font-weight: 600;
      color: var(--green-light);
      margin-bottom: 32px;
    }
    .badge-dot {
      width: 6px; height: 6px;
      background: var(--green-light);
      border-radius: 50%;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    h1 {
      font-size: clamp(44px, 7vw, 88px);
      font-weight: 900;
      line-height: 1.05;
      letter-spacing: -3px;
      margin-bottom: 24px;
      max-width: 800px;
    }
    h1 .gradient-text {
      background: var(--gradient-text);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .hero-sub {
      font-size: clamp(16px, 2.5vw, 20px);
      color: var(--muted);
      max-width: 540px;
      margin: 0 auto 44px;
      font-weight: 400;
      line-height: 1.6;
    }
    .hero-actions {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: var(--gradient);
      color: white;
      font-family: 'Inter', sans-serif;
      font-size: 16px;
      font-weight: 700;
      padding: 16px 32px;
      border-radius: 100px;
      text-decoration: none;
      transition: opacity 0.2s, transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 8px 32px rgba(48,209,88,0.4);
    }
    .btn-primary:hover { opacity: 0.9; transform: translateY(-2px); box-shadow: 0 14px 40px rgba(48,209,88,0.5); }
    .btn-secondary {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: transparent;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 16px;
      font-weight: 600;
      padding: 16px 32px;
      border-radius: 100px;
      border: 1px solid var(--border);
      text-decoration: none;
      transition: background 0.2s, border-color 0.2s;
    }
    .btn-secondary:hover { background: var(--surface); border-color: rgba(255,255,255,0.2); }

    /* ── PRIVACY STRIP ────────────────────────────── */
    .privacy-strip {
      display: flex;
      justify-content: center;
      gap: 24px;
      flex-wrap: wrap;
      margin-top: 52px;
      font-size: 13px;
      color: var(--muted);
    }
    .privacy-strip span {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .privacy-strip .icon { font-size: 15px; }

    /* ── SECTION ─────────────────────────────────── */
    section {
      padding: 100px 24px;
    }
    .section-inner {
      max-width: 1100px;
      margin: 0 auto;
    }
    .section-label {
      text-transform: uppercase;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 2px;
      color: var(--green-light);
      margin-bottom: 14px;
    }
    .section-title {
      font-size: clamp(28px, 4vw, 46px);
      font-weight: 800;
      letter-spacing: -1.5px;
      margin-bottom: 16px;
      line-height: 1.1;
    }
    .section-sub {
      font-size: 17px;
      color: var(--muted);
      max-width: 520px;
      margin-bottom: 64px;
    }

    /* ── FEATURES ────────────────────────────────── */
    .features-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
    }
    .feature-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 32px;
      transition: border-color 0.25s, transform 0.25s;
    }
    .feature-card:hover {
      border-color: rgba(48,209,88,0.4);
      transform: translateY(-3px);
    }
    .feature-icon {
      width: 52px; height: 52px;
      border-radius: 14px;
      background: var(--green-dim);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      margin-bottom: 20px;
    }
    .feature-card h3 {
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 10px;
      letter-spacing: -0.2px;
    }
    .feature-card p {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.65;
    }

    /* ── PRIVACY SECTION ─────────────────────────── */
    .privacy-section {
      background: var(--surface);
      border-radius: 28px;
      border: 1px solid var(--border);
      padding: 60px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 60px;
      align-items: center;
    }
    @media (max-width: 700px) {
      .privacy-section { grid-template-columns: 1fr; padding: 36px 24px; }
    }
    .privacy-section h2 {
      font-size: clamp(26px, 3.5vw, 40px);
      font-weight: 800;
      letter-spacing: -1px;
      margin-bottom: 18px;
    }
    .privacy-section p {
      font-size: 15px;
      color: var(--muted);
      line-height: 1.7;
      margin-bottom: 28px;
    }
    .privacy-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: var(--green-dim);
      border: 1px solid rgba(48,209,88,0.3);
      border-radius: 100px;
      padding: 7px 14px;
      font-size: 13px;
      font-weight: 600;
      color: var(--green-light);
    }
    .privacy-visual {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 36px 32px;
      text-align: center;
    }
    .privacy-big-icon { font-size: 72px; margin-bottom: 20px; }
    .privacy-visual h3 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 10px;
    }
    .privacy-visual p {
      font-size: 14px;
      color: var(--muted);
      margin: 0;
    }

    /* ── STEPS ───────────────────────────────────── */
    .steps {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 0;
      position: relative;
    }
    .step {
      padding: 36px 24px;
      text-align: center;
      position: relative;
    }
    .step:not(:last-child)::after {
      content: '→';
      position: absolute;
      right: -12px;
      top: 40px;
      font-size: 20px;
      color: var(--green-light);
      opacity: 0.5;
    }
    @media (max-width: 600px) { .step:not(:last-child)::after { display: none; } }
    .step-num {
      width: 48px; height: 48px;
      border-radius: 50%;
      background: var(--gradient);
      color: white;
      font-size: 18px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
    }
    .step h3 { font-size: 15px; font-weight: 700; margin-bottom: 8px; }
    .step p { font-size: 13px; color: var(--muted); line-height: 1.5; }

    /* ── CTA ─────────────────────────────────────── */
    .cta-section {
      text-align: center;
      background: var(--gradient);
      border-radius: 28px;
      padding: 80px 40px;
      margin: 0 24px 100px;
      max-width: 1100px;
      margin-left: auto;
      margin-right: auto;
      position: relative;
      overflow: hidden;
    }
    .cta-section::before {
      content: '';
      position: absolute;
      top: -40%; left: -20%;
      width: 60%; height: 200%;
      background: rgba(255,255,255,0.05);
      border-radius: 50%;
      pointer-events: none;
    }
    .cta-section h2 {
      font-size: clamp(28px, 4vw, 48px);
      font-weight: 900;
      letter-spacing: -1px;
      margin-bottom: 16px;
    }
    .cta-section p {
      font-size: 17px;
      opacity: 0.85;
      max-width: 460px;
      margin: 0 auto 36px;
    }
    .btn-white {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: white;
      color: var(--green);
      font-family: 'Inter', sans-serif;
      font-size: 16px;
      font-weight: 700;
      padding: 16px 32px;
      border-radius: 100px;
      text-decoration: none;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn-white:hover { transform: translateY(-2px); box-shadow: 0 12px 36px rgba(0,0,0,0.25); }

    /* ── FOOTER ──────────────────────────────────── */
    footer {
      border-top: 1px solid var(--border);
      padding: 48px 32px;
      text-align: center;
    }
    .footer-inner {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 20px;
    }
    .footer-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text); font-weight: 700; }
    .footer-links { display: flex; gap: 28px; }
    .footer-links a { color: var(--muted); text-decoration: none; font-size: 14px; transition: color 0.2s; }
    .footer-links a:hover { color: var(--text); }
    .footer-copy { width: 100%; text-align: center; color: var(--muted); font-size: 13px; margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--border); }

    /* ── i18n ───────────────────────────────────── */
    .langpick {
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 100px;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 500;
      padding: 7px 12px;
      cursor: pointer;
      appearance: none;
    }
    .langpick:focus-visible { outline: 2px solid var(--green-light); outline-offset: 2px; }
    .trans-note {
      max-width: 1100px;
      margin: 0 auto 8px;
      padding: 0 24px;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
    }
    .trans-note:empty { display: none; }
    /* The picker is one more item in a nav that was already tight. Below 640
       the two in-page anchors go, since scrolling reaches those sections
       anyway, and Support / the CTA / the picker stay. */
    .nav-cta { white-space: nowrap; }
    @media (max-width: 760px) { .nav-links { gap: 16px; } }
    @media (max-width: 640px) { .nav-links .nav-link[href^="#"] { display: none; } }
    /* Below 480 even three items overflow. The nav CTA is the one to drop:
       the hero's own download button is on screen at that width anyway, so
       nothing is lost, and the picker stays reachable. */
    @media (max-width: 480px) { .nav-links .nav-cta { display: none; } }
    /* Fourteen languages made 'Português (Brasil)' the longest option, and a
       native <select>'s closed width follows its widest option, not the
       selected one — so the picker grew wide enough on its own to overflow a
       375px screen even with the CTA already gone. Capping it with an
       ellipsis keeps the box a constant, predictable size regardless of which
       language (or how many) are ever added; the open dropdown is unaffected
       and still shows every option in full. */
    @media (max-width: 480px) {
      .nav-inner { padding: 0 16px; }
      .langpick { max-width: 84px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    }
    /* The step connector is physically sided. */
    [dir="rtl"] .step:not(:last-child)::after { right: auto; left: -12px; content: '←'; }
    :lang(ar) body { font-family: 'Inter', 'Geeza Pro', system-ui, sans-serif; }
    :lang(ja) body { font-family: 'Inter', 'Hiragino Sans', 'Yu Gothic', system-ui, sans-serif; }
    :lang(zh-Hans) body { font-family: 'Inter', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif; }
    :lang(zh-Hant) body { font-family: 'Inter', 'PingFang TC', 'Microsoft JhengHei', system-ui, sans-serif; }
    :lang(zh-HK) body { font-family: 'Inter', 'PingFang HK', 'PingFang TC', system-ui, sans-serif; }
    :lang(ru) body { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    :lang(vi) body { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    :lang(tr) body { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
  </style>
</head>
<body>

  <!-- NAV -->
  <nav>
    <div class="nav-inner">
      <a href="index.html" class="logo">
        <img src="appicon.png" class="logo-icon" alt="WatermarkIT App Icon">
        WatermarkIT
      </a>
      <div class="nav-links">
        <a href="#features" class="nav-link" data-i18n="nav.features"></a>
        <a href="#privacy" class="nav-link" data-i18n="nav.privacy"></a>
        <a href="support.html" class="nav-link" data-i18n="nav.support"></a>
        <a href="#download" class="nav-cta" data-i18n="nav.cta"></a>
        <select class="langpick" id="langpick">
          <option value="en">English</option>
          <option value="zh-Hans">简体中文</option>
          <option value="zh-Hant">繁體中文</option>
          <option value="ar">العربية</option>
          <option value="ja">日本語</option>
          <option value="zh-HK">繁體中文（香港）</option>
          <option value="fr">Français</option>
          <option value="de">Deutsch</option>
          <option value="ru">Русский</option>
          <option value="nl">Nederlands</option>
          <option value="vi">Tiếng Việt</option>
          <option value="tr">Türkçe</option>
          <option value="es">Español</option>
          <option value="pt-BR">Português (Brasil)</option>
        </select>
      </div>
    </div>
  </nav>

  <!-- HERO -->
  <div class="hero">
    <div class="hero-glow"></div>
    <div class="badge">
      <span class="badge-dot"></span>
      <span data-i18n="hero.badge"></span>
    </div>
    <h1><span data-i18n="hero.h1a"></span><br><span class="gradient-text" data-i18n="hero.h1b"></span></h1>
    <p class="hero-sub" data-i18n="hero.sub"></p>
    <div class="hero-actions">
      <a href="#download" class="btn-primary" id="hero-download-btn" data-i18n="hero.download"></a>
      <a href="#features" class="btn-secondary" data-i18n="hero.features"></a>
    </div>
    <div class="privacy-strip">
      <span><span class="icon">🔒</span> <span data-i18n="strip1"></span></span>
      <span><span class="icon">🛡️</span> <span data-i18n="strip2"></span></span>
      <span><span class="icon">☁️</span> <span data-i18n="strip3"></span></span>
      <span><span class="icon">📴</span> <span data-i18n="strip4"></span></span>
    </div>
  </div>

  <p class="trans-note" data-i18n="trans.note"></p>

  <!-- FEATURES -->
  <section id="features">
    <div class="section-inner">
      <div class="section-label" data-i18n="feat.label"></div>
      <h2 class="section-title" data-i18n="feat.title"></h2>
      <p class="section-sub" data-i18n="feat.sub"></p>
      <div class="features-grid">
          <div class="feature-card">
            <div class="feature-icon">✏️</div>
            <h3 data-i18n="f1.h"></h3>
            <p data-i18n="f1.p"></p>
          </div>
          <div class="feature-card">
            <div class="feature-icon">🖼️</div>
            <h3 data-i18n="f2.h"></h3>
            <p data-i18n="f2.p"></p>
          </div>
          <div class="feature-card">
            <div class="feature-icon">✍️</div>
            <h3 data-i18n="f3.h"></h3>
            <p data-i18n="f3.p"></p>
          </div>
          <div class="feature-card">
            <div class="feature-icon">🔗</div>
            <h3 data-i18n="f4.h"></h3>
            <p data-i18n="f4.p"></p>
          </div>
          <div class="feature-card">
            <div class="feature-icon">🧱</div>
            <h3 data-i18n="f5.h"></h3>
            <p data-i18n="f5.p"></p>
          </div>
          <div class="feature-card">
            <div class="feature-icon">🪪</div>
            <h3 data-i18n="f6.h"></h3>
            <p data-i18n="f6.p"></p>
          </div>
          <div class="feature-card">
            <div class="feature-icon">⚡</div>
            <h3 data-i18n="f7.h"></h3>
            <p data-i18n="f7.p"></p>
          </div>
          <div class="feature-card">
            <div class="feature-icon">📦</div>
            <h3 data-i18n="f8.h"></h3>
            <p data-i18n="f8.p"></p>
          </div>
          <div class="feature-card">
            <div class="feature-icon">🎨</div>
            <h3 data-i18n="f9.h"></h3>
            <p data-i18n="f9.p"></p>
          </div>
          <div class="feature-card">
            <div class="feature-icon">📤</div>
            <h3 data-i18n="f10.h"></h3>

          <div class="feature-card">

            <p data-i18n="f11.p"></p>
          </div>
      </div>
    </div>
  </section>

  <!-- HOW IT WORKS -->
  <section style="padding-top: 0;">
    <div class="section-inner">
      <div class="section-label" data-i18n="how.label"></div>
      <h2 class="section-title" data-i18n="how.title"></h2>
      <p class="section-sub" data-i18n="how.sub"></p>
      <div class="steps">
          <div class="step">
            <div class="step-num">1</div>
            <h3 data-i18n="st1.h"></h3>
            <p data-i18n="st1.p"></p>
          </div>
          <div class="step">
            <div class="step-num">2</div>
            <h3 data-i18n="st2.h"></h3>
            <p data-i18n="st2.p"></p>
          </div>
          <div class="step">
            <div class="step-num">3</div>
            <h3 data-i18n="st3.h"></h3>
            <p data-i18n="st3.p"></p>
          </div>
      </div>
    </div>
  </section>

  <!-- CROP-PROOF CREDIT -->
  <section style="padding-top: 0;">
    <div class="section-inner">
      <div class="privacy-section">
        <div>
          <div class="section-label" data-i18n="crop.label"></div>

  "f2.p": "Importez votre propre logo et placez-le où vous voulez. Faites-le pivoter à 360°, retournez-le horizontalement ou verticalement, et redimensionnez-le sur une large plage. Transparence PNG prise en charge.",
  "f3.h": "Signez à la main",
  "f3.p": "Dessinez votre signature directement sur la photo, dans la couleur d’encre de votre choix, avec annuler et rétablir. Ce qui se rapproche le plus de signer un tirage papier, sans quitter votre téléphone.",
  "f4.h": "Marques en code QR",
  "f4.p": "Transformez un lien en marque scannable qui pointe vers votre portfolio, votre boutique ou vos conditions de licence. Généré entièrement sur votre appareil — aucun serveur ne voit jamais l’URL.",
  "f5.h": "Mosaïque",
  "f5.p": "Répétez votre marque sur toute la photo avec un espacement réglable, pour qu’il ne reste aucun coin net à recadrer. La norme du monde de la validation client, intégrée d’office.",
  "f6.h": "Mention invisible",
  "f6.p": "Inscrivez votre nom et vos droits d’auteur dans les champs IPTC et TIFF du fichier exporté. Elle voyage avec le fichier et survit au recadrage — une preuve de paternité même quand la marque visible a disparu.",
  "f7.h": "Huit préréglages intégrés",
  "f7.p": "Nommés d’après leur usage, pas leurs réglages : épreuve client, confidentiel, brouillon, crédit photo, identifiant social, épreuve en mosaïque, horodatage et mentions légales. Touchez-en un, c’est terminé.",
  "f8.h": "Traitement par lot",
  "f8.p": "Sélectionnez plusieurs photos et appliquez la même marque à toutes en une fois. Idéal pour les shootings produits, les portfolios et les séries pour réseaux sociaux.",
  "f9.h": "Modèles réutilisables",
  "f9.p": "Enregistrez vos styles de filigrane sous forme de modèles nommés et réutilisez-les d’un geste. Rouvrez n’importe quel travail récent depuis l’écran d’accueil et renvoyez-le.",
  "f10.h": "Exportez pour sa destination",
  "f10.p": "JPEG, PNG ou HEIC. Formats 1:1, 4:5, 9:16 et 16:9, en ajustement ou en remplissage. Tailles originale, grande ou web avec dimensions réelles et poids de fichier estimé — et nommez vous-même les fichiers.",
  "how.label": "Comment ça marche",
  "how.title": "Trois étapes. Terminé.",
  "how.sub": "Interface simple et intuitive. Ouvrez l’app et lancez-vous.",
  "st1.h": "Choisissez une photo",
  "st1.p": "Choisissez-la dans votre photothèque, prenez-en une nouvelle avec l’appareil photo, ou importez-la depuis Fichiers. Le travail récent, en page d’accueil, retrouve tout ce que vous avez déjà réalisé.",
  "st2.h": "Ajoutez votre filigrane",
  "st2.p": "Saisissez votre texte, ajoutez un logo, signez à la main ou générez un code QR. Touchez un préréglage pour arriver directement à un rendu fini, puis mettez en mosaïque si vous voulez une couverture complète.",
  "st3.h": "Exportez et partagez",
  "st3.p": "Enregistrez dans votre pellicule en JPEG, PNG ou HEIC — recadré au format voulu si besoin — ou partagez directement via n’importe quelle feuille de partage iOS.",
  "crop.label": "Mention à l’épreuve du recadrage",
  "crop.h": "Une marque qu’on ne peut pas recadrer",
  "crop.p1": "Un filigrane visible peut être recadré, effacé au tampon ou flouté. C’est pourquoi WatermarkIT inscrit aussi votre nom et vos droits d’auteur <strong style=\"color:#fff;\">à l’intérieur même du fichier photo</strong> — dans les champs standard IPTC et TIFF que les logiciels de retouche, les banques d’images et les gestionnaires d’actifs lisent déjà.",
  "crop.p2": "Recadrez l’image, la mention y reste. C’est votre nom, jamais le nôtre, et vous pouvez la désactiver pour n’importe quel export.",
  "crop.pill1": "✓ Survit au recadrage",
  "crop.pill2": "✓ Champs IPTC et TIFF standard",
  "crop.pill3": "✓ Inscrite sur votre appareil",
  "crop.pill4": "✓ Désactivable en un geste",
  "crop.vh": "Une mention qui voyage",
  "crop.vp": "Votre mention et vos droits d’auteur accompagnent le fichier partout où il va.",
  "priv.label": "La confidentialité d’abord",
  "priv.h": "Vos photos ne quittent jamais votre téléphone",
  "priv.p": "WatermarkIT traite absolument tout sur votre appareil. Nous nous engageons formellement : vos photos ne sont jamais consultées, envoyées ou stockées par nous, en aucune circonstance.",
  "priv.pill1": "✓ Rendu sur l’appareil",
  "priv.pill2": "✓ Conception axée sur la confidentialité",
  "priv.pill3": "✓ Photos jamais envoyées ni stockées",
  "priv.pill4": "✓ Fonctionne entièrement hors ligne",
  "priv.vh": "100 % sur l’appareil",
  "priv.vp": "Tout le traitement se fait localement sur votre appareil. Vos images vous appartiennent — toujours.",
  "cta.h": "Commencez à filigraner dès aujourd’hui",
  "cta.p": "WatermarkIT est gratuit sur l’App Store et fonctionne sous iOS 18 et versions ultérieures. Pas de compte, pas de cloud, pas de piège.",
  "cta.btn": "Télécharger gratuitement sur l’App Store",
  "foot.support": "Assistance",
  "foot.privacy": "Politique de confidentialité",
  "foot.copy": "WatermarkIT. Conçu avec ❤️ pour iOS. Tous droits réservés.",
  "f11.h": "Parle votre langue",
  "f11.p": "L’application entière — pas seulement la fiche de la boutique — en allemand, anglais, arabe, chinois simplifié et traditionnel, chinois (Hong Kong), espagnol, français, japonais, néerlandais, portugais, russe, turc et vietnamien. L’arabe s’affiche de droite à gauche partout, et vous pouvez changer de langue dans Réglages sans changer celle de votre appareil."
 },

 "vi": {
  "lang.label": "Ngôn ngữ",
  "trans.note": "Bản dịch này chỉ mang tính tham khảo; bản tiếng Anh là bản chính thức.",
  "nav.features": "Tính năng",
  "nav.privacy": "Quyền riêng tư",
  "nav.support": "Hỗ trợ",
  "nav.cta": "Nhận miễn phí",
  "hero.badge": "Phiên bản 1.1.3 — hiện có 14 ngôn ngữ",
  "hero.h1a": "Đóng hình mờ cho ảnh của bạn",
  "hero.h1b": "đẹp mắt và riêng tư",
  "hero.sub": "Đánh dấu một bức ảnh bằng văn bản, logo, chữ ký viết tay của riêng bạn, hoặc mã QR có thể quét — rồi lát kín để không còn góc sạch nào để cắt. Xử lý từng ảnh một hoặc xử lý hàng loạt cả buổi chụp. Mọi thứ đều được xử lý trên thiết bị của bạn, không bao giờ trên đám mây.",
  "hero.download": "Tải miễn phí trên App Store",
  "hero.features": "Xem tính năng →",
  "strip1": "Xử lý trên thiết bị",
  "strip2": "Chú trọng quyền riêng tư",
  "strip3": "Không tải lên đám mây",
  "strip4": "Hoạt động hoàn toàn ngoại tuyến",
  "feat.label": "Tính năng",
  "feat.title": "Mọi thứ bạn cần để bảo vệ ảnh của mình",
  "feat.sub": "Bốn cách để đánh dấu một bức ảnh, và một dấu mà không ai cắt bỏ được. Mạnh mẽ ở những nơi quan trọng, đơn giản ở mọi nơi khác.",
  "f1.h": "Hình mờ chữ",
  "f1.p": "22 kiểu chữ — không chân, có chân, đều nét, thư pháp và chữ viết tay — với toàn quyền kiểm soát kích thước, màu sắc và độ mờ. Thêm bóng đổ hoặc viền để dấu của bạn luôn dễ đọc trên những bức ảnh nhiều chi tiết.",
  "f2.h": "Hình mờ logo",
  "f2.p": "Đưa logo của riêng bạn vào và đặt ở bất kỳ đâu. Xoay trọn 360°, lật ngang hoặc dọc, và thay đổi kích thước trong một phạm vi rộng. Hỗ trợ độ trong suốt của PNG.",
  "f3.h": "Ký tay",
  "f3.p": "Vẽ chữ ký trực tiếp lên ảnh bằng bất kỳ màu mực nào, có hoàn tác và làm lại. Gần giống nhất với việc ký lên một bản in, mà không cần rời khỏi điện thoại.",
  "f4.h": "Dấu mã QR",
  "f4.p": "Biến một đường liên kết thành dấu có thể quét, dẫn tới portfolio, cửa hàng, hoặc điều khoản cấp phép của bạn. Được tạo hoàn toàn trên thiết bị của bạn — không máy chủ nào từng thấy đường liên kết đó.",
  "f5.h": "Lát kín",
  "f5.p": "Lặp lại dấu của bạn trên toàn bộ bức ảnh với khoảng cách có thể điều chỉnh, để không còn góc sạch nào có thể cắt bỏ. Tiêu chuẩn duyệt ảnh, được tích hợp sẵn.",
  "f6.h": "Ghi công vô hình",
  "f6.p": "Ghi tên và bản quyền của bạn vào các trường IPTC và TIFF của tệp đã xuất. Nó đi theo tệp và tồn tại qua việc cắt ảnh — một tuyên bố quyền với hình ảnh ngay cả khi dấu hiển thị đã mất.",
  "f7.h": "Tám mẫu dựng sẵn",
  "f7.p": "Được đặt tên theo công việc, không theo cài đặt: Duyệt khách hàng, Bảo mật, Bản nháp, Ghi công ảnh, Tài khoản mạng xã hội, Duyệt lát kín, Đóng dấu ngày và Chữ nhỏ. Chạm một cái là xong.",
  "f8.h": "Xử lý hàng loạt",
  "f8.p": "Chọn nhiều ảnh và áp cùng một dấu cho tất cả cùng lúc. Hoàn hảo cho chụp sản phẩm, portfolio và các bộ ảnh mạng xã hội.",
  "f9.h": "Mẫu dùng lại được",
  "f9.p": "Lưu phong cách hình mờ của riêng bạn thành các mẫu có tên và dùng lại chỉ với một chạm. Mở lại bất cứ thứ gì từ Công việc gần đây trên màn hình chính và gửi đi lần nữa.",
  "f10.h": "Xuất theo đúng nơi cần đến",
  "f10.p": "JPEG, PNG hoặc HEIC. Các tỉ lệ 1:1, 4:5, 9:16 và 16:9 với Vừa khít hoặc Lấp đầy. Kích thước Gốc, Lớn hoặc Web với kích thước thật và dung lượng tệp ước tính — và tự đặt tên tệp.",
  "how.label": "Cách hoạt động",
  "how.title": "Ba bước. Xong.",
  "how.sub": "Giao diện đơn giản, trực quan. Chỉ cần mở ứng dụng và bắt đầu.",
  "st1.h": "Chọn một bức ảnh",
  "st1.p": "Chọn từ thư viện, chụp ảnh mới bằng camera, hoặc nhập từ Tệp. Công việc gần đây trên màn hình chính đưa lại mọi thứ bạn đã từng làm.",
  "st2.h": "Thêm hình mờ của bạn",
  "st2.p": "Gõ văn bản, thêm logo, ký tay, hoặc tạo mã QR. Chạm vào một mẫu để có ngay diện mạo hoàn chỉnh, rồi lát kín nếu bạn muốn phủ toàn bộ.",
  "st3.h": "Xuất và chia sẻ",
  "st3.p": "Lưu vào Cuộn phim Camera dưới dạng JPEG, PNG hoặc HEIC — cắt theo tỉ lệ nếu cần — hoặc chia sẻ trực tiếp qua bất kỳ trình chia sẻ nào của iOS.",
  "crop.label": "Ghi công chống cắt ảnh",

  "crop.p1": "Một hình mờ hiển thị có thể bị cắt, xóa bằng công cụ nhân bản, hoặc làm mờ đi. Vì vậy WatermarkIT cũng ghi tên và bản quyền của bạn <strong style=\"color:#fff;\">vào bên trong chính tệp ảnh</strong> — vào các trường IPTC và TIFF tiêu chuẩn mà các trình chỉnh sửa ảnh, thư viện ảnh gốc và trình quản lý tài sản đã đọc sẵn.",

 "tr": {

  "trans.note": "Bu çeviri yalnızca kolaylık amacıyla sunulur; asıl metin İngilizce sürümdür.",

  "hero.h1a": "Fotoğraflarınıza filigran ekleyin",
  "hero.h1b": "şık ve gizli biçimde",
  "hero.sub": "Bir fotoğrafı metinle, logonuzla, kendi el yazınızla attığınız imzayla veya taranabilir bir QR koduyla işaretleyin — sonra kırpılacak temiz bir köşe kalmasın diye döşeyin. Tek tek fotoğrafla çalışın ya da bütün bir çekimi toplu işleyin. Her şey cihazınızda işlenir, asla bulutta değil.",

  "feat.label": "Özellikler",
  "feat.title": "Fotoğraflarınızı korumak için gereken her şey",
  "feat.sub": "Bir fotoğrafı işaretlemenin dört yolu, ve kimsenin kırpıp atamayacağı bir işaret. Önemli olan yerde güçlü, geri kalan her yerde basit.",
  "f1.h": "Metin Filigranları",
  "f1.p": "22 yazı tipi — çizgisiz, çizgili, eş aralıklı, el yazısı ve kaligrafik — boyut, renk ve saydamlık üzerinde tam kontrolle. Yoğun fotoğraflarda işaretinizin okunaklı kalması için gölge veya dış çizgi ekleyin.",
  "f2.h": "Logo Filigranları",
  "f2.p": "Kendi logonuzu getirin ve istediğiniz yere yerleştirin. Tam 360° döndürün, yatay veya dikey çevirin ve geniş bir boyut aralığında ölçeklendirin. PNG saydamlığı desteklenir.",
  "f3.h": "Elle İmzalayın",
  "f3.p": "İmzanızı istediğiniz mürekkep renginde doğrudan fotoğrafın üzerine çizin; geri al ve yinele seçenekleriyle. Telefonunuzdan ayrılmadan bir baskıyı imzalamaya en yakın deneyim.",
  "f4.h": "QR Kod İşaretleri",
  "f4.p": "Bir bağlantıyı; portföyünüze, mağazanıza veya lisans şartlarınıza yönlendiren taranabilir bir işarete dönüştürün. Tamamen cihazınızda oluşturulur — bağlantıyı hiçbir sunucu görmez.",
  "f5.h": "Döşeme",
  "f5.p": "İşaretinizi, ayarlanabilir aralıklarla fotoğrafın tamamına tekrarlayın; kırpılacak temiz bir köşe kalmasın. Prova standardı, uygulamaya gömülü olarak.",
  "f6.h": "Görünmez Telif Bilgisi",
  "f6.p": "Adınızı ve telif hakkınızı, dışa aktarılan dosyanın IPTC ve TIFF alanlarına yazın. Dosyayla birlikte yolculuk eder ve kırpmaya dayanır — görünür işaret kaybolsa bile görsel üzerindeki hakkınızı korur.",
  "f7.h": "Sekiz Yerleşik Hazır Ayar",
  "f7.p": "Ayarlarına göre değil, işine göre adlandırılmış: Müşteri Provası, Gizli, Taslak, Fotoğraf Kredisi, Sosyal Medya Kullanıcı Adı, Döşeli Prova, Tarih Damgası ve İnce Yazı. Birine dokunun, işiniz bitsin.",
  "f8.h": "Toplu İşleme",
  "f8.p": "Birden fazla fotoğraf seçin ve aynı işareti hepsine birden uygulayın. Ürün çekimleri, portföyler ve sosyal medya setleri için mükemmel.",
  "f9.h": "Yeniden Kullanılabilir Şablonlar",
  "f9.p": "Kendi filigran stillerinizi adlandırılmış şablonlar olarak kaydedin ve tek dokunuşla yeniden kullanın. Ana ekrandaki Son Çalışmalar’dan istediğinizi yeniden açın ve tekrar gönderin.",
  "f10.h": "Gideceği Yere Göre Dışa Aktarın",
  "f10.p": "JPEG, PNG veya HEIC. Sığdır veya Doldur ile 1:1, 4:5, 9:16 ve 16:9 oranları. Gerçek boyutlar ve tahmini dosya boyutuyla Orijinal, Büyük veya Web boyutları — ve dosyaları kendiniz adlandırın.",
  "how.label": "Nasıl Çalışır",
  "how.title": "Üç adım. Bitti.",
  "how.sub": "Basit, sezgisel arayüz. Uygulamayı açın ve başlayın.",
  "st1.h": "Bir Fotoğraf Seçin",
  "st1.p": "Kitaplığınızdan seçin, kamerayla yenisini çekin ya da Dosyalar’dan içe aktarın. Ana ekrandaki Son Çalışmalar, daha önce yaptığınız her şeyi geri getirir.",
  "st2.h": "Filigranınızı Ekleyin",
  "st2.p": "Metninizi yazın, logo ekleyin, elle imzalayın ya da QR kodu oluşturun. Doğrudan bitmiş bir görünüme geçmek için bir hazır ayara dokunun, tam kaplama istiyorsanız sonra döşeyin.",
  "st3.h": "Dışa Aktarın ve Paylaşın",
  "st3.p": "JPEG, PNG veya HEIC olarak Kamera Rulosu’na kaydedin — gerekirse şekle göre kırpılmış olarak — ya da doğrudan herhangi bir iOS paylaşım sayfasından paylaşın.",
  "crop.label": "Kırpmaya Dayanıklı Telif",
  "crop.h": "Kırpıp atamayacakları bir işaret",
  "crop.p1": "Görünür bir filigran kırpılabilir, damgayla silinebilir ya da bulanıklaştırılabilir. Bu yüzden WatermarkIT adınızı ve telif hakkınızı ayrıca <strong style=\"color:#fff;\">fotoğraf dosyasının içine</strong> de yazar — fotoğraf düzenleyicilerin, stok kitaplıklarının ve varlık yöneticilerinin zaten okuduğu standart IPTC ve TIFF alanlarına.",
  "crop.p2": "Fotoğrafı kırpın, telif bilgisi yine de orada kalır. Bu sizin adınızdır, asla bizim değil, ve herhangi bir dışa aktarma için kapatabilirsiniz.",
  "crop.pill1": "✓ Kırpmaya dayanır",
  "crop.pill2": "✓ Standart IPTC ve TIFF alanları",
  "crop.pill3": "✓ Cihazınızda yazılır",
  "crop.pill4": "✓ Tek dokunuşla kapatılır",
  "crop.vh": "Sizinle Yolculuk Eden Telif",
  "crop.vp": "Ad bilginiz ve telif hakkınız, dosya nereye giderse gitsin onunla birlikte yolculuk eder.",
  "priv.label": "Önce Gizlilik",
  "priv.h": "Fotoğraflarınız telefonunuzdan asla çıkmaz",
  "priv.p": "WatermarkIT her şeyi tamamen cihazınızda işler. Fotoğraflarınıza hiçbir koşulda bizim tarafımızdan erişilmeyeceğini, yüklenmeyeceğini veya saklanmayacağını kesinlikle taahhüt ediyoruz.",
  "priv.pill1": "✓ Cihaz üzerinde işleme",
  "priv.pill2": "✓ Önce gizlilik tasarımı",
  "priv.pill3": "✓ Fotoğraflar asla yüklenmez veya saklanmaz",
  "priv.pill4": "✓ Tamamen çevrimdışı çalışır",
  "priv.vh": "%100 Cihaz Üzerinde",
  "priv.vp": "Tüm işleme cihazınızda, yerel olarak gerçekleşir. Görselleriniz her zaman size aittir.",
  "cta.h": "Bugün filigran eklemeye başlayın",
  "cta.p": "WatermarkIT App Store’da ücretsizdir ve iOS 18 ve üzerinde çalışır. Hesap yok, bulut yok, gizli şart yok.",
  "cta.btn": "App Store’dan ücretsiz indirin",
  "foot.support": "Destek",
  "foot.privacy": "Gizlilik Politikası",
  "foot.copy": "WatermarkIT. iOS için ❤️ ile yapıldı. Tüm hakları saklıdır.",
  "f11.h": "Sizin Dilinizi Konuşur",
  "f11.p": "Yalnızca mağaza sayfası değil, uygulamanın tamamı — Almanca, Arapça, Çince (basitleştirilmiş ve geleneksel), Çince (Hong Kong), Fransızca, Hollandaca, İngilizce, İspanyolca, Japonca, Portekizce, Rusça, Türkçe ve Vietnamca dillerinde. Arapça her yerde sağdan sola düzenlenir ve cihaz dilinizi değiştirmeden Ayarlar’dan dili değiştirebilirsiniz."
 },

  // The storefront whose listing is in that language. Empty means "no country
  // segment", which resolves to the reader's own storefront. Kept in step with
  // WatermarkItLinks in the app.
  // fr/de/nl have no country segment: their storefronts (France, Germany, the
  // Netherlands) are EU-blocked and return zero results for this app's own ID
  // (verified directly, along with every other EU storefront tested) — naming
  // one would point at a listing that does not exist. Spanish maps to Mexico,
  // not Spain, for the same reason: es-ES is EU-blocked, es-MX is live.
  const STOREFRONT = {
    en: '', ar: '/sa', ja: '/jp', 'zh-Hans': '/cn', 'zh-Hant': '/tw',
    'zh-HK': '/hk', ru: '/ru', vi: '/vn', tr: '/tr', es: '/mx', 'pt-BR': '/br',
    fr: '', de: '', nl: '',
  };
  const APP_ID = '6797597563';

  const SUPPORTED = Object.keys(I18N);
  const RTL = new Set(['ar']);

  // The English title and description are tuned for search, so they are kept
  // verbatim rather than rebuilt from the hero copy — and restored when the
  // reader switches back, which a one-way override would not do.
  const EN_TITLE = document.title;
  const EN_DESC = (document.querySelector('meta[name="description"]') || {}).content || '';

  function resolveLang() {
    const q = new URLSearchParams(location.search).get('lang');
    let stored = null;
    try { stored = localStorage.getItem('wmk-lang'); } catch (e) {}
    for (const cand of [q, stored, ...(navigator.languages || [navigator.language || ''])]) {
      if (!cand) continue;
      if (I18N[cand]) return cand;
      const low = cand.toLowerCase();
      if (low.startsWith('zh')) {
        // Hong Kong gets its own dedicated locale (distinct in-app wording
        // from Taiwan); Macau has no locale of its own and reads Taiwan's.
        if (low.includes('hk')) return 'zh-HK';
        return /hant|tw|mo/.test(low) ? 'zh-Hant' : 'zh-Hans';
      }
      const base = low.split('-')[0];
      const hit = SUPPORTED.find(l => l.toLowerCase().split('-')[0] === base);
      if (hit) return hit;
    }
    return 'en';
  }

  function applyLang(lang) {
    const dict = I18N[lang] || I18N.en;
    const root = document.documentElement;
    root.lang = lang;
    root.dir = RTL.has(lang) ? 'rtl' : 'ltr';

    document.querySelectorAll('[data-i18n]').forEach(el => {
      const v = dict[el.dataset.i18n];
      if (v !== undefined) el.innerHTML = v;   // authored strings, not user input
    });

    const desc = document.querySelector('meta[name="description"]');
    if (lang === 'en') {
      document.title = EN_TITLE;
      if (desc) desc.setAttribute('content', EN_DESC);
    } else {
      document.title = 'WatermarkIT \u2014 ' + (dict['hero.h1a'] || '');
      if (desc) desc.setAttribute('content', (dict['hero.sub'] || '').replace(/<[^>]*>/g, ''));
    }

    // Send the reader to the storefront that has the listing in their language.
    const store = document.getElementById('app-store-link');
    if (store) {
      store.href = 'https://apps.apple.com' + (STOREFRONT[lang] || '') + '/app/id' + APP_ID;
    }

    const pick = document.getElementById('langpick');
    if (pick) { pick.value = lang; pick.setAttribute('aria-label', dict['lang.label'] || 'Language'); }

    document.querySelectorAll('a[href]').forEach(a => {
      const href = a.getAttribute('href');
      if (!href || !/^(index|support|privacy)\.html/.test(href)) return;
      const u = new URL(href, location.href);
      u.searchParams.set('lang', lang);
      a.setAttribute('href', u.pathname.split('/').pop() + u.search);
    });

    try { localStorage.setItem('wmk-lang', lang); } catch (e) {}
  }

  applyLang(resolveLang());

  document.getElementById('langpick').addEventListener('change', e => {
    applyLang(e.target.value);
    const u = new URL(location.href);
    u.searchParams.set('lang', e.target.value);
    history.replaceState(null, '', u);
  });

  document.getElementById('yr-index').textContent = new Date().getFullYear();
</script>
