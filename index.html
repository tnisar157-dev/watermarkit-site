<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WatermarkIT — Free Photo Watermark App for iPhone &amp; iPad</title>
  <meta name="description" content="WatermarkIT is a free, private iOS app for watermarking photos — text, logo, hand-drawn signature, QR code or tiled marks, plus invisible copyright that survives cropping. 100% on-device. iOS 18+." />
  <link rel="icon" type="image/png" href="appicon.png" />
  <link rel="apple-touch-icon" href="appicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green: #0B8340;
      --green-light: #30D158;
      --green-dim: rgba(48,209,88,0.15);
      --gradient: linear-gradient(135deg, #04642F 0%, #0B8340 100%);
      --gradient-text: linear-gradient(135deg, #7CFFA8 0%, #30D158 100%);
      --bg: #0C0C0E;
      --surface: #161618;
      --surface2: #1D1D20;
      --border: rgba(255,255,255,0.08);
      --text: #F0F0F2;
      --muted: #98989E;
      --radius: 18px;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, sans-serif;
      line-height: 1.6;
      overflow-x: hidden;
    }

    /* ── NAV ─────────────────────────────────────── */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 200;
      background: rgba(10,10,15,0.8);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-bottom: 1px solid var(--border);
    }
    .nav-inner {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 66px;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--text);
      font-weight: 800;
      font-size: 18px;
      letter-spacing: -0.3px;
    }
    .logo-icon {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      object-fit: cover;
    }
    .nav-links { display: flex; align-items: center; gap: 32px; }
    .nav-link {
      color: var(--muted);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      transition: color 0.2s;
    }
    .nav-link:hover { color: var(--text); }
    .nav-cta {
      background: var(--gradient);
      color: white;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      padding: 9px 20px;
      border-radius: 100px;
      transition: opacity 0.2s, transform 0.2s;
    }
    .nav-cta:hover { opacity: 0.88; transform: scale(1.03); }

    /* ── HERO ────────────────────────────────────── */
    .hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 120px 24px 80px;
      position: relative;
      overflow: hidden;
    }
    .hero-glow {
      position: absolute;
      width: 700px; height: 700px;
      background: radial-gradient(circle, rgba(48,209,88,0.28) 0%, transparent 70%);
      border-radius: 50%;
      top: 50%; left: 50%;
      transform: translate(-50%, -55%);
      pointer-events: none;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--green-dim);
      border: 1px solid rgba(48,209,88,0.4);
      border-radius: 100px;
      padding: 6px 16px;
      font-size: 13px;
      font-weight: 600;
      color: var(--green-light);
      margin-bottom: 32px;
    }
    .badge-dot {
      width: 6px; height: 6px;
      background: var(--green-light);
      border-radius: 50%;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    h1 {
      font-size: clamp(44px, 7vw, 88px);
      font-weight: 900;
      line-height: 1.05;
      letter-spacing: -3px;
      margin-bottom: 24px;
      max-width: 800px;
    }
    h1 .gradient-text {
      background: var(--gradient-text);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .hero-sub {
      font-size: clamp(16px, 2.5vw, 20px);
      color: var(--muted);
      max-width: 540px;
      margin: 0 auto 44px;
      font-weight: 400;
      line-height: 1.6;
    }
    .hero-actions {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: var(--gradient);
      color: white;
      font-family: 'Inter', sans-serif;
      font-size: 16px;
      font-weight: 700;
      padding: 16px 32px;
      border-radius: 100px;
      text-decoration: none;
      transition: opacity 0.2s, transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 8px 32px rgba(48,209,88,0.4);
    }
    .btn-primary:hover { opacity: 0.9; transform: translateY(-2px); box-shadow: 0 14px 40px rgba(48,209,88,0.5); }
    .btn-secondary {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: transparent;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 16px;
      font-weight: 600;
      padding: 16px 32px;
      border-radius: 100px;
      border: 1px solid var(--border);
      text-decoration: none;
      transition: background 0.2s, border-color 0.2s;
    }
    .btn-secondary:hover { background: var(--surface); border-color: rgba(255,255,255,0.2); }

    /* ── PRIVACY STRIP ────────────────────────────── */
    .privacy-strip {
      display: flex;
      justify-content: center;
      gap: 24px;
      flex-wrap: wrap;
      margin-top: 52px;
      font-size: 13px;
      color: var(--muted);
    }
    .privacy-strip span {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .privacy-strip .icon { font-size: 15px; }

    /* ── SECTION ─────────────────────────────────── */
    section {
      padding: 100px 24px;
    }
    .section-inner {
      max-width: 1100px;
      margin: 0 auto;
    }
    .section-label {
      text-transform: uppercase;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 2px;
      color: var(--green-light);
      margin-bottom: 14px;
    }
    .section-title {
      font-size: clamp(28px, 4vw, 46px);
      font-weight: 800;
      letter-spacing: -1.5px;
      margin-bottom: 16px;
      line-height: 1.1;
    }
    .section-sub {
      font-size: 17px;
      color: var(--muted);
      max-width: 520px;
      margin-bottom: 64px;
    }

    /* ── FEATURES ────────────────────────────────── */
    .features-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
    }
    .feature-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 32px;
      transition: border-color 0.25s, transform 0.25s;
    }
    .feature-card:hover {
      border-color: rgba(48,209,88,0.4);
      transform: translateY(-3px);
    }
    .feature-icon {
      width: 52px; height: 52px;
      border-radius: 14px;
      background: var(--green-dim);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      margin-bottom: 20px;
    }
    .feature-card h3 {
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 10px;
      letter-spacing: -0.2px;
    }
    .feature-card p {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.65;
    }

    /* ── PRIVACY SECTION ─────────────────────────── */
    .privacy-section {
      background: var(--surface);
      border-radius: 28px;
      border: 1px solid var(--border);
      padding: 60px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 60px;
      align-items: center;
    }
    @media (max-width: 700px) {
      .privacy-section { grid-template-columns: 1fr; padding: 36px 24px; }
    }
    .privacy-section h2 {
      font-size: clamp(26px, 3.5vw, 40px);
      font-weight: 800;
      letter-spacing: -1px;
      margin-bottom: 18px;
    }
    .privacy-section p {
      font-size: 15px;
      color: var(--muted);
      line-height: 1.7;
      margin-bottom: 28px;
    }
    .privacy-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: var(--green-dim);
      border: 1px solid rgba(48,209,88,0.3);
      border-radius: 100px;
      padding: 7px 14px;
      font-size: 13px;
      font-weight: 600;
      color: var(--green-light);
    }
    .privacy-visual {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 36px 32px;
      text-align: center;
    }
    .privacy-big-icon { font-size: 72px; margin-bottom: 20px; }
    .privacy-visual h3 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 10px;
    }
    .privacy-visual p {
      font-size: 14px;
      color: var(--muted);
      margin: 0;
    }

    /* ── STEPS ───────────────────────────────────── */
    .steps {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 0;
      position: relative;
    }
    .step {
      padding: 36px 24px;
      text-align: center;
      position: relative;
    }
    .step:not(:last-child)::after {
      content: '→';
      position: absolute;
      right: -12px;
      top: 40px;
      font-size: 20px;
      color: var(--green-light);
      opacity: 0.5;
    }
    @media (max-width: 600px) { .step:not(:last-child)::after { display: none; } }
    .step-num {
      width: 48px; height: 48px;
      border-radius: 50%;
      background: var(--gradient);
      color: white;
      font-size: 18px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
    }
    .step h3 { font-size: 15px; font-weight: 700; margin-bottom: 8px; }
    .step p { font-size: 13px; color: var(--muted); line-height: 1.5; }

    /* ── CTA ─────────────────────────────────────── */
    .cta-section {
      text-align: center;
      background: var(--gradient);
      border-radius: 28px;
      padding: 80px 40px;
      margin: 0 24px 100px;
      max-width: 1100px;
      margin-left: auto;
      margin-right: auto;
      position: relative;
      overflow: hidden;
    }
    .cta-section::before {
      content: '';
      position: absolute;
      top: -40%; left: -20%;
      width: 60%; height: 200%;
      background: rgba(255,255,255,0.05);
      border-radius: 50%;
      pointer-events: none;
    }
    .cta-section h2 {
      font-size: clamp(28px, 4vw, 48px);
      font-weight: 900;
      letter-spacing: -1px;
      margin-bottom: 16px;
    }
    .cta-section p {
      font-size: 17px;
      opacity: 0.85;
      max-width: 460px;
      margin: 0 auto 36px;
    }
    .btn-white {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: white;
      color: var(--green);
      font-family: 'Inter', sans-serif;
      font-size: 16px;
      font-weight: 700;
      padding: 16px 32px;
      border-radius: 100px;
      text-decoration: none;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn-white:hover { transform: translateY(-2px); box-shadow: 0 12px 36px rgba(0,0,0,0.25); }

    /* ── FOOTER ──────────────────────────────────── */
    footer {
      border-top: 1px solid var(--border);
      padding: 48px 32px;
      text-align: center;
    }
    .footer-inner {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 20px;
    }
    .footer-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text); font-weight: 700; }
    .footer-links { display: flex; gap: 28px; }
    .footer-links a { color: var(--muted); text-decoration: none; font-size: 14px; transition: color 0.2s; }
    .footer-links a:hover { color: var(--text); }
    .footer-copy { width: 100%; text-align: center; color: var(--muted); font-size: 13px; margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--border); }

    /* ── i18n ───────────────────────────────────── */
    .langpick {
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 100px;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 500;
      padding: 7px 12px;
      cursor: pointer;
      appearance: none;
    }
    .langpick:focus-visible { outline: 2px solid var(--green-light); outline-offset: 2px; }
    .trans-note {
      max-width: 1100px;
      margin: 0 auto 8px;
      padding: 0 24px;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
    }
    .trans-note:empty { display: none; }
    /* The picker is one more item in a nav that was already tight. Below 640
       the two in-page anchors go, since scrolling reaches those sections
       anyway, and Support / the CTA / the picker stay. */
    .nav-cta { white-space: nowrap; }
    @media (max-width: 760px) { .nav-links { gap: 16px; } }
    @media (max-width: 640px) { .nav-links .nav-link[href^="#"] { display: none; } }
    /* Below 480 even three items overflow. The nav CTA is the one to drop:
       the hero's own download button is on screen at that width anyway, so
       nothing is lost, and the picker stays reachable. */
    @media (max-width: 480px) { .nav-links .nav-cta { display: none; } }
    /* The step connector is physically sided. */
    [dir="rtl"] .step:not(:last-child)::after { right: auto; left: -12px; content: '←'; }
    :lang(ar) body { font-family: 'Inter', 'Geeza Pro', system-ui, sans-serif; }
    :lang(ja) body { font-family: 'Inter', 'Hiragino Sans', 'Yu Gothic', system-ui, sans-serif; }
    :lang(zh-Hans) body { font-family: 'Inter', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif; }
    :lang(zh-Hant) body { font-family: 'Inter', 'PingFang TC', 'Microsoft JhengHei', system-ui, sans-serif; }
  </style>
</head>

  // The storefront whose listing is in that language. Empty means "no country
  // segment", which resolves to the reader's own storefront. Kept in step with
  // WatermarkItLinks in the app.
  const STOREFRONT = { en: '', ar: '/sa', ja: '/jp', 'zh-Hans': '/cn', 'zh-Hant': '/tw' };
  const APP_ID = '6797597563';

  const SUPPORTED = Object.keys(I18N);
  const RTL = new Set(['ar']);

  // The English title and description are tuned for search, so they are kept
  // verbatim rather than rebuilt from the hero copy — and restored when the
  // reader switches back, which a one-way override would not do.
  const EN_TITLE = document.title;
  const EN_DESC = (document.querySelector('meta[name="description"]') || {}).content || '';

  function resolveLang() {
    const q = new URLSearchParams(location.search).get('lang');
    let stored = null;
    try { stored = localStorage.getItem('wmk-lang'); } catch (e) {}
    for (const cand of [q, stored, ...(navigator.languages || [navigator.language || ''])]) {
      if (!cand) continue;
      if (I18N[cand]) return cand;
      const low = cand.toLowerCase();
      if (low.startsWith('zh')) {
        return /hant|tw|hk|mo/.test(low) ? 'zh-Hant' : 'zh-Hans';
      }
      const base = low.split('-')[0];
      const hit = SUPPORTED.find(l => l.toLowerCase().split('-')[0] === base);
      if (hit) return hit;
    }
    return 'en';
  }

  function applyLang(lang) {
    const dict = I18N[lang] || I18N.en;
    const root = document.documentElement;
    root.lang = lang;
    root.dir = RTL.has(lang) ? 'rtl' : 'ltr';

    document.querySelectorAll('[data-i18n]').forEach(el => {
      const v = dict[el.dataset.i18n];
      if (v !== undefined) el.innerHTML = v;   // authored strings, not user input
    });

    const desc = document.querySelector('meta[name="description"]');
    if (lang === 'en') {
      document.title = EN_TITLE;
      if (desc) desc.setAttribute('content', EN_DESC);
    } else {
      document.title = 'WatermarkIT \u2014 ' + (dict['hero.h1a'] || '');
      if (desc) desc.setAttribute('content', (dict['hero.sub'] || '').replace(/<[^>]*>/g, ''));
    }

    // Send the reader to the storefront that has the listing in their language.
    const store = document.getElementById('app-store-link');
    if (store) {
      store.href = 'https://apps.apple.com' + (STOREFRONT[lang] || '') + '/app/id' + APP_ID;
    }

    const pick = document.getElementById('langpick');
    if (pick) { pick.value = lang; pick.setAttribute('aria-label', dict['lang.label'] || 'Language'); }

    document.querySelectorAll('a[href]').forEach(a => {
      const href = a.getAttribute('href');
      if (!href || !/^(index|support|privacy)\.html/.test(href)) return;
      const u = new URL(href, location.href);
      u.searchParams.set('lang', lang);
      a.setAttribute('href', u.pathname.split('/').pop() + u.search);
    });

    try { localStorage.setItem('wmk-lang', lang); } catch (e) {}
  }

  applyLang(resolveLang());

  document.getElementById('langpick').addEventListener('change', e => {
    applyLang(e.target.value);
    const u = new URL(location.href);
    u.searchParams.set('lang', e.target.value);
    history.replaceState(null, '', u);
  });

  document.getElementById('yr-index').textContent = new Date().getFullYear();
</script>
